<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BILBO CITY · Forja de sprites</title>
<style>
:root{--hueso:#e6e2d6;--acero:#8d99a4;--oxido:#b7451f;--neon:#e8c547;--fondo:#0b0e12;--panel:#12181e;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{margin:0;background:var(--fondo);color:var(--hueso);
 font-family:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;}
header{position:sticky;top:0;z-index:5;background:rgba(11,14,18,.97);
 border-bottom:1px solid rgba(141,153,164,.3);padding:calc(env(safe-area-inset-top) + 10px) 12px 0;}
h1{margin:0;font-size:22px;letter-spacing:4px;text-transform:uppercase;}
.sub{font-size:11px;letter-spacing:2px;color:var(--acero);text-transform:uppercase;margin:1px 0 9px;}
nav{display:flex;gap:5px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none;}
nav::-webkit-scrollbar{display:none;}
nav div{white-space:nowrap;padding:6px 11px;font-size:11px;letter-spacing:2px;text-transform:uppercase;
 border:1px solid rgba(141,153,164,.3);cursor:pointer;}
nav div.on{background:var(--oxido);border-color:var(--oxido);}
.barra{display:flex;gap:6px;align-items:center;padding:0 0 9px;flex-wrap:wrap;}
.bt{padding:6px 11px;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;
 border:1px solid rgba(230,226,214,.35);cursor:pointer;}
.bt:active{background:var(--oxido);}
.bt.pri{background:var(--neon);color:#12181e;border-color:var(--neon);}
main{padding:12px;}
h2{font-size:15px;letter-spacing:3px;text-transform:uppercase;color:var(--neon);
 margin:20px 0 4px;border-bottom:1px solid rgba(232,197,71,.25);padding-bottom:4px;}
h2:first-child{margin-top:0;}
.nota{font-size:11px;color:var(--acero);line-height:1.4;margin-bottom:9px;}
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:7px;}
.cel{background:var(--panel);border:1px solid rgba(141,153,164,.22);padding:5px 3px 4px;text-align:center;}
.cel canvas{display:block;margin:0 auto;image-rendering:pixelated;
 background:repeating-conic-gradient(#1a2027 0 25%,#141a20 0 50%) 0 0/12px 12px;}
.cel .n{font-size:9px;color:var(--acero);margin-top:4px;word-break:break-all;line-height:1.15;}
.tira{display:flex;gap:3px;justify-content:center;}
footer{padding:24px 12px calc(env(safe-area-inset-bottom) + 30px);font-size:11px;color:var(--acero);line-height:1.5;}
#salida{width:100%;height:110px;background:#0c1116;color:var(--acero);border:1px solid rgba(141,153,164,.3);
 font-family:ui-monospace,monospace;font-size:10px;padding:6px;display:none;}
</style>
</head>
<body>
<header>
  <h1>Forja de sprites</h1>
  <div class="sub">Bilbo City · catálogo y atlas</div>
  <nav id="nav"></nav>
  <div class="barra">
    <div class="bt" id="zoomM">Zoom −</div><div class="bt" id="zoomP">Zoom +</div>
    <div class="bt pri" id="expPng">Exportar atlas PNG</div>
    <div class="bt" id="expJson">Exportar JSON</div>
    <div class="bt" id="semilla">Otros vecinos</div>
  </div>
</header>
<main id="main"></main>
<textarea id="salida" readonly></textarea>
<footer id="pie"></footer>

<script>
(()=>{
"use strict";
/*══════════ PALETA BLOQUEADA (40) ══════════*/
const C={
 negro:'#0b0e12',carbon:'#1c2229',asfalto:'#33383e',asfaltoO:'#2a2f34',asfaltoL:'#3f454c',
 gris:'#4a444c',grisO:'#3a353c',grisL:'#5f5a63',acero:'#8d99a4',aceroO:'#6d7883',hueso:'#e6e2d6',
 hormigon:'#7b7669',hormigonO:'#655f55',hormigonL:'#948e80',
 piel1:'#f0cfae',piel2:'#e0b48c',piel3:'#c69068',piel4:'#a87247',piel5:'#8d6142',piel6:'#6b482f',
 pelo1:'#2a2018',pelo2:'#4a3520',pelo3:'#7a5a2a',pelo4:'#b09a72',pelo5:'#8d99a4',
 azul:'#1f3a5f',azulO:'#152741',azulL:'#2f5182',
 rojo:'#b7451f',rojoO:'#8e3316',rojoL:'#d05c33',sangre:'#951f18',
 verde:'#3d6b4a',verdeO:'#2d5137',verdeL:'#508a5f',cesped:'#3c6338',cespedO:'#2f5330',
 agua:'#1c4652',aguaL:'#2a6473',
 mostaza:'#e8c547',mostazaO:'#b89a2c',
 morado:'#5b4a76',teja:'#7a5f52',tejaO:'#5f4840',madera:'#6b4326',maderaO:'#4d3019',maderaL:'#8a5c37',
 blanco:'#f4f2ea',crema:'#d8d4c4',
};
function lienzo(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
const P=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);};
let SEM=1;
function h32(a,b){let h=(a*73856093)^(b*19349663)^(SEM*83492791);h=(h^(h>>13))*1274126177;return Math.abs(h^(h>>16));}
function ruido(g,w,h,cols,d,ox=0,oy=0){for(let y=0;y<h;y++)for(let x=0;x<w;x++)
 if(((x*7+y*13+((x*3)^(y*5)))%100)<d)P(g,x+ox,y+oy,1,1,cols[(x*3+y*7)%cols.length]);}

/*══════════ 1 · PERSONAJES POR CAPAS ══════════*/
/* Lienzo 20×26. Pies en (10,25).
   8 direcciones como en los GTA portátiles: S SE E NE N NO O SO.
   Las diagonales se resuelven como vista lateral con pista de frente o de espalda,
   que es como se hacía en los sprites pequeños de verdad. */
const AB=0,AR=1,IZ=2,DE=3;
const DIR8=['s','se','e','ne','n','no','o','so'];
/* base cardinal + si vemos la cara o el cogote */
const MAPA8=[
 {b:AB,f:0,e:0},{b:DE,f:1,e:0},{b:DE,f:0,e:0},{b:DE,f:0,e:1},
 {b:AR,f:0,e:0},{b:IZ,f:0,e:1},{b:IZ,f:0,e:0},{b:IZ,f:1,e:0}];
const POSES={
 quieto:{p:[0,0],b:[0,0],y:0},
 andar1:{p:[0,1],b:[1,-1],y:0}, andar2:{p:[1,0],b:[0,0],y:-1},
 andar3:{p:[1,0],b:[-1,1],y:0}, andar4:{p:[0,1],b:[0,0],y:-1},
 correr1:{p:[-2,2],b:[2,-2],y:-1}, correr2:{p:[2,-2],b:[-2,2],y:-1},
 correr3:{p:[-3,3],b:[3,-3],y:-2}, correr4:{p:[3,-3],b:[-3,3],y:-2},
 pega1:{p:[0,0],b:[0,0],y:0,ataque:1}, pega2:{p:[0,1],b:[0,0],y:0,ataque:2},
 apunta:{p:[0,0],b:[0,0],y:0,apunta:1}, dispara:{p:[0,0],b:[0,0],y:-1,apunta:1,fog:1},
 herido:{p:[1,1],b:[2,2],y:1,herido:1},
};
const ORDEN_POSES=['quieto','andar1','andar2','andar3','andar4','correr1','correr2','correr3','correr4','pega1','pega2','apunta','dispara','herido'];

const COMPLEX={delgada:{w:6,hom:7},media:{w:8,hom:9},corpulenta:{w:10,hom:11}};
const TORSOS={
 camisa:{b:C.blanco,s:C.crema,l:C.blanco,manga:'larga'},
 camisaRem:{b:C.blanco,s:C.crema,l:C.blanco,manga:'corta'},
 chaqueta:{b:C.azul,s:C.azulO,l:C.azulL,manga:'larga'},
 cazadora:{b:C.carbon,s:C.negro,l:C.gris,manga:'larga'},
 sudadera:{b:C.grisL,s:C.gris,l:C.acero,manga:'larga',capucha:1},
 chandal:{b:C.verde,s:C.verdeO,l:C.verdeL,manga:'larga',raya:C.hueso},
 mono:{b:C.azulL,s:C.azul,l:C.acero,manga:'larga',peto:1},
 abrigo:{b:C.tejaO,s:C.maderaO,l:C.teja,manga:'larga',largo:1},
 gabardina:{b:C.crema,s:C.hormigonO,l:C.hueso,manga:'larga',largo:1},
 jersey:{b:C.rojoO,s:C.sangre,l:C.rojo,manga:'larga'},
 bata:{b:C.blanco,s:C.crema,l:C.blanco,manga:'larga',largo:1},
 uniforme:{b:C.azulO,s:C.negro,l:C.azul,manga:'larga',placa:1},
 camiseta:{b:C.mostaza,s:C.mostazaO,l:C.mostaza,manga:'corta'},
 polo:{b:C.verdeL,s:C.verde,l:C.verdeL,manga:'corta'},
 reflectante:{b:C.rojo,s:C.rojoO,l:C.mostaza,manga:'corta',bandas:1},
 delantal:{b:C.carbon,s:C.negro,l:C.gris,manga:'corta',mandil:1},
};
const PIERNAS={
 vaquero:{b:'#3a4f6b',s:'#2c3d53'},vestir:{b:C.carbon,s:C.negro},
 chandalP:{b:C.verdeO,s:'#24422a',raya:C.hueso},monoP:{b:C.azulL,s:C.azul},
 falda:{b:C.morado,s:'#443759',falda:1},short:{b:C.crema,s:C.hormigonO,corto:1},
 cargo:{b:'#5d5b45',s:'#474535'},uniformeP:{b:C.azulO,s:C.negro},
};
const CALZADO={deportivas:C.blanco,botas:'#3a2d22',zapatos:C.negro,katiuskas:C.mostazaO};
const PELOS=['rapado','corto','melena','coleta','mono','afro','calvo','canoso'];
const GORROS=['ninguno','txapela','gorra','visera','cascoObra','cascoMoto','lana','policia','capucha'];
const ACCES=['ninguno','mochila','bolso','bandolera','bufanda','gafas','carrito'];

function dibChar(cfg,pose,d8){
 const M=MAPA8[d8], dir=M.b, frente=M.f, espalda=M.e;
 const c=lienzo(20,26),g=c.getContext('2d');
 const P_=POSES[pose],comp=COMPLEX[cfg.comp],T=TORSOS[cfg.torso],PN=PIERNAS[cfg.piernas];
 const diag=frente||espalda;
 const lateral=(dir===DE||dir===IZ)&&!diag;
 const cx=10+(diag?(dir===DE?-1:1):0)+(lateral?(dir===DE?1:-1):0);
 const oy=P_.y, w=comp.w, hom=comp.hom-(diag?1:0)-(lateral?2:0);
 const izqV=dir===IZ, derV=dir===DE, arr=(dir===AR)||espalda;
 /* sombra de contacto la pinta el juego */
 /* piernas */
 const py=17+oy;
 const l1=P_.p[0],l2=P_.p[1];
 if(PN.falda){P(g,cx-w/2-1,py-1,w+2,6,PN.b);P(g,cx-w/2-1,py+4,w+2,1,PN.s);
  P(g,cx-3,py+5,2,4,cfg.piel);P(g,cx+1,py+5,2,4,cfg.piel);}
 else if(lateral){
  /* de perfil las piernas se solapan: la trasera más oscura da profundidad */
  const dx=derV?1:-1;
  P(g,cx-2-dx,py+l2,3,8-l2,PN.s);
  P(g,cx-2+dx,py+l1,3,8-l1,PN.b);
  if(PN.corto){P(g,cx-2+dx,py+4,3,4,cfg.piel);}
 }
 else{
  P(g,cx-3,py+l1,3,8-l1,PN.b);P(g,cx,py+l2,3,8-l2,PN.s);
  if(PN.raya){P(g,cx-3,py+l1,1,8-l1,PN.raya);P(g,cx+2,py+l2,1,8-l2,PN.raya);}
  if(PN.corto){P(g,cx-3,py+4,3,4-l1<0?0:4,cfg.piel);P(g,cx,py+4,3,4,cfg.piel);}
 }
 if(lateral){const dx=derV?1:-1;
  P(g,cx-2-dx,24+oy,3,2,CALZADO[cfg.calzado]);P(g,cx-2+dx,24+oy,4,2,CALZADO[cfg.calzado]);}
 else P(g,cx-3,24+oy,3,2,CALZADO[cfg.calzado]),P(g,cx,24+oy,3,2,CALZADO[cfg.calzado]);
 /* torso */
 const ty=9+oy,th=T.largo?10:8;
 P(g,cx-hom/2,ty,hom,th,T.b);
 P(g,cx-hom/2,ty,hom,2,T.l);
 P(g,cx+hom/2-1,ty,1,th,T.s);
 if(T.raya)P(g,cx-hom/2,ty,1,th,T.raya);
 if(T.peto){P(g,cx-hom/2+1,ty+2,hom-2,5,T.l);P(g,cx-1,ty+3,2,2,T.s);}
 if(T.bandas){P(g,cx-hom/2,ty+3,hom,1,C.hueso);P(g,cx-hom/2,ty+6,hom,1,C.hueso);}
 if(T.mandil&&!arr){P(g,cx-hom/2+1,ty+2,hom-2,th-1,C.crema);}
 if(T.placa&&!arr)P(g,cx-hom/2+1,ty+3,2,2,C.mostaza);
 if(T.capucha)P(g,cx-hom/2,ty-1,hom,3,T.s);
 /* brazos */
 const b1=P_.b[0],b2=P_.b[1];
 const mangaCol=T.manga==='corta'?T.b:T.b, manoY=T.manga==='corta'?ty+4:ty+7;
 const bx1=cx-hom/2-2,bx2=cx+hom/2;
 if(P_.ataque){
  const ex=P_.ataque===2?4:2;
  if(derV||dir===AB){P(g,bx2,ty+2,2+ex,3,mangaCol);P(g,bx2+2+ex,ty+2,2,3,cfg.piel);}
  else{P(g,bx1-ex,ty+2,2+ex,3,mangaCol);P(g,bx1-ex-2,ty+2,2,3,cfg.piel);}
  P(g,bx1,ty+2+b2,2,6,T.s);
 }else if(P_.apunta){
  if(derV){P(g,bx2,ty+3,5,2,mangaCol);P(g,bx2+5,ty+3,2,2,cfg.piel);}
  else if(izqV){P(g,bx1-3,ty+3,5,2,mangaCol);P(g,bx1-5,ty+3,2,2,cfg.piel);}
  else{P(g,bx2-1,ty+2,3,5,mangaCol);P(g,bx2-1,ty+7,3,2,cfg.piel);}
  P(g,bx1,ty+3,2,5,T.s);
 }else if(lateral){
  /* de perfil solo se ve el brazo cercano; el otro queda tapado por el cuerpo */
  const bf=derV?bx2:bx1;
  P(g,bf,ty+1+b1,2,6,T.l);P(g,bf,manoY+b1,2,2,cfg.piel);
 }else{
  P(g,bx1,ty+1+b1,2,6,T.l);P(g,bx2,ty+1+b2,2,6,T.s);
  P(g,bx1,manoY+b1,2,2,cfg.piel);P(g,bx2,manoY+b2,2,2,cfg.piel);
 }
 /* cabeza */
 const hy=1+oy;
 P(g,cx-4,hy,8,8,cfg.piel);
 P(g,cx+3,hy,1,8,cfg.pielS);P(g,cx-4,hy,8,1,cfg.pielS);
 if(dir===AB){P(g,cx-2,hy+4,1,2,C.negro);P(g,cx+1,hy+4,1,2,C.negro);P(g,cx-1,hy+7,2,1,cfg.pielS);}
 if(izqV){P(g,cx-4,hy+4,1,2,C.negro);P(g,cx-4,hy,4,8,cfg.pielS);}
 if(derV){P(g,cx+3,hy+4,1,2,C.negro);P(g,cx,hy,4,8,cfg.pielS);}
 /* diagonal hacia el jugador: asoma el segundo ojo y la nariz */
 if(frente){
  if(derV){P(g,cx,hy,4,8,cfg.piel);P(g,cx,hy+4,1,2,C.negro);P(g,cx+2,hy+6,1,1,cfg.pielS);}
  else{P(g,cx-1,hy,4,8,cfg.piel);P(g,cx+2,hy+4,1,2,C.negro);P(g,cx-3,hy+6,1,1,cfg.pielS);}}
 /* diagonal de espaldas: sin cara, solo cogote */
 if(espalda){P(g,cx-4,hy,8,8,cfg.pielS);}
 if(P_.herido&&dir===AB){P(g,cx-2,hy+4,4,1,C.sangre);}
 /* pelo */
 const pc=cfg.pelo==='canoso'?C.pelo5:cfg.pelocol;
 const est=cfg.pelo;
 if(est!=='calvo'){
  if(est==='rapado')P(g,cx-4,hy-1,8,3,pc);
  else if(est==='corto'){P(g,cx-4,hy-2,8,4,pc);if(!arr)P(g,cx-4,hy+2,2,2,pc);}
  else if(est==='melena'){P(g,cx-5,hy-2,10,4,pc);P(g,cx-5,hy+2,2,7,pc);P(g,cx+3,hy+2,2,7,pc);}
  else if(est==='coleta'){P(g,cx-4,hy-2,8,4,pc);P(g,cx-6,hy+1,2,6,pc);}
  else if(est==='mono'){P(g,cx-4,hy-2,8,4,pc);P(g,cx-2,hy-5,4,3,pc);}
  else if(est==='afro'){P(g,cx-6,hy-4,12,7,pc);}
  else P(g,cx-4,hy-2,8,4,pc);
  if(arr&&est!=='calvo')P(g,cx-4,hy-2,8,8,pc);
 }
 /* gorro */
 const G=cfg.gorro;
 if(G==='txapela'){P(g,cx-5,hy-3,10,3,C.carbon);P(g,cx-6,hy-1,12,2,C.carbon);P(g,cx-1,hy-4,2,1,C.gris);}
 else if(G==='gorra'){P(g,cx-4,hy-3,8,3,cfg.gorroCol);if(!arr)P(g,cx-4,hy,6,1,cfg.gorroCol);}
 else if(G==='visera'){P(g,cx-4,hy-2,8,2,cfg.gorroCol);if(!arr)P(g,cx-5,hy,7,1,cfg.gorroCol);}
 else if(G==='cascoObra'){P(g,cx-5,hy-4,10,5,C.mostaza);P(g,cx-6,hy,12,1,C.mostazaO);P(g,cx-1,hy-5,2,1,C.mostazaO);}
 else if(G==='cascoMoto'){P(g,cx-5,hy-3,10,9,C.rojo);if(!arr)P(g,cx-3,hy+2,6,3,C.carbon);}
 else if(G==='lana'){P(g,cx-4,hy-3,8,4,C.rojoO);P(g,cx-4,hy+1,8,1,C.rojo);}
 else if(G==='policia'){P(g,cx-4,hy-3,8,3,C.azulO);if(!arr){P(g,cx-5,hy,8,1,C.azulO);P(g,cx-1,hy-2,2,1,C.mostaza);}}
 else if(G==='capucha'){P(g,cx-5,hy-2,10,6,TORSOS[cfg.torso].s);if(!arr)P(g,cx-3,hy+1,6,5,cfg.piel);}
 /* accesorio */
 const A=cfg.acces;
 if(A==='mochila'){if(arr)P(g,cx-4,ty+1,8,7,C.verdeO);else{P(g,cx-hom/2-1,ty+2,2,5,C.verdeO);P(g,cx+hom/2-1,ty+2,2,5,C.verdeO);}}
 else if(A==='bolso'){P(g,cx+hom/2-1,ty+5,3,3,C.maderaO);P(g,cx-1,ty+1,hom/2,1,C.madera);}
 else if(A==='bandolera'){P(g,cx-hom/2,ty+1,hom,1,C.maderaO);P(g,cx-hom/2-1,ty+5,2,3,C.madera);}
 else if(A==='bufanda'){P(g,cx-4,ty-1,8,2,C.rojo);P(g,cx+1,ty+1,2,4,C.rojoO);}
 else if(A==='gafas'&&dir===AB){P(g,cx-3,hy+4,2,2,C.carbon);P(g,cx+1,hy+4,2,2,C.carbon);P(g,cx-1,hy+4,2,1,C.carbon);}
 else if(A==='carrito'&&!arr){P(g,cx+5,ty+5,5,8,C.rojoO);P(g,cx+5,ty+5,5,2,C.rojo);P(g,cx+6,ty+13,1,2,C.carbon);P(g,cx+8,ty+13,1,2,C.carbon);}
 /* fogonazo */
 if(P_.fog){
  if(derV)P(g,cx+hom/2+7,ty+2,3,3,C.mostaza);
  else if(izqV)P(g,cx-hom/2-8,ty+2,3,3,C.mostaza);
  else P(g,cx+hom/2-1,ty+9,3,3,C.mostaza);}
 return c;
}
/* --- Arquetipos --- */
function A(nombre,comp,pielI,pelo,pelocol,gorro,gorroCol,torso,piernas,calzado,acces){
 const pieles=[C.piel1,C.piel2,C.piel3,C.piel4,C.piel5,C.piel6];
 const oscuras=['#d2ac89','#c1946e','#a5734f','#8a5b36','#6f4a31','#523524'];
 return {nombre,comp,piel:pieles[pielI],pielS:oscuras[pielI],pelo,pelocol,gorro,gorroCol,torso,piernas,calzado,acces};
}
const ARQUETIPOS=[
 A('protagonista','media',1,'corto',C.pelo1,'txapela',null,'cazadora','vaquero','botas','ninguno'),
 A('ertzaina','corpulenta',1,'rapado',C.pelo1,'policia',null,'uniforme','uniformeP','botas','ninguno'),
 A('ertzaina_asalto','corpulenta',2,'rapado',C.pelo1,'cascoMoto',null,'uniforme','uniformeP','botas','bandolera'),
 A('maton_a','corpulenta',2,'rapado',C.pelo1,'gorra',C.carbon,'cazadora','vaquero','deportivas','ninguno'),

/* Relleno de polígono por test de interior: sólido, sin huecos ni anti-alias.
   Rotar un rectángulo píxel a píxel dejaba agujeros; esto no. */
function poligono(g,pts,col,x0,y0,x1,y1){
 const dentro=(px,py)=>{let d=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
   const[xi,yi]=pts[i],[xj,yj]=pts[j];
   if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)d=!d;}
  return d;};
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)
  if(dentro(x+.5,y+.5))P(g,x,y,1,1,typeof col==='function'?col(x,y):col);
}
const girar=(pts,ang,cx,cy)=>pts.map(([x,y])=>{
 const ca=Math.cos(ang),sa=Math.sin(ang);return[cx+x*ca-y*sa,cy+x*sa+y*ca];});

function dibGlifo(filas){
 const c=lienzo(9,11),g=c.getContext('2d');
 const on=(x,y)=>y>=0&&y<7&&x>=0&&x<5&&((filas[y]>>(4-x))&1);
 /* contorno en los 8 vecinos */
 for(let y=-1;y<8;y++)for(let x=-1;x<6;x++){
  if(on(x,y))continue;
  let v=false;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(on(x+dx,y+dy))v=true;
  if(v)P(g,x+2,y+2,1,1,C.carbon);}
 /* cuerpo con degradado vertical de 3 tonos */
 for(let y=0;y<7;y++)for(let x=0;x<5;x++)if(on(x,y))
  P(g,x+2,y+2,1,1, y<2?C.mostaza : y<5?'#d9891f' : C.rojoO);
 /* brillo en la fila superior */
 for(let x=0;x<5;x++)if(on(x,0))P(g,x+2,1,1,1,C.crema);
 return c;
}

/*══════════ CUANTIZADOR A PALETA BLOQUEADA ══════════*/
/* Cualquier color que se cuele fuera de la paleta se ajusta al más cercano.
   Además el alfa se fuerza a binario: o el píxel existe o no existe. */
const PALETA=[...new Set(Object.values(C))].map(h=>[
 parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),h]);
const cacheCol=new Map();
function masCercano(r,g,b){
 const k=(r<<16)|(g<<8)|b;
 let v=cacheCol.get(k);if(v!==undefined)return v;
 let mej=PALETA[0],md=1e9;
 for(const p of PALETA){const d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(d<md){md=d;mej=p;}}
 cacheCol.set(k,mej);return mej;}
function cuantizar(c){
 const g=c.getContext('2d'),img=g.getImageData(0,0,c.width,c.height),d=img.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]<128){d[i+3]=0;continue;}
  d[i+3]=255;
  const p=masCercano(d[i],d[i+1],d[i+2]);
  d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];}
 g.putImageData(img,0,0);return c;}

 d.className=k===actual?'on':'';
 d.addEventListener('click',()=>{actual=k;[...nav.children].forEach(x=>x.classList.remove('on'));
  d.classList.add('on');pintar();});
 nav.appendChild(d);});
function pintar(){
 const cat=CAT[actual];
 main.innerHTML='';
 const h=document.createElement('h2');h.textContent=cat.titulo+' · '+cat.items.length+' sprites';main.appendChild(h);
 const n=document.createElement('div');n.className='nota';n.textContent=cat.nota;main.appendChild(n);
 if(actual==='personajes'){
  const grupos={};cat.items.forEach(i=>{(grupos[i.grupo]=grupos[i.grupo]||[]).push(i);});
  Object.keys(grupos).forEach(gk=>{
   const sh=document.createElement('h2');sh.textContent=gk.replace(/_/g,' ');main.appendChild(sh);
   const rej=document.createElement('div');rej.className='rej';
   for(let p=0;p<ORDEN_POSES.length;p++){
    const cel=document.createElement('div');cel.className='cel';
    const tira=document.createElement('div');tira.className='tira';
    for(let d=0;d<8;d++){
     const it=grupos[gk][p*8+d];
     const cc=document.createElement('canvas');cc.width=it.c.width*zoom;cc.height=it.c.height*zoom;
     const g=cc.getContext('2d');g.imageSmoothingEnabled=false;
     g.drawImage(it.c,0,0,cc.width,cc.height);tira.appendChild(cc);}
    cel.appendChild(tira);
    const nn=document.createElement('div');nn.className='n';nn.textContent=ORDEN_POSES[p];cel.appendChild(nn);
    rej.appendChild(cel);}
   main.appendChild(rej);});
 }else{
  const rej=document.createElement('div');rej.className='rej';
  cat.items.forEach(it=>{
   const cel=document.createElement('div');cel.className='cel';
   const cc=document.createElement('canvas');cc.width=it.c.width*zoom;cc.height=it.c.height*zoom;
   const g=cc.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(it.c,0,0,cc.width,cc.height);
   cel.appendChild(cc);
   const nn=document.createElement('div');nn.className='n';nn.textContent=it.n;cel.appendChild(nn);
   rej.appendChild(cel);});
  main.appendChild(rej);}
 const total=Object.values(CAT).reduce((a,c)=>a+c.items.length,0);
 document.getElementById('pie').textContent=
  `Total del catálogo: ${total} sprites en ${Object.keys(CAT).length} bloques. `+
  `Todo generado por código con la paleta bloqueada de 40 colores, sin anti-alias. `+
  `«Exportar atlas PNG» descarga una lámina con todos los sprites del bloque actual y «Exportar JSON» sus coordenadas.`;
}
document.getElementById('zoomP').addEventListener('click',()=>{zoom=Math.min(8,zoom+1);pintar();});
document.getElementById('zoomM').addEventListener('click',()=>{zoom=Math.max(1,zoom-1);pintar();});
document.getElementById('semilla').addEventListener('click',()=>{SEM=(SEM*7+13)%9973;construir();pintar();});

function atlas(){
 const items=CAT[actual].items;
 const ANCHO=512;let x=0,y=0,fila=0;const meta=[];
 items.forEach(it=>{
  if(x+it.c.width>ANCHO){x=0;y+=fila+1;fila=0;}
  meta.push({n:it.n,x,y,w:it.c.width,h:it.c.height});
  x+=it.c.width+1;fila=Math.max(fila,it.c.height);});
 const alto=y+fila+1;
 const c=lienzo(ANCHO,alto),g=c.getContext('2d');
 items.forEach((it,i)=>g.drawImage(it.c,meta[i].x,meta[i].y));
 return{canvas:c,meta};
}
document.getElementById('expPng').addEventListener('click',()=>{
 const{canvas}=atlas();const a=document.createElement('a');
 a.download='bilbo_atlas_'+actual+'.png';a.href=canvas.toDataURL('image/png');a.click();});
document.getElementById('expJson').addEventListener('click',()=>{
 const{meta}=atlas();const s=document.getElementById('salida');
 s.style.display='block';s.value=JSON.stringify({bloque:actual,sprites:meta},null,1);
 s.select();});
pintar();
})();
</script>
</body>
