/*═══════════════ VEHÍCULOS Y NPCs ═══════════════*/
/* un coche aparcado mira hacia donde va la calle, no siempre al este */
function angCalle(x,y){
 const fx=Math.floor(x),fy=Math.floor(y);
 let h=0,v=0;
 for(let d=1;d<=3;d++){
  if(rodable(fx+d,fy))h++;if(rodable(fx-d,fy))h++;
  if(rodable(fx,fy+d))v++;if(rodable(fx,fy-d))v++;}
 if(h===v)return azar()<.5?0:Math.PI/2;
 return h>v?(azar()<.5?0:Math.PI):(azar()<.5?Math.PI/2:-Math.PI/2);}
function nuevoCoche(x,y,tipo,lib,propio,vmax){
 return{x,y,ang:angCalle(x,y),vx:0,vy:0,tipo,lib,propio,vmax:vmax||vmaxDe(tipo),dano:0,vivo:true};}
const coches=[],trafico=[],policia=[],enemigos=[],balas=[],parts=[],peatones=[];
let tuCoche=null;
const TIPOS_CIVIL=['utilitario','berlina','ranchera','todoterreno','taxi','furgoCorta','moto','microbus'];
/* La ambulancia estaba dibujada, con su chasis y su tope de velocidad, y no salía nunca:
   no estaba en ninguna lista, así que ni el tráfico la sacaba ni el jugador podía subirse. */
const TIPOS_PESADO=['autobus','basura','camionObra','furgoLarga','bomberos','grua','furgonPoli','ambulancia'];
/* Por la Gran Vía no pasan las mismas cosas que por Zorrotzaurre. La mezcla la decide el
   estilo del barrio, que ya lo tenemos del plano: no hace falta pintar rutas a mano. */
const TRAFICO_BARRIO={
 senorial:  ['taxi','berlina','berlina','utilitario','moto','microbus','furgoCorta'],
 denso:     ['utilitario','moto','moto','taxi','furgoCorta','microbus'],
 bloques:   ['utilitario','utilitario','ranchera','furgoCorta','moto','todoterreno','microbus'],
 industrial:['furgoLarga','camionObra','grua','furgoCorta','todoterreno','basura','ranchera'],
 abierto:   ['todoterreno','ranchera','utilitario','moto','autobus'],
};
const tipoParaBarrio=(x,y)=>{
 const l=TRAFICO_BARRIO[distDe(clamp(x|0,0,MW-1),clamp(y|0,0,MH-1)).estilo];
 return l?l[rndi(0,l.length-1)]:TIPOS_CIVIL[rndi(0,TIPOS_CIVIL.length-1)];};
/* Un coche aparcado va en su plaza y mirando a donde va la calle, no en mitad del carril
   y de cualquier manera. La plaza ya está pintada en el suelo, y su código dice además de
   qué lado queda el bordillo: de ahí salen el sitio —arrimado al bordillo, no en el eje— y
   el rumbo, que es el de la calle. Si no hay ninguna cerca se vuelve a lo de antes. */
function puntoAparcamiento(cx,cy,rad){
 for(let i=0;i<500;i++){
  const x=clamp(cx+rndi(-rad,rad),2,MW-3),y=clamp(cy+rndi(-rad,rad),2,MH-3);
  const mb=MOB[y*MW+x];
  if(mb<M_APARCA||mb>=M_APARCA+4)continue;
  const[dx,dy]=[[0,-1],[0,1],[-1,0],[1,0]][mb-M_APARCA];
  /* El bordillo a los lados quiere decir calle de norte a sur, y al revés. El sentido lo
     da la paridad de la casilla: los de un lado miran a un lado. */
  const ang=dx?(y%2?Math.PI/2:-Math.PI/2):(x%2?Math.PI:0);
  return{x:x+.5+dx*.28,y:y+.5+dy*.28,ang};}
 return null;}
function aparcarCoche(c,cx,cy,rad){
 const q=puntoAparcamiento(cx,cy,rad);
 if(q){c.x=q.x;c.y=q.y;c.ang=q.ang;return true;}
 const p=puntoCalle(cx,cy,rad);
 c.x=p.x;c.y=p.y;c.ang=angCalle(p.x,p.y);return false;}
function poblar(){
 tuCoche=nuevoCoche(poi('piso').p.x+1.4,poi('piso').p.y,'utilitario',0,true,11);
 coches.push(tuCoche);
 /* Cuarenta coches aparcados repartidos por el término municipal entero son cuarenta
    coches que no se ven nunca: son siete kilómetros de calle. Se sueltan alrededor del
    jugador y se reciclan al alejarse, igual que el tráfico y los peatones. */
 for(let i=0;i<40;i++){const p=puntoCalle(player.x|0,player.y|0,48);
  const c=nuevoCoche(p.x,p.y,tipoParaBarrio(p.x,p.y),(i+1)%LIBREAS.length,false);
  aparcarCoche(c,player.x|0,player.y|0,48);
  coches.push(c);}
 for(let i=0;i<16;i++)trafico.push(nuevoTrafico(player.x|0,player.y|0));
 for(let i=0;i<26;i++)peatones.push(nuevoPeaton(player.x|0,player.y|0));
}
/* Se recolocan de dos en dos por vuelta: buscar sitio en la calle cuesta lo suyo y
   hacerlo para cuarenta coches el mismo fotograma se nota en el pulso del juego. */
let _reciclaCoche=0;
function reciclarCoches(){
 let hechos=0;
 for(let n=0;n<coches.length&&hechos<2;n++){
  _reciclaCoche=(_reciclaCoche+1)%coches.length;
  const c=coches[_reciclaCoche];
  if(c.propio||c===player.enCoche||dist(c,player)<=72)continue;
  const q=puntoAparcamiento(player.x|0,player.y|0,54)||puntoCalle(player.x|0,player.y|0,54);
  if(dist(q,player)<26)continue;                 /* que no aparezca en las narices */
  c.x=q.x;c.y=q.y;c.ang=q.ang!==undefined?q.ang:angCalle(q.x,q.y);
  c.vx=c.vy=0;c.dano=0;c.vivo=true;
  c.tipo=tipoParaBarrio(q.x,q.y);c.lib=(c.lib+1)%LIBREAS.length;
  hechos++;}
}
function nuevoTrafico(cx,cy){
 const p=puntoCalle(cx===undefined?player.x|0:cx,cy===undefined?player.y|0:cy,44);
 const pesado=azar()<.18;
 const tipo=pesado?TIPOS_PESADO[rndi(0,TIPOS_PESADO.length-1)]:tipoParaBarrio(p.x,p.y);
 return{x:p.x,y:p.y,tx:p.x|0,ty:p.y|0,dx:1,dy:0,vel:pesado?2.7:3.7,ang:0,
  tipo,lib:rndi(0,LIBREAS.length-1),frenado:0};}
function arqPeaton(x,y){
 const l=PEATON_BARRIO[distDe(clamp(x|0,0,MW-1),clamp(y|0,0,MH-1)).estilo];
 return (l||PEATON_ARQ)[rndi(0,(l||PEATON_ARQ).length-1)];}
function nuevoPeaton(cx,cy){
 /* Uno de cada cuatro no va a ningún sitio: espera el bus en la marquesina o está sentado
    en un banco. Sin esto, todo el mundo anda todo el rato y una parada de bus es un tejadillo
    con nadie debajo. */
 let p=null,espera=0;
 if(azar()<.25)for(let i=0;i<90&&!p;i++){
  const x=clamp(cx+rndi(-20,20),2,MW-3),y=clamp(cy+rndi(-16,16),2,MH-3);
  const mb=MOB[y*MW+x];
  if(mb===M_MARQUESINA||mb===M_BANCO){p={x:x+.5,y:y+.5};espera=rnd(8,30);}}
 if(!p)p=puntoAcera(cx,cy,22);
 return{x:p.x,y:p.y,dx:0,dy:0,t:0,arq:arqPeaton(p.x,p.y),
  d8:espera?4:0,pose:'quieto',anim:0,huye:0,espera,hp:30};}
function particula(x,y,tipo,n=1){
 for(let i=0;i<n;i++){const a=rnd(0,6.283),v=tipo==='sangre'?rnd(1,4):tipo==='chispa'?rnd(2,7):rnd(.4,2.4);
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,vida:tipo==='humo'?rnd(.6,1.6):rnd(.25,.7),
   tipo,r:tipo==='humo'?rnd(4,9):rnd(1.5,3.5)});}}

/*═══════════════ EL MANDO, FORJADO ═══════════════*/
/* El marco era CSS: degradados radiales y una bolita negra de «brillo». Un brillo negro
   sobre plástico claro no es un brillo, es una mancha —y encima se comía la letra. Aquí
   todo lo demás se dibuja por código y a la paleta; el mando también.

   Plástico de consola: cuerpo claro, canto vivo arriba a la izquierda, sombra abajo a la
   derecha, un reflejo blanco arriba —donde pega la luz, que en este juego siempre viene
   de arriba a la izquierda— y la letra en negro, que es lo único que se lee sobre un
   botón de hueso. */
const MANDO={};
const disco=(g,cx,cy,r,col)=>{
 for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)
  if(x*x+y*y<=r*r)P(g,cx+x,cy+y,1,1,col);};
const arco=(g,cx,cy,r,col,d0,d1)=>{
 for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){
  const q=x*x+y*y;
  if(q>r*r||q<(r-1.6)*(r-1.6))continue;
  const a=Math.atan2(y,x);
  if(a>=d0&&a<=d1)P(g,cx+x,cy+y,1,1,col);}};
/* Un botón redondo de 24, pulsado o sin pulsar. */
function botonMando(letra,pulsado){
 const N=24,c=lienzo(N,N),g=c.getContext('2d'),r=11,cx=12,cy=12;
 disco(g,cx,cy,r,C.carbon);                                   /* el hueco donde va */
 const cuerpo=pulsado?C.hormigonO:C.crema, alto=pulsado?C.hormigon:C.hueso;
 disco(g,cx,cy+(pulsado?1:0),r-1,cuerpo);
 arco(g,cx,cy+(pulsado?1:0),r-1,alto,-Math.PI,-0.15);          /* canto de arriba */
 arco(g,cx,cy+(pulsado?1:0),r-1,C.hormigonO,0.25,Math.PI-0.1); /* canto de abajo */
 if(!pulsado){P(g,7,5,4,2,C.blanco);P(g,6,6,2,2,C.blanco);}    /* el reflejo, en blanco */
 texto(g,letra,cx-3,cy-3+(pulsado?1:0),1,'negra');
 return cuantizar(c);}
/* La base del joystick: un plato cóncavo. */
function joyBase(){
 const N=32,c=lienzo(N,N),g=c.getContext('2d');
 disco(g,16,16,15,C.carbon);
 disco(g,16,16,14,C.crema);
 arco(g,16,16,14,C.hueso,-Math.PI,-0.15);
 arco(g,16,16,14,C.hormigonO,0.25,Math.PI-0.1);
 disco(g,16,16,9,C.hormigon);                                  /* el hueco del plato */
 arco(g,16,16,9,C.hormigonO,-Math.PI,-0.15);
 arco(g,16,16,9,C.hormigonL,0.25,Math.PI-0.1);
 P(g,9,7,4,2,C.hueso);
 return cuantizar(c);}
/* La seta que se mueve dentro del plato. */
function joySeta(){
 const N=20,c=lienzo(N,N),g=c.getContext('2d');
 disco(g,10,10,9,C.negro);
 disco(g,10,10,8,C.gris);
 arco(g,10,10,8,C.grisL,-Math.PI,-0.15);
 arco(g,10,10,8,C.carbon,0.25,Math.PI-0.1);
 disco(g,10,9,5,C.grisL);
 P(g,6,5,3,2,C.acero);
 return cuantizar(c);}
/* Las pastillas alargadas de arriba. */
function pastilla(pulsada){
 const W=28,Hh=12,c=lienzo(W,Hh),g=c.getContext('2d');
 P(g,0,1,W,Hh-2,C.carbon);P(g,1,0,W-2,Hh,C.carbon);
 const cuerpo=pulsada?C.hormigonO:C.gris;
 P(g,1,2,W-2,Hh-4,cuerpo);P(g,2,1,W-4,Hh-2,cuerpo);
 if(!pulsada){P(g,2,2,W-4,1,C.grisL);P(g,2,Hh-3,W-4,1,C.negro);P(g,3,3,4,1,C.acero);}
 return cuantizar(c);}
function forjarMando(){
 MANDO.a=botonMando('A',0);MANDO.aP=botonMando('A',1);
 MANDO.b=botonMando('B',0);MANDO.bP=botonMando('B',1);
 MANDO.joy=joyBase();MANDO.seta=joySeta();
 MANDO.pas=pastilla(0);MANDO.pasP=pastilla(1);
 const url=c=>`url(${c.toDataURL()})`;
 const R=document.documentElement.style;
 R.setProperty('--imgA',url(MANDO.a));   R.setProperty('--imgAp',url(MANDO.aP));
 R.setProperty('--imgB',url(MANDO.b));   R.setProperty('--imgBp',url(MANDO.bP));
 R.setProperty('--imgJoy',url(MANDO.joy));R.setProperty('--imgSeta',url(MANDO.seta));
 R.setProperty('--imgPas',url(MANDO.pas));R.setProperty('--imgPasP',url(MANDO.pasP));}
/* Los sprites del mando miden 24 y 32; para que no salgan píxeles a medias, el tamaño en
   pantalla se redondea a un múltiplo entero, como el zoom del juego. */
function ajustarMando(){
 const marco=document.getElementById('izq').clientWidth;
 if(!marco)return;
 const alto=innerHeight;
 const esc=n=>Math.max(2,Math.floor(n));
 const eBtn=esc(Math.min(marco*.60,alto*.24,110)/24);
 const eJoy=esc(Math.min(marco*.80,alto*.38,152)/32);
 const R=document.documentElement.style;
 R.setProperty('--btn',eBtn*24+'px');
 R.setProperty('--joy',eJoy*32+'px');
 R.setProperty('--seta',eJoy*20+'px');
 R.setProperty('--pas',Math.max(2,Math.floor(Math.min(marco*.42,alto*.06,34)/28))*28+'px');}
addEventListener('resize',ajustarMando);

/*═══════════════ ENTRADA ═══════════════*/
/* Un mando de consola repartido en los dos cuartos exteriores de la pantalla apaisada.
   A la izquierda el pulgar que anda o conduce, a la derecha el que apunta y dispara.
   Nada en el medio: por ahí se ve Bilbao.

   No hay botón de correr. El joystick es analógico, así que empujarlo a fondo ya es
   correr — un botón menos que buscar con el pulgar, y el anillo se enciende para que se
   note. */
const teclas={};
let aPuls=false,cPuls=false,cMant=false,aMant=false,aDesde=0,aToque=false;
const joy={id:null,dx:0,dy:0,mag:0};      /* andar y conducir */
const mira={dx:0,dy:0};                   /* apuntado fino: solo con las flechas del teclado */
/* Las velocidades, escritas en metros por segundo y pasadas a casillas con la escala del
   mapa. Iban en casillas puestas a ojo y, medidas, salía esto:
     andar     1,55 c/s =  28,8 km/h        correr  4,80 c/s = 89,2 km/h
     agachado  1,25 c/s =  23,2 km/h        coche  11,00 c/s = 204 km/h
     aceleración del coche  73,8 m/s² = 7,5 g
   Un peatón que anda a 29 km/h y acelera un utilitario a siete veces la gravedad. Nada de
   eso se nota mirando el número en casillas, y por eso estaba así: en metros por segundo
   no cuela.
   Ahora se escribe en m/s y se convierte, que es lo único que mantiene esto honesto. Los
   valores son humanos pero del lado rápido —paso vivo y carrera de alguien que huye—,
   porque el juego se cruza en coche y en metro, no andando. */
const MS=1/5.16;                          /* m/s -> casillas/s */
/* La vara de la figura. La gente y el mobiliario se dibujan a 20 px/m —a la escala del
   suelo una persona mide 21 px y ahí no cabe una cara, ni ocho direcciones— mientras que el
   suelo va a 12,4. O sea que la figura es **1,6 veces más grande que la calle que pisa**, y
   de ahí salía que andar pareciese patinar: a 1,7 m/s avanzaba 0,6 alturas de cuerpo por
   segundo, cuando una persona de verdad avanza una entera. El ojo no mide metros: mide
   cuerpos.

   Así que lo que anda por encima del suelo anda en **la vara de la figura**, no en la del
   plano: velocidad y zancada se multiplican por ESC_FIG y el paso se ve como el de alguien
   de ese tamaño. En metros de mapa sale más rápido, y es a propósito.

   Dentro de un sitio no hace falta y por eso ahí siempre se vio bien: la casilla de interior
   va a 20 px/m, la misma vara que la gente. */
const PX_M=TS/5.16;                       /* píxeles de pantalla por metro de suelo */
const ESC_FIG=sc(26)/(1.70*PX_M);         /* la figura mide sc(26) px y representa 1,70 m */
const V_ANDAR=1.7*MS*ESC_FIG, V_CORRER=6.0*MS*ESC_FIG, V_AGACHADO=1.0*MS*ESC_FIG;
const V_PEATON=1.3*MS*ESC_FIG, V_HUIDA=4.5*MS*ESC_FIG, V_ENEMIGO=3.4*MS*ESC_FIG;
/* El coche: punta por chasis y aceleración de verdad. 2,5 m/s² son los 0-100 en 11 s de
   un utilitario; la furgoneta y el camión, menos. Frenar es 7 m/s², que es lo que da un
   freno decente sobre asfalto seco. */
const ACEL=3.1*MS, FRENO=7*MS;
const VMAX_VEH={utilitario:120,berlina:150,ranchera:145,furgoCorta:110,furgoLarga:105,
 deportivo:200,todoterreno:140,taxi:150,patrulla:170,ambulancia:120,basura:80,
 autobus:80,camionObra:90,moto:130,bomberos:90,grua:95,microbus:95,furgonPoli:130};
const vmaxDe=t=>(VMAX_VEH[t]||120)/3.6*MS;   /* km/h -> casillas/s */
const CORRE=.82;                          /* a partir de aquí el joystick es correr */
/* Y por debajo de esto, agachado. El joystick ya decía si andas o corres; que diga
   también si vas agachado es un botón menos que buscar con el pulgar. La postura se
   queda puesta al soltar: si no, cada vez que paras a mirar una esquina te levantas. */
const AGACHA=.34;

addEventListener('keydown',e=>{const k=e.key.toLowerCase();
 if(k==='tab'){e.preventDefault();abrirTel();return;}
 if(k==='escape'){e.preventDefault();togglePausa();return;}
 if(k==='e'&&!teclas[k]){aPuls=true;aMant=true;aDesde=performance.now();}
 if(k===' '&&!teclas[k]){e.preventDefault();cPuls=true;cMant=true;}
 if(k==='q'&&!teclas[k])cambiarArma();
 teclas[k]=true;});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();
 if(k===' ')cMant=false;
 if(k==='e'){aMant=false;aToque=performance.now()-aDesde<250;}
 teclas[k]=false;});

const joyEl=document.getElementById('joy'),joyPal=joyEl.querySelector('i');

/* El punto de agarre del joystick es su centro en pantalla, y se recalcula en cada
   toque: la barra del navegador aparece y desaparece y con ella se mueve todo. */
function centro(el){const r=el.getBoundingClientRect();
 return{x:r.left+r.width/2,y:r.top+r.height/2,r:Math.max(24,r.width/2)};}

function tomarJoy(x,y){
 const c=centro(joyEl);
 let dx=x-c.x,dy=y-c.y;const d=Math.hypot(dx,dy);
 if(d>c.r){dx=dx/d*c.r;dy=dy/d*c.r;}
 joy.dx=dx/c.r;joy.dy=dy/c.r;joy.mag=Math.min(1,d/c.r);
 joyPal.style.transform=`translate(${dx*.5}px,${dy*.5}px)`;
 joyEl.classList.toggle('corre',joy.mag>CORRE);}
function soltarJoy(){joy.id=null;joy.dx=joy.dy=0;joy.mag=0;
 joyPal.style.transform='';joyEl.classList.remove('corre');}

/* Se agarra desde todo el marco izquierdo, no solo desde el disco: en marcha el pulgar
   no acierta al centro y quedarse sin andar por dos milímetros da mucha rabia. */
const zonaIzq=x=>x<innerWidth*.20;
addEventListener('touchstart',e=>{audioInit();for(const t of e.changedTouches)
 if(joy.id===null&&zonaIzq(t.clientX)){joy.id=t.identifier;tomarJoy(t.clientX,t.clientY);}},{passive:true});
addEventListener('touchmove',e=>{for(const t of e.changedTouches)
 if(t.identifier===joy.id)tomarJoy(t.clientX,t.clientY);},{passive:true});
function finT(e){for(const t of e.changedTouches)if(t.identifier===joy.id)soltarJoy();}
addEventListener('touchend',finT,{passive:true});addEventListener('touchcancel',finT,{passive:true});

/* Con ratón vale el mismo mando: se prueba en el escritorio sin enchufar nada. */
let ratonEn=false;
addEventListener('mousedown',e=>{audioInit();if(zonaIzq(e.clientX)){ratonEn=true;tomarJoy(e.clientX,e.clientY);}});
addEventListener('mousemove',e=>{if(ratonEn)tomarJoy(e.clientX,e.clientY);});
addEventListener('mouseup',()=>{if(ratonEn)soltarJoy();ratonEn=false;});

function bind(el,f){el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();audioInit();f(true);},{passive:false});
 el.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();f(false);},{passive:false});
 el.addEventListener('mousedown',e=>{e.stopPropagation();audioInit();f(true);});
 el.addEventListener('mouseup',e=>{e.stopPropagation();f(false);});}
/* A deja de ser solo un pulso: mantenido es el freno del coche, y el toque corto sigue
   siendo la accion. Se distinguen por el tiempo, que es lo unico que no obliga a meter
   otro boton en un marco donde no cabe. */
bind(document.getElementById('bA'),v=>{
 if(v){aPuls=true;aMant=true;aDesde=performance.now();}
 else{aMant=false;aToque=performance.now()-aDesde<250;}});
bind(document.getElementById('bB'),v=>{if(v)cPuls=true;cMant=v;});
document.getElementById('bSel').addEventListener('click',abrirTel);
document.getElementById('bOpt').addEventListener('click',togglePausa);
document.getElementById('bR').addEventListener('click',cambiarArma);

const AU={ctx:null,on:true,mus:true,gSfx:null,gMus:null,motor:null,sirena:null,musT:0};
function audioInit(){
 if(AU.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 AU.ctx=new AC();
 AU.gSfx=AU.ctx.createGain();AU.gSfx.gain.value=.32;AU.gSfx.connect(AU.ctx.destination);
 AU.gMus=AU.ctx.createGain();AU.gMus.gain.value=.12;AU.gMus.connect(AU.ctx.destination);
 const o=AU.ctx.createOscillator(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();
 o.type='sawtooth';o.frequency.value=60;f.type='lowpass';f.frequency.value=520;g.gain.value=0;
 o.connect(f);f.connect(g);g.connect(AU.gSfx);o.start();AU.motor={o,g,f};
 const so=AU.ctx.createOscillator(),sg=AU.ctx.createGain();
 so.type='square';so.frequency.value=680;sg.gain.value=0;so.connect(sg);sg.connect(AU.gSfx);so.start();
 AU.sirena={o:so,g:sg,t:0};}
function ruidoBuf(seg){const n=AU.ctx.sampleRate*seg,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=azar()*2-1;return b;}
function sfx(tipo,vol=1){
 if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime,g=AU.ctx.createGain();g.connect(AU.gSfx);
 if(['disparo','escopeta','golpe','explosion','choque','grito'].includes(tipo)){
  const s=AU.ctx.createBufferSource();s.buffer=ruidoBuf(tipo==='explosion'?.9:.28);
  const f=AU.ctx.createBiquadFilter();f.type=tipo==='golpe'?'lowpass':'bandpass';
  f.frequency.value=tipo==='explosion'?180:tipo==='escopeta'?900:tipo==='golpe'?320:tipo==='choque'?260:1500;
  f.Q.value=tipo==='grito'?6:1;s.connect(f);f.connect(g);
  const dur=tipo==='explosion'?.85:tipo==='escopeta'?.3:.14;
  g.gain.setValueAtTime(.9*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  if(tipo==='explosion'){const o=AU.ctx.createOscillator(),og=AU.ctx.createGain();
   o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(24,t+.8);
   og.gain.setValueAtTime(.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.8);
   o.connect(og);og.connect(AU.gSfx);o.start(t);o.stop(t+.9);}
  s.start(t);s.stop(t+dur+.05);
 }else if(tipo==='claxon'){
  const o=AU.ctx.createOscillator(),o2=AU.ctx.createOscillator();o.type=o2.type='square';
  o.frequency.value=370;o2.frequency.value=440;o.connect(g);o2.connect(g);
  g.gain.setValueAtTime(.22*vol,t);g.gain.setValueAtTime(.22*vol,t+.22);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.start(t);o2.start(t);o.stop(t+.32);o2.stop(t+.32);
 }else{const o=AU.ctx.createOscillator();o.type='square';
  o.frequency.setValueAtTime(tipo==='dinero'?620:300,t);
  o.frequency.setValueAtTime(tipo==='dinero'?880:200,t+.07);
  o.connect(g);g.gain.setValueAtTime(.25*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.start(t);o.stop(t+.18);}}
function motorAudio(vel,vmax){
 if(!AU.motor||!AU.on)return;
 if(vel===null){AU.motor.g.gain.value=0;return;}
 const v=Math.abs(vel)/Math.max(1,vmax);
 AU.motor.o.frequency.value=52+v*140;AU.motor.f.frequency.value=380+v*900;
 AU.motor.g.gain.value=clamp(.05+v*.13,0,.2);}
function sirenaAudio(dt,activa){
 if(!AU.sirena||!AU.on)return;
 if(!activa){AU.sirena.g.gain.value=0;return;}
 AU.sirena.t+=dt;AU.sirena.o.frequency.value=Math.sin(AU.sirena.t*6)>0?720:520;AU.sirena.g.gain.value=.05;}
const ESCALA=[0,3,5,7,10];
function musica(dt){
 if(!AU.ctx||!AU.mus||!AU.on)return;
 AU.musT-=dt;if(AU.musT>0)return;AU.musT=.24;
 const t=AU.ctx.currentTime,base=S.estrellas>0?58:S.escena==='interior'?46:41;
 const paso=(azar()<.75)?ESCALA[rndi(0,4)]:ESCALA[rndi(0,4)]+12;
 const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
 o.type=S.estrellas>0?'sawtooth':'triangle';
 o.frequency.value=440*Math.pow(2,(base+paso-69)/12);
 g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.5,t+.02);
 g.gain.exponentialRampToValueAtTime(.001,t+.23);
 o.connect(g);g.connect(AU.gMus);o.start(t);o.stop(t+.25);
 if(azar()<.5){const b=AU.ctx.createOscillator(),bg=AU.ctx.createGain();
  b.type='square';b.frequency.value=440*Math.pow(2,(base-24-69)/12);
  bg.gain.setValueAtTime(.4,t);bg.gain.exponentialRampToValueAtTime(.001,t+.2);
  b.connect(bg);bg.connect(AU.gMus);b.start(t);b.stop(t+.22);}}

   a.innerHTML=`<div class="ico">${icoImg('llave')}</div><div class="txt"><div class="tt">Pagar alquiler</div>

/*═══════════════ CURROS ═══════════════*/
function aceptarCurro(j,pago){
 let o,d=null;
 let dn=null;
 const dest=(min,max)=>{const q=destinoCurro(min,max);dn=q.n;return q.p;};
 if(j.id==='reparto'){o=poi('bar').p;d=dest(70,200);}
 else if(j.id==='taxi'||j.id==='mudanza'){o=puntoAcera(player.x|0,player.y|0,60);d=dest(90,300);}
 else if(j.id==='obra')o=poi('obra').p;
 else if(j.id==='puerto')o=poi('puerto').p;
 else if(j.id==='lonja')o=poi('merca').p;
 else if(j.id==='fuga'){o=puntoAcera(player.x|0,player.y|0,50);d=dest(90,280);}
 else{o=poi('taller').p;d=dest(70,240);}
 S.job={...j,pago,o,d,dn,fase:0};
 aviso('Curro aceptado: '+j.tt+(dn?' · '+dn.toUpperCase():''));}

/* Un destino de curro tiene que estar lejos para que el viaje valga algo y cerca para
   que no sea media hora andando: entre 300 m y kilómetro y medio. Y mejor un sitio con
   nombre —«a San Mamés», «a Zorrotza»— que una acera cualquiera. La ciudad es la de
   verdad; que se note en el trabajo, no solo en el plano. */
function destinoCurro(minC,maxC,ox,oy){
 const px=ox===undefined?player.x:ox, py=oy===undefined?player.y:oy, cand=[];
 for(const b of BARRIOS){const q=Math.hypot(b.x-px,b.y-py);
  if(q>=minC&&q<=maxC)cand.push({n:b.n,c:[b.x,b.y]});}
 for(const p of POI){if(p.int||!p.mira)continue;
  const q=Math.hypot(p.p.x-px,p.p.y-py);
  if(q>=minC&&q<=maxC)cand.push({n:p.n,c:[p.p.x|0,p.p.y|0]});}
 if(!cand.length)return{n:null,p:puntoAcera(px|0,py|0,Math.round(maxC))};
 const e=cand[rndi(0,cand.length-1)];
 return{n:e.n,p:puntoAcera(e.c[0],e.c[1],24)};}
function cobrar(j){
 S.dinero+=j.pago;S.rep[j.g]++;sfx('dinero');let e='';
 if(S.contrato&&S.contrato.g===j.g){S.contrato.hechos++;
  if(S.contrato.hechos>=S.contrato.meta){S.dinero+=S.contrato.bonus;e=' +'+S.contrato.bonus+' CONTRATO';S.contrato=null;}}
 darXp(Math.max(6,Math.round(j.pago*.5)));
 aviso('+'+j.pago+' €'+e);S.job=null;guardar();}
function firmar(g,meta,bonus){if(S.contrato)return aviso('Ya tienes contrato');
 S.contrato={g,meta,hechos:0,bonus};aviso('Contrato firmado');guardar();}

/*═══════════════ NIVEL, VIVIENDAS Y NEGOCIOS ═══════════════*/
/* La fama por gremio ya existía y desbloquea curros, pero es local: ser bueno repartiendo
   pintxos no dice nada de lo que has hecho en la calle. El nivel es el resumen de todo, y
   es lo que abre las armas grandes, los coches y —sobre todo— lo que te dejan comprar.

   La curva sube deprisa a propósito: el primer piso tiene que costar varios días de curro
   y la galería, media partida. Si el dinero llega antes que el nivel, comprar deja de ser
   una meta y pasa a ser un trámite. */
const XP_NIVEL=n=>Math.round(140*Math.pow(n,1.5));
function darXp(n,motivo){
 S.xp+=n;
 while(S.xp>=XP_NIVEL(S.nivel)){S.xp-=XP_NIVEL(S.nivel);S.nivel++;
  grande('NIVEL '+S.nivel,2.4);sfx('dinero');}
 if(motivo)aviso('+'+n+' XP · '+motivo);}

const propDe=id=>PROPIEDADES.find(p=>p.id===id);
const esMio=id=>!!S.props[id];
const perkMio=perk=>PROPIEDADES.some(p=>p.perk===perk&&esMio(p.id));
const rentaDiaria=()=>PROPIEDADES.reduce((t,p)=>t+(esMio(p.id)?(p.renta||0):0),0);
/* Falta nivel, falta dinero, o nada: el mismo texto sirve para el móvil y para el
   diálogo, y así no se explican de dos maneras distintas. */
function pegaPara(p){
 if(esMio(p.id))return null;
 if(S.nivel<p.nivel)return 'Necesitas nivel '+p.nivel;
 if(S.dinero<p.precio)return 'Te faltan '+(p.precio-Math.round(S.dinero))+' €';
 return '';}
function comprarProp(id){
 const p=propDe(id);if(!p)return;
 const pega=pegaPara(p);
 if(pega===null)return aviso('Ya es tuyo');
 if(pega)return aviso(pega);
 S.dinero-=p.precio;S.props[id]=true;sfx('dinero');
 /* Comprar el piso de Santutxu es dejar de ser inquilino: se salda lo que se deba y no
    vuelve a correr el alquiler. */
 if(id==='pisosantutxu'){S.deuda=0;S.alquiler=0;}
 darXp(Math.round(p.precio/220));
 grande(p.tipo==='vivienda'?'CASA NUEVA':'NEGOCIO COMPRADO',2.6);
 aviso(p.n+' · −'+p.precio+' €',3);guardar();}
/* Lo que renta un negocio se cobra al dormir, como el alquiler pero al revés. */
function cobrarRentas(){
 const r=rentaDiaria();
 if(r>0){S.dinero+=r;aviso('Cuentas del día: +'+r+' €',3);}
 return r;}
/* Una opción de compra para el diálogo del dueño. Si ya es tuyo, la casa invita. */
function opcionComprar(id,textoDentro){
 const p=propDe(id);
 if(esMio(p.id))return {txt:textoDentro||'Ver las cuentas',
  fn:()=>aviso(p.n+' es tuyo · +'+p.renta+' €/día')};
 const pega=pegaPara(p);
 return {txt:'¿Y si te lo compro?',coste:p.precio+' €',
  fn:()=>pega?aviso(pega):hablar('Trato',[p.dd,'Son '+p.precio+' €. ¿Cerramos?'],
   [{txt:'Trato hecho',fn:()=>comprarProp(id)},{txt:'Me lo pienso',fn:()=>{}}])};}

/*═══════════════ EL ALQUILER Y LA CASERA ═══════════════*/
/* El alquiler era un número que subía y una frase al dormir. Ahora hay alguien al otro
   lado: Amaia lleva la cuenta, avisa, y si no pagas te cambia la cerradura. Se puede
   seguir durmiendo allí a la fuerza, pero eso ya es otra cosa —y se paga de otra manera.

   Estados, en orden: al día → debiendo → avisado → desahuciado → okupa. No hay más, y
   ninguno es un callejón sin salida: pagando se vuelve, aunque el precio de volver sube. */
const SEMANA=7;
const semanasDebe=()=>S.alquiler>0?Math.floor(S.deuda/S.alquiler):0;
function estadoCasera(){
 if(S.casera.okupa)return 'okupa';
 if(S.casera.desahucio)return 'desahuciado';
 if(S.casera.avisada)return 'avisado';
 return S.deuda>0?'debiendo':'aldia';}
/* Lo que hay que soltar para volver a tener llave. La mudanza y la cerradura las paga
   quien las provoca. */
const deudaTotal=()=>S.deuda+(S.casera.desahucio?Math.round(S.alquiler*1.5):0);

/* Se llama al dormir, una vez por día. El recibo cae cada siete. */
function correrAlquiler(){
 if(S.alquiler<=0)return;                       /* piso comprado o dejado: no hay recibo */
 while(S.dia-S.ultCobro>=SEMANA){
  S.ultCobro+=SEMANA;S.deuda+=S.alquiler;
  aviso('Recibo del alquiler: +'+S.alquiler+' € de deuda',3);}
 const sem=semanasDebe();
 if(sem>=2&&!S.casera.avisada&&!S.casera.desahucio){
  S.casera.avisada=1;S.casera.paciencia=Math.max(0,S.casera.paciencia-1);
  grande('AVISO DE AMAIA',2.4);
  aviso('«Dos meses. El que viene te cambio la cerradura»',4);}
 if(sem>=3&&!S.casera.desahucio){
  S.casera.desahucio=true;
  grande('TE HAN DESAHUCIADO',2.8);
  aviso('Amaia ha cambiado la cerradura de tu piso',4);}}

/* Dormir de okupa es dormir mal, y a veces con visita. */
function dormirOkupa(){
 S.hp=Math.min(100,S.hp+18);S.energia=.55;
 if(azar()<.3){delito(1,false);estrellas(1);
  aviso('Alguien ha llamado a la pasma',3);}
 else aviso('Has dormido en el suelo. Día '+S.dia,3);}

function pagarCasera(){
 const t=deudaTotal();
 if(t<=0){
  /* Pagar por adelantado no es tirar el dinero: la casera se ablanda, y con ella al día
     es cuando se puede hablar de comprarle el piso. */
  if(S.dinero<S.alquiler)return aviso('No te llega ni para adelantar un mes');
  S.dinero-=S.alquiler;S.ultCobro+=SEMANA;
  S.casera.paciencia=Math.min(5,S.casera.paciencia+1);
  sfx('dinero');aviso('Un mes por adelantado. −'+S.alquiler+' €');guardar();return;}
 if(S.dinero<t)return aviso('Son '+t+' € y no los tienes');
 S.dinero-=t;S.deuda=0;
 const volvia=S.casera.desahucio;
 S.casera.desahucio=false;S.casera.okupa=false;S.casera.avisada=0;
 sfx('dinero');
 aviso(volvia?'Llave nueva. −'+t+' €':'Alquiler al día. −'+t+' €',3);
 guardar();}

/* Dejar el piso: se acaba el recibo y se acaba la cama. Es la salida limpia para quien
   ya se ha comprado otra cosa. */
function dejarPiso(){
 if(S.deuda>0)return aviso('Primero paga lo que debes');
 S.alquiler=0;S.casera.desahucio=true;S.casera.okupa=false;
 aviso('Le has dejado las llaves a Amaia',3);guardar();}

/* Forzar la puerta de tu antiguo piso. Es un delito y se oye. */
function ocupar(){
 ruido(player.x,player.y,8);
 S.casera.okupa=true;
 delito(1,true);
 aviso('Has forzado la puerta. Ahora eres el okupa',3);guardar();}

const pasoActual=()=>S.mision?S.mision.pasos[S.mision.paso]:null;
function avanzarPaso(){
 const m=S.mision;m.paso++;
 if(m.paso>=m.pasos.length){terminarMision(true);return;}
 const p=m.pasos[m.paso];m.limite=p.limite||0;m.t=0;
 if(p.t==='evento'){p.fn();avanzarPaso();return;}
 if(p.t==='matar')generarEnemigos(p);
 aviso(p.txt,2.4);}
function generarEnemigos(p){
 for(let i=0;i<p.n;i++){const q=puntoAcera(p.donde.x|0,p.donde.y|0,8);
  enemigos.push({x:q.x,y:q.y,hp:60,arq:p.arq||'maton',arma:p.arma||'punos',d8:0,pose:'quieto',
   anim:0,cad:0,mision:true,herido:0,alerta:0,sosp:0,oido:null});}
 if(p.estrellas)estrellas(p.estrellas);}
function terminarMision(ok){
 const m=S.mision;if(!m)return;
 /* El prólogo se apoya en el motor de misiones para tener flecha y cartel, pero no paga,
    no cuenta para el contador de misiones y no deja enemigos que recoger. */
 if(m.def.prologo){S.mision=null;if(ok)finPrologo();return;}
 if(ok){S.dinero+=m.def.pago;S.rep.calle+=2;S.misionIdx++;darXp(Math.round(m.def.pago*1.4));
  grande('MISIÓN CUMPLIDA',2.6);sfx('dinero');
  hablar(m.def.giver,m.def.fin.concat(['+'+m.def.pago+' €']));}
 else grande('MISIÓN FALLIDA',2.4);
 for(let i=enemigos.length-1;i>=0;i--)if(enemigos[i].mision)enemigos.splice(i,1);
 S.mision=null;guardar();}

/*═══════════════ EL PRÓLOGO ═══════════════*/
/* La partida no empieza con el piso puesto: empieza bajando del autobús del aeropuerto en
   Moyúa con una bolsa. Reaprovecha el motor de misiones —pasos, flecha y cartel— con la
   marca `prologo`, que es lo que le quita el pago y el contador. Los dos pasos enseñan de
   paso las dos cosas que hacen falta para moverse: el metro y entrar en un sitio. */
const PRIMO={x:8.5,y:5.6,n:'Yeray',arq:'yeray',tipo:'primo'};
const PROLOGO={n:'Recién llegado',prologo:true,giver:'Yeray',pago:0,
 pasos:()=>[
  {t:'ir',p:poi('mtsantutxu').p,txt:'SUBE A SANTUTXU · METRO EN MOYÚA'},
  {t:'entrar',poi:'piso',p:poi('piso').p,txt:'ENTRA EN EL PISO DE YERAY'}]};
function retomarPrologo(){
 /* Hasta que no duermes ahí, el piso es el del primo: el rótulo del plano lo dice. */
 poi('piso').n='Piso de Yeray';
 empezarMision(PROLOGO);}
function empezarPrologo(){
 S.prologo=1;S.min=19*60+20;
 player.x=poi('moyua').p.x;player.y=poi('moyua').p.y+1.2;
 retomarPrologo();
 hablar('Yeray · al teléfono',[
  '¿Ya has aterrizado? Aupa, primo.',
  'Aquí llueve. Te aviso para que no te lleves la sorpresa tú solo.',
  'Yo salgo de currar a las diez, pero la llave te la dejo yo en mano.',
  'Estás en Moyúa. Ahí mismo tienes el metro: bájate en Santutxu.',
  'Portal viejo, tercero. Y no llames al segundo, que es la casera.'],
  [{txt:'Voy para allá',fn:()=>{}}]);}
function finPrologo(){
 S.prologo=0;poi('piso').n='Tu piso';
 grande('BILBAO',2.6);
 hablar('Yeray',[
  'Ya era hora. ¿Ese es todo el equipaje?',
  'Esa habitación es la tuya. La cama la bajó un vecino de una lonja, así que no preguntes.',
  'El piso es de Amaia, la del segundo. '+S.alquiler+' € al mes, y no le gusta esperar.',
  'Yo pongo lo mío. Lo tuyo lo pones tú, que para eso has cruzado medio Atlántico.',
  'El coche de abajo es mío. Cógelo si te hace falta, pero me lo traes con las cuatro ruedas.',
  'Y si quieres cobrar rápido, en el Bar Zurito hay un tal Txema que siempre anda pidiendo favores.'],
  [{txt:'¿Y de cenar?',fn:()=>hablar('Yeray',['Huevos y poco más.','Mañana bajas tú a la Ribera.'])},
   {txt:'Me pongo a ello',fn:()=>aviso('VIVE DONDE PUEDAS. COBRA DONDE TOQUE',3.4)}]);
 guardar();}

/*═══════════════ ACCIONES ═══════════════*/
function tileInt(x,y){const m=S.interior.mapa,fy=Math.floor(y),fx=Math.floor(x);
 if(fy<0||fy>=m.length||fx<0||fx>=m[fy].length)return '#';return m[fy][fx];}
/* El nombre viene de fuera a propósito: dos tascas iguales por dentro se llaman
   distinto en la puerta, que es lo que pasa en cualquier barrio. */
function entrar(id,desde,nombre,poiId){fundir(()=>{
 S.interior={...INT[id],id,poi:poiId||null};if(nombre)S.interior.n=nombre;
 /* El piso de Santutxu es compartido y el primo está dentro. Se le añade aquí y no en la
    plantilla porque el mismo plano lo usan los pisos que se compran, y allí no vive
    nadie. La copia es a propósito: empujarlo en INT.piso lo dejaría también en esos. */
 if(poiId==='piso'&&!S.casera.desahucio)S.interior.npcs=INT[id].npcs.concat([PRIMO]);
 const m=S.interior.mapa;let px=2,py=2;
 /* El portón de un taller mide más que una puerta de casa, así que se entra por el centro
    del hueco y no por su última casilla. */
 const ds=[];
 for(let y=0;y<m.length;y++)for(let x=0;x<m[y].length;x++)if(m[y][x]==='D')ds.push([x,y]);
 if(ds.length){px=ds.reduce((a,d)=>a+d[0],0)/ds.length+.5;py=ds[0][1]-.7;}
 S.escena='interior';player.enCoche=null;player.x=px;player.y=py;player.d8=4;S.volver=desde;
 /* Un paso de entrar no lo puede ver comprobarObjetivos: dentro de un interior el bucle
    se va por actInterior y nunca llega a mirarlo. */
 const p=pasoActual();if(p&&p.t==='entrar'&&p.poi===poiId)avanzarPaso();});}
function salir(){fundir(()=>{S.escena='ciudad';player.x=S.volver.x;player.y=S.volver.y+1.2;S.interior=null;});}
function poiCerca(){let m=null,md=1.8;for(const p of POI){const d=dist(p.p,player);if(d<md){md=d;m=p;}}return m;}
function cocheCerca(){let m=null,md=1.7;
 for(const c of coches){if(!c.vivo)continue;const d=dist(c,player);if(d<md){md=d;m=c;}}return m;}
function npcCerca(){if(!S.interior)return null;let m=null,md=1.7;
 for(const n of S.interior.npcs){const d=dist(n,player);if(d<md){md=d;m=n;}}return m;}
function accion(){
 if(dlg)return;
 if(S.escena==='interior'){
  const n=npcCerca();if(n)return hablarCon(n);
  if(tileInt(player.x,player.y-.9)==='C')return dormir();
  if(tileInt(player.x,player.y-.9)==='L')return curar();
  if(tileInt(player.x,player.y+.7)==='D'||tileInt(player.x,player.y)==='D')return salir();
  return aviso('Aquí no hay nada');}
 if(player.enCoche){const c=player.enCoche;
  player.x=c.x+Math.cos(c.ang+Math.PI/2)*1.3;player.y=c.y+Math.sin(c.ang+Math.PI/2)*1.3;
  player.enCoche=null;motorAudio(null,1);return;}
 const p=poiCerca();
 if(p){if(p.red)return estacion(p);
  /* Tu piso, cuando ya no es tuyo. */
  if(p.id==='piso'&&S.casera.desahucio&&!esMio('pisosantutxu')){
   if(S.casera.okupa)return entrar('piso',{x:p.p.x,y:p.p.y},'Tu piso · de okupa',p.id);
   return hablar('Cerradura nueva',['La llave no entra. Amaia la ha cambiado.'],
    [{txt:'Forzar la puerta',fn:()=>{ocupar();entrar('piso',{x:p.p.x,y:p.p.y},'Tu piso · de okupa',p.id);}},
     {txt:'Dejarlo estar',fn:()=>{}}]);}
  /* En la puerta de una casa en venta: o la compras o te quedas mirando el cartel. */
  if(p.vende&&!esMio(p.vende)){
   const q=propDe(p.vende),pega=pegaPara(q);
   return hablar('SE VENDE',[q.dd,pega||('Piden '+q.precio+' €.')],
    pega?null:[{txt:'Comprarla',coste:q.precio+' €',fn:()=>comprarProp(q.id)},
               {txt:'Otro día',fn:()=>{}}]);}
  if(p.int)return entrar(p.int,{x:p.p.x,y:p.p.y},p.n,p.id);
  if(p.id==='poli')return aviso('Comisaría. Mejor no entres');
  if(p.mira)return aviso(p.n.toUpperCase());
  return aviso('Acepta un curro aquí desde el móvil');}
 const q=paradaCerca();
 if(q){if(S.estrellas>0)return aviso('Con la pasma detrás no subes a ningún sitio');
  return abrirRed('bus','Parada · '+q.n,q.p);}
 const c=cocheCerca();
 if(c){player.enCoche=c;
  if(!c.propio&&!c.marcado){
   /* Reventar una ventanilla se oye, aunque no haya nadie mirando. */
   ruido(c.x,c.y,7);
   if(delito(1))aviso('Coche robado');else aviso('Coche robado. Sin testigos');
  }else aviso('A rodar');return;}
 aviso('Aquí no hay nada que hacer');}
function curar(){
 if(S.hp>=100)return aviso('Estás entero');
 const c=Math.round((100-S.hp)*1.2);
 if(S.dinero<c)return aviso('Te cobran '+c+' € y no los tienes');
 S.dinero-=c;S.hp=100;sfx('dinero');aviso('Curado. −'+c+' €');}
function dormir(){
 const okupa=S.casera.okupa&&S.interior&&S.interior.id==='piso'&&!esMio('pisosantutxu');
 S.dia++;S.min=8*60;S.energia=1;S.hp=Math.min(100,S.hp+45);S.estrellas=0;policia.length=0;
 const renta=cobrarRentas();
 correrAlquiler();
 if(okupa)dormirOkupa();
 else if(!renta&&!S.deuda)aviso('Has dormido. Día '+S.dia);
 if(S.deuda>=S.alquiler*2&&S.alquiler>0){S.energia=Math.min(S.energia,.55);
  aviso('Debes '+S.deuda+' €. Duermes fatal',3);}
 guardar();}

/* Hasta aquí, el Arriaga y el Ayuntamiento eran una chincheta sobre una manzana igual que
   las demás: el juego te decía dónde estaban pero desde arriba no se veía nada. Estos se
   dibujan enteros, encima del tejado genérico y a su tamaño de verdad: la estación de
   Abando ocupa treinta y dos casillas de largo porque la nave mide ciento ochenta metros
   y la casilla son 5,16 m. No caben en pantalla de una vez, y así debe ser — se recorren
   andando, como el resto de la ciudad.

   No son fachadas fotografiadas ni plantas copiadas: son la silueta que tiene cada uno
   visto desde arriba —el cuenco de un campo de fútbol, la cruz de una catedral, la nave
   de una estación— dibujada con la paleta del juego. Eso es un hecho de la ciudad, como
   las calles; el dibujo es nuestro. */
const SINGULARES={};
/* Se dibuja en casillas, no en píxeles. La primera versión iba en píxeles absolutos y
   valía mientras un singular medía ocho casillas; a treinta y dos, un remate de tres
   píxeles sobre un lienzo de mil se pierde. Así el mismo dibujo sirve a cualquier tamaño,
   que hace falta: abajo se encogen hasta que caben. */
function singular(id,w,h,fn){
 const c=lienzo(w*TS,h*TS),g=c.getContext('2d');
 const T=(x,y,an,al,col)=>P(g,Math.round(x*TS),Math.round(y*TS),
  Math.max(1,Math.round(an*TS)),Math.max(1,Math.round(al*TS)),col);
 const aro=(cx,cy,r,gr,col)=>{const n=Math.max(32,Math.round(r*TS/1.5));
  for(let i=0;i<n;i++){const a=i/n*6.283;T(cx+Math.cos(a)*r-gr/2,cy+Math.sin(a)*r-gr/2,gr,gr,col);}};
 fn(T,w,h,aro,g);
 SINGULARES[id]={w,h,c:cuantizar(c)};}

/* Cada uno con su medida real en metros pasada a casillas, y su dibujo. */
const PLANO_SINGULAR={
 /* 227×203 m: el estadio, y lo que más se reconoce de Bilbao desde el aire después de la
    ría. No hay otro rectángulo verde en toda la ciudad. */
 sanmames:[44,39,(T,W,H,aro)=>{
  T(0,0,W,H,C.hormigonO);
  T(1,1,W-2,H-2,C.grisL);                            /* el anillo de fuera */
  T(2.6,2.6,W-5.2,H-5.2,C.gris);                     /* la grada */
  T(4.4,3.8,W-8.8,H-7.6,C.carbon);                   /* la boca, en sombra */
  const px=6,py=5,pw=W-12,ph=H-10;
  T(px,py,pw,ph,C.cespedO);
  for(let i=0;i<pw;i+=2)T(px+i,py,1,ph,C.cesped);    /* las franjas de siega */
  const l=.22;
  T(px,py,pw,l,C.hueso);T(px,py+ph-l,pw,l,C.hueso);
  T(px,py,l,ph,C.hueso);T(px+pw-l,py,l,ph,C.hueso);
  T(px+pw/2-l/2,py,l,ph,C.hueso);                    /* el medio campo */
  aro(px+pw/2,py+ph/2,ph/5.5,l,C.hueso);
  for(const s of[0,1]){                              /* las dos áreas */
   const bx=s?px+pw-pw/6:px+pw/6;
   T(s?bx:px,py+ph/2-ph/3,pw/6,l,C.hueso);
   T(s?bx:px,py+ph/2+ph/3,pw/6,l,C.hueso);
   T(bx,py+ph/2-ph/3,l,ph*2/3,C.hueso);}
  for(const[fx,fy]of[[1.4,1.4],[W-3.4,1.4],[1.4,H-3.4],[W-3.4,H-3.4]]){
   T(fx,fy,2,2,C.acero);T(fx+.45,fy+.45,1.1,1.1,C.hueso);}}],
 /* 150×110 m. Chapa de titanio: bandas alabeadas unas sobre otras, cada una con su
    brillo arriba. Desde el aire el museo es eso y poco más. */
 guggen:[29,21,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  /* Placas de titanio: velas que se solapan, cada una con su brillo por el canto de
     arriba y su sombra por el de la derecha. Ninguna alineada con la de al lado — eso es
     lo único que separa al museo de un tejado de chapa cualquiera, y la primera versión,
     con las bandas a paso regular, salió persiana. */
  const velas=[[.7,1,W-8.5,3.4],[3.6,3.4,W-5.8,3],[1,5.9,W-9.5,4],[5.2,9.3,W-7.2,3.2],
               [.7,12,W-10.5,3.6],[4.4,14.9,W-6.6,3.4],[1.8,17.6,W-8.5,2.4]];
  velas.forEach(([x,y,an,al],i)=>{
   T(x,y,an,al,i%2?C.acero:C.aceroO);
   T(x,y,an,.45,C.hueso);
   T(x+an-.45,y,.45,al,C.grisO);});
  T(W-3.4,.7,2.7,H-2.2,C.grisL);T(W-3.4,.7,2.7,.4,C.hueso);
  T(.6,H-1.1,W-1.2,.8,C.hormigon);}],                /* la lámina de agua del muelle */
 /* 42×42 m. Desde arriba una torre es un cuadrado; lo que la delata es el cristal. */
 iberdrola:[8,8,(T,W,H)=>{
  T(0,0,W,H,C.grisO);
  T(.5,.5,W-1,H-1,C.aceroO);
  T(1,1,W-2,H-2,C.acero);
  for(let i=1.5;i<W-1.5;i+=.9)T(i,1,.3,H-2,C.hueso);
  T(1,1,W-2,.4,C.hueso);
  T(W/2-1,H/2-1,2,2,C.aceroO);}],                    /* el casquete de arriba */
 /* 130×85 m. Casco de barco en acero oxidado, en el sitio del astillero: las cuadernas
    se ven desde arriba como costillas. */
 euskalduna:[25,16,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  T(1,1.6,W-2,H-4,C.tejaO);
  T(1,1.6,W-2,.45,C.maderaL);
  for(let x=2;x<W-2;x+=1.6)T(x,2.2,.5,H-5.4,C.maderaO);
  T(W-4.6,1,3.6,H-2,C.gris);                         /* la caja de escena */
  T(2.6,H-2.6,W-5.2,1.8,C.grisL);                    /* la plaza de delante */
  T(2.6,H-2.6,W-5.2,.35,C.hueso);}],
 /* 180×80 m. La nave de la estación, con los andenes y las vías debajo. */
 abando:[35,16,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  T(.6,.6,W-1.2,H-1.2,C.aceroO);
  for(let y=1.3;y<H-2.2;y+=2.6){
   T(1.2,y,W-2.4,1.9,C.acero);                       /* la bóveda */
   T(1.2,y,W-2.4,.3,C.hueso);
   T(1.2,y+1.9,W-2.4,.5,C.asfaltoO);                 /* la vía por debajo */
   T(1.2,y+2.05,W-2.4,.15,C.grisL);}
  T(.6,.6,W-1.2,.4,C.hueso);
  T(W/2-3,H-1.5,6,1,C.mostazaO);}],                  /* el vestíbulo, a la calle */
 /* 60×45 m. Mansarda de pizarra, frontón al medio y marquesina a la calle. */
 arriaga:[12,9,(T,W,H)=>{
  T(0,0,W,H,C.grisL);
  T(.45,.45,W-.9,H-.9,C.gris);
  for(let x=1;x<W-1;x+=1.4)T(x,1,.45,H-3,C.grisO);   /* las limatesas */
  T(W/2-2.6,.2,5.2,2.4,C.mostazaO);                  /* el frontón */
  T(W/2-2.2,.6,4.4,1.6,C.mostaza);
  T(.6,H-2.2,W-1.2,1.4,C.maderaO);                   /* la marquesina */
  T(.6,H-2.2,W-1.2,.4,C.mostazaO);
  T(1.6,H-1,W-3.2,.7,C.carbon);}],
 /* 78×45 m. Planta simétrica y la torre del reloj en el eje. */
 ayto:[15,9,(T,W,H)=>{
  T(0,0,W,H,C.hormigon);
  T(.5,.5,W-1,H-1,C.hormigonL);
  T(1.2,1.6,W-2.4,H-3.2,C.grisL);                    /* el cuerpo y sus dos alas */
  for(let x=2;x<W-2;x+=1.7)T(x,2,.6,H-4,C.gris);
  T(W/2-2.2,.2,4.4,4.6,C.hormigonL);                 /* la torre del reloj */
  T(W/2-1.8,.6,3.6,3.8,C.hormigon);
  /* El reloj. Con dos agujas y nada más se leía como una ele mayúscula: hacen falta las
     marcas del cuadrante y el eje para que la cabeza lo vea como una esfera. */
  const rx=W/2,ry=2.4,rr=1.1;
  T(rx-rr,ry-rr,rr*2,rr*2,C.crema);
  for(const[dx,dy]of[[0,-1],[1,0],[0,1],[-1,0]])
   T(rx+dx*(rr-.3)-.09,ry+dy*(rr-.3)-.09,.18,.18,C.carbon);
  T(rx-.09,ry-.72,.18,.75,C.carbon);                 /* la aguja larga, a las doce */
  T(rx,ry-.09,.58,.18,C.carbon);                     /* la corta, a las tres */
  T(rx-.15,ry-.15,.3,.3,C.carbon);                   /* el eje */
  T(.8,H-1.4,W-1.6,.9,C.hormigonO);}],               /* la escalinata */
 /* 62×32 m. Cruz latina: la nave a lo largo, el crucero cruzándola y la aguja al medio. */
 catedral:[13,8,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  /* Cruz latina: la nave a lo largo, el crucero cruzándola cerca de la cabecera y el
     cimborrio en el cruce. A doce por seis el crucero no llegaba a leerse como brazo y
     la catedral salía siendo una nave más. */
  const nv=2.9,cx=W*.62;
  T(.6,H/2-nv/2,W-1.2,nv,C.gris);
  T(cx-1.7,.7,3.4,H-1.4,C.gris);
  T(.6,H/2-nv/2,W-1.2,.4,C.grisL);
  T(cx-1.7,.7,3.4,.4,C.grisL);
  for(let x=1;x<W-1.4;x+=1.2)T(x,H/2-nv/2,.26,nv,C.grisO);
  for(let y=1.3;y<H-1.2;y+=1.2)T(cx-1.7,y,3.4,.26,C.grisO);
  T(cx-1.05,H/2-1.45,2.1,2.9,C.hormigonL);           /* el cimborrio */
  T(cx-.5,H/2-.95,1,1.9,C.mostazaO);                 /* la aguja */
  T(W-2,H/2-1.9,1.4,3.8,C.hormigon);}],              /* el ábside */
 /* 60×28 m. Nave larga y su torre, que se ve desde media villa. */
 begonia:[12,5,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  T(1,.8,W-2,H-1.6,C.teja);
  T(1,.8,W-2,.35,C.tejaO);
  for(let y=1.4;y<H-1;y+=.7)T(1,y,W-2,.18,C.maderaO);
  T(.4,.4,2.8,H-.8,C.hormigonL);                     /* la torre */
  T(.7,.7,2.2,H-1.4,C.hormigon);
  T(1.2,1.4,1.2,1.6,C.crema);
  T(1.5,.05,.5,.8,C.mostazaO);}],
 /* 130×40 m. Nave junto al agua, con sus lucernarios en diente de sierra. */
 merca:[25,8,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  T(.6,.6,W-1.2,H-1.2,C.grisL);
  for(let x=1.6;x<W-2;x+=2.3){
   T(x,1.2,1.6,H-2.4,C.gris);
   T(x+.3,1.5,1,H-3,C.acero);
   T(x+.3,1.5,1,.3,C.hueso);}
  T(.6,.6,W-1.2,.4,C.hueso);}],
 /* 76×76 m. El almacén de vinos: ladrillo, y los tres patios que le abrieron dentro. */
 alhondiga:[15,15,(T,W,H)=>{
  T(0,0,W,H,C.maderaL);
  T(.45,.45,W-.9,H-.9,C.teja);
  for(let y=1.2;y<H-1;y+=.9)T(.9,y,W-1.8,.2,C.tejaO);
  const an=(W-3.2)/3;
  for(let i=0;i<3;i++){
   T(1.6+i*an,H/2-2.4,an-1.1,4.8,C.aceroO);
   T(1.9+i*an,H/2-2.1,an-1.7,4.2,C.acero);}
  T(.45,.45,W-.9,.4,C.maderaL);}],
 /* 100×62 m. Los almacenes de la Gran Vía: un bloque macizo con la cubierta llena de
    máquinas y el rótulo corrido por el canto de la calle. Nombre inventado, sitio real —
    aquí no entra ninguna marca de nadie. */
 almacenes:[19,12,(T,W,H)=>{
  T(0,0,W,H,C.hormigonO);
  T(.5,.5,W-1,H-1,C.hormigonL);
  T(1.2,1.2,W-2.4,H-3.4,C.hormigon);
  /* Los climatizadores de la azotea, en dos hileras. */
  for(let y=2.2;y<H-3.4;y+=2.4)for(let x=2.2;x<W-3;x+=2.6){
   T(x,y,1.8,1.4,C.aceroO);T(x+.25,y+.25,1.3,.9,C.acero);T(x+.25,y+.25,1.3,.25,C.hueso);}
  T(1.2,H-4.2,W-2.4,.35,C.grisO);                   /* la junta de la cubierta */
  T(.8,H-2.4,W-1.6,1.5,C.mostazaO);                 /* el rótulo, a la Gran Vía */
  T(1.2,H-2.1,W-2.4,.9,C.mostaza);
  for(let x=2;x<W-2;x+=1.5)T(x,H-1.85,.55,.4,C.carbon);
  T(.8,H-.9,W-1.6,.5,C.carbon);}],                  /* la marquesina */
 /* 105×90 m. Cuenco pequeño y tejado de madera. */
 arena:[20,17,(T,W,H,aro)=>{
  T(0,0,W,H,C.hormigonO);
  T(1,1,W-2,H-2,C.maderaO);
  for(let x=1.6;x<W-1.6;x+=1.2)T(x,1.4,.45,H-2.8,C.madera);
  T(1,1,W-2,.4,C.maderaL);
  aro(W/2,H/2,Math.min(W,H)/3.2,.5,C.grisL);
  T(W/2-3.2,H/2-2.6,6.4,5.2,C.gris);
  T(W/2-2.8,H/2-2.2,5.6,4.4,C.acero);}],
};

/* Dónde se planta cada uno, y de qué tamaño.

   El rótulo del plano marca el sitio con un error de unas cuantas casillas, y en dos
   casos el error es gordo: los de San Mamés y el Bilbao Arena caen en mitad de la ría.
   Plantarlos ahí sin mirar dejaba medio estadio flotando. Así que no se planta: se
   desliza la caja alrededor del rótulo y se elige donde más manzana pisa y menos agua
   toca; si a diez casillas no hay sitio seco, se busca a veinte; y si aun así no cabe,
   el edificio se encoge de diez en diez por ciento hasta que cabe. Lo que se pierde es
   escala; lo que se gana es que está donde el plano dice y pisando tierra.

   Veinte casillas es el tope a propósito: la batería exige que ningún sitio se aleje
   más de treinta del plano, y así la colocación no puede ser nunca la que rompa eso.

   Dos tablas de sumas acumuladas hacen que cada posición candidata se resuelva con
   cuatro restas, así que probar dos mil sitios por edificio no cuesta nada. */
const RADIOS_SINGULAR=[10,20],SECO_SINGULAR=.88;
function colocarSingulares(){
 const acumula=cond=>{
  const t=new Int32Array((MW+1)*(MH+1));
  for(let y=0;y<MH;y++){let f=0;
   for(let x=0;x<MW;x++){if(cond(map[y*MW+x]))f++;
    t[(y+1)*(MW+1)+x+1]=t[y*(MW+1)+x+1]+f;}}
  return t;};
 const caja=(t,x,y,w,h)=>t[(y+h)*(MW+1)+x+w]-t[y*(MW+1)+x+w]-t[(y+h)*(MW+1)+x]+t[y*(MW+1)+x];
 const manzana=acumula(t=>t===EDIF||t===PATIO),
       prohibido=acumula(t=>!pintable(t)),
       seco=acumula(pintable);
 const busca=(cx,cy,w,h,R)=>{
  let mx=clamp(cx-(w>>1),1,MW-w-1),my=clamp(cy-(h>>1),1,MH-h-1),mej=-1e9;
  for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){
   const x=clamp(cx-(w>>1)+dx,1,MW-w-1),y=clamp(cy-(h>>1)+dy,1,MH-h-1);
   /* Manda la manzana, pero un paso de más desde el rótulo se paga: entre dos sitios
      parecidos gana el que está donde lo pone el plano. */
   const v=caja(seco,x,y,w,h)+caja(manzana,x,y,w,h)-6*caja(prohibido,x,y,w,h)-Math.hypot(dx,dy)*1.2;
   if(v>mej){mej=v;mx=x;my=y;}}
  return{x:mx,y:my,seco:caja(seco,mx,my,w,h)/(w*h)};};
 for(const p of POI){
  const d=PLANO_SINGULAR[p.id];if(!d)continue;
  const[W0,H0,dib]=d;
  let el=null;
  buscando:
  for(const R of RADIOS_SINGULAR)for(let k=10;k>=5;k--){
   const w=Math.max(4,Math.round(W0*k/10)),h=Math.max(4,Math.round(H0*k/10));
   const r=busca(p.cerca[0],p.cerca[1],w,h,R);
   if(!el||r.seco>el.seco+.001)el={...r,w,h};
   if(r.seco>=SECO_SINGULAR){el={...r,w,h};break buscando;}}
  singular(p.id,el.w,el.h,dib);
  SINGULARES[p.id].x=el.x;SINGULARES[p.id].y=el.y;}}

/* Lo que levanta cada uno, en metros. Un singular no es una manzana más: la torre
   Iberdrola son 165 m y a media tarde su sombra cruza Abandoibarra entera, y eso es
   justo lo que se ve de ella desde arriba. Con la altura del barrio —trece metros— la
   torre proyectaba lo mismo que el portal de al lado. */
const ALTO_SINGULAR={sanmames:40,guggen:50,iberdrola:165,euskalduna:40,abando:25,
 arriaga:30,ayto:30,catedral:45,begonia:35,merca:20,alhondiga:25,almacenes:30,arena:30};
/* La sombra de un singular es su planta barrida hasta donde llega: la caja, su copia
   corrida y las cuatro bandas que las unen, todo en un trazo y un solo relleno — con dos
   rellenos superpuestos la parte común saldría al doble de oscuro. */
function sombraSingulares(x0,y0,x1,y1){
 if(!SOL.elev)return;
 ctx.fillStyle='rgba(7,9,12,.30)';
 for(const id in SINGULARES){
  const s=SINGULARES[id];if(s.x===undefined)continue;
  const L=Math.min(20,(ALTO_SINGULAR[id]||25)/Math.tan(SOL.elev)/5.16);
  const dx=SOL.ux*L,dy=SOL.uy*L;
  if(Math.min(s.x,s.x+dx)>x1+2||Math.max(s.x+s.w,s.x+s.w+dx)<x0-2)continue;
  if(Math.min(s.y,s.y+dy)>y1+2||Math.max(s.y+s.h,s.y+s.h+dy)<y0-2)continue;
  const ax=s.x*TS,ay=s.y*TS,bx=(s.x+s.w)*TS,by=(s.y+s.h)*TS,px=dx*TS,py=dy*TS;
  const V=[[ax,ay],[bx,ay],[bx,by],[ax,by]];
  ctx.beginPath();
  ctx.moveTo(ax,ay);ctx.lineTo(bx,ay);ctx.lineTo(bx,by);ctx.lineTo(ax,by);ctx.closePath();
  ctx.moveTo(ax+px,ay+py);ctx.lineTo(bx+px,ay+py);ctx.lineTo(bx+px,by+py);
  ctx.lineTo(ax+px,by+py);ctx.closePath();
  for(let i=0;i<4;i++){const a=V[i],b=V[(i+1)%4];
   ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
   ctx.lineTo(b[0]+px,b[1]+py);ctx.lineTo(a[0]+px,a[1]+py);ctx.closePath();}
  ctx.fill();}}

/* Dónde puede pisar un singular. La calle, la acera de enfrente, la ría y el monte no:
   por ahí se anda o se navega, y un edificio encima los borraría. */
const pintable=t=>t!==AGUA&&t!==MUELLE&&t!==PUENTE&&t!==ROAD&&t!==MONTE;
/* Se dibujan con la ciudad, antes que la gente: son suelo, no bicho. Y casilla a casilla,
   no de un trazo, porque la caja de un edificio de treinta metros de largo siempre pilla
   un trozo de calle por medio y esa calle tiene que seguir estando. */
function dibSingulares(x0,y0,x1,y1){
 for(const id in SINGULARES){
  const s=SINGULARES[id];if(s.x===undefined)continue;
  const ax=Math.max(x0,s.x),ay=Math.max(y0,s.y),
        bx=Math.min(x1,s.x+s.w-1),by=Math.min(y1,s.y+s.h-1);
  for(let y=ay;y<=by;y++)for(let x=ax;x<=bx;x++){
   if(!pintable(map[y*MW+x]))continue;
   ctx.drawImage(s.c,(x-s.x)*TS,(y-s.y)*TS,TS,TS,x*TS,y*TS,TS,TS);}}}

/*═══════════════ EL CALLEJERO ═══════════════*/
/* Andabas por «Abando» y ya está. Ahora el HUD dice también por qué calle vas, y son las
   calles de Bilbao: la Gran Vía, Urquijo, Autonomía, Zabalbide, Lehendakari Agirre.

   De dónde salen, y qué NO son. El plano municipal trae su callejero rotulado, pero el
   PDF no entra en el repositorio —esa es una norma nuestra— y el extractor solo se queda
   con la geometría. Así que estas calles no están leídas de un rótulo: están puestas por
   su trazado, que es el hecho geográfico que sí se puede afirmar. La Gran Vía va de Moyúa
   a la Circular; Urquijo, de la Circular a San Mamés; Zabalbide, del Casco a Santutxu.

   calle sigue cayendo en la calzada que va de un sitio al otro — que es exactamente lo
   que identifica a una calle. Lo que no se puede afirmar no se nombra: las Siete Calles
   miden dos casillas de ancho cada una y a 5,16 m por casilla no caben, así que del Casco

/* El nombre para el HUD. En la tabla van los nombres completos del callejero —'Gran Vía
   López de Haro D. Diego', 'Arenal Celestino Ma del'— porque es lo que dice el plano, pero
   en pantalla eso son cuarenta caracteres y se come media franja. Se abrevia como se
   abrevia en un callejero de papel, y si aun así no cabe se corta. */
const ABREV_CALLE=[[/\bAvenida\b/g,'Av.'],[/\bAlameda\b/g,'Al.'],[/\bPlaza\b/g,'Pl.'],
 [/\bPaseo\b/g,'Ps.'],[/\bCarretera\b/g,'Ctra.'],[/\bCamino\b/g,'Cm.'],
 [/\bJardines\b/g,'Jdns.'],[/\bJardín\b/g,'Jdín.'],[/\bEscalinata\b/g,'Esc.'],
 [/\bGrupo\b/g,'Gp.'],[/\bMuelle\b/g,'Mu.'],[/\bPuente\b/g,'Pte.'],[/\bCaserío\b/g,'Cs.'],
 [/\bTravesía\b/g,'Trv.'],[/\bPasaje\b/g,'Psj.'],[/\bRonda\b/g,'Rda.'],
 [/\bCallejón\b/g,'Cjón.'],[/\bDoctora\b/g,'Dra.'],[/\bDoctor\b/g,'Dr.'],
 [/\bGeneral\b/g,'Gral.'],[/\bSanta\b/g,'Sta.'],[/\bSanto\b/g,'Sto.'],
 [/\bUniversidad\b/g,'Univ.'],[/\bReverendo\b/g,'Rvdo.'],[/\bMonseñor\b/g,'Mons.'],
 [/\bProfesor\b/g,'Prof.'],[/\bIngeniero\b/g,'Ing.'],[/\bArquitecto\b/g,'Arqto.'],
 [/\bPintor(es)?\b/g,'Ptor.'],[/\bViaducto\b/g,'Vdto.'],[/\bBarrio\b/g,'Bo.']];
const TOPE_CALLE=26;
const nombreCorto=n=>{
 for(const[re,a]of ABREV_CALLE)n=n.replace(re,a);
 n=n.replace(/\s+/g,' ').trim();
 return n.length>TOPE_CALLE?n.slice(0,TOPE_CALLE-1).trimEnd()+'.':n;};
/* Qué calle es cada casilla: 0 es «ninguna», y si no, el índice en CALLES más uno. */
const calleDe=new Int16Array(MW*MH);
const calleEn=(x,y)=>{
 if(x<0||y<0||x>=MW||y>=MH)return null;
 const i=calleDe[y*MW+x];return i?nombreCorto(CALLES[i-1].n):null;};
/* Cuántas casillas le han salido a cada calle. Lo mira la batería: una calle que se
   queda en cuatro casillas es una calle que no se ha encontrado, aunque no dé error. */
const LARGO_CALLE=[];
/* Qué casillas son «calle». No solo la calzada: la acera es calle, y en el Casco Viejo la
   calle ES la acera —las Siete Calles y media Bilbao la Vieja son peatonales y el plano no
   les pinta trazo de rodadura, así que buscando solo asfalto el Casco entero se quedaba
   sin nombrar—. Y andando, que es como se va la mitad del rato, se va por la acera: con
   la calzada sola el rótulo solo salía conduciendo. */
const esCalle=(x,y)=>{const t=Tc(x,y);
 /* El puente no cuenta como calle a efectos de nombrar. Un puente sí es calle para andar,
    pero deja que el trazado salte de una orilla a la otra: 'Correo', que es del Casco
    Viejo, salía cruzando a San Francisco porque sus dos rótulos se unían por el Arenal.
    Ninguna calle de Bilbao está en las dos orillas. */
 return t===ROAD||t===ACERA||t===PLAZA||t===MUELLE;};
/* El camino de calle entre dos puntos, encerrado en la caja de los dos extremos con
   holgura: sin la caja, un tramo que no se puede unir se pone a recorrer los siete
   kilómetros de ciudad antes de rendirse.

   No es una anchura a secas sino un Dijkstra con dos precios —la calzada vale 1 y la
   acera 4— porque si los dos cuestan igual el camino se va por la acera en cuanto ahorra
   una casilla, y entonces la Gran Vía sale nombrada por el portal en vez de por la
   avenida. Con dos precios y tan pocos valores no hace falta un montículo: valen unos
   cubos por distancia, que se recorren en orden. */
const HOLGURA_CALLE=60, PRECIO_ACERA=4;
function caminoCalle(ax,ay,bx,by){
 /* La holgura, a la medida del tramo. Con sesenta fijas, dos rótulos de la misma calle a
    quince casillas montaban una caja de 135×135 para un camino de quince: con las mil y
    pico calles que saca el extractor del plano, eso es la carga entera. */
 const hol=clamp(Math.max(Math.abs(bx-ax),Math.abs(by-ay)),24,HOLGURA_CALLE);
 const x0=Math.max(1,Math.min(ax,bx)-hol),x1=Math.min(MW-2,Math.max(ax,bx)+hol),
       y0=Math.max(1,Math.min(ay,by)-hol),y1=Math.min(MH-2,Math.max(ay,by)+hol);
 const an=x1-x0+1,al=y1-y0+1,N=an*al;
 const k=(x,y)=>(y-y0)*an+(x-x0);
 const dist=new Int32Array(N).fill(0x7fffffff),de=new Int32Array(N).fill(-1);
 const tope=(an+al)*PRECIO_ACERA+8,cubos=new Array(tope);
 const mete=(i,d)=>{const c=d%tope;(cubos[c]||(cubos[c]=[])).push(i);};
 dist[k(ax,ay)]=0;mete(k(ax,ay),0);
 const fin=k(bx,by);
 for(let d=0;d<(an*al)*PRECIO_ACERA;d++){
  const lote=cubos[d%tope];if(!lote||!lote.length)continue;
  cubos[d%tope]=[];
  for(const i of lote){
   if(dist[i]!==d)continue;                       /* entrada vieja, ya mejorada */
   if(i===fin){
    const cam=[];let j=i;
    while(j>=0){cam.push([x0+(j%an),y0+((j/an)|0)]);j=de[j];}
    return cam;}
   const x=x0+(i%an),y=y0+((i/an)|0);
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx<x0||ny<y0||nx>x1||ny>y1||!esCalle(nx,ny))continue;
    const nd=d+(rodable(nx,ny)?1:PRECIO_ACERA),j=k(nx,ny);
    if(nd<dist[j]){dist[j]=nd;de[j]=i;mete(j,nd);}}}}
 return null;}
/* El apaño de cuando no hay camino: la recta entre los dos extremos, casilla a casilla. */
function rectaCalle(ax,ay,bx,by){
 const n=Math.max(Math.abs(bx-ax),Math.abs(by-ay)),cam=[];
 for(let i=0;i<=n;i++){
  const x=Math.round(ax+(bx-ax)*i/n),y=Math.round(ay+(by-ay)*i/n);
  if(esCalle(x,y))cam.push([x,y]);}
 return cam.length?cam:null;}
/* La casilla de calle más cercana a un punto de paso. */
const calleCerca=(cx,cy,r)=>{const q=cercaDe(esCalle,cx,cy,r||24);
 return esCalle(q.x|0,q.y|0)?[q.x|0,q.y|0]:null;};
function nombrarCalles(){
 calleDe.fill(0);
 /* Primero todos los trazados, y después las faldas. En una sola pasada la falda de una
    calle se comía el trazado de su vecina: en el Ensanche, Colón de Larreátegui va a una
    manzana de la Gran Vía y se quedaba en veinte casillas, porque la Gran Vía iba antes
    en la tabla y le pintaba encima. El trazado de cualquiera pesa más que la falda de
    cualquiera; entre dos trazados que se cruzan, manda el orden de la tabla. */
 const caminos=[];
 for(let c=0;c<CALLES.length;c++){
  const via=CALLES[c];caminos[c]=[];
  for(let t=0;t+1<via.v.length;t++){
   const a=calleCerca(via.v[t][0],via.v[t][1]),b=calleCerca(via.v[t+1][0],via.v[t+1][1]);
   if(!a||!b)continue;
   /* Si no hay camino, se nombra a lo largo de la recta. Pasa donde el plano deja la
      calle partida —la acera sale de erosionar la calzada y en una diagonal estrecha el
      interior se queda en una hilera que solo se toca por la esquina— y también donde el
      tramo cruza un puente que el extractor no cosió. Es menos exacto que seguir la
      calle, pero el trazado que se afirma es el mismo y así ninguna calle de la tabla se
      queda sin una sola casilla. */
   const cam=caminoCalle(a[0],a[1],b[0],b[1])||rectaCalle(a[0],a[1],b[0],b[1]);
   if(cam)for(const q of cam)caminos[c].push(q);}}
 const cuenta=new Int32Array(CALLES.length);
 /* Se nombra el trazado y la calle pegada a él: una avenida son tres o cuatro casillas de
    calzada más dos aceras, y el camino solo va por una, así que cruzándola por el otro
    carril el HUD se quedaba en blanco. */
 const pinta=(c,r)=>{
  for(const[x,y]of caminos[c])
   for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    const px=x+dx,py=y+dy;
    if(px<0||py<0||px>=MW||py>=MH)continue;
    const i=py*MW+px;
    if(calleDe[i]||!esCalle(px,py))continue;
    calleDe[i]=c+1;cuenta[c]++;}};
 for(let c=0;c<CALLES.length;c++)pinta(c,0);
 for(let c=0;c<CALLES.length;c++)pinta(c,2);
 /* Y si alguna se ha quedado a cero —el rótulo cayó en un trozo de calle que no conecta
    con nada, o se lo comió entero la vecina— se nombra al menos su propio sitio. Una
    calle que existe en el plano y no aparece nunca es peor que una nombrada de más. */
 for(let c=0;c<CALLES.length;c++){
  if(cuenta[c])continue;
  for(const[vx,vy]of CALLES[c].v){
   /* Aquí se busca más lejos que en el trazado: el rótulo de una calle de monte puede
      caer a cuarenta casillas de la calzada más próxima. */
   const q=calleCerca(vx,vy,80);if(!q)continue;
   caminos[c]=[q];pinta(c,2);if(cuenta[c])break;}
  if(cuenta[c])continue;
  /* Y si aun así sigue a cero es que su sitio se lo ha quedado entero la calle de al
     lado. Entonces se le quita una casilla: la de su propio rótulo. Que dos calles se
     disputen una esquina pasa en Bilbao también; que una desaparezca del juego, no. */
  for(const[vx,vy]of CALLES[c].v){
   const q=calleCerca(vx,vy,80);if(!q)continue;
   calleDe[q[1]*MW+q[0]]=c+1;cuenta[c]=1;break;}}
 for(let c=0;c<CALLES.length;c++)LARGO_CALLE[c]=cuenta[c];}

const enLoMio=()=>S.interior&&esMio(S.interior.poi);
function comer(coste,h,e,hp,txt){
 if(enLoMio())coste=0;
 if(S.dinero<coste)return aviso('No te llega');
 S.dinero-=coste;S.hambre=Math.min(1,S.hambre+h);
 S.energia=Math.min(1,S.energia+e);S.hp=Math.min(100,S.hp+hp);

/* El coche que se repara es el que has dejado en la puerta, no el que llevas: al entrar
   te bajas. Se busca alrededor del sitio por el que entraste. */
function repostar(){
 const donde=S.volver||player;
 let mej=null,md=9;
 for(const c of coches){if(!c.vivo)continue;const d=dist(c,donde);if(d<md){md=d;mej=c;}}
 if(!mej)return aviso('Acerca el coche a los surtidores');
 if(mej.dano<=.02)return aviso('El coche está entero');
 const cst=enLoMio()?0:Math.max(15,Math.round(mej.dano*260));
 if(S.dinero<cst)return aviso('Te piden '+cst+' € y no los tienes');
 S.dinero-=cst;mej.dano=0;sfx('dinero');
 aviso(cst?'Repostado y arreglado. −'+cst+' €':'Repostado y arreglado. Es tuya');}

/*═══════════════ TRANSPORTE PÚBLICO ═══════════════*/
/* Tres redes con la misma mecánica y tres coberturas distintas, que es lo que las
   diferencia: el bus para en los treinta y cuatro barrios pero tarda; el metro solo
   pasa por donde pasa, y vuela; el cercanías llega al fondo del valle —Zorrotza,
   Olabeaga— que es justo donde el metro no baja.

   Cuesta dinero y cuesta reloj. Y con la pasma detrás no te dejan subir: si no, el
   billete de dos euros sería la mejor huida del juego. */
const REDES={
 bus:  {n:'Bilbobus',  tarifa:2, vel: 48, espera: 7, ico:'bus'},
 metro:{n:'Metro',     tarifa:3, vel:115, espera: 4, ico:'metro'},
 tren: {n:'Cercanías', tarifa:3, vel:135, espera:10, ico:'tren'},
};
const PARADAS=[];
function colocarParadas(){
 /* La parada de bus de cada barrio va en la acera más cercana a su rótulo del plano. No
    hay que escribir ninguna coordenada: los barrios ya están donde el ayuntamiento los
    rotula, y así el bus llega a todos sin una lista que mantener. */
 PARADAS.length=0;
 for(const b of BARRIOS)PARADAS.push({n:b.n,p:cercaDe((x,y)=>{
  const t=Tc(x,y);return t===ACERA||t===PLAZA;},b.x,b.y,34)});}
const redesDe=p=>p.red?(p.red.match(/metro|tren|bus/g)||[]):[];
function nodos(red){
 if(red==='bus')return PARADAS;
 return POI.filter(p=>redesDe(p).includes(red)).map(p=>({n:p.n,p:p.p}));}
function minutosViaje(red,d){return Math.max(2,Math.round(REDES[red].espera+d/REDES[red].vel));}
function viajarA(red,destino){
 const min=minutosViaje(red,dist(destino.p,player));
 fundir(()=>{
  player.x=destino.p.x;player.y=destino.p.y;player.enCoche=null;
  S.min+=min;while(S.min>=1440){S.min-=1440;S.dia++;}
  S.energia=Math.max(0,S.energia-min*.004);
  grande(destino.n.toUpperCase(),2);});
 aviso(REDES[red].n+' · '+min+' min');guardar();}
function lineaDe(red,aqui){
 return nodos(red).filter(q=>dist(q.p,aqui)>3)
  .map(q=>({q,d:dist(q.p,aqui)})).sort((a,b)=>a.d-b.d);}
function abrirRed(red,titulo,aqui){
 const R=REDES[red],destinos=lineaDe(red,aqui);
 if(!destinos.length)return aviso('No hay más paradas en esta red');
 abrirTienda(titulo,R.n+' · '+R.tarifa+' €',destinos.map(({q,d})=>({
  ico:R.ico,tt:q.n,dd:minutosViaje(red,d)+' min · '+Math.round(d*5.16/100)/10+' km',
  precio:R.tarifa,ya:()=>false,fn:()=>viajarA(red,q)})));}
/* Una parada de bus no es un POI: no sale en el radar ni en el mapa de pausa, porque
   treinta y cuatro chinchetas más taparían la ciudad. Se encuentra estando encima. */
function paradaCerca(){let m=null,md=1.8;
 for(const q of PARADAS){const d=dist(q.p,player);if(d<md){md=d;m=q;}}return m;}
function estacion(p){
 if(S.estrellas>0)return aviso('Con la pasma detrás no subes a ningún sitio');
 const redes=redesDe(p);
 if(redes.length===1)return abrirRed(redes[0],p.n,p.p);
 /* Abando es las dos cosas, que es lo que pasa de verdad: allí se cambia de red. */
 return hablar(p.n,['Metro abajo, cercanías arriba. ¿Qué coges?'],
  redes.map(r=>({txt:REDES[r].n,fn:()=>abrirRed(r,p.n,p.p)})));}

/*═══════════════ COMBATE ═══════════════*/
function estrellas(n){
 S.estrellas=clamp(S.estrellas+n,0,5);S.cooldown=0;
 while(policia.length<Math.min(S.estrellas,4)){const p=puntoCalle(player.x|0,player.y|0,28);
  policia.push({x:p.x,y:p.y,tx:p.x|0,ty:p.y|0,vel:5.2+S.estrellas*.35,ang:0,luz:0});}}
function lineaVista(a,b){
 const d=dist(a,b),pasos=Math.ceil(d/.4);
 for(let i=1;i<pasos;i++){const t=i/pasos;
  if(!andable(Tc(Math.floor(a.x+(b.x-a.x)*t),Math.floor(a.y+(b.y-a.y)*t))))return false;}
 return true;}
function disparar(desde,ang,a,dueno){
 const n=a.disp||1;
 for(let i=0;i<n;i++){const sp=(azar()-.5)*(a.spread||0)*2;
  balas.push({x:desde.x+Math.cos(ang)*.5,y:desde.y+Math.sin(ang)*.5,
   vx:Math.cos(ang+sp)*a.vel,vy:Math.sin(ang+sp)*a.vel,dmg:a.dmg,vida:a.alc/a.vel,dueno});}
 particula(desde.x+Math.cos(ang)*.6,desde.y+Math.sin(ang)*.6,'chispa',3);
 sfx(a.id==='escopeta'?'escopeta':'disparo',.8);}
const dirAng=d8=>(2-d8)*Math.PI/4;
let fogT=0,fogTipo=null,fogD=0;
/* mx,my es el apuntado fino del teclado. Si está puesto se dispara hacia ahí y el arma
   apenas corrige; si no —que es como se juega con el pulgar— se dispara hacia donde mira
   el personaje y el arma busca blanco en un cono ancho. Acertar a una figura de veinte
   píxeles con el pulgar en un móvil no es puntería, es suerte, y el juego no debería
   depender de eso. */
/*═══════════════ SIGILO ═══════════════*/
/* Hasta aquí el juego repartía estrellas por el hecho de hacer algo, mirara quien
   mirara: robar un coche en un descampado a las cuatro de la mañana costaba lo mismo que
   robarlo delante de una patrulla. Ahora lo que cuenta es que te vean.

   Todo cuelga de tres cosas que ya estaban: `lineaVista`, hacia dónde mira cada uno, y
   el reloj. Lo demás es cono, distancia y paciencia. */
const CONO=1.05;                          /* medio ángulo del cono de visión, ~60° */
const esDeNoche=()=>S.min<7*60||S.min>=21*60;
/* Un coche se ve venir aunque vayas despacio; agachado se te ve la mitad; corriendo
   llamas la atención. De noche, todo esto a la mitad larga. */
function alcanceVista(){
 let r=esDeNoche()?9:15;
 if(player.enCoche)return r*1.3;
 if(player.sigilo)r*=.5;
 else if(player.corriendo)r*=1.3;
 return r;}
/* Los peatones y los enemigos miran hacia donde andan (d8); los coches patrulla, hacia
   donde conducen (ang). */
const miraA=o=>o.d8!==undefined?dirAng(o.d8):(o.ang||0);
function teVe(o,r){
 const d=dist(o,player);
 const alc=r===undefined?alcanceVista():r;
 if(d>alc)return false;
 /* A bocajarro no hace falta cono: te tiene encima. */
 if(d>2.2){
  const ang=Math.atan2(player.y-o.y,player.x-o.x);
  if(Math.abs(((ang-miraA(o)+Math.PI*3)%(Math.PI*2))-Math.PI)>CONO)return false;}
 return lineaVista(o,player);}
/* ¿Hay ahora mismo alguien que pueda declarar? La pasma y los enemigos siempre cuentan;
   los viandantes solo de cerca, que a cincuenta metros nadie distingue una cara. */
function testigos(){
 for(const p of policia)if(teVe(p))return true;
 for(const e of enemigos)if(teVe(e))return true;
 for(const q of peatones)if(!(q.huye>0)&&teVe(q,Math.min(9,alcanceVista())))return true;
 return false;}
/* Un delito que no ve nadie no da estrellas. Es la regla entera del sigilo. */
let avisoLimpio=0;
function delito(n,que){
 if(testigos()){estrellas(n);return true;}
 if(que&&avisoLimpio<=0){avisoLimpio=6;aviso('Nadie te ha visto');}
 return false;}
/* El ruido no ve, pero orienta: quien lo oye deja de mirar hacia donde miraba y va a
   mirar ahí. Es lo que convierte un disparo en un problema aunque estés a cubierto. */
function ruido(x,y,r){
 if(r<=0)return;
 const o={x,y};
 for(const p of policia)if(dist(p,o)<r){p.sosp=Math.min(1,(p.sosp||0)+.55);p.oido={x,y};}
 for(const e of enemigos)if(dist(e,o)<r*.8){e.sosp=Math.min(1,(e.sosp||0)+.7);e.oido={x,y};e.alerta=1;}
 asustar(o,r*.45);}
/* Quien no te ha visto todavía va llenando su sospecha; quien te pierde la vacía. Al
   llenarse, canta. */
function ojos(dt){
 let max=0,visto=false;
 const mira=(o,esPoli)=>{
  const ve=teVe(o);
  if(ve){visto=true;
   const d=dist(o,player);
   o.sosp=Math.min(1,(o.sosp||0)+dt*(esPoli?1.5:1.1)*(1.3-clamp(d/alcanceVista(),0,1)));
  }else o.sosp=Math.max(0,(o.sosp||0)-dt*.5);
  if(o.sosp>max)max=o.sosp;
  return ve;};
 for(const p of policia)mira(p,true);
 for(const e of enemigos){
  if(mira(e,false)){e.oido=null;if(e.sosp>=.6)e.alerta=1;}
  else if(e.alerta&&e.sosp<=0&&!e.oido)e.alerta=0;}
 S.sospecha=max;S.visto=visto;
 if(avisoLimpio>0)avisoLimpio-=dt;}
/* Un enemigo que no sabe que estás ahí y al que llegas por detrás cae de un golpe y sin
   ruido. Es el premio de haber ido despacio: si no, el sigilo solo sirve para tardar
   más en llegar al mismo tiroteo. */
const porDetras=o=>Math.abs(((Math.atan2(player.y-o.y,player.x-o.x)-miraA(o)+Math.PI*3)%(Math.PI*2))-Math.PI)>1.85;
const desprevenido=o=>!o.alerta&&(o.sosp||0)<.5;

function atacarJugador(mx,my){
 if(S.escena!=='ciudad'||player.enCoche)return;
 const a=arma(S.armaAct);
 if(player.cad>0)return;
 if(!a.inf&&!(S.armas[a.id]>0))return aviso('Sin munición');
 player.cad=a.cad;
 const base=(mx||my)?Math.atan2(my,mx):dirAng(player.d8);
 const cono=(mx||my)?.62:1.15;
 let obj=null,md=a.alc+.6;
 for(const e of enemigos){const d=dist(e,player);if(d>md)continue;
  const ang=Math.atan2(e.y-player.y,e.x-player.x);
  const df=Math.abs(((ang-base+Math.PI*3)%(Math.PI*2))-Math.PI);
  if(df<cono&&lineaVista(player,e)){md=d;obj=e;}}
 if(a.cuerpo&&!obj)for(const p of peatones){const d=dist(p,player);if(d>a.alc+.4)continue;
  const ang=Math.atan2(p.y-player.y,p.x-player.x);
  const df=Math.abs(((ang-base+Math.PI*3)%(Math.PI*2))-Math.PI);
  if(df<1.05){obj=p;break;}}
 const ang=obj?Math.atan2(obj.y-player.y,obj.x-player.x):base;
 if(obj)player.d8=dir8De(Math.cos(ang),Math.sin(ang));
 if(a.cuerpo){player.pose='pega2';player.golpeT=.22;
  /* Por detrás y a alguien que no sabe que estás ahí: cae de un golpe y sin ruido. Es
     el premio de haber ido despacio; sin esto, el sigilo solo sirve para tardar más en
     llegar al mismo tiroteo. */
  if(obj&&enemigos.includes(obj)&&desprevenido(obj)&&porDetras(obj)&&dist(obj,player)<.35){
   sfx('golpe',.35);danar(obj,999);particula(obj.x,obj.y,'sangre',6);
   ruido(obj.x,obj.y,2.5);darXp(25);aviso('Por la espalda');return;}
  sfx('golpe',.7);
  if(obj&&dist(obj,player)<=a.alc+.4){danar(obj,a.dmg);particula(obj.x,obj.y,'sangre',4);}
 }else{S.armas[a.id]--;disparar(player,ang,a,'jugador');
  player.golpeT=.16;player.pose='dispara';
  fogT=.07;fogTipo=a.fog;fogD=player.d8;
  /* Un disparo se oye a media calle. Con silenciador, a la acera de enfrente y poco
     más: el arma sigue haciendo el mismo daño, lo que compras es no despertar al
     barrio. */
  const sil=S.tiene.silenciador&&a.id==='pistola';
  ruido(player.x,player.y,sil?5:18);
  if(S.estrellas<1)delito(1);}}
function danar(e,d){
 e.hp-=d;e.herido=.25;
 if(e.hp<=0){
  const i=enemigos.indexOf(e);
  if(i>=0){enemigos.splice(i,1);S.dinero+=rndi(20,70);sfx('dinero',.5);particula(e.x,e.y,'sangre',10);
   if(S.mision){const p=pasoActual();if(p&&p.t==='matar'){p.n--;if(p.n<=0)avanzarPaso();else aviso('QUEDAN '+p.n);}}}
  else{const j=peatones.indexOf(e);if(j>=0){peatones.splice(j,1);peatones.push(nuevoPeaton(player.x|0,player.y|0));
   particula(e.x,e.y,'sangre',8);sfx('grito',.6);delito(1);}}
 }else{particula(e.x,e.y,'sangre',3);if(e.huye!==undefined)e.huye=4;}}
function danarJugador(d){
 if(S.muerto>0)return;
 S.hp=Math.max(0,S.hp-d);flashT=.3;player.herido=.25;
 if(S.hp<=0){S.muerto=2.2;grande('K.O.',2.2);}}
function explotar(c){
 c.vivo=false;sfx('explosion');ruido(c.x,c.y,30);particula(c.x,c.y,'chispa',26);particula(c.x,c.y,'humo',16);
 for(const e of enemigos)if(dist(e,c)<2.6)danar(e,90);
 if(dist(player,c)<2.8)danarJugador(55);
 if(player.enCoche===c){player.enCoche=null;player.x=c.x+1;player.y=c.y+1;}}
function detener(){
 const multa=Math.round(S.dinero*.35)+30;
 S.dinero=Math.max(0,S.dinero-multa);S.estrellas=0;policia.length=0;
 for(let i=enemigos.length-1;i>=0;i--)if(enemigos[i].tipo==='poli')enemigos.splice(i,1);
 if(S.mision)terminarMision(false);
 S.job=null;player.enCoche=null;
 player.x=poi('poli').p.x;player.y=poi('poli').p.y+1.4;
 grande('DETENIDO',2.2);aviso('Multa de '+multa+' €',3);guardar();}

/*═══════════════ MOVIMIENTO ═══════════════*/
function libre(x,y,coche){
 if(S.escena==='interior')return !solidoInt(tileInt(x,y));
 const t=Tc(Math.floor(x),Math.floor(y));
 return coche?(t!==EDIF&&t!==AGUA&&t!==PARQUE&&t!==MONTE):andable(t);}
function mover(e,nx,ny,coche){
 if(libre(nx,e.y,coche))e.x=nx;else if(coche)e.golpe=true;
 if(libre(e.x,ny,coche))e.y=ny;else if(coche)e.golpe=true;
 if(S.escena==='ciudad'){e.x=clamp(e.x,1,MW-1);e.y=clamp(e.y,1,MH-1);}}
function rejilla(c,dt,persigue){
 if(c.frenado)return;
 if(Math.hypot(c.tx+.5-c.x,c.ty+.5-c.y)<.15){
  let d=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>rodable(c.tx+dx,c.ty+dy));
  if(!d.length){c.tx++;return;}
  let el;
  if(persigue){d.sort((a,b)=>Math.hypot(c.tx+a[0]-player.x,c.ty+a[1]-player.y)-Math.hypot(c.tx+b[0]-player.x,c.ty+b[1]-player.y));el=d[0];}
  else{const r=d.find(([dx,dy])=>dx===c.dx&&dy===c.dy);
   el=(r&&azar()<.82)?r:(d.filter(([dx,dy])=>!(dx===-c.dx&&dy===-c.dy))[0]||d[0]);}
  c.dx=el[0];c.dy=el[1];c.tx+=el[0];c.ty+=el[1];}
 c.ang=Math.atan2(c.ty+.5-c.y,c.tx+.5-c.x);
 c.x+=Math.cos(c.ang)*c.vel*dt;c.y+=Math.sin(c.ang)*c.vel*dt;}
/* Diez gaviotas planeando. Van por la capa de vuelo —no las tapa nada, están por encima
   de los tejados— y en círculo, que es como planea una gaviota: no aletea, se deja llevar.
   Se reciclan alrededor del jugador como el tráfico, y si hay ría cerca hacen el corro
   sobre el agua, que es donde comen. */
const gaviotas=[];
function nuevaGaviota(cx,cy){
 /* Cerca: la pantalla enseña trece casillas de ancho, y diez gaviotas repartidas por
    noventa no se ven nunca. */
 let mx=cx+rndi(-10,10),my=cy+rndi(-7,7);
 for(let i=0;i<40;i++){const x=clamp(cx+rndi(-11,11),2,MW-3),y=clamp(cy+rndi(-8,8),2,MH-3);
  if(Tc(x,y)===AGUA||Tc(x,y)===MUELLE){mx=x;my=y;break;}}
 return{cx:clamp(mx,2,MW-3),cy:clamp(my,2,MH-3),r:rnd(2.5,7),a:rnd(0,6.28),
  w:rnd(.25,.6)*(azar()<.5?1:-1),alto:rnd(6,16),f:0,x:mx,y:my};}
function actGaviotas(dt){
 if(S.escena!=='ciudad')return;
 if(!gaviotas.length)for(let i=0;i<10;i++)gaviotas.push(nuevaGaviota(player.x|0,player.y|0));
 for(const v of gaviotas){
  v.a+=v.w*dt;v.f+=dt;
  v.x=v.cx+Math.cos(v.a)*v.r;
  v.y=v.cy+Math.sin(v.a)*v.r*.62;
  if(Math.hypot(v.x-player.x,v.y-player.y)>19)Object.assign(v,nuevaGaviota(player.x|0,player.y|0));}}
function asustar(p,r){for(const q of peatones)if(dist(q,p)<r){q.huye=3.5;if(azar()<.1)sfx('grito',.3);}}
function objetivo(){
 if(S.mision){const p=pasoActual();if(!p)return null;return p.t==='robar'?p.coche:p.p;}
 if(S.job)return S.job.fase===0?S.job.o:S.job.d;
 return null;}

/*═══════════════ BUCLE ═══════════════*/
let ult=performance.now(),acum=0,autoT=0,arrancado=false;
function bucle(t){const dt=Math.min(.05,(t-ult)/1000);ult=t;act(dt);dib();requestAnimationFrame(bucle);}
function act(dt){
 if(avisoT>0)avisoT-=dt;
 if(grandeT>0)grandeT-=dt;
 if(flashT>0){flashT-=dt;flashEl.style.opacity=Math.max(0,flashT);}
 if(fogT>0)fogT-=dt;
 if(player.herido>0)player.herido-=dt;
 if(player.golpeT>0)player.golpeT-=dt;
 musica(dt);
 if(S.muerto>0){S.muerto-=dt;motorAudio(null,1);sirenaAudio(dt,false);
  if(S.muerto<=0){
   S.hp=60;S.dinero=Math.max(0,S.dinero-Math.round(S.dinero*.2));
   ARMAS.forEach(a=>{if(!a.inf)delete S.armas[a.id];});S.armaAct='punos';
   S.estrellas=0;policia.length=0;balas.length=0;
   for(let i=enemigos.length-1;i>=0;i--)if(!enemigos[i].mision)enemigos.splice(i,1);
   player.enCoche=null;
   player.x=poi('hospital').p.x;player.y=poi('hospital').p.y+1.2;
   if(S.mision)terminarMision(false);
   aviso('Hospital. Te han cobrado el rescate',3);guardar();}
  return;}
 const pausa=telEl.style.display==='flex'||tiEl.style.display==='flex'||pauEl.style.display==='flex'||dlg;
 autoT+=dt;if(autoT>25){autoT=0;guardar();}
 if(curro){curro.t-=dt;document.getElementById('curroP').textContent='Quedan '+curro.t.toFixed(1)+' s';
  if(curro.t<=0)finCurro(false);return;}
 if(pausa){motorAudio(null,1);sirenaAudio(dt,false);return;}
 acum+=dt;while(acum>.45){acum-=.45;S.min++;if(S.min>=1440){S.min=0;S.dia++;}}
 S.hambre=Math.max(0,S.hambre-dt*.004);
 /* Correr ya no es un botón: es empujar el joystick a fondo. */
 let ix=joy.dx,iy=joy.dy,fuerza=joy.mag;
 if(teclas['a'])ix=-1;if(teclas['d'])ix=1;
 if(teclas['w'])iy=-1;if(teclas['s'])iy=1;
 if(teclas['a']||teclas['d']||teclas['w']||teclas['s'])fuerza=teclas['shift']?1:.7;
 const correr=fuerza>CORRE;
 /* La postura se decide con el joystick y se queda puesta al soltarlo: agacharse para
    mirar una esquina y levantarse solo al parar sería inservible. */
 if(fuerza>.02)player.sigilo=fuerza<AGACHA;
 player.corriendo=correr;
 /* Apuntado fino solo con las flechas del teclado. Con el pulgar no hay cruceta: se
    apunta encarando, y el arma corrige. */
 let mx=mira.dx,my=mira.dy;
 if(teclas['arrowleft'])mx=-1;if(teclas['arrowright'])mx=1;
 if(teclas['arrowup'])my=-1;if(teclas['arrowdown'])my=1;

 S.energia=Math.max(0,S.energia-dt*.0025-((correr&&!player.enCoche)?dt*.01:0));
 if(S.hambre<=0){S.energia=Math.max(0,S.energia-dt*.017);S.hp=Math.max(1,S.hp-dt*.9);}
 player.cad=Math.max(0,player.cad-dt);

 /* Apuntar gira al personaje aunque esté quieto: así se puede cubrir una esquina sin
    andar hacia ella, que es media pelea. */
 if((mx||my)&&!player.enCoche)player.d8=dir8De(mx,my);
 /* Al volante, A es el freno y el toque corto vale de claxon o de bajarse; a pie sigue
    siendo la accion de siempre. */
 if(player.enCoche){
  if(aToque){aToque=false;
