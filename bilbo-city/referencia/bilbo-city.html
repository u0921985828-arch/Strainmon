/* La cadencia sale de la velocidad de verdad, no de un ritmo fijo. Iba a 7,5 pasos por
   segundo andando y 11 corriendo pasara lo que pasara, asi que desde que el joystick es
   analogico y la velocidad tiene inercia se podia avanzar a paso de tortuga moviendo las
   piernas a toda pastilla — el pie patinaba sobre el suelo, que es lo que mas canta de
   una animacion mal atada.
   Una zancada mide unos 0,75 m, asi que los pasos por segundo son la velocidad partida
   por eso. Y correr o andar tampoco lo decide el boton: lo decide ir a mas de 3,2 m/s,
   que es donde una persona deja de andar. */
/* Andando la zancada es de 75 cm y corriendo de 1,80 m: no es la misma, y con una sola
   medida la carrera salía a ocho pasos por segundo —el doble que un atleta— y las piernas
   se veían como un abanico. Van en metros de figura, que es la vara en la que se mueve
   (ver ESC_FIG). */
const ZANCADA=0.75*ESC_FIG, ZANCADA_C=1.80*ESC_FIG;

function poseAndar(e,vel,correr,dt,sigilo,mCasilla){

    casilla: 5,16 m en la calle, 0,80 m dentro de un sitio. */
 const ms=Math.abs(vel)*(mCasilla||1/MS);
 const corriendo=ms>(mCasilla?3.2:V_CORRE_ANIM);
 e.anim+=dt*Math.max(.6,ms/(corriendo?ZANCADA_C:ZANCADA));
 const f=Math.floor(e.anim)%4+1;
 if(sigilo){e.pose=f<3?'agacha':'agacha2';return;}
 e.pose=(corriendo?'correr':'andar')+(corriendo?((f-1)%4+1):f);}

/*═══════════════ RENDER DEL MUNDO ═══════════════*/
/* Las capas, de abajo arriba, y el orden en que se pinta. Es una ley, no una costumbre:
   nada de una capa puede pintarse antes que algo de una capa de más abajo, porque lo que
   va después tapa. El verificador la comprueba grabando un fotograma de verdad. */
const CAPA={SUELO:0,EDIFICIO:1,OBJETO:2,VUELO:3,HUD:4};
let capa=CAPA.SUELO;
const capaAct=()=>capa;
const cam={x:0,y:0,z:1,tinte:[0,0,0]};
/*── El sol ──────────────────────────────────────────────────────────────────
  Bilbao está a 43° N: el sol sale por el este, cruza por el sur y se pone por el oeste,
  así que a mediodía la sombra apunta al norte —hacia arriba en pantalla— y a primera y
  última hora se tumba y cruza la calle entera. Desde arriba, la sombra es lo único que
  dice cuánto levanta un edificio y dónde acaba su tejado; y como sale de la hora y no de
  una constante, además dice qué hora es sin mirar el reloj. */
const AMANECE=7.5, ANOCHECE=21.5;
const SOL={ux:0,uy:-1,alto:0,elev:0};
function calcularSol(){
 const h=S.min/60;
 if(h<=AMANECE||h>=ANOCHECE){SOL.alto=0;SOL.elev=0;return SOL;}
 const t=(h-AMANECE)/(ANOCHECE-AMANECE);
 SOL.alto=Math.sin(t*Math.PI);
 const az=Math.PI/2+t*Math.PI;          /* este al amanecer, sur al mediodía, oeste al ocaso */
 SOL.ux=-Math.sin(az);SOL.uy=Math.cos(az);   /* la sombra va al contrario que el sol */
 SOL.elev=Math.max(.10,SOL.alto*1.13);       /* 65° de elevación máxima, en radianes */
 return SOL;}
/* Lo que proyecta cualquier cosa que esté de pie, en píxeles: la altura partida por la
   tangente de la elevación. Sale de aquí para todo —persona, coche, farola y árbol— porque
   si la manzana proyecta a un lado y el coche al otro, la escena se rompe. */
function sombraSol(altoM){
 if(!SOL.elev)return null;
 const largo=Math.min(4*TS,altoM/Math.tan(SOL.elev)*(TS/5.16));
 return {dx:SOL.ux*largo,dy:SOL.uy*largo,largo,ang:Math.atan2(SOL.uy,SOL.ux)};}
/* La misma sombra, pero parada donde se acaba el suelo. Desde arriba, la de una farola no
   puede subirse al tejado del edificio de al lado: al llegar a la fachada, la sombra trepa
   por la pared y en una vista cenital eso no se ve. Se recorta en la primera manzana que

 cajaHUD(xCol,marg+26,wd,26);
 ctx.drawImage(ICO.euro,xCol+3,marg+29,20,20);
 texto(ctx,din,xCol+26,marg+29,2,'ambar');
 /* ── reloj y día ── */
 const wh=wCol;
 const yRel=marg+26+26+GAP;
 cajaHUD(xCol,yRel,wh,36);
 texto(ctx,hr,xCol+5,yRel+3,2,'hueso');
 texto(ctx,'DIA '+S.dia,xCol+5,yRel+23,1,'hueso');
 /* ── energía y hambre bajo el radar ── */
 const by=cyr+R+14;
 const barra=(y,v,col,ico)=>{
  ctx.drawImage(ico,zi,y-3,14,14);
  ctx.fillStyle='rgba(7,9,12,.8)';ctx.fillRect(zi+18,y,74,8);
  ctx.fillStyle='rgba(141,153,164,.4)';ctx.fillRect(zi+18,y,74,1);ctx.fillRect(zi+18,y+7,74,1);
  ctx.fillStyle=col;ctx.fillRect(zi+19,y+1,72*clamp(v,0,1),6);};
 barra(by,S.energia,'#4d9de0',ICO.energia);
 barra(by+16,S.hambre,'#e0a14d',ICO.hambre);
 /* ── dónde estás: la calle, y debajo el barrio ──
    La calle solo cuando se sabe cuál es. Nombrar de menos es mejor que nombrar mal: la
    mayor parte de la trama son calles que no se pueden afirmar sin el callejero, y una
    inventada en el sitio de una que existe es peor que no poner nada. */
 const D=distDe(clamp(player.x|0,0,MW-1),clamp(player.y|0,0,MH-1));
 if(S.escena==='interior')texto(ctx,S.interior.n,zi,by+32,1,'hueso');
 else{
  const cl=calleEn(player.x|0,player.y|0);
  if(cl){texto(ctx,cl,zi,by+32,1,'hueso');texto(ctx,D.n,zi,by+44,1,'ambar');}
  else texto(ctx,D.n,zi,by+32,1,'hueso');}
 /* Dónde acaba la columna izquierda. El rótulo grande iba a una fracción de la altura
    (H*.42) y la columna va en píxeles fijos, así que en una pantalla baja el aviso caía
    justo encima del barrio y de las barras. */
 hudBaseIzq=by+58;
 /* ── arma y munición ── */
 const a=aq, mun=munq, wa=wCol;
 const ay=yRel+36+GAP;
 cajaHUD(xCol,ay,wa,36);
 ctx.drawImage(ICO[a.id]||ICO.punos,xCol+3,ay+8,22,22);
 texto(ctx,a.n,xCol+28,ay+4,1,'hueso');
 texto(ctx,mun,xCol+28,ay+16,2,'ambar');
 /* ── el ojo ──
    Sin esto el sigilo se juega a ciegas: no hay forma de saber si el que está ahí
    enfrente te ha visto o está mirando al escaparate. El ojo se abre según lo que le
    falta a la sospecha para llenarse, y se pone en rojo cuando ya te tienen. Va debajo
    del arma, que es la esquina que queda libre. */
 if(S.escena==='ciudad'&&(S.sospecha>.02||S.visto)){
  const an=wCol,oy=ay+36+GAP;
  cajaHUD(xCol,oy,an,26);
  ctx.drawImage(S.visto?ICO.ojo:ICO.ojoTachado,xCol+3,oy+3,20,20);
  const wb=an-30;
  ctx.fillStyle=C.carbon;ctx.fillRect(xCol+26,oy+9,wb,8);
  ctx.fillStyle=S.sospecha>=1?C.sangre:S.sospecha>.5?C.mostaza:C.acero;
  ctx.fillRect(xCol+26,oy+9,Math.round(wb*clamp(S.sospecha,0,1)),8);}
 /* ── misión o curro ── */
 if(S.escena==='ciudad'&&(S.mision||S.job)){
  const o=objetivo(),dm=o?Math.round(dist(o,player)*8):0;
  const t1=S.mision?S.mision.def.n:S.job.tt;
  const t2=S.mision?pasoActual().txt
   :(S.job.fase===0?'RECOGIDA':'ENTREGA'+(S.job.dn?' · '+S.job.dn.toUpperCase():''));
  const t3=dm+' M'+(S.mision&&S.mision.limite?'  '+Math.max(0,Math.ceil(S.mision.limite-S.mision.t))+' S':
   (S.job?'  '+S.job.pago+' €':''));
  const wm=Math.max(anchoTexto(t1,1),anchoTexto(t2,1),anchoTexto(t3,1))+12;
  const mx=clamp((W-wm)/2,zi,zd-wm), my=H-58;
  cajaHUD(mx,my,wm,42);
  ctx.fillStyle=C.mostaza;ctx.fillRect(mx,my,wm,2);
  texto(ctx,t1,mx+6,my+4,1,'ambar');
  texto(ctx,t2,mx+6,my+16,1,'hueso');
  texto(ctx,t3,mx+6,my+28,1,'ambar');}
 /* ── deuda ── */
 if(S.deuda>0){const td='ALQUILER '+S.deuda+' €';
  texto(ctx,td,zi,by+46,1,'rojo');}
 /* ── pista contextual ── */
 if(pista1){const w=anchoTexto(pista1,1)+12;
  cajaHUD((W-w)/2,H-24,w,16);
  texto(ctx,pista1,(W-w)/2+6,H-22,1,'hueso');}
 /* ── aviso ── */
 if(avisoT>0&&aviso1){
  let esc=2;while(esc>1&&anchoTexto(aviso1,esc)>zd-zi)esc--;
  const w=Math.min(zd-zi,anchoTexto(aviso1,esc)+16), al=clamp(avisoT,0,1);
  const ya=Math.max(H*.42,hudBaseIzq);
  ctx.globalAlpha=al;cajaHUD((W-w)/2,ya,w,9*esc+8);
  texto(ctx,aviso1,(W-w)/2+8,ya+4,esc,'ambar');ctx.globalAlpha=1;}
 /* ── rótulo grande ── */
 if(grandeT>0&&grande1){let esc=W<620?3:4;
  while(esc>1&&anchoTexto(grande1,esc)>zd-zi)esc--;
  const w=anchoTexto(grande1,esc);
  const al=clamp(grandeT,0,1);
  ctx.globalAlpha=al;
  texto(ctx,grande1,(W-w)/2,H*.3,esc,'ambar');ctx.globalAlpha=1;}}

/*═══════════════ GUARDADO ═══════════════*/
const CLAVE='bilbocity_v4';
const alm={
 async get(k){try{if(window.storage){const r=await window.storage.get(k);return r?r.value:null;}
  return localStorage.getItem(k);}catch(e){return null;}},
 async set(k,v){try{if(window.storage)await window.storage.set(k,v);else localStorage.setItem(k,v);}catch(e){}},
 async del(k){try{if(window.storage)await window.storage.delete(k);else localStorage.removeItem(k);}catch(e){}}};
function guardar(){
 alm.set(CLAVE,JSON.stringify({
  dinero:S.dinero,hp:S.hp,energia:S.energia,hambre:S.hambre,min:S.min,dia:S.dia,rep:S.rep,
  deuda:S.deuda,alquiler:S.alquiler,ultCobro:S.ultCobro,tiene:S.tiene,contrato:S.contrato,
  armas:Object.fromEntries(Object.entries(S.armas).map(([k,v])=>[k,v===Infinity?-1:v])),
  armaAct:S.armaAct,misionIdx:S.misionIdx,pinta:S.pinta,
  xp:S.xp,nivel:S.nivel,props:S.props,casera:S.casera,prologo:S.prologo,x:player.x,y:player.y}));}
/* La carga es atómica y desconfía del archivo. Antes se hacía `Object.assign` nada más
   parsear: un guardado a medias —la pestaña cerrada mientras escribía, otra versión del
   juego, un campo a null— reventaba a mitad, `cargar()` devolvía false, y el arranque
   entendía «aquí no hay partida» y dejaba empezar una nueva **encima del estado ya
   envenenado**: dinero NaN, reloj NaN y el protagonista en la casilla 99999. Ahora todo
   se valida y se acota en variables aparte, y S no se toca hasta que sale bien. */
const num=(v,d,lo,hi)=>typeof v==='number'&&isFinite(v)?clamp(v,lo,hi):d;
const objDe=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:null;
async function cargar(){
 const raw=await alm.get(CLAVE);if(!raw)return false;
 let d;try{d=JSON.parse(raw);}catch(e){return false;}
 if(!objDe(d))return false;
 try{
  const nuevo={
   dinero:num(d.dinero,60,-1e6,1e9),hp:num(d.hp,100,0,100),
   energia:num(d.energia,1,0,1),hambre:num(d.hambre,1,0,1),
   min:num(d.min,8*60,0,24*60),dia:Math.round(num(d.dia,1,1,1e5)),
   rep:objDe(d.rep)||S.rep,deuda:num(d.deuda,0,0,1e9),alquiler:num(d.alquiler,220,0,1e6),
   ultCobro:Math.round(num(d.ultCobro,1,1,1e5)),
   tiene:objDe(d.tiene)||S.tiene,contrato:objDe(d.contrato),
   misionIdx:Math.round(num(d.misionIdx,0,0,MISIONES.length)),
   armaAct:arma(d.armaAct)?d.armaAct:'punos',
   xp:num(d.xp,0,0,1e9),nivel:Math.round(num(d.nivel,1,1,99)),
   props:objDe(d.props)||{},casera:objDe(d.casera)||S.casera,
   prologo:d.prologo?1:0};  /* es bandera, no contador: 1 mientras llegas a Bilbao. */
  const armas={};
  Object.entries(objDe(d.armas)||{punos:-1}).forEach(([k,v])=>{
   if(arma(k))armas[k]=v===-1?Infinity:num(v,0,0,9999);});
  if(armas.punos===undefined)armas.punos=Infinity;
  /* Una prenda que no existe deja el arquetipo sin torso y la forja se cae al vestir. La
     lista buena es la de la tienda: lo que no se puede comprar no se pudo guardar. */
  const pinta={},dp=objDe(d.pinta)||{};
  for(const r of ['torso','piernas','calzado','gorro'])
   if(PRENDAS.some(p=>p.r===r&&p.v===dp[r]))pinta[r]=dp[r];
  /* Y una posición sin validar saca al jugador del mapa, donde no hay casilla que pisar:
     se cae a la casilla andable más cercana, y si viene basura, al portal. */
  const casa=poi('piso').p;
  const px=num(d.x,casa.x,1,MW-2),py=num(d.y,casa.y,1,MH-2);
  const p=andable(Tc(Math.floor(px),Math.floor(py)))?{x:px,y:py}
   :cercaDe((x,y)=>andable(Tc(x,y)),px,py,60);
  Object.assign(S,nuevo);S.armas=armas;
  if(Object.keys(pinta).length)vestir(pinta);
  if(S.prologo)retomarPrologo();
  player.x=p.x;player.y=p.y;
  if(S.tiene.deportivo){tuCoche.tipo='deportivo';tuCoche.lib=2;tuCoche.vmax=vmaxDe('deportivo');}
  else if(S.tiene.furgo){tuCoche.tipo='furgoLarga';tuCoche.vmax=vmaxDe('furgoLarga');}
  tuCoche.x=casa.x+1.4;tuCoche.y=casa.y;
  return true;}catch(e){return false;}}

/*═══════════════ ARRANQUE ═══════════════*/
const tituloEl=document.getElementById('titulo'),tcv=document.getElementById('tcv'),cargaEl=document.getElementById('carga');
/*═══════════════ PORTADA Y CARGA ═══════════════*/
/* El título iba en HTML: tipografía del sistema, degradados y un mapa de fondo teñido de
   rojo. Nada de eso está en el juego, así que la primera pantalla mentía sobre lo que
   venía después. Ahora se dibuja con lo mismo que todo lo demás —la fuente BLOQUE, la
   paleta de 48 y los sprites forjados— sobre un trozo de la ciudad de verdad.

   El lienzo va a una resolución baja y se escala en entero: es la única manera de que un
   píxel del rótulo mida lo mismo que un píxel del juego. */
const POR_W=320, POR_H=180;
/* `map` está preasignado, así que preguntarle por su tamaño dice que sí desde el primer
   paso de la carga: el mapa del fondo se cacheaba vacío y la portada salía negra. */
let ciudadLista=false;
let porT=0, porPaso='', porProg=0, porHay=false;
function escalaPortada(){
 return Math.max(1,Math.floor(Math.min(innerWidth/POR_W,innerHeight/POR_H)));}
/* Un rótulo grande con sombra dura, centrado. */
function rotulo(g,txt,y,esc,tinta){
 texto(g,txt,Math.round((POR_W-anchoTexto(txt,esc))/2),y,esc,tinta);}
/* Una caja de las del juego: borde de dos, relleno oscuro y rayas de tubo. */
function cajaPortada(g,x,y,w,h,encendida){
 P(g,x,y,w,h,encendida?C.rojoO:C.carbon);
 P(g,x+2,y+2,w-4,h-4,encendida?'#7a2f14':C.negro);
 P(g,x,y,w,2,encendida?C.rojoL:C.grisL);
 P(g,x,y+h-2,w,2,C.negro);
 for(let i=y+4;i<y+h-2;i+=3){g.globalAlpha=.14;P(g,x+2,i,w-4,1,C.hueso);g.globalAlpha=1;}}
function pintarPortada(){
 const g=tcv.getContext('2d');
 if(tcv.width!==POR_W){tcv.width=POR_W;tcv.height=POR_H;}
 g.imageSmoothingEnabled=false;
 /* Fondo: un trozo de Bilbao de verdad —el meandro de Deusto y el Casco— a una casilla
    por píxel. Si la ciudad aún no está cargada se queda el asfalto, que tampoco
    desentona. */
 P(g,0,0,POR_W,POR_H,C.asfaltoO);
 if(ciudadLista){
  /* A una casilla por píxel el recorte cae entero sobre manzanas y sale una plancha
     oscura: 320 casillas son kilómetro y medio de edificios. Se coge el doble de ciudad
     y con la ría dentro, que es lo que se reconoce de Bilbao desde arriba. */
  g.drawImage(mapaBase(),470,110,POR_W*2,POR_H*2,0,0,POR_W,POR_H);
  g.globalAlpha=.22;P(g,0,0,POR_W,POR_H,C.negro);g.globalAlpha=1;}
 /* Bandas arriba y abajo, para que el rótulo y los botones se lean siempre. */
 for(let i=0;i<34;i++){g.globalAlpha=Math.min(.92,(34-i)/30);
  P(g,0,i,POR_W,1,C.negro);P(g,0,POR_H-1-i,POR_W,1,C.negro);}
 g.globalAlpha=1;
 rotulo(g,'BILBO',14,4,'ambar');
 rotulo(g,'CITY',50,4,'ambar');
 rotulo(g,'NERVION · 199X',88,1,'hueso');
 /* Una acera con cuatro vecinos y un coche: es un juego de andar por la calle y la
    portada tiene que decirlo antes que ninguna otra cosa. */
 const suelo=POR_H-34;
 P(g,0,suelo,POR_W,2,C.asfalto);
 g.globalAlpha=.5;P(g,0,suelo+2,POR_W,6,C.negro);g.globalAlpha=1;
 if(VEH&&VEH.utilitario)g.drawImage(VEH.utilitario[0],POR_W-96,suelo-16);
 const cw=CEL_W(),ch=CEL_H();
 for(const[k,d,x] of [['protagonista',2,16],['p6',0,52],['p10',6,84],['ertzaina',4,POR_W-30]]){
  const h=hoja(k);if(h)g.drawImage(h,d*cw,0,cw,ch,x,suelo-ch+8,cw,ch);}
 /* Y encima de todo, la carga o los botones. */
 if(porProg<1){
  const bw=180,bx=(POR_W-bw)/2,by=POR_H-16;
  P(g,bx-2,by-2,bw+4,10,C.carbon);
  P(g,bx,by,bw,6,C.negro);
  P(g,bx,by,Math.round(bw*porProg),6,C.mostaza);
  P(g,bx,by,Math.round(bw*porProg),2,C.hueso);
  const t='FORJANDO '+porPaso.toUpperCase();
  texto(g,t,Math.round((POR_W-anchoTexto(t,1))/2),by-12,1,'hueso');
 }else{
  const bw=112,bx=(POR_W-bw)/2;
  cajaPortada(g,bx,POR_H-30,bw,13,false);
  const t1='CONTINUAR';
  texto(g,t1,Math.round((POR_W-anchoTexto(t1,1))/2),POR_H-27,1,porHay?'ambar':'hueso');
  if(!porHay){g.globalAlpha=.55;P(g,bx,POR_H-30,bw,13,C.negro);g.globalAlpha=1;}
  cajaPortada(g,bx,POR_H-15,bw,13,true);
  const t2=porHay?'PARTIDA NUEVA':'EMPEZAR';
  texto(g,t2,Math.round((POR_W-anchoTexto(t2,1))/2),POR_H-12,1,'hueso');}
 /* Las cajas de clic del DOM se colocan encima de lo dibujado: la lógica de los botones
    no cambia, solo dónde se ven. */
 colocarBotonesPortada();}
function colocarBotonesPortada(){
 const e=escalaPortada(),ox=Math.round((innerWidth-POR_W*e)/2),oy=Math.round((innerHeight-POR_H*e)/2);
 /* El lienzo se estira a un múltiplo entero y se coloca a mano: centrarlo con flex y
    dejarle el tamaño natural lo dejaba a 320×180 en una esquina. */
 if(tcv&&tcv.style){tcv.style.position='absolute';tcv.style.transform='none';
  tcv.style.left=ox+'px';tcv.style.top=oy+'px';
  tcv.style.width=(POR_W*e)+'px';tcv.style.height=(POR_H*e)+'px';
  tcv.style.maxWidth='none';tcv.style.maxHeight='none';}
  const bw=112,bx=(POR_W-bw)/2;
 const poner=(el,y)=>{if(!el||!el.style)return;
  el.style.position='absolute';el.style.left=(ox+bx*e)+'px';el.style.top=(oy+y*e)+'px';
  el.style.width=(bw*e)+'px';el.style.height=(13*e)+'px';
  el.style.padding='0';el.style.margin='0';el.style.border='none';
  el.style.background='transparent';el.style.color='transparent';el.style.fontSize='0';};
 poner(document.getElementById('btnCont'),POR_H-30);
 poner(document.getElementById('btnNuevo'),POR_H-15);}
addEventListener('resize',()=>{if(tituloEl&&tituloEl.style.display!=='none')pintarPortada();});

const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function arrancar(){
 const pasos=[
  ['tiles',()=>generarTiles()],
  ['vehículos',()=>generarVeh()],
  ['props',()=>generarProps()],
  ['iconos',()=>{generarIconos();forjarMando();ajustarMando();}],
  ['la ciudad',async()=>{await cargarCiudad();colocarPOIs();colocarSingulares();colocarParadas();nombrarCalles();clasificarNombres();colocarCalle();}],
  ['el barrio',()=>{player.x=poi('piso').p.x;player.y=poi('piso').p.y;poblar();}],
  ['a la gente',async()=>{await cargarSprites();['protagonista','ertzaina','maton','maton2'].forEach(hoja);}],
 ];
 for(let i=0;i<pasos.length;i++){
  const[n,f]=pasos[i];
  porPaso=n;porProg=i/pasos.length;
  cargaEl.textContent='';
  pintarPortada();
  await espera(12);await f();}
 porProg=1;
 const hay=await cargar();
 document.body.dataset.listo='1';
 porHay=hay;
 pintarPortada();
 const bc=document.getElementById('btnCont'),bn=document.getElementById('btnNuevo');
 if(!hay)bc.style.pointerEvents='none';
 const entrar1=nuevo=>{audioInit();tituloEl.style.display='none';
  if(!arrancado){arrancado=true;ult=performance.now();requestAnimationFrame(bucle);}
  if(nuevo)empezarPrologo();
  else aviso('PARTIDA CARGADA · DIA '+S.dia,3.4);};
 bc.addEventListener('click',()=>{if(hay)entrar1(false);});
 bn.addEventListener('click',async()=>{if(hay){await alm.del(CLAVE);location.reload();}else entrar1(true);});
}
arrancar();
})();
</script>
