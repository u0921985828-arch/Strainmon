<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>BILBO CITY</title>
<style>
:root{--hueso:#e6e2d6;--acero:#8d99a4;--oxido:#b7451f;--neon:#e8c547;--verde:#4f9d69;--morado:#9d5fa8;--sangre:#c1362b;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;background:#07090c;color:var(--hueso);
 font-family:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;user-select:none;touch-action:none;}
/* Consola de mano: la pantalla va en medio y los mandos en el marco, fuera de ella.
   Overlaid sobre el juego los pulgares tapan justo lo que hay que mirar; aquí no tapan
   nada, y además la mano descansa en el marco como en una consola de verdad. */
/* El ancho del marco es una sola cuenta y todo lo demás cuelga de ella. Medido con
   herramientas/html/mando.js en móviles de verdad: con el 17% de antes y el joystick
   atado a la altura, en un móvil de 5,4" el joystick salía a 14,5 mm — más pequeño que el
   pulgar que lo usa— y los botones a 9,1 mm, justo en el mínimo que se puede acertar. El
   marco crece hasta el 20% y el joystick se mide desde el marco, no desde la altura. La
   pantalla pierde una casilla y media de ancho; el pulgar gana seis milímetros. */
:root{--marco:clamp(112px,20%,220px);}
/* El ancho va explícito: un <canvas> es un elemento reemplazado y con width:auto usa su
   tamaño intrínseco, así que se salía por debajo de los marcos. */
canvas#c{position:absolute;left:var(--marco);top:5%;bottom:5%;height:90%;
 width:calc(100% - var(--marco) * 2);
 image-rendering:pixelated;background:#05070a;
 border:2px solid rgba(230,226,214,.14);border-radius:4px;
 box-shadow:0 0 0 6px #0d1116, 0 6px 22px rgba(0,0,0,.75), inset 0 0 40px rgba(0,0,0,.6);}
body{background:radial-gradient(circle at 50% 40%,#12171d,#080a0d 78%);}
#capa{position:absolute;inset:0;pointer-events:none;}
.btn{position:absolute;pointer-events:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;
 font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--hueso);
 background:radial-gradient(circle at 34% 30%,rgba(78,88,99,.92),rgba(24,29,35,.92));
 border:2px solid rgba(230,226,214,.28);box-shadow:0 3px 0 rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.12);}
.btn:active{background:radial-gradient(circle at 34% 30%,#d0561f,#8e3316);transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.5);}
/* ═══ EL MANDO ═══
   Los dos marcos laterales, a los lados de la pantalla. A la izquierda el pulgar que
   anda o conduce, con SELECT y OPTIONS encima; a la derecha A y B, y el cambio de arma.
   Todo en porcentajes: un móvil tumbado puede medir 640 o 1280 de ancho y el pulgar
   sigue cayendo en el mismo sitio de la mano. */
#izq,#der{position:absolute;top:0;bottom:0;width:var(--marco);pointer-events:none;
 display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;}
#izq{left:0;} #der{right:0;}

/* Las pastillas de arriba: pequeñas y alargadas, que no se pulsan a menudo. */
.pastillas{display:flex;gap:10%;width:78%;justify-content:center;pointer-events:none;}
/* El mando no lleva ni un degradado: los sprites los forja el juego, en la paleta y con
   la luz de arriba a la izquierda como todo lo demás, y aquí solo se colocan. El tamaño
   lo pone ajustarMando() en múltiplos enteros del sprite, que si no salen píxeles a
   medias. */
.pas,#joy,#joy i,.btn{background-repeat:no-repeat;background-size:100% 100%;
 image-rendering:pixelated;-webkit-tap-highlight-color:transparent;}
.pas{pointer-events:auto;width:var(--pas,56px);height:calc(var(--pas,56px) * 12 / 28);
 background-image:var(--imgPas);display:flex;align-items:center;justify-content:center;
 font-size:min(2vh,12px);color:rgba(230,226,214,.78);letter-spacing:.5px;}
.pas:active{background-image:var(--imgPasP);}

#joy{position:relative;width:var(--joy,128px);height:var(--joy,128px);
 pointer-events:auto;background-image:var(--imgJoy);}
#joy i{position:absolute;left:50%;top:50%;width:var(--seta,80px);height:var(--seta,80px);
 margin:calc(var(--seta,80px) / -2) 0 0 calc(var(--seta,80px) / -2);
 background-image:var(--imgSeta);}
/* El aro se enciende al correr: sin botón de correr, es lo que dice que vas a tope. */
#joy.corre{box-shadow:0 0 0 3px rgba(232,197,71,.85);border-radius:50%;}

/* A y B, redondos y uno encima de otro, como en el boceto. La letra va dentro del sprite
   y en negro: sobre plástico de hueso es lo único que se lee. */
.btn{pointer-events:auto;width:var(--btn,88px);height:var(--btn,88px);
 background-image:var(--imgA);font-size:0;position:relative;}
#bB{background-image:var(--imgB);}
#bA:active,#bA.on{background-image:var(--imgAp);}
#bB:active,#bB.on{background-image:var(--imgBp);}

/* Tumba el móvil: el juego es apaisado y punto. */
#gira{position:absolute;inset:0;background:#07090c;z-index:20;display:none;
 flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:auto;
 text-align:center;padding:24px;}
#gira .g{font-size:64px;animation:vuelta 2.2s ease-in-out infinite;}
#gira .t{font-size:15px;letter-spacing:4px;text-transform:uppercase;color:var(--acero);}
@keyframes vuelta{0%,42%{transform:rotate(0)}58%,100%{transform:rotate(-90deg)}}
/* ═══ LOS PANELES ═══
   El móvil, la pausa y las tiendas. Van dentro de la pantalla de la consola, no encima
   de todo: si un menú tapa también el marco, se pierde la ilusión de estar mirando un
   cacharro. De ahí que no sean `inset:0` sino que se recorten al hueco del lienzo. */
.pant{position:absolute;left:17%;right:17%;top:5%;bottom:5%;
 background:linear-gradient(180deg,rgba(8,11,15,.995),rgba(13,18,24,.995));
 border:2px solid rgba(230,226,214,.14);border-radius:4px;
 display:none;flex-direction:column;padding:12px 14px;overflow:hidden;pointer-events:auto;}
.pant>*{width:100%;max-width:620px;margin-left:auto;margin-right:auto;flex-shrink:0;}
/* El plano de la ciudad se estira al ancho del panel; si no, queda arrinconado. */
#pausaCuerpo canvas{display:block;width:100%;height:auto;image-rendering:pixelated;}
/* Las rayas horizontales son de tubo, no de adorno: dan al menú la misma materia que
   la pantalla del juego y disimulan el degradado. */
.pant::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:4px;z-index:1;
 background:repeating-linear-gradient(180deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px);}
/* La pestaña encendida va por encima de las rayas: es lo único de la pantalla que tiene
   que leerse de un vistazo, y rayada parece deshabilitada. */
.tabs{position:relative;z-index:2;}
.pant h2{margin:0;font-size:20px;letter-spacing:5px;text-transform:uppercase;
 color:var(--neon);text-shadow:2px 2px 0 var(--oxido);}
.pant .sub{font-size:10px;letter-spacing:3px;color:var(--acero);margin:1px 0 9px;text-transform:uppercase;}
.tabs{display:flex;gap:4px;margin-bottom:9px;}
.tab{flex:1;text-align:center;padding:6px 0;font-size:10px;letter-spacing:2px;text-transform:uppercase;
 border:2px solid rgba(141,153,164,.28);background:rgba(16,21,27,.9);color:var(--acero);}
.tab.on{background:var(--neon);border-color:var(--neon);color:#1a1206;text-shadow:none;font-weight:700;}
/* El cuerpo es lo único que se desplaza: la cabecera y el botón de cerrar se quedan. */
#telCuerpo,#pausaCuerpo,#tiendaCuerpo{flex:1;overflow-y:auto;min-height:0;}

.item{background:linear-gradient(180deg,#161d24,#10161b);border:2px solid rgba(141,153,164,.2);
 border-left:5px solid var(--oxido);padding:5px 8px;margin-bottom:5px;display:flex;gap:8px;align-items:center;}
.item:active{background:#1e262f;border-color:var(--neon);}
/* El icono va en un hueco hundido, como una casilla de inventario. */
/* Caben cinco filas en un móvil tumbado; con la caja más alta solo entraban cuatro. */
.item .ico{width:30px;height:30px;flex:0 0 30px;display:flex;align-items:center;justify-content:center;
 background:#0a0d11;border:1px solid rgba(141,153,164,.22);box-shadow:inset 0 2px 4px rgba(0,0,0,.7);}
img.pix{image-rendering:pixelated;display:block;}
.item .txt{flex:1;min-width:0;}
.item .tt{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.item .dd{font-size:11px;color:var(--acero);line-height:1.25;}
.item .pago{font-size:15px;font-weight:700;color:var(--neon);white-space:nowrap;
 text-shadow:1px 1px 0 var(--oxido);}
.item.legal{border-left-color:var(--verde);} .item.turbio{border-left-color:var(--morado);}
.item.hist{border-left-color:var(--neon);} .item.no{opacity:.34;}
.cerrar{margin-top:8px;padding:10px;text-align:center;letter-spacing:3px;text-transform:uppercase;
 border:2px solid rgba(230,226,214,.26);font-weight:700;font-size:12px;background:rgba(16,21,27,.9);}
.cerrar:active{background:var(--oxido);border-color:var(--oxido);}
.rep{margin-bottom:8px;}
.rep .n{display:flex;justify-content:space-between;font-size:11px;letter-spacing:1px;text-transform:uppercase;}
.rep .b{height:9px;background:rgba(0,0,0,.6);border:1px solid rgba(141,153,164,.28);margin-top:2px;}
.rep .b i{display:block;height:100%;background:linear-gradient(90deg,#b7451f,#e8c547);}
#dlg{position:absolute;left:50%;transform:translateX(-50%);width:min(560px,50%);
 bottom:calc(env(safe-area-inset-bottom) + 10px);
 background:linear-gradient(180deg,rgba(9,12,16,.98),rgba(14,19,25,.98));
 border:1px solid rgba(141,153,164,.36);border-top:3px solid var(--neon);padding:10px 12px;
 display:none;pointer-events:auto;box-shadow:0 -6px 20px rgba(0,0,0,.5);}
#dlgN{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--neon);}
#dlgT{font-size:16px;line-height:1.35;margin:4px 0 2px;min-height:44px;}
#dlgO .op{border:1px solid rgba(230,226,214,.3);padding:8px 10px;margin-top:5px;font-size:14px;
 display:flex;justify-content:space-between;gap:8px;background:rgba(20,26,32,.7);}
#dlgO .op:active{background:var(--oxido);} #dlgO .op span{color:var(--neon);font-weight:700;}
#dlgMas{font-size:11px;color:var(--acero);text-align:right;letter-spacing:2px;}
#curro{position:absolute;inset:0;background:rgba(6,8,11,.94);display:none;flex-direction:column;
 align-items:center;justify-content:center;gap:14px;pointer-events:auto;}
#curro .t{font-size:20px;letter-spacing:2px;text-transform:uppercase;}
#curro .c{font-size:48px;font-weight:700;color:var(--neon);line-height:1;}
#curroBtn{width:180px;height:180px;border-radius:50%;border:4px solid rgba(230,226,214,.36);
 background:radial-gradient(circle at 35% 30%,#d0561f,#8e3316);
 display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;letter-spacing:2px;}
#curroBtn:active{transform:scale(.94);}
#curro .p{font-size:11px;letter-spacing:2px;color:var(--acero);text-transform:uppercase;}
/* La portada se dibuja entera en su lienzo, con la fuente y los sprites del juego. Aquí
   solo queda centrarlo y escalarlo en entero, como el juego. */
#tcv{position:absolute;image-rendering:pixelated;}
#titulo .b{position:absolute;pointer-events:auto;background:transparent;border:none;}
#titulo{position:absolute;inset:0;background:#07090c;display:flex;flex-direction:column;align-items:center;
 justify-content:center;gap:4px;pointer-events:auto;z-index:9;overflow:hidden;}
#tcv{position:absolute;inset:0;width:100%;height:100%;opacity:.28;image-rendering:pixelated;}
#titulo .z{position:relative;text-align:center;}
#titulo h1{font-size:min(17vw,76px);margin:0;letter-spacing:7px;line-height:.88;
 background:linear-gradient(180deg,#f7edc0,#e8c547 45%,#b7451f);-webkit-background-clip:text;background-clip:text;
 color:transparent;text-shadow:0 7px 0 rgba(0,0,0,.55);}
#titulo .tag{font-size:12px;letter-spacing:7px;text-transform:uppercase;color:var(--acero);margin:6px 0 26px;}
#titulo .b{border:1px solid rgba(230,226,214,.4);padding:12px 34px;margin-top:9px;letter-spacing:3px;
 text-transform:uppercase;font-weight:700;font-size:15px;min-width:242px;background:rgba(16,21,27,.75);}
#titulo .b:active{background:var(--oxido);}
#carga{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:11px;letter-spacing:3px;
 text-transform:uppercase;color:var(--acero);}
#fund{position:absolute;inset:0;background:#05070a;opacity:0;pointer-events:none;transition:opacity .22s;}
#flash{position:absolute;inset:0;background:#c1362b;opacity:0;pointer-events:none;}
</style>
</head>

function resize(){DPR=Math.min(2,Math.max(1,Math.floor(devicePixelRatio||1)));W=cv.clientWidth;H=cv.clientHeight;
 cv.width=W*DPR|0;cv.height=H*DPR|0;ctx.imageSmoothingEnabled=false;}

/* Generador propio en vez del de la plataforma: así una partida — o una pasada de la
   batería de pruebas — se puede repetir clavada. Sin sembrar arranca de la hora,
   que es el comportamiento de siempre. mulberry32: corto, rápido y bien repartido. */
let _semilla=(Date.now()^0x9E3779B9)>>>0;
function sembrar(s){_semilla=(s>>>0)||1;}
function azar(){_semilla=(_semilla+0x6D2B79F5)>>>0;let t=_semilla;
 t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
 return ((t^(t>>>14))>>>0)/4294967296;}
const rnd=(a,b)=>a+azar()*(b-a), rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const modp=(a,n)=>((a%n)+n)%n;   /* el % de JS devuelve negativos y aquí no valen */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(a,b){let h=(a*73856093)^(b*19349663);h=(h^(h>>13))*1274126177;return Math.abs(h^(h>>16));}
function lienzo(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;
 const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
/* La escala a la que se forja lo que se dibuje ahora. El mundo se sigue escribiendo en
   espacio de 32 —61 tiles, los props, las fachadas— y sale a 64 recalculando cada
   rectangulo por sus dos cantos, no multiplicando el ancho: asi lo que iba pegado sigue
   pegado. Lo que NO se escala es el grano: `grano` pinta a 1 y por eso la textura del
   asfalto y del ladrillo es fina de verdad, del tamano de pixel del personaje. Antes el
   tile se forjaba a 32 y se subia con `x2()`, y se veian dos tamanos de pixel en la misma
   pantalla: bloques de 2x2 en el suelo y pixeles sueltos en la gente. */
let ESC_P=1;
const P=(g,x,y,w,h,c)=>{
 if(ESC_P===1){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0);return;}
 const s=ESC_P,X=Math.floor(x*s),Y=Math.floor(y*s);
 g.fillStyle=c;g.fillRect(X,Y,Math.floor((x+w)*s)-X,Math.floor((y+h)*s)-Y);};
/* El grano va a resolucion de pantalla, no a la de la geometria: se recorre el area ya
   escalada y se pinta de uno en uno con la escala apagada. Es lo unico que distingue una
   textura de un damero de bloques cuando el tile sale al doble. */
/* Se llamaba `ruido`, igual que el ruido del sigilo de más abajo. Dos `function` con el
   mismo nombre en el mismo ámbito no dan error: gana la última, y la última era la del
   sonido. Así que las treinta y una llamadas del arte le pasaban un lienzo donde esperaba
   una coordenada, no pintaban nada y el juego entero llevaba sin grano desde entonces —sin
   que saltara un solo aviso—. Se llama `grano`, que además es como lo llaman los comentarios. */
function grano(g,w,h,cols,d,ox=0,oy=0){
 const s=ESC_P,W=Math.round(w*s),H=Math.round(h*s),OX=Math.round(ox*s),OY=Math.round(oy*s);

    múltiplos: aquella dibujaba rayas en diagonal, y un tile de 16 repetido por toda una
    habitación convertía la diagonal en pana. Un grano tiene que ser grano. */
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)
  if(hash(x,y)%100<d)P(g,x+OX,y+OY,1,1,cols[hash(x+7,y+11)%cols.length]);
 ESC_P=s;}

   cuerpo que ella misma pinta. El otro son las hojas traídas de PixelLab, que vienen a
   propósito sin nada en la cabeza y sin bolsas: así una sola hoja vale para todo el que
   tenga esa silueta, y el peinado, la txapela y el carro de la compra se le ponen encima.
   Con `soloGrandes` el pelo corto no se repite —ese ya viene en la hoja— y solo se añaden

/* El chaflán, y es lo que quita el aire de muñeco de bloques. Todo lo que dibuja la forja
   son rectángulos —`P` no sabe hacer otra cosa— y a 26 píxeles la suma de rectángulos se
   lee como un montón de cajas apiladas: el cráneo, el hombro y la puntera son cantos de
   noventa grados. Quitando el píxel de cada esquina convexa, la silueta se redondea sin
   dibujar una forma nueva.
   La condición es apretada a propósito —los dos vecinos de fuera transparentes y los dos
   de dentro opacos— porque con la suelta un detalle de un píxel de ancho, como la correa
   del bolso o el cañón de un arma, se lo come entero. Y se recogen todas las esquinas
   antes de borrar ninguna: borrando sobre la marcha, el hueco recién hecho convierte al
   vecino en esquina y el chaflán se come la figura en diagonal. */
function chaflan(c){

  if(!op(x,y))continue;
  const iz=op(x-1,y),de=op(x+1,y),ar=op(x,y-1),ab=op(x,y+1);
  if((!iz&&!ar&&de&&ab)||(!de&&!ar&&iz&&ab)||(!iz&&!ab&&de&&ar)||(!de&&!ab&&iz&&ar))esquinas.push((y*W+x)*4+3);
 }
 for(const i of esquinas)d[i]=0;
 g.putImageData(img,0,0);return c;}

/* Los sprites traídos vienen como un índice de paleta por píxel —0 es transparente— y
   no como PNG: así el archivo sigue siendo uno solo y el arte sigue atado a los 48
   colores. Se descomprimen todos al arrancar porque dibujar no puede esperar. */
function lienzoDeIndices(bytes,w,h){
 const c=lienzo(w,h),g=c.getContext('2d'),img=g.createImageData(w,h),d=img.data;
 for(let i=0,j=0;i<bytes.length;i++,j+=4){
  const v=bytes[i];
  if(!v){d[j+3]=0;continue;}
  const p=PALETA[(v-1)%PALETA.length];
  d[j]=p[0];d[j+1]=p[1];d[j+2]=p[2];d[j+3]=255;}
 g.putImageData(img,0,0);return c;}

/*═══════════════ HOJAS TRAÍDAS: UNA SILUETA, MUCHOS VECINOS ═══════════════*/
/* Una hoja de PixelLab no se baja para un personaje: se baja para una silueta, y de esa
   silueta salen todos los que la comparten. Viene pintada con colores de plantilla —cada
   parte del cuerpo en su propia rampa de la paleta— y cada arquetipo la repinta cambiando
   índices por índices: la chaqueta al color de su chaqueta, el pantalón al suyo, la piel a
   la suya. Encima se le forjan el pelo largo, el gorro y la bolsa, que es justo lo que
   habría multiplicado las hojas por setenta si viniera dibujado.

   Siete hojas visten a los treinta y siete arquetipos, y el vecino número treinta y ocho
   no cuesta ni una llamada más. */

/* De la ropa de un arquetipo a la hoja que le sirve. Lo que decide es la silueta, no el
   color: manga larga o corta, abrigo, capucha; pantalón, falda o pantalón corto. Si la
   hoja exacta no está bajada se prueba con la más parecida, así que bajar una sola ya
   viste a todo el mundo y bajarlas todas afina. */
function setDe(cfg){
 const T=TORSOS[cfg.torso],PN=PIERNAS[cfg.piernas];
 const arriba=T.largo?'abrigo':T.capucha?'capucha':(T.manga==='corta'||T.manga==='sin')?'corto':'largo';
 const abajo=PN.falda?'falda':PN.corto?'short':'pantalon';
 const h=SPR.hojas||{};
 for(const k of [arriba+'_'+abajo,arriba+'_pantalon','largo_'+abajo,'largo_pantalon'])
  if(BASES[k])return k;
 return null;}

const iPaleta=(()=>{const m=new Map();PALETA.forEach((p,i)=>m.set(p[3],i));return m;})();
/* El índice de un color en la paleta. Los tonos de piel oscura de la forja no están en
   los 48 —se cuantizan al pintar—, así que aquí se cuantizan igual antes de indexar. */
function indiceDe(hex){
 const v=iPaleta.get(hex);
 if(v!==undefined)return v;
 const p=masCercano(parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16));
 return PALETA.indexOf(p);}

/* La tabla de repintado de un arquetipo: 256 bytes que dicen en qué se convierte cada
   índice de la hoja de plantilla. Una rampa de tres tonos que va a parar a una de dos se
   reparte proporcionalmente; la de un solo color aplana. */
function lutDe(cfg){
 const lut=new Uint8Array(256);
 for(let i=0;i<256;i++)lut[i]=i;
 const R=SPR.rampas||{};
 const pinta=(rampa,cols)=>{
  if(!rampa||!rampa.length||!cols.length)return;
  const n=rampa.length,m=cols.length;
  for(let i=0;i<n;i++)lut[rampa[i]]=1+indiceDe(cols[m<2?0:Math.round(i*(m-1)/(n-1))]);};
 const T=TORSOS[cfg.torso],PN=PIERNAS[cfg.piernas];
 pinta(R.piel,[cfg.pielS,cfg.piel]);
 /* Calvo no necesita hoja propia: se le manda el pelo al color de su piel y desaparece. */
 pinta(R.pelo,cfg.pelo==='calvo'?[cfg.pielS,cfg.piel]
  :[cfg.pelo==='canoso'?C.pelo5:cfg.pelocol]);
 pinta(R.torso,[T.s,T.b,T.l]);
 pinta(R.piernas,[PN.s,PN.b,PN.l]);
 pinta(R.calzado,[CALZADO[cfg.calzado].s,CALZADO[cfg.calzado].b]);
 return lut;}

/* Dónde tiene la cabeza esta casilla de la hoja. No se da por supuesto: el dibujo traído
   no cae píxel a píxel donde lo pone la forja, y un gorro colocado a ojo se queda flotando
   o le tapa los ojos. Se busca la primera fila con piel o pelo y el borde izquierdo de esa
   cabeza, y el gorro se sitúa respecto a eso. */
function anclaCabeza(bytes,w,cw,ch,d,fy,masc){
 const x0=d*cw;
 let arriba=-1;
 for(let y=0;y<ch&&arriba<0;y++){
  const f=(fy*ch+y)*w+x0;
  for(let x=0;x<cw;x++)if(masc[bytes[f+x]]){arriba=y;break;}}
 if(arriba<0)return null;
 let xmin=cw;
 for(let y=arriba;y<Math.min(ch,arriba+8);y++){
  const f=(fy*ch+y)*w+x0;
  for(let x=0;x<cw;x++)if(masc[bytes[f+x]]&&x<xmin){xmin=x;break;}}
 return {x:xmin,y:arriba};}

/* Las capas de encima, forjadas en la caja de la forja, y dónde queda su cabeza para poder
   cuadrarlas con la de la hoja traída. */
function dibEncima(cfg,pose,d8){
 const M=MAPA8[d8],dir=M.b,frente=M.f,espalda=M.e;
 const c=lienzo(sc(FORJA_W),sc(FORJA_H)),g=c.getContext('2d');
 /* El margen se reparte sobre la celda ya escalada, no escalando el margen: sc() no es
    aditivo —sc(20)+2*sc(2) no da sc(24)— y confiando en sc(MG_X) el lado izquierdo se
    quedaba con dos pixeles en vez de tres y el puno y la correa se salian por ahi. */
 g.translate(Math.round((sc(FORJA_W)-sc(20))/2),sc(FORJA_H)-sc(26)-sc(MG_ABA));
 const P=Pe;
 const P_=POSES[pose],comp=COMPLEX[cfg.comp],T=TORSOS[cfg.torso];
 const diag=frente||espalda,lateral=(dir===DE||dir===IZ)&&!diag;
 const cx=10+(diag?(dir===DE?-1:1):0)+(lateral?(dir===DE?1:-1):0);
 const oy=P_.y,yt=P_.yt||0,hom=comp.hom-(diag?1:0)-(lateral?2:0);
 const arr=(dir===AR)||espalda,ty=9+oy+yt,hy=1+oy+yt;
 capasEncima(g,cfg,cx,hy,ty,hom,
  {dir,arr,T,izqV:dir===IZ,derV:dir===DE,fog:P_.fog},1);
 return {c:contorno(c,C.negro),hx:MG_X+cx-4,hy:MG_ARR+hy};}

/* La hoja de un arquetipo a partir de la silueta que le toca: repintar y poner encima. */
function hojaDeSet(k){
 const cfg=ARQ[k],s=cfg&&setDe(cfg),base=s&&BASES[s];
 if(!base)return null;
 const cw=CEL_W(),ch=CEL_H(),w=cw*8;
 const lut=lutDe(cfg),bytes=new Uint8Array(base.length);
 for(let i=0;i<base.length;i++)bytes[i]=lut[base[i]];
 const c=lienzoDeIndices(bytes,w,ch*ORDEN_POSES.length),g=c.getContext('2d');
 const masc=new Uint8Array(256);
 for(const r of ['piel','pelo'])for(const v of (SPR.rampas||{})[r]||[])masc[v]=1;
 ORDEN_POSES.forEach((p,fy)=>{for(let d=0;d<8;d++){
  const a=anclaCabeza(base,w,cw,ch,d,fy,masc);
  if(!a)continue;
  const e=dibEncima(cfg,p,d);
  g.drawImage(e.c,d*cw+a.x-e.hx,fy*ch+a.y-e.hy);}});
 return cuantizar(c);}

async function cargarSprites(){
 const w=CEL_W()*8, h=CEL_H()*ORDEN_POSES.length;
 for(const k of Object.keys(SPR.hojas)){
  try{
   const bytes=await inflar(SPR.hojas[k]);
   if(bytes.length!==w*h){console.warn('silueta',k,'con medidas raras; se forja');continue;}
   BASES[k]=bytes;
  }catch(e){console.warn('no pude leer la silueta',k,e);}}}

function hoja(k){
 if(HOJAS[k])return HOJAS[k];
 const traida=hojaDeSet(k);
 if(traida)return HOJAS[k]=traida;
 /* La forja da la celda entera, figura y margen. Si los sprites traídos usan otra
    medida, la celda forjada se centra en la suya y se apoya abajo: mezclar tamaños
    descoloca los pies. Con la medida de siempre, ox y oy salen cero. */
 const cw=CEL_W(), ch=CEL_H();
 const c=lienzo(cw*8,ch*ORDEN_POSES.length),g=c.getContext('2d');
 const ox=Math.round((cw-sc(FORJA_W))/2), oy=ch-sc(FORJA_H);
 ORDEN_POSES.forEach((p,fy)=>{for(let d=0;d<8;d++)g.drawImage(dibChar(ARQ[k],p,d),d*cw+ox,fy*ch+oy);});
 return HOJAS[k]=cuantizar(c);
}
function pintaChar(g,k,d8,pose,x,y,hj){
 const h=hj||HOJAS[k]||hoja(k), cw=CEL_W(), ch=CEL_H();
 g.drawImage(h,d8*cw,IPOSE[pose]*ch,cw,ch,Math.round(x)-(cw>>1),Math.round(y)-ch+sc(7+MG_ABA),cw,ch);}
const dir8De=(dx,dy)=>((2-Math.round(Math.atan2(dy,dx)/(Math.PI/4)))%8+8)%8;

/* El arma se forja en su propio lienzo y hacía falta ensancharlo: el cañón de la escopeta
   mide once píxeles y en los veinte de antes se salía por el canto en las tres direcciones
   que miran a la derecha —cuatro píxeles perdidos de once, un tercio del arma—, y el bate
   y la uzi otro tanto. Solo la pistola cabía. Treinta y dos da sitio a la más larga con su
   contorno, y sigue siendo par, que si no el sprite baila medio píxel al girar.
   Y va con contorno, como el personaje y por lo mismo: una pistola de carbón con la culata
   negra cruzando el asfalto, que es del mismo gris, se deshacía. */
const ARMA_W=32, ARMA_H=26, ARMA_CX=16;
const ARMA_MANO={};
ARMAS.forEach(a=>{if(!a.l)return;
 ARMA_MANO[a.id]=[];
 for(let d8=0;d8<8;d8++){
  const M=MAPA8[d8],dir=M.b,c=lienzo(sc(ARMA_W),sc(ARMA_H)),g=c.getContext('2d');
  const P=Pe;
  const gr=a.grosor||1,y=13,dg=(M.f||M.e)?1:0,ox=ARMA_CX-10;
  if(dir===DE){P(g,ox+13-dg,y+dg,a.l,gr,a.col);P(g,ox+11-dg,y+dg,2,gr+1,a.mango);}
  else if(dir===IZ){P(g,ox+7+dg-a.l,y+dg,a.l,gr,a.col);P(g,ox+7+dg,y+dg,2,gr+1,a.mango);}
  else if(dir===AB){P(g,ox+12,y+2,gr,a.l,a.col);P(g,ox+12,y,gr+1,2,a.mango);}
  else{P(g,ox+7,y-a.l,gr,a.l,a.col);P(g,ox+7,y,gr+1,2,a.mango);}
  ARMA_MANO[a.id].push(cuantizar(contorno(c,C.negro)));}
});

/* La fuente del juego es BLOQUE: el alfabeto de 5×7 engordado a 6 de ancho, relleno
   plano y sombra dura de un píxel abajo a la derecha. Se eligió sobre otras cinco
   (herramientas/html/fuentes.js las saca todas en una imagen) porque a tamaño 1 en un
   móvil es la que se lee sin acercar la cara, y a tamaño 3 aguanta como rótulo.

   La sombra va en un color de la paleta, no en negro: sobre las cajas oscuras del HUD un
   negro no se ve y la letra se queda plana. */
const GLIFOS_B={};
for(const k in GLIFOS)GLIFOS_B[k]=GLIFOS[k].map(r=>(r|(r<<1))&63);
const TINTAS={
 ambar:[C.mostaza,C.rojoO],
 negra:[C.negro,C.hormigonL],
 hueso:[C.hueso,C.aceroO],
 rojo:[C.rojoL,C.sangre],
 verde:[C.verdeL,C.verdeO],
};
const FUENTE={};
function glifo(ch,tinta){
 const k=tinta+ch;if(FUENTE[k])return FUENTE[k];
 const f=GLIFOS_B[ch]||GLIFOS_B['?'],T=TINTAS[tinta];
 const c=lienzo(8,9),g=c.getContext('2d');
 const on=(x,y)=>y>=0&&y<7&&x>=0&&x<6&&((f[y]>>(5-x))&1);
 for(let y=0;y<7;y++)for(let x=0;x<6;x++)if(on(x,y))P(g,x+1,y+1,1,1,T[1]);
 for(let y=0;y<7;y++)for(let x=0;x<6;x++)if(on(x,y))P(g,x,y,1,1,T[0]);
 return FUENTE[k]=cuantizar(c);
}
function texto(g,s,x,y,esc,tinta){
 s=String(s).toUpperCase();let cx=x;
 for(const ch of s){

  g.drawImage(glifo(ch,tinta||'ambar'),cx,y,8*esc,9*esc);cx+=7*esc;}
 return cx-x;}

   dentro del índice plano y cuántas variantes tiene. */
const TEJADOS={},TEJADO_DE={};

function T32(fn){const c=lienzo(32*ESC,32*ESC),g=c.getContext('2d');
 ESC_P=ESC;fn(g);ESC_P=1;return cuantizar(c);}
/* Igual que T32 pero el dibujo se escribe en la medida final, sin escalar: es lo que
   permite meter detalle de 1 px —la junta de una losa, la raya de la calzada, el canto de
   un adoquin— en vez de la geometria de 32 vista al doble. A 64 px por casilla, un pixel
   son 8 cm de Bilbao, asi que las medidas de aqui abajo son las de verdad: la losa de
   acera de 1,3 m, el adoquin de medio metro, la marca vial de 15 cm. */
const TT=()=>32*ESC;
function T64(fn){const N=TT(),c=lienzo(N,N),g=c.getContext('2d');fn(g,N);return cuantizar(c);}
const rell=(g,col)=>P(g,0,0,32,32,col);
function generarTiles(){
 /* El asfalto es arido: grano fino y nada mas. Se probo a meterle parches de reparacion
    y sale al reves de lo que se busca — un tile se repite en toda la calle, asi que
    cualquier rasgo con forma se convierte en una trama regular y canta mas que el color
    plano. Lo que da variedad es tener varias casillas distintas (`roadGrieta`), no
    cargar una. */
 const asfalto=(g,N)=>{P(g,0,0,N,N,C.asfalto);grano(g,N,N,[C.asfaltoO,C.asfaltoL],26);};
 TILE[ROAD]=T64((g,N)=>asfalto(g,N));
 TILE.roadGrieta=T64((g,N)=>{asfalto(g,N);
  /* Una grieta de verdad no es una senoidal: se abre, se bifurca y se cierra. */
  let x=6,y=N*.3;
  for(let i=0;i<N-10;i++){x+=1;y+=((i*7)%5)-2;y=Math.max(3,Math.min(N-4,y));
   P(g,x,y,1,1,C.asfaltoO);if(i%9===0)P(g,x,y+1,1,1,C.carbon);
   if(i>N*.4&&i<N*.7)P(g,x,y+3+((i*3)%2),1,1,C.asfaltoO);}});
 /* La marca vial mide 15 cm de ancho —2 px— y va a trazos de 2 m con 2 m de hueco. Iba a
    4 px de ancho y continua: 32 cm de pintura, el doble de lo que se pinta en la calle. */
 const marca=(g,N,vert)=>{const w=2,largo=Math.round(2/0.081),hueco=largo;
  for(let d=0;d<N;d+=largo+hueco){const l=Math.min(largo,N-d);

 TILE.lineaH=T64((g,N)=>{asfalto(g,N);marca(g,N,0);});
 TILE.lineaV=T64((g,N)=>{asfalto(g,N);marca(g,N,1);});
 /* Paso de cebra: banda de 50 cm y hueco de 50, o sea 6 px y 6. */
 TILE.cebraH=T64((g,N)=>{asfalto(g,N);for(let y=2;y<N-4;y+=12)P(g,0,y,N,6,C.crema);});
 TILE.cebraV=T64((g,N)=>{asfalto(g,N);for(let x=2;x<N-4;x+=12)P(g,x,0,6,N,C.crema);});
 /* Línea de detención: 40 cm de ancho —5 px— pegada al paso. Una calle sin ella es una
    calle donde nadie sabe dónde para el coche, y con el paso de cebra ya pintado cantaba. */
 const stopL=(g,N,lado)=>{const w=5;
  if(lado===0)P(g,0,1,N,w,C.crema);

  else if(lado===2)P(g,1,0,w,N,C.crema);

 TILE.stop=[0,1,2,3].map(l=>T64((g,N)=>{asfalto(g,N);stopL(g,N,l);}));
 /* Aparcamiento en línea. Una casilla son 5,16 m: justo la plaza de un coche. Se pinta la
    línea de fondo a 2,20 m del bordillo y los dos travesaños que separan una plaza de la
    siguiente. Sin esto, en toda la ciudad no había un solo sitio marcado para aparcar. */
 const aparcaL=(g,N,lado)=>{const w=2,f=Math.round(2.2/0.0806);
  if(lado===0){P(g,0,f,N,w,C.crema);P(g,0,0,w,f,C.crema);P(g,N-w,0,w,f,C.crema);}
  else if(lado===1){P(g,0,N-f-w,N,w,C.crema);P(g,0,N-f,w,f,C.crema);P(g,N-w,N-f,w,f,C.crema);}
  else if(lado===2){P(g,f,0,w,N,C.crema);P(g,0,0,f,w,C.crema);P(g,0,N-w,f,w,C.crema);}
  else {P(g,N-f-w,0,w,N,C.crema);P(g,N-f,0,f,w,C.crema);P(g,N-f,N-w,f,w,C.crema);}};
 TILE.aparca=[0,1,2,3].map(l=>T64((g,N)=>{asfalto(g,N);aparcaL(g,N,l);}));
 /* La flecha de carril: 2,5 m de largo, la que se pinta antes de un cruce para decir por
    dónde se sigue. Va en el sentido de la marcha, así que hay una por cada lado. */
 const flechaL=(g,N,lado)=>{
  const L=Math.round(2.5/0.0806), w=4, c=N/2;
  /* Se dibuja apuntando arriba y se gira: cuatro dibujos a mano se descuadran entre sí. */
  g.save();g.translate(c,c);g.rotate([0,Math.PI,-Math.PI/2,Math.PI/2][lado]);
  P(g,-w/2,-L/2,w,L,C.crema);

 TILE.flecha=[0,1,2,3].map(l=>T64((g,N)=>{asfalto(g,N);flechaL(g,N,l);}));
 /* Tapa de registro: 60 cm de diametro, marco de fundicion y rejilla, no un cuadrado. */
 TILE.alcantarilla=T64((g,N)=>{asfalto(g,N);
  const r=Math.round(0.31/0.081),cx=N/2,cy=N/2;
  for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++){const d=Math.hypot(x,y);

 TILE[PATIO]=T32(g=>{rell(g,C.hormigonO);grano(g,32,32,[C.hormigon,C.cespedO],20);

 TILE[PARQUE]=T32(g=>{rell(g,C.cesped);grano(g,32,32,[C.cespedO,'#4d7c48'],28);});
 TILE.parqueAlto=T32(g=>{rell(g,C.cespedO);grano(g,32,32,[C.cesped,'#4d7c48'],34);

 TILE.camino=T32(g=>{rell(g,'#8a7f66');grano(g,32,32,['#79705a','#9c9078'],22);});
 /* Medio término municipal de Bilbao es ladera. No es parque: es argoma, helecho y

 TILE[MONTE]=T32(g=>{rell(g,'#4a6340');grano(g,32,32,['#3f5638','#57704a'],30);});
 TILE.monteMata=T32(g=>{rell(g,'#456039');grano(g,32,32,['#3a5232','#5b7550'],36);

 TILE.monteRoca=T32(g=>{rell(g,'#4a6340');grano(g,32,32,['#3f5638'],26);

 TILE.agua=[0,1].map(f=>T32(g=>{rell(g,C.agua);grano(g,32,32,['#193f4a','#20505e'],20);

 TILE[MUELLE]=T32(g=>{rell(g,'#5e5346');grano(g,32,32,['#524839','#6b6052'],18);
  for(let y=0;y<32;y+=6)P(g,0,y,32,1,'#463d31');});
 /* Vista desde arriba, un edificio es su tejado. Hasta aquí todos llevaban el mismo, con
    ocho variantes de color repartidas al azar, así que el Casco Viejo, el Ensanche y una
    nave de Zorrotzaurre se veían igual desde el aire: el plano distinguía las manzanas
    pero el juego las pintaba a todas de gris.

    Ahora el tejado sale del estilo del barrio y del tamaño del edificio. Teja a dos aguas
    en el casco, pizarra con buhardillas en el ensanche, azotea de grava con depósitos y
    tendederos en los bloques, y chapa con lucernarios en diente de sierra en la
    industria. El bulto lo pone la ciudad, no el azar. */
 const tej=(b,o,cl)=>T32(g=>{rell(g,b);grano(g,32,32,[o,cl],14);
  for(let y=6;y<28;y+=7)P(g,3,y,26,1,o);});
 /* Teja árabe: hiladas de canales. Poco contraste a propósito — a treinta y dos píxeles
    por cinco metros, un tejado tiene que leerse como material y no como rayas. La primera
    versión llevaba una banda clara en medio de cada tile y toda la ciudad salió a pana. */
 /* Los tejados, a la medida final. A 8 cm por pixel una teja curva mide 40x25 cm, o sea
    5x3 px, y por eso a 32 no cabia: las hileras de antes eran de 80 cm y el tejado parecia
    una persiana. Ahora se dibuja pieza a pieza, con la canal entre teja y teja y el solape
    de la hilera de abajo, que es lo que hace que un tejado se lea como tejado. */
 const teja=(b,o)=>T64((g,N)=>{P(g,0,0,N,N,b);grano(g,N,N,[o],9);
  for(let y=0;y<N;y+=6){
   P(g,0,y,N,1,o);                                   /* el solape de la hilera */
   for(let x=(y/6%2)*3;x<N;x+=5){P(g,x,y+1,1,5,o);   /* la canal entre tejas */
    P(g,x+1,y+1,3,1,C.ladrillo5);}}});               /* el lomo, que da la luz */
 /* Pizarra: placa de 30x20 cm a matarras, con el clavo visto. */
 const pizarra=(b,o)=>T64((g,N)=>{P(g,0,0,N,N,b);grano(g,N,N,[o],10);
  for(let y=0;y<N;y+=3)for(let x=(y/3%2)*2;x<N;x+=4){
   P(g,x,y,3,2,o);P(g,x,y,3,1,C.hormigon5);}});
 /* Azotea: grava, y la junta de dilatacion de la lamina cada tres metros. */
 const grava=(b,o)=>T64((g,N)=>{P(g,0,0,N,N,b);grano(g,N,N,[o],34);
  for(let i=0;i<N;i+=37)P(g,i,0,1,N,o);});
 /* Nave: chapa grecada de 25 cm de paso, y el diente de sierra con sus lucernarios. */
 const chapa=(b,o)=>T64((g,N)=>{P(g,0,0,N,N,b);
  for(let x=0;x<N;x+=3){P(g,x,0,1,N,o);P(g,x+1,0,1,N,C.acero);}});
 const sierra=(b,o,luz)=>T64((g,N)=>{P(g,0,0,N,N,b);
  for(let y=0;y<N;y+=20){P(g,0,y,N,12,o);P(g,0,y+12,N,6,luz);P(g,0,y+12,N,1,C.nieve);}});

 /* Tejas de barro viejo, no de tejado nuevo: entre variantes hay un paso corto de tono.
    Una de ellas era roja de bandera y la manzana entera cantaba desde el otro lado del
    río. */
 TEJADOS.teja=[teja('#8e4f2c','#5f3520'),teja('#8a5c37','#5f4840'),
  teja('#7a4630','#54301f'),teja(C.teja,'#4d3728'),teja('#96603a','#63402a')];
 TEJADOS.pizarra=[pizarra('#585665','#3f3d4a'),pizarra('#4e545c','#383d44'),
  pizarra('#615d69','#46434e'),pizarra('#4a5460','#353d47')];
 TEJADOS.azotea=[grava('#5c5a63','#4a4850'),grava('#63615a','#4e4c46'),
  grava('#55524b','#423f3a'),grava('#4a5257','#3a4145'),grava('#6b6052','#524839')];
 TEJADOS.nave=[chapa('#7d8a90','#66727a'),sierra('#8a949a','#6d787f','#a8c4d0'),

  chapa('#6d7883','#57616b')];
 /* Un índice plano: el mapa de tejados guarda un número por casilla y no puede permitirse
    una tupla por edificio. */
 TILE.tejados=[];
 for(const fam of Object.keys(TEJADOS)){
  TEJADO_DE[fam]=[TILE.tejados.length,TEJADOS[fam].length];
  for(const t of TEJADOS[fam]){FAM_DE[TILE.tejados.length]=fam;TILE.tejados.push(t);}}
 generarInteriores();
}
/* Ningún tile puede tener un hueco: por un agujero se ve el negro del fondo y sale una
   rejilla de puntos por toda la ciudad. El mobiliario, que sí lleva transparencia, ya no
   es un tile — son piezas de interior, y van por su cuenta (ver ARTE DE INTERIOR). */

/*═══════════════ VEHÍCULOS ═══════════════*/
/* Las medidas salen de las de verdad, no de lo que quedaba bonito. La escala del mapa es
   1 casilla = 32 px = 5,16 m, o sea 0,161 m por píxel, y todo lo vivo y lo rodante va a una
   sola sobreescala, **×2,1**: es la más pequeña con la que un personaje sigue siendo
   dibujable —a escala real unos hombros son 3 px— y aplicarla igual a todos es lo que hace
   que la calle deje de contradecirse. Antes cada chasis iba por libre: el utilitario a
   ×1,32, la moto a ×1,54 y el autobús a ×0,75, más corto que una ambulancia.
   Así que un utilitario mide 3,9 m de verdad y 52 px en pantalla, y un autobús 12 m y 156.
   Si tocas uno, sácalo de su medida real: largo_en_metros × 2,1 / 0,161, redondeado a par. */
const CHASIS={
 utilitario:{l:52,an:22,morro:7,cabina:[15,18]},
 berlina:{l:60,an:24,morro:9,cabina:[19,19]},
 ranchera:{l:64,an:24,morro:10,cabina:[18,29]},
 furgoCorta:{l:66,an:26,morro:9,cabina:[15,15],caja:[31,28]},
 furgoLarga:{l:78,an:26,morro:9,cabina:[14,14],caja:[30,43]},
 deportivo:{l:58,an:24,morro:12,cabina:[21,17]},
 todoterreno:{l:60,an:26,morro:8,cabina:[17,25],alto:1},
 taxi:{l:60,an:24,morro:9,cabina:[19,19],taxi:1},
 patrulla:{l:60,an:24,morro:9,cabina:[19,19],rotativo:1},
 ambulancia:{l:72,an:28,morro:8,cabina:[13,13],caja:[26,43],rotativo:1,cruz:1},
 basura:{l:98,an:34,morro:11,cabina:[17,19],caja:[38,55]},
 autobus:{l:156,an:34,morro:8,cabina:[17,128],bus:1},
 camionObra:{l:92,an:34,morro:12,cabina:[18,20],volquete:1},
 /* Lo que faltaba por la calle: dos ruedas, los bomberos, la grúa municipal, el microbús
    de barrio y el furgón de la Ertzaintza. */
 moto:{l:28,an:10,morro:4,cabina:[10,7],moto:1},
 bomberos:{l:104,an:34,morro:10,cabina:[19,25],caja:[46,50],rotativo:1,escalera:1},
 grua:{l:86,an:30,morro:10,cabina:[16,20],caja:[37,31],brazo:1},
 microbus:{l:92,an:30,morro:9,cabina:[13,70],bus:1},
 furgonPoli:{l:72,an:26,morro:8,cabina:[13,13],caja:[26,39],rotativo:1,rejilla:1},
};
const LIBREAS=[['#c23b22','#952914','#e05b3c'],['#3f6f8f','#2f5469','#5b93b5'],
 ['#8f8f3f','#6e6e2f','#b3b35b'],['#3f8f6f','#2f6c53','#5bb392'],['#8f5f3f','#6c472f','#b37f5b'],
 ['#c9c9c9','#9d9d9d','#eaeaea'],['#2f3f4f','#22303c','#48606f']];
function dibVeh(tipo,lib,estado){
 const K=CHASIS[tipo],c=lienzo(K.l+6,K.an+6),g=c.getContext('2d');
 const ox=3,oy=3,L=K.l,AN=K.an;
 let base=lib[0],osc=lib[1],cl=lib[2];
 if(estado==='quemado'){base='#2a2622';osc='#191612';cl='#3a352f';}
 /* La moto no es un coche estrecho: no tiene morro, ni cabina, ni cuatro ruedas. Se
    dibuja aparte y se acabó. */
 if(K.moto){
  P(g,ox+2,oy+2,L-4,AN-4,C.negro);
  P(g,ox+3,oy+3,L-6,AN-6,base);P(g,ox+3,oy+3,L-6,1,cl);
  P(g,ox+L-9,oy+3,4,AN-6,osc);

  P(g,ox+9,oy+1,7,AN-2,C.carbon);                    /* el que va encima */
  P(g,ox+10,oy+2,5,3,C.piel2);
  P(g,ox+L-5,oy+AN/2-2,3,3,'#e8dfa8');
  return cuantizar(c);}
 P(g,ox,oy+1,L,AN-2,C.negro);
 /* Los remates iban en píxeles absolutos —faros de 3, ruedas de 6, ventanillas de 3— y
    con la escala vieja colaban. Sobre un autobús de 156 px se quedan de juguete, así que
    van al doble: una rueda mide 0,65 m de verdad, que a ×2,1 son 8 px, no 3. */
 P(g,ox+1,oy+1,L-2,AN-2,base);P(g,ox+1,oy+1,L-2,3,cl);P(g,ox+1,oy+AN-4,L-2,3,osc);
 P(g,ox+2,oy+3,K.morro,AN-6,cl);
 const[cxp,cw]=K.cabina;
 P(g,ox+cxp,oy+3,cw,AN-6,C.carbon);
 P(g,ox+cxp+2,oy+5,5,AN-10,'#3f5566');P(g,ox+cxp+cw-6,oy+5,4,AN-10,'#31424f');
 if(K.caja){const[bx,bw]=K.caja;P(g,ox+bx,oy+2,bw,AN-4,cl);P(g,ox+bx+2,oy+4,bw-4,AN-8,base);}
 if(K.bus)for(let i=16;i<L-12;i+=15)P(g,ox+i,oy+3,9,3,'#3f5566');
 if(K.volquete)P(g,ox+cxp+cw,oy+2,L-cxp-cw-2,AN-4,C.mostazaO);
 /* Un faro mide 60×25 cm: a ×2,1 son 8 de ancho por 3 de alto, y visto desde arriba lo
    que asoma es una tira, no un cuadrado. Con los 5×5 de antes el coche parecía llevar
    cuatro paneles blancos atornillados en las esquinas. */
 P(g,ox+L-6,oy+4,4,3,'#e8dfa8');P(g,ox+L-6,oy+AN-7,4,3,'#e8dfa8');
 P(g,ox+2,oy+4,3,3,C.crema);P(g,ox+2,oy+AN-7,3,3,C.crema);
 const rw=K.alto?6:5;
 P(g,ox+8,oy-2,10,rw,C.negro);P(g,ox+L-18,oy-2,10,rw,C.negro);
 P(g,ox+8,oy+AN-3,10,rw,C.negro);P(g,ox+L-18,oy+AN-3,10,rw,C.negro);
 if(K.taxi){P(g,ox+cxp+4,oy-2,10,5,C.mostaza);
  for(let i=0;i<L-14;i+=8)P(g,ox+4+i,oy+AN/2-2,4,4,C.carbon);}
 if(K.rotativo){P(g,ox+cxp,oy+1,5,AN-2,estado==='rotA'?'#2f6bff':C.gris);
  P(g,ox+cxp+5,oy+1,5,AN-2,estado==='rotA'?C.gris:'#ff3b30');}

const ICO={};
/* Un icono se mira a 24 píxeles y sobre fondos de cualquier color: la caja del HUD, la
   fila oscura del móvil, el marco claro de la tienda. Sin un contorno alrededor, la mitad
   de ellos se pierden contra el fondo. Se pone aquí, una vez, y no en cada dibujo. */
function contorno(c,col){
 const g=c.getContext('2d'),w=c.width,h=c.height;
 const src=g.getImageData(0,0,w,h).data;
 const out=g.createImageData(w,h),o=out.data;
 const hay=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&src[(y*w+x)*4+3]>0;
 const rgb=[parseInt(col.slice(1,3),16),parseInt(col.slice(3,5),16),parseInt(col.slice(5,7),16)];
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){
  const i=(y*w+x)*4;
  if(src[i+3]>0){o[i]=src[i];o[i+1]=src[i+1];o[i+2]=src[i+2];o[i+3]=255;continue;}
  let v=false;
  for(let dy=-1;dy<=1&&!v;dy++)for(let dx=-1;dx<=1&&!v;dx++)if(hay(x+dx,y+dy))v=true;
  if(v){o[i]=rgb[0];o[i+1]=rgb[1];o[i+2]=rgb[2];o[i+3]=255;}}
 g.putImageData(out,0,0);return c;}
/* Rellenar con un color transparente no borra nada: pinta cero píxeles. Para abrir un
   hueco en algo ya dibujado —el ojo de una llave— hace falta borrar de verdad. */
const hueco=(g,x,y,w,h)=>g.clearRect(x|0,y|0,w|0,h|0);
function I24(fn){const c=lienzo(24,24),g=c.getContext('2d');fn(g);return cuantizar(contorno(c,C.negro));}

/* Los menús son HTML, así que el icono entra como imagen. Se guarda hecho: convertir un
   lienzo a data-URL en cada repintado del móvil se nota al desplazar la lista. */
const _icoURL={};
function icoImg(k,tam){
 if(!_icoURL[k]){const c=ICO[k];if(!c)return '';_icoURL[k]=c.toDataURL();}
 return `<img class="pix" src="${_icoURL[k]}" width="${tam||24}" height="${tam||24}" alt="">`;}

/*═══════════════ BILBAO ═══════════════*/
/* La planta ya no se inventa. Sale del plano municipal, que es vectorial: las manzanas
   vienen como polígonos con su relleno y la calzada como trazos con el ancho real de
   cada calle — un callejón del Casco Viejo y la Gran Vía son la misma línea con distinto
   grosor. herramientas/plano/extraer.py separa esas dos capas, las pasa a casillas y
   deja el resultado ahí arriba comprimido.

   Lo que se dibuja son las calles de Bilbao, no unas calles verosímiles: la retícula del
   Ensanche, la diagonal de la Gran Vía, la elipse de Moyúa, el meandro de Deusto, las
   revueltas de Artxanda y las autopistas cruzando el monte. Por eso este archivo ya no
   trae ni corredores, ni semillas, ni una malla que estampar. */
const map=new Uint8Array(MW*MH);
const roof=new Uint8Array(MW*MH);
const barrioDe=new Uint8Array(MW*MH);
function pon(x,y,t){if(x>=0&&y>=0&&x<MW&&y<MH)map[y*MW+x]=t;}
const distDe=(x,y)=>BARRIOS[barrioDe[clamp(y|0,0,MH-1)*MW+clamp(x|0,0,MW-1)]]||BARRIOS[0];

/* Deflate crudo, sin cabecera: lo descomprime el navegador con DecompressionStream y
   C# con DeflateStream, los mismos bytes en los dos sitios y sin biblioteca en ninguno.
   Sin comprimir, una casilla por byte, serían 1,1 MB metidos en este archivo. */
async function inflar(b64){
 const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
 const r=new Response(new Blob([bin]).stream()
  .pipeThrough(new DecompressionStream('deflate-raw')));
 return new Uint8Array(await r.arrayBuffer());}

async function cargarCiudad(){
 map.set(await inflar(TRAMA));
 barrioDe.set(await inflar(TRAMA_BARRIO));
 ciudadLista=true;_mb=null;
 /* Un tejado por edificio contiguo, y el tejado lo deciden el barrio y el tamaño. El
    plano ya distingue las manzanas; esto es lo que hace que además se noten desde el
    aire. Hay que recorrer el edificio entero antes de elegir, porque hasta que no se
    acaba no se sabe si es una casa o una nave. */
 roof.fill(0);
 const visto=new Uint8Array(MW*MH),celdas=[];
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  if(map[y*MW+x]!==EDIF||visto[y*MW+x])continue;
  celdas.length=0;
  const pila=[y*MW+x];visto[y*MW+x]=1;
  while(pila.length){const i=pila.pop();celdas.push(i);
   const cx=i%MW,cy=(i/MW)|0;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const j=ny*MW+nx;
    if(map[j]===EDIF&&!visto[j]){visto[j]=1;pila.push(j);}}}
  /* El tamaño es del edificio entero —eso decide si es una casa o una nave— pero el
     material lo pone el barrio de cada casilla, no el del rincón por el que empezó el
     recorrido: la manzana del Casco Viejo son 6366 casillas y cruza a Abando, así que
     tomando el estilo del origen el casco entero salía de pizarra.

     Y la variante cambia por parches, que con un solo tile una manzana así es una plancha
     lisa; por parches se lee lo que es, muchas casas pegadas. */
  const n=celdas.length;
  for(const i of celdas){
   const est=(BARRIOS[barrioDe[i]]||BARRIOS[0]).estilo;
   const[base,cuantas]=TEJADO_DE[familiaTejado(est,n)];
   roof[i]=base+hash(((i%MW)/PARCHE)|0,((i/MW)/PARCHE)|0)%cuantas;}}
 clasificarSuelos();
 /* borde cerrado: fuera del término municipal no hay nada que visitar */
 for(let x=0;x<MW;x++){pon(x,0,EDIF);pon(x,MH-1,EDIF);}
 for(let y=0;y<MH;y++){pon(0,y,EDIF);pon(MW-1,y,EDIF);}
}
/* Del plano salen siete cosas: calzada, acera, manzana, parque, agua, puente y monte. La
   ciudad tiene más, y el juego tenía el arte hecho —muelle, patio y plaza, con sus tiles y
   sus grúas— sin una sola casilla donde ponerlo: arte muerto y Zorrotzaurre de césped.

   Esto no inventa geometría, no mueve una casilla: le pone nombre a la que ya hay, que es
   lo que decide con qué se pinta y qué se le planta encima. Las tres preguntas se contestan
   con la propia trama, así que la ciudad sigue saliendo igual en cada partida. */
function clasificarSuelos(){
 const n=MW*MH, cuenta={muelle:0,patio:0,plaza:0};
 /* 1 · El muelle es la orilla de trabajo: acera pegada al agua en barrio industrial
    —Zorrotza, Olabeaga, Bolueta—. Tres condiciones a la vez, y cada una quita algo: la
    orilla de Abandoibarra también toca el agua y no es muelle sino paseo, así que manda el
    barrio; y el césped de la ladera de Olabeaga tampoco es muelle aunque llegue al agua,
    así que solo cuenta lo que ya estaba pavimentado. */
 const dAgua=new Uint8Array(n).fill(255);
 let cola=[];
 for(let i=0;i<n;i++)if(map[i]===AGUA){dAgua[i]=0;cola.push(i);}
 for(let d=0;d<2;d++){
  const sig=[];
  for(const i of cola){const x=i%MW,y=(i/MW)|0;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const j=ny*MW+nx;if(dAgua[j]!==255)continue;
    dAgua[j]=d+1;sig.push(j);}}
  cola=sig;}
 cola=[];
 for(let i=0;i<n;i++){
  if(dAgua[i]>2||map[i]!==ACERA)continue;
  if((BARRIOS[barrioDe[i]]||BARRIOS[0]).estilo!=='industrial')continue;
  map[i]=MUELLE;cuenta.muelle++;cola.push(i);}
 /* Y el muelle no es la línea del borde: es la explanada. Desde la orilla tira tres
    casillas —quince metros— tierra adentro por lo que ya estuviera pavimentado, que es
    donde caben la grúa, los contenedores y el camión que viene a cargar. */
 for(let d=0;d<3&&cola.length;d++){
  const sig=[];
  for(const i of cola){const x=i%MW,y=(i/MW)|0;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
    const j=ny*MW+nx;
    if(map[j]!==ACERA)continue;
    if((BARRIOS[barrioDe[j]]||BARRIOS[0]).estilo!=='industrial')continue;
    map[j]=MUELLE;cuenta.muelle++;sig.push(j);}}
  cola=sig;}
 /* 2 · El patio de manzana es el hueco que queda dentro de una manzana y no toca la calle.
    Se busca al revés: trozos de suelo pisable cerrados por edificio, sin salida a calzada
    ni al borde del mapa, y pequeños — si mide más de trescientas casillas (ocho mil metros
    cuadrados) no es un patio, es un parque al que se llega por otro lado. */
 const visto=new Uint8Array(n);
 const trozo=[];
 for(let i0=0;i0<n;i0++){
  const t0=map[i0];
  if(visto[i0]||t0!==ACERA&&t0!==PARQUE)continue;
  trozo.length=0;let abierto=false;
  const pila=[i0];visto[i0]=1;
  while(pila.length){
   const i=pila.pop();trozo.push(i);
   const x=i%MW,y=(i/MW)|0;
   if(x===0||y===0||x===MW-1||y===MH-1)abierto=true;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const j=ny*MW+nx,tj=map[j];
    if(tj===ROAD||tj===PUENTE||tj===MONTE||tj===VIA||tj===AGUA){abierto=true;continue;}
    if(visto[j]||tj!==ACERA&&tj!==PARQUE)continue;
    visto[j]=1;pila.push(j);}}
  if(abierto||trozo.length>300)continue;
  for(const i of trozo){map[i]=PATIO;cuenta.patio++;}}
 /* 3 · La plaza es la acera que se ensancha tanto que deja de ser acera: Moyúa, el
    Arriaga, la Plaza Nueva. Se mide por holgura —cuánto hay hasta lo primero que no es
    acera— y no por superficie: una acera larguísima de la Gran Vía sigue siendo una acera.
    Núcleo a partir de tres casillas de holgura (15 m), y de ahí se extiende por lo que
    tenga dos, que es el borde de la plaza. */
 const holg=new Uint8Array(n);
 cola=[];
 for(let i=0;i<n;i++)if(map[i]!==ACERA){holg[i]=0;cola.push(i);}
 for(let d=0;d<4&&cola.length;d++){
  const sig=[];
  for(const i of cola){const x=i%MW,y=(i/MW)|0;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const j=ny*MW+nx;if(holg[j]||map[j]!==ACERA)continue;
    holg[j]=d+1;sig.push(j);}}
  cola=sig;}
 cola=[];
 for(let i=0;i<n;i++)if(holg[i]>=3){map[i]=PLAZA;cuenta.plaza++;cola.push(i);}
 while(cola.length){
  const sig=[];
  for(const i of cola){const x=i%MW,y=(i/MW)|0;
   for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const j=ny*MW+nx;
    if(map[j]!==ACERA||holg[j]<2)continue;
    map[j]=PLAZA;cuenta.plaza++;sig.push(j);}}
  cola=sig;}
 return cuenta;}
/* La plaza no sale midiendo el ancho de la acera: en el plano ninguna pasa de una casilla
   de holgura, ni la del Arenal. Pero el callejero sí lo sabe —setenta y siete de las 513
   calles se llaman «Plaza …»—, así que lo que hace plaza a una casilla es su nombre, que es
   un dato del plano y no una corazonada. Se toma la acera de esas calles y se extiende dos
   casillas por acera contigua: el rótulo cae por el centro y el borde de la plaza es la
   misma piedra. Va después de nombrarCalles, que es quien reparte los nombres. */
function clasificarNombres(){
 const cuenta={plaza:0,muelle:0};
 /* El nombre dice de qué es la casilla: setenta y siete calles se llaman «Plaza …» y nueve
    «Muelle …» —Olabeaga, Ibeni, Evaristo Churruca, Ramón de la Sota—. Se toma su acera y se
    extiende por acera contigua: el rótulo cae por el centro y el borde es la misma piedra.
    La plaza crece dos casillas y el muelle tres, que una explanada de carga es más ancha
    que el corro de un quiosco. */
 const marca=(re,tipo,pasos,llave)=>{
  const suyas=new Uint8Array(CALLES.length);
  for(let k=0;k<CALLES.length;k++)if(re.test(CALLES[k].n))suyas[k]=1;
  let cola=[];
  for(let i=0;i<map.length;i++){
   const c=calleDe[i];
   if(!c||!suyas[c-1]||map[i]!==ACERA)continue;
   map[i]=tipo;cuenta[llave]++;cola.push(i);}
  for(let d=0;d<pasos&&cola.length;d++){
   const sig=[];
   for(const i of cola){const x=i%MW,y=(i/MW)|0;
    for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
     const nx=x+dx,ny=y+dy;if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
     const j=ny*MW+nx;if(map[j]!==ACERA)continue;
     map[j]=tipo;cuenta[llave]++;sig.push(j);}}
   cola=sig;}};
 marca(/^(plaza|plazuela)\b/i,PLAZA,2,'plaza');
 marca(/^muelle\b/i,MUELLE,3,'muelle');
 _mb=null;                       /* el radar cachea el mapa: si no, se queda con el de antes */
 return cuenta;}
/* Qué sombrero le toca a un edificio. El tamaño manda sobre el estilo cuando el edificio
   es claramente otra cosa: una nave de sesenta casillas en un barrio de bloques sigue
   siendo una nave, y un bajo de cuatro casillas en el Ensanche no lleva mansarda. */
/* De qué familia es un índice del atlas de tejados. Se pregunta por casilla al dibujar,
   así que se resuelve con una tabla y no recorriendo nada. */
const FAM_DE=[];
function famDe(idx){return FAM_DE[idx]||'azotea';}
/* Los umbrales salen de medir el plano, no de suponer: la mediana de una manzana son 44
   casillas, el percentil 90 son 220 y el Casco Viejo entero es una sola pieza de 6366.
   La primera versión daba «nave» a partir de 90 y salió media Bilbao de chapa. */
function familiaTejado(estilo,celdas){
 if(estilo==='industrial')return celdas>=110?'nave':'azotea';
 /* El barrio manda antes que el tamaño donde se vive: el Casco Viejo entero es una sola
    pieza de 6366 casillas, y con la regla del tamaño por delante salía de chapa
    ondulada. Lo grande solo se vuelve nave donde puede haberla. */
 if(estilo==='denso')return 'teja';
 if(estilo==='senorial')return celdas>=70?'pizarra':'teja';
 if(celdas>=900)return 'nave';                  /* cocheras, lonjas, recintos feriales */
 if(estilo==='bloques')return celdas>=45?'azotea':'teja';
 return celdas>=90?'azotea':'teja';}
const Tc=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?EDIF:map[y*MW+x];
const rodable=(x,y)=>{const t=Tc(x,y);return t===ROAD||t===PUENTE||t===MUELLE;};
const andable=t=>t!==EDIF&&t!==AGUA;
function buscar(cond,cx,cy,rad){
 for(let i=0;i<900;i++){
  const x=cx===undefined?rndi(2,MW-3):clamp(cx+rndi(-rad,rad),2,MW-3);
  const y=cy===undefined?rndi(2,MH-3):clamp(cy+rndi(-rad,rad),2,MH-3);
  if(cond(x,y))return{x:x+.5,y:y+.5};}
 return{x:MW/2,y:MH/2};}
const puntoAcera=(cx,cy,r)=>buscar((x,y)=>{const t=Tc(x,y);return t===ACERA||t===PLAZA;},cx,cy,r||40);
/* para portales y comercios: acera con fachada detrás, no un descampado */
/* Los sitios reales quieren la casilla válida MÁS CERCANA a su punto del plano, no una
   cualquiera del vecindario: cuando las coordenadas eran una pista daba igual, pero
   ahora son las de verdad y correr la catedral doscientos metros la saca del Casco
   Viejo. Se busca en espiral desde el punto exacto hacia fuera. */
function cercaDe(cond,cx,cy,rmax){
 cx=clamp(cx|0,1,MW-2);cy=clamp(cy|0,1,MH-2);
 if(cond(cx,cy))return{x:cx+.5,y:cy+.5};
 let mx=-1,my=-1,mejor=Infinity;
 /* Los anillos son cuadrados, así que la esquina de uno queda más lejos que el centro
    del lado del siguiente: por eso no vale quedarse con el primero que aparezca. Se
    sigue mirando mientras el anillo pueda mejorar lo encontrado — ninguna casilla del
    anillo r está a menos de r — y se elige por distancia de verdad. */
 for(let r=1;r<=(rmax||60)&&r<mejor;r++)
  for(let d=-r;d<=r;d++)
   for(const[x,y]of[[cx+d,cy-r],[cx+d,cy+r],[cx-r,cy+d],[cx+r,cy+d]]){
    if(x<1||y<1||x>=MW-1||y>=MH-1)continue;
    const q=Math.hypot(x-cx,y-cy);
    if(q<mejor&&cond(x,y)){mejor=q;mx=x;my=y;}}
 return mx<0?{x:cx+.5,y:cy+.5}:{x:mx+.5,y:my+.5};}
const puntoPortal=(cx,cy,r,z)=>cercaDe((x,y)=>{
 if(Tc(x,y)!==ACERA)return false;
 if(z&&distDe(x,y).n!==z)return false;
 let fach=0,calle=0;
 for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
  const t=Tc(x+dx,y+dy);if(t===EDIF)fach++;if(t===ROAD)calle++;}
 return fach>0&&calle>0;},cx,cy,r||60);
/* para los monumentos basta con estar en el barrio correcto y pisable */
const puntoZona=(cx,cy,r,z)=>cercaDe((x,y)=>{
 const t=Tc(x,y);
 if(!andable(t)||t===MONTE)return false;
 return !z||distDe(x,y).n===z;},cx,cy,r||60);

/*═══════════════ LA CALLE: BORDILLO, PASOS Y MOBILIARIO ═══════════════*/
/* El mobiliario iba sembrado por hash sobre cualquier acera: una farola cada 29 casillas
   —150 m, y en Bilbao hay una cada 25— caída en mitad del ancho, un semáforo en medio de
   una recta y ni un paso de cebra en toda la ciudad (los dos tiles estaban forjados y no
   los usaba nadie). Una calle no es una acera con cosas repartidas: es un bordillo con
   todo alineado encima, cruces donde se cruza y el barrio decidiendo qué hay.

   Se calcula una vez al cargar la ciudad y se guarda un byte por casilla, como los
   tejados: siete kilómetros de calle no se pueden resolver por fotograma. */
const MOB=new Uint8Array(MW*MH);
const M_FAROLA=1,M_CONT=2,M_CONT2=3,M_BANCO=4,M_PAPELERA=5,M_SEMAFORO=6,M_ARBOL=7,
      M_TERRAZA=8,M_MARQUESINA=9,M_BOLARDO=10,M_CABINA=11,
      M_BUZON=12,M_PARQUIMETRO=13,M_SENAL=14,M_HIDRANTE=15,M_JARDINERA=16,M_SETO=17,
      M_BICIS=18,M_VIDRIO=19,M_PAPEL=20,M_BOCAMETRO=21,M_QUIOSCO=22,M_MOTO=23,M_BICI=24,
      M_FAROLA_CASCO=25,
      /* La obra: tres casillas seguidas del bordillo —el andamio contra la fachada, la
         valla que corta el paso y el cono en el canto—. Bilbao siempre tiene una calle
         levantada; hasta ahora las tres piezas se forjaban y no se plantaban nunca. */
      M_ANDAMIO=26,M_VALLA=27,M_CONO=28,
      /* El toldo del comercio y la placa de la calle, que van pegados al sitio. */
      M_TOLDO=29,M_PLACA=30,
      /* Los pasos de cebra no son un mueble: son suelo pintado, y por eso van aparte y
         arriba del todo. Estaban en el 20 y el 21, pegados a la lista de muebles, y al
         crecer el atrezzo la primera pieza nueva se habría dibujado como un paso. */
      M_CEBRA_V=200,M_CEBRA_H=201,
      /* Marca vial: la línea de detención y la plaza de aparcamiento, cada una con el lado
         al que mira (0 arriba, 1 abajo, 2 izquierda, 3 derecha). También son suelo pintado. */
      M_STOP=202,M_APARCA=206,M_FLECHA=210;
const esCebra=mb=>mb===M_CEBRA_V||mb===M_CEBRA_H;
const esPintura=mb=>mb>=200;
/* Qué pieza es cada código. Estaba solo dentro del switch de dibujo, así que nadie más
   podía saber qué hay plantado en una casilla ni cuánto mide. */
const MOB_PIEZA={[M_FAROLA]:'farola',[M_SEMAFORO]:'semaforo',[M_ARBOL]:'arbolPodado',
 [M_BOLARDO]:'bolardo',[M_CONT]:'contenedor',[M_CONT2]:'contenedor2',[M_PAPELERA]:'papelera',
 [M_BANCO]:'banco',[M_CABINA]:'cabina',[M_MARQUESINA]:'marquesina',[M_TERRAZA]:'terraza',
 [M_BUZON]:'buzon',[M_PARQUIMETRO]:'parquimetro',[M_SENAL]:'senal',[M_HIDRANTE]:'hidrante',
 [M_JARDINERA]:'jardinera',[M_SETO]:'seto',[M_BICIS]:'aparcabicis',[M_VIDRIO]:'contVidrio',
 [M_PAPEL]:'contPapel',[M_BOCAMETRO]:'bocaMetro',[M_QUIOSCO]:'quiosco',[M_MOTO]:'moto',
 [M_BICI]:'bici',[M_FAROLA_CASCO]:'farolaCasco',
 [M_ANDAMIO]:'andamio',[M_VALLA]:'valla',[M_CONO]:'cono',[M_TOLDO]:'toldo',[M_PLACA]:'placa'};
/* Lo que se siembra fuera de la acera, y cada cuánto. Iba metido en el bucle de dibujo con
   sus desplazamientos a mano: ni se podía comprobar ni se podía mover sin tocar el render.
   Gana la primera que case, que es como estaba la cadena de condiciones. */
const SIEMBRA={
 /* Un parque no es césped con árboles: es donde está el columpio, el tobogán, el arenero
    y la fuente de beber. Van antes que el árbol en la lista porque el árbol se lleva una
    de cada cuatro casillas y si no, no saldría ninguno. */
 [PARQUE]:[[53,'columpio'],[59,'tobogan'],[67,'arenero'],[71,'porteria'],[37,'fuenteBeber'],
           [4,'arbol'],[19,'matorral'],[23,'banco'],[43,'papelera']],
 /* El monte es el 39% del mapa —Artxanda, Pagasarri, las laderas— y estaba pelado: verde
    con manchas y ni un árbol. El puerto de Unity sí los planta; el prototipo no, y el
    prototipo es el que manda. Uno de cada cuatro casillas son diez metros entre árboles. */
 [MONTE]: [[4,'pino'],[9,'matorral'],[13,'arbol']],
 /* La plaza tiene lo que tiene una plaza de Bilbao: fuente, quiosco de prensa, el reloj,
    la estatua de alguien y bancos alrededor. Lo raro va primero, que si no se lo come el
    arbolado. */
 [PLAZA]: [[97,'fuente'],[89,'estatua'],[83,'reloj'],[151,'quiosco'],[59,'jardinera'],
           [23,'arbolPodado'],[31,'banco'],[41,'papelera']],
 /* El muelle es sitio de trabajo: grúa, contenedores apilados, palés, bidones, la
    hormigonera y el noray donde se amarra. */
 [MUELLE]:[[29,'grua'],[37,'pilaCont'],[17,'contMaritimo'],[13,'pales'],[11,'bidon'],
           [23,'hormigonera'],[31,'escombros'],[43,'contObra'],[7,'noray']],
 /* El patio de manzana: trastos, el tendedero, la bici del vecino y el contenedor. */
 [PATIO]: [[13,'trastos'],[19,'contenedor'],[29,'tendedero'],[17,'bici'],
           [7,'arbolPodado'],[9,'pales']],
};
const SIEMBRA_TEJADO={
 teja:   [[23,'chimenea'],[71,'antenaTv']],
 pizarra:[[23,'chimenea'],[71,'antenaTv']],
 azotea: [[37,'deposito'],[41,'tendedero'],[43,'climatizador'],[47,'caseta'],[53,'antenaTv']],
 nave:   [[29,'lucernario']],
};
/* Ley 6 · lo que tapa. Un objeto no ocupa solo suelo: ocupa vista. De ahí dos topes.
   Uno de sitio: en una acera de dos metros y medio no cabe una grúa de doce, y una acera
   con algo de más de cuatro metros deja de ser una acera y pasa a ser un muro. Otro de
   figura: lo que pasa de dos metros es más alto que quien anda por delante, así que puede
   esconderlo entero — y cuando eso pasa, al jugador se le pinta la silueta encima, que
   perderse a uno mismo detrás de un plátano de sombra no es dificultad, es un fallo. */
const ALTO_TAPA=2.0;
/* El monte admite ocho metros porque ahí hay pinos de verdad; en un parque urbano el
   arbolado está podado y no pasa de seis. */
const TOPE_ALTO={[ACERA]:4,[PLAZA]:4,[PARQUE]:6,[MONTE]:8,[PATIO]:6,[MUELLE]:12,[EDIF]:2.4};
function colocarCalle(){
 MOB.fill(0);
 const pisable=(x,y)=>{const t=Tc(x,y);return t===ACERA||t===PLAZA;};
 const rueda=(x,y)=>Tc(x,y)===ROAD;
 /* 1 · Los pasos de cebra van en la bocacalle, y se encuentran solos: en mitad de una
    calle la acera acompaña a los dos lados, y justo en el cruce se interrumpe. Ahí es
    donde cruza la gente. Las bandas van paralelas al tráfico, que es como se pintan. */
 let cruces=0;
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
  if(!rueda(x,y))continue;
  const eo=pisable(x-1,y)&&pisable(x+1,y), ns=pisable(x,y-1)&&pisable(x,y+1);
  if(eo&&!ns){
   if(!pisable(x-1,y-1)||!pisable(x+1,y-1)||!pisable(x-1,y+1)||!pisable(x+1,y+1)){
    MOB[y*MW+x]=M_CEBRA_V;cruces++;}}
  else if(ns&&!eo){
   if(!pisable(x-1,y-1)||!pisable(x-1,y+1)||!pisable(x+1,y-1)||!pisable(x+1,y+1)){
    MOB[y*MW+x]=M_CEBRA_H;cruces++;}}}
 /* 1 bis · Donde hay paso, hay línea de detención: el coche para antes de la cebra, no
    encima. Y a lo largo de la calle, donde el bordillo acompaña y no hay cruce, la plaza de
    aparcamiento — una casilla, 5,16 m, justo un coche. */
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
  const i=y*MW+x;
  if(map[i]!==ROAD||MOB[i])continue;
  const lados=[[0,0,-1],[1,0,1],[2,-1,0],[3,1,0]];
  let puesto=false;
  for(const[lado,dx,dy]of lados){
   const v=MOB[(y+dy)*MW+x+dx];
   /* La cebra vertical cruza una calle que va de norte a sur: se para por arriba y por
      abajo. La horizontal, al revés. */
   if(v===M_CEBRA_V&&dx===0||v===M_CEBRA_H&&dy===0){MOB[i]=M_STOP+lado;puesto=true;break;}}
  if(puesto)continue;
  /* Aparcar solo donde la calle sigue recta: en una bocacalle no se aparca, y de cada tres
     plazas se deja una sin marcar —vados, contenedores, la parada del bus—. */
  if(hash(x,y)%3===0)continue;
  for(const[lado,dx,dy]of lados){
   const j=(y+dy)*MW+x+dx,t2=map[j];
   if(t2!==ACERA&&t2!==PLAZA&&t2!==MUELLE)continue;
   const largo=(dx===0)?(rueda(x-1,y)&&rueda(x+1,y)):(rueda(x,y-1)&&rueda(x,y+1));
   if(!largo)continue;
   MOB[i]=M_APARCA+lado;break;}}
 /* 1 ter · La flecha de carril, antes del cruce y en el sentido de la marcha. Un cruce es
    una casilla de calzada con salida por tres lados o más; la flecha va en la casilla de
    antes, que es donde se pinta de verdad. */
 const cruceCalle=(x,y)=>{
  if(!rueda(x,y))return false;
  let n=0;
  if(rueda(x+1,y))n++;if(rueda(x-1,y))n++;if(rueda(x,y+1))n++;if(rueda(x,y-1))n++;
  return n>=3;};
 for(let y=2;y<MH-2;y++)for(let x=2;x<MW-2;x++){
  const i=y*MW+x;
  if(map[i]!==ROAD||MOB[i]||hash(x,y)%3)continue;
  for(const[lado,dx,dy]of[[0,0,-1],[1,0,1],[2,-1,0],[3,1,0]]){
   if(!cruceCalle(x+dx,y+dy))continue;
   /* Y solo en el cruce que tiene paso: la flecha se pinta donde el tráfico se ordena, no
      en cada bocacalle de las siete mil que tiene Bilbao. */
   const j=(y+dy)*MW+x+dx;
   if(!esCebra(MOB[j-1])&&!esCebra(MOB[j+1])&&!esCebra(MOB[j-MW])&&!esCebra(MOB[j+MW]))continue;
   /* Y solo si por detrás sigue habiendo calle: una flecha en una casilla suelta no
      señala nada. */
   if(!rueda(x-dx,y-dy))continue;
   MOB[i]=M_FLECHA+lado;break;}}
 /* 2 · Todo lo demás va en la fila del bordillo —la acera que toca calzada— y a paso
    fijo a lo largo de la calle, no al azar: una farola cada cinco casillas son 26 m, y
    un árbol de alineación cada cuatro son 21. Lo que hay lo decide el barrio: el Casco
    no tiene arbolado y sí bolardos; el Ensanche, lo contrario. */
 for(let y=1;y<MH-1;y++)for(let x=1;x<MW-1;x++){
  const i=y*MW+x;
  if(map[i]!==ACERA)continue;
  const cN=rueda(x,y-1),cS=rueda(x,y+1),cE=rueda(x+1,y),cO=rueda(x-1,y);
  if(!(cN||cS||cE||cO))continue;
  /* El semáforo va en la esquina —acera que da a la calzada por dos lados— y solo si
     tiene un paso al lado. Puesto en cada acera que toca un cruce salían veinticuatro mil,
     uno cada cinco metros; y aun así no todos los cruces de Bilbao están semaforizados. */
  const esquina=(cN||cS)&&(cE||cO);
  if(esquina&&(esCebra(MOB[(y-1)*MW+x])||esCebra(MOB[(y+1)*MW+x])
     ||esCebra(MOB[y*MW+x+1])||esCebra(MOB[y*MW+x-1]))
     &&hash(x,y)%3===0){MOB[i]=M_SEMAFORO;continue;}
  const est=distDe(x,y).estilo;
  const l=(cE||cO)?y:x;                  /* el paso, a lo largo de la calle */
  const h=hash(x,y);
  /* El Casco no lleva la farola de aluminio de la Gran Vía: lleva la de fundición, más
     baja y con capitel. Es la misma cadencia, otra pieza. */
  if(l%4===0)MOB[i]=(est==='denso'?M_FAROLA_CASCO:M_FAROLA);
  else if((est==='senorial'||est==='abierto')&&l%4===2)MOB[i]=M_ARBOL;
  else if(est==='denso'&&l%3===1)MOB[i]=M_BOLARDO;
  else if(l%37<3)MOB[i]=(h%2?M_CONT:M_CONT2);   /* los contenedores van en batería */
  else if(l%9===4)MOB[i]=M_PAPELERA;
  else if((est==='senorial'||est==='abierto')&&l%13===6)MOB[i]=M_BANCO;
  else if(l%97===0)MOB[i]=M_CABINA;
  /* Y lo demás, que es lo que hace que una acera no sea una fila de farolas: el buzón, el
     parquímetro donde se aparca, la señal, el hidrante, los iglús del vidrio y del papel,
     el aparcabicis, la jardinera del Ensanche y el seto de los bloques. Cada uno con su
     paso a lo largo de la calle, así que salen repartidos y no en corro. */
  else if(l%53===7)MOB[i]=M_BUZON;
  else if((est==='senorial'||est==='denso')&&l%29===11)MOB[i]=M_PARQUIMETRO;
  else if(l%23===5)MOB[i]=M_SENAL;
  else if(l%61===13)MOB[i]=M_HIDRANTE;
  else if((est==='senorial'||est==='abierto')&&l%17===9)MOB[i]=M_JARDINERA;
  else if((est==='bloques'||est==='abierto')&&l%19===7)MOB[i]=M_SETO;
  else if(l%41===15)MOB[i]=M_BICIS;
  else if(l%31===12)MOB[i]=(h%2?M_VIDRIO:M_PAPEL);
  else if(l%149===0)MOB[i]=M_QUIOSCO;
  else if(l%73===33)MOB[i]=M_MOTO;
  else if(l%79===41)MOB[i]=M_BICI;
  /* La obra ocupa tres casillas seguidas, que es lo que ocupa de verdad: no se levanta
     una acera de cinco metros y se deja el andamio suelto en mitad. Una cada kilómetro. */
  else if(l%211===0)MOB[i]=M_ANDAMIO;
  else if(l%211===1)MOB[i]=M_VALLA;
  else if(l%211===2)MOB[i]=M_CONO;}
 /* 3 · La marquesina va donde para el bus, y la terraza delante de donde se bebe. */
 const bordillo=(x,y)=>map[y*MW+x]===ACERA&&
  (rueda(x+1,y)||rueda(x-1,y)||rueda(x,y+1)||rueda(x,y-1));
 for(const q of PARADAS){const x=q.p.x|0,y=q.p.y|0;
  if(bordillo(x,y))MOB[y*MW+x]=M_MARQUESINA;}
 /* Y la boca de metro donde está la estación. Once agujeros en la acera con su barandilla
    y su rótulo: hasta ahora el metro se cogía tocando una chincheta sobre una manzana. */
 for(const q of nodos('metro')){
  const x=q.p.x|0,y=q.p.y|0;
  for(let r=0;r<3;r++){let puesta=false;
   for(let dy=-r;dy<=r&&!puesta;dy++)for(let dx=-r;dx<=r;dx++){
    if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;
    const nx=x+dx,ny=y+dy;
    if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
    const j=ny*MW+nx;
    if(map[j]!==ACERA&&map[j]!==PLAZA)continue;
    MOB[j]=M_BOCAMETRO;puesta=true;break;}
   if(puesta)break;}}
 /* El toldo es del comercio, no del bar: lo que tiene escaparate a la calle. Y la placa
    de mármol con el nombre va en la fachada del edificio que lo merece, que son los trece
    singulares. Las dos piezas estaban forjadas y sin un sitio donde ponerse. */
 const pegar=(p,cod)=>{
  for(let d=-2;d<=2;d++)for(const[dx,dy]of[[d,1],[d,-1],[1,d],[-1,d]]){
   const x=(p.p.x|0)+dx,y=(p.p.y|0)+dy,i=y*MW+x;
   if(x<1||y<1||x>=MW-1||y>=MH-1)continue;
   if(bordillo(x,y)&&MOB[i]!==M_SEMAFORO&&!esPintura(MOB[i])&&MOB[i]!==M_TERRAZA){
    MOB[i]=cod;return true;}}
  return false;};
 for(const p of POI){
  if(p.int==='ropa'||p.int==='merca'||p.int==='almacenes'||p.int==='armeria'||p.int==='centro')pegar(p,M_TOLDO);
  if(PLANO_SINGULAR[p.id])pegar(p,M_PLACA);}
 for(const p of POI){
  if(p.int!=='bar'&&p.int!=='tasca'&&p.int!=='resto')continue;
  let puestas=0;
  for(let d=-2;d<=2&&puestas<3;d++)for(const[dx,dy]of[[d,1],[d,-1],[1,d],[-1,d]]){
   const x=(p.p.x|0)+dx,y=(p.p.y|0)+dy,i=y*MW+x;
   if(x<1||y<1||x>=MW-1||y>=MH-1)continue;
   if(bordillo(x,y)&&MOB[i]!==M_SEMAFORO&&!esPintura(MOB[i])&&MOB[i]!==M_TERRAZA){
    MOB[i]=M_TERRAZA;puestas++;break;}}}
 return cruces;}
/* El sprite se arrima al bordillo: una farola en el centro de la acera es una farola en
   mitad del paso. El lado lo dice la calzada que tiene al lado. */
/* El charco de luz de una farola encendida. Va en escalones y no en degradado, y no es un
   sprite: es luz, como el tinte de la hora, y un sprite con medio alfa se saltaría la regla
   de que todo el arte va a la paleta y opaco. */
function halo(px,py){
 for(const[rad,a]of[[38,.05],[26,.07],[15,.10]]){
  ctx.fillStyle='rgba(232,197,71,'+a+')';ctx.beginPath();ctx.arc(px,py,rad,0,6.283);ctx.fill();}}
/* El punto del bordillo, en espacio de 32 por casilla: pegado al canto que da a la
   calzada y centrado en el otro eje. Se saca aparte porque no solo lo quiere el dibujo:
   la cola de dibujado necesita la base para ordenar por profundidad. */
function anclaMob(x,y){
 const pE=Tc(x+1,y)===ROAD,pO=Tc(x-1,y)===ROAD,pS=Tc(x,y+1)===ROAD;
 return [pE?26:pO?6:16, pS?27:(Tc(x,y-1)===ROAD?7:18)];}
/* Ley 3 · ancla: por la base y centrado en su ancho, en casillas del mundo. Un sitio, una
   fórmula. Lo del parque y el muelle iba con desplazamientos a mano y sin sombra: un árbol
   de cinco metros flotaba sobre el césped sin marcar dónde se apoya. */
function plantar(k,cx,cy){
 const[a,al]=MOB_M[k];
 /* Cada pieza tira su sombra desde su base y con su altura: una farola de cuatro metros
    no proyecta lo mismo que una papelera de uno. */
 sombraFig(cx*TS,cy*TS,a*4,al);
 ctx.drawImage(PROP[k],Math.round(cx*TS-a*5*ESC),Math.round(cy*TS-al*10*ESC));}
/* La caja que ocupa en pantalla, para saber a quién esconde. */
function cajaProp(k,cx,cy){const[a,al]=MOB_M[k];
 return {x0:cx*TS-a*5*ESC,x1:cx*TS+a*5*ESC,y0:cy*TS-al*10*ESC,y1:cy*TS,alto:al};}
function dibMobiliario(mb,x,y){
 const[bx,by]=anclaMob(x,y),pE=Tc(x+1,y)===ROAD,pO=Tc(x-1,y)===ROAD;
 const k=MOB_PIEZA[mb];if(!k)return;
 const D=(dx,dy)=>plantar(k,x+(bx+dx)/32,y+(by+dy)/32);
 /* Los bolardos van en fila, que es como se ponen: uno cada casilla serían cinco metros
    de separación y no cierran el paso a nada. */
 if(mb===M_BOLARDO){for(let j=-1;j<2;j++){if(pE||pO)D(0,j*10);else D(j*10,0);}return;}
 /* La terraza sale de la pared del bar hacia la calzada, no encima del bordillo. */
 D(0,mb===M_TERRAZA?-4:0);}

const S={
 dinero:60,hp:100,energia:1,hambre:1,estrellas:0,min:8*60,dia:1,
 rep:{hosteleria:0,obra:0,transporte:0,calle:0},

 armas:{punos:Infinity},armaAct:'punos',
 job:null,contrato:null,mision:null,misionIdx:0,

 sospecha:0,visto:false,
