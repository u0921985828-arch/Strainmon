let _mb=null;
function mapaBase(){
 if(_mb)return _mb;
 _mb=lienzo(MW,MH);const g=_mb.getContext('2d');
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const t=map[y*MW+x];
  g.fillStyle=t===AGUA?C.agua:t===EDIF?'#262a30':t===PARQUE?'#2e4a2e':t===MONTE?'#23361f':t===PLAZA?'#5c574d'
   :t===MUELLE?'#453d33':t===PATIO?'#3a3630':t===PUENTE?C.grisL:'#4a505a';
  g.fillRect(x,y,1,1);}
 return _mb;}
function cajaHUD(x,y,w,h){
 ctx.fillStyle='rgba(7,9,12,.72)';ctx.fillRect(x,y,w,h);
 ctx.fillStyle='rgba(141,153,164,.35)';ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);
 ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);}
function dibHUD(){
 /* El HUD ocupa la pantalla entera otra vez: los mandos viven en el marco, fuera del
    lienzo, así que ya no hay nada que esquivar. */
 const marg=8;
 const zi=marg, zd=W-marg;
 /* ── radar circular con anillo de salud ── */
 const R=Math.min(52,H*.19), cxr=zi+R, cyr=marg+R+2;
 ctx.save();
 ctx.beginPath();ctx.arc(cxr,cyr,R,0,6.283);ctx.closePath();
 ctx.fillStyle='rgba(7,9,12,.85)';ctx.fill();
 ctx.save();ctx.clip();
 const esc=R*2/64;
 ctx.imageSmoothingEnabled=false;
 ctx.translate(cxr,cyr);ctx.scale(esc,esc);ctx.translate(-player.x,-player.y);
 ctx.drawImage(mapaBase(),0,0);
 POI.forEach(p=>{ctx.fillStyle=C.carbon;ctx.fillRect(p.p.x-2,p.p.y-2,4,4);
  ctx.fillStyle=p.c;ctx.fillRect(p.p.x-1.3,p.p.y-1.3,2.6,2.6);});
 const ob=objetivo();
 if(ob){ctx.fillStyle=C.mostaza;ctx.fillRect(ob.x-2.2,ob.y-2.2,4.4,4.4);}
 policia.forEach(p=>{ctx.fillStyle='#4d9dff';ctx.fillRect(p.x-1.5,p.y-1.5,3,3);});
 enemigos.forEach(e=>{ctx.fillStyle='#ff5a3c';ctx.fillRect(e.x-1.3,e.y-1.3,2.6,2.6);});
 ctx.fillStyle=C.blanco;ctx.fillRect(player.x-1.6,player.y-1.6,3.2,3.2);
 ctx.restore();
 /* anillo de salud */
 ctx.lineWidth=5;
 ctx.strokeStyle='rgba(28,34,41,.9)';ctx.beginPath();ctx.arc(cxr,cyr,R+3,0,6.283);ctx.stroke();
 const frac=clamp(S.hp/100,0,1);
 ctx.strokeStyle=frac>.5?C.sangre:frac>.25?'#d9591f':'#ff3b30';
 ctx.beginPath();ctx.arc(cxr,cyr,R+3,-Math.PI/2,-Math.PI/2+6.283*frac);ctx.stroke();
 ctx.lineWidth=1;ctx.strokeStyle='rgba(141,153,164,.45)';
 ctx.beginPath();ctx.arc(cxr,cyr,R+6,0,6.283);ctx.stroke();
 /* flecha de brújula al objetivo, pegada al borde del radar */
 if(ob){const ang=Math.atan2(ob.y-player.y,ob.x-player.x);
  const d8=((2-Math.round(ang/(Math.PI/4)))%8+8)%8;
  const fl=MARCA['f'+d8]||(MARCA['f'+d8]=flechaDir(d8,C.mostaza));
  ctx.drawImage(fl,cxr+Math.cos(ang)*(R-11)-8,cyr+Math.sin(ang)*(R-11)-8);}
 ctx.restore();
 /* ── estrellas ── */
 const exd=zd;
 for(let i=0;i<5;i++)ctx.drawImage(i<S.estrellas?ICO.estrella:ICO.estrellaOff,exd-24-i*20,marg+2,20,20);
 /* ── dinero ── */
 const din=String(Math.round(S.dinero));
 const wd=anchoTexto(din,2)+34;
 cajaHUD(exd-wd,marg+26,wd,26);
 ctx.drawImage(ICO.euro,exd-wd+3,marg+29,20,20);
 texto(ctx,din,exd-wd+26,marg+29,2,'ambar');
 /* ── reloj y día ── */
 const hr=String((S.min/60)|0).padStart(2,'0')+':'+String(S.min%60).padStart(2,'0');
 const wh=Math.max(anchoTexto(hr,2),anchoTexto('DIA '+S.dia,1))+10;
 cajaHUD(exd-wh,marg+58,wh,36);
 texto(ctx,hr,exd-wh+5,marg+61,2,'hueso');
 texto(ctx,'DIA '+S.dia,exd-wh+5,marg+81,1,'hueso');
 /* ── energía y hambre bajo el radar ── */
 const by=cyr+R+14;
 const barra=(y,v,col,ico)=>{
  ctx.drawImage(ico,zi,y-3,14,14);
  ctx.fillStyle='rgba(7,9,12,.8)';ctx.fillRect(zi+18,y,74,8);
  ctx.fillStyle='rgba(141,153,164,.4)';ctx.fillRect(zi+18,y,74,1);ctx.fillRect(zi+18,y+7,74,1);

 barra(by,S.energia,'#4d9de0',ICO.energia);

 /* ── dónde estás: la calle, y debajo el barrio ──

 const D=distDe(clamp(player.x|0,0,MW-1),clamp(player.y|0,0,MH-1));
 if(S.escena==='interior')texto(ctx,S.interior.n,zi,by+32,1,'hueso');

 /* ── arma y munición ── */
 const a=arma(S.armaAct);
 const mun=a.inf?'∞':String(S.armas[a.id]||0);
 const wa=Math.max(anchoTexto(a.n,1),anchoTexto(mun,2))+34;
 const ay=marg+98;
 cajaHUD(zd-wa,ay,wa,36);
 ctx.drawImage(ICO[a.id]||ICO.punos,zd-wa+3,ay+8,22,22);
 texto(ctx,a.n,zd-wa+28,ay+4,1,'hueso');
 texto(ctx,mun,zd-wa+28,ay+16,2,'ambar');
 /* ── el ojo ──
    Sin esto el sigilo se juega a ciegas: no hay forma de saber si el que está ahí
    enfrente te ha visto o está mirando al escaparate. El ojo se abre según lo que le

 if(S.escena==='ciudad'&&(S.sospecha>.02||S.visto)){
  const an=64,oy=ay+40;

 /* ── misión o curro ── */
 if(S.escena==='ciudad'&&(S.mision||S.job)){
  const o=objetivo(),dm=o?Math.round(dist(o,player)*8):0;
  const t1=S.mision?S.mision.def.n:S.job.tt;

   :(S.job.fase===0?'RECOGIDA':'ENTREGA'+(S.job.dn?' · '+S.job.dn.toUpperCase():''));
  const t3=dm+' M'+(S.mision&&S.mision.limite?'  '+Math.max(0,Math.ceil(S.mision.limite-S.mision.t))+' S':
   (S.job?'  '+S.job.pago+' €':''));
  const wm=Math.max(anchoTexto(t1,1),anchoTexto(t2,1),anchoTexto(t3,1))+12;
  const mx=clamp((W-wm)/2,zi,zd-wm), my=H-58;

  ctx.fillStyle=C.mostaza;ctx.fillRect(mx,my,wm,2);
  texto(ctx,t1,mx+6,my+4,1,'ambar');

 /* ── deuda ── */
 if(S.deuda>0){const td='ALQUILER '+S.deuda+' €';
  texto(ctx,td,zi,by+46,1,'rojo');}
 /* ── pista contextual ── */
 if(pista1){const w=anchoTexto(pista1,1)+12;
  cajaHUD((W-w)/2,H-24,w,16);

 if(avisoT>0&&aviso1){

 /* ── rótulo grande ── */
 if(grandeT>0&&grande1){let esc=W<620?3:4;
  while(esc>1&&anchoTexto(grande1,esc)>zd-zi)esc--;

  texto(ctx,grande1,(W-w)/2,H*.3,esc,'ambar');ctx.globalAlpha=1;}}

const tituloEl=document.getElementById('titulo'),tcv=document.getElementById('tcv'),cargaEl=document.getElementById('carga');
/*═══════════════ PORTADA Y CARGA ═══════════════*/
/* El título iba en HTML: tipografía del sistema, degradados y un mapa de fondo teñido de
   rojo. Nada de eso está en el juego, así que la primera pantalla mentía sobre lo que
   venía después. Ahora se dibuja con lo mismo que todo lo demás —la fuente BLOQUE, la
   paleta de 48 y los sprites forjados— sobre un trozo de la ciudad de verdad.

   El lienzo va a una resolución baja y se escala en entero: es la única manera de que un
   píxel del rótulo mida lo mismo que un píxel del juego. */
const POR_W=320, POR_H=180;
/* `map` está preasignado, así que preguntarle por su tamaño dice que sí desde el primer
   paso de la carga: el mapa del fondo se cacheaba vacío y la portada salía negra. */
let ciudadLista=false;
let porT=0, porPaso='', porProg=0, porHay=false;
function escalaPortada(){
 return Math.max(1,Math.floor(Math.min(innerWidth/POR_W,innerHeight/POR_H)));}
/* Un rótulo grande con sombra dura, centrado. */
function rotulo(g,txt,y,esc,tinta){
 texto(g,txt,Math.round((POR_W-anchoTexto(txt,esc))/2),y,esc,tinta);}
/* Una caja de las del juego: borde de dos, relleno oscuro y rayas de tubo. */
function cajaPortada(g,x,y,w,h,encendida){
 P(g,x,y,w,h,encendida?C.rojoO:C.carbon);
 P(g,x+2,y+2,w-4,h-4,encendida?'#7a2f14':C.negro);
 P(g,x,y,w,2,encendida?C.rojoL:C.grisL);
 P(g,x,y+h-2,w,2,C.negro);
 for(let i=y+4;i<y+h-2;i+=3){g.globalAlpha=.14;P(g,x+2,i,w-4,1,C.hueso);g.globalAlpha=1;}}
function pintarPortada(){
 const g=tcv.getContext('2d');
 if(tcv.width!==POR_W){tcv.width=POR_W;tcv.height=POR_H;}
 g.imageSmoothingEnabled=false;
 /* Fondo: un trozo de Bilbao de verdad —el meandro de Deusto y el Casco— a una casilla
    por píxel. Si la ciudad aún no está cargada se queda el asfalto, que tampoco
    desentona. */
 P(g,0,0,POR_W,POR_H,C.asfaltoO);
 if(ciudadLista){
  /* A una casilla por píxel el recorte cae entero sobre manzanas y sale una plancha
     oscura: 320 casillas son kilómetro y medio de edificios. Se coge el doble de ciudad
     y con la ría dentro, que es lo que se reconoce de Bilbao desde arriba. */
  g.drawImage(mapaBase(),470,110,POR_W*2,POR_H*2,0,0,POR_W,POR_H);
  g.globalAlpha=.22;P(g,0,0,POR_W,POR_H,C.negro);g.globalAlpha=1;}
 /* Bandas arriba y abajo, para que el rótulo y los botones se lean siempre. */
 for(let i=0;i<34;i++){g.globalAlpha=Math.min(.92,(34-i)/30);
  P(g,0,i,POR_W,1,C.negro);P(g,0,POR_H-1-i,POR_W,1,C.negro);}
 g.globalAlpha=1;
 rotulo(g,'BILBO',14,4,'ambar');
 rotulo(g,'CITY',50,4,'ambar');
 rotulo(g,'NERVION · 199X',88,1,'hueso');
 /* Una acera con cuatro vecinos y un coche: es un juego de andar por la calle y la
    portada tiene que decirlo antes que ninguna otra cosa. */
 const suelo=POR_H-34;
 P(g,0,suelo,POR_W,2,C.asfalto);
 g.globalAlpha=.5;P(g,0,suelo+2,POR_W,6,C.negro);g.globalAlpha=1;
 if(VEH&&VEH.utilitario)g.drawImage(VEH.utilitario[0],POR_W-96,suelo-16);
 const cw=CEL_W(),ch=CEL_H();
 for(const[k,d,x] of [['protagonista',2,16],['p6',0,52],['p10',6,84],['ertzaina',4,POR_W-30]]){
  const h=hoja(k);if(h)g.drawImage(h,d*cw,0,cw,ch,x,suelo-ch+8,cw,ch);}
 /* Y encima de todo, la carga o los botones. */
 if(porProg<1){
  const bw=180,bx=(POR_W-bw)/2,by=POR_H-16;
  P(g,bx-2,by-2,bw+4,10,C.carbon);
  P(g,bx,by,bw,6,C.negro);
  P(g,bx,by,Math.round(bw*porProg),6,C.mostaza);
  P(g,bx,by,Math.round(bw*porProg),2,C.hueso);
  const t='FORJANDO '+porPaso.toUpperCase();
  texto(g,t,Math.round((POR_W-anchoTexto(t,1))/2),by-12,1,'hueso');
 }else{
  const bw=112,bx=(POR_W-bw)/2;
  cajaPortada(g,bx,POR_H-30,bw,13,false);
  const t1='CONTINUAR';
  texto(g,t1,Math.round((POR_W-anchoTexto(t1,1))/2),POR_H-27,1,porHay?'ambar':'hueso');
  if(!porHay){g.globalAlpha=.55;P(g,bx,POR_H-30,bw,13,C.negro);g.globalAlpha=1;}
  cajaPortada(g,bx,POR_H-15,bw,13,true);
  const t2=porHay?'PARTIDA NUEVA':'EMPEZAR';
  texto(g,t2,Math.round((POR_W-anchoTexto(t2,1))/2),POR_H-12,1,'hueso');}
 /* Las cajas de clic del DOM se colocan encima de lo dibujado: la lógica de los botones
    no cambia, solo dónde se ven. */
 colocarBotonesPortada();}
function colocarBotonesPortada(){
 const e=escalaPortada(),ox=Math.round((innerWidth-POR_W*e)/2),oy=Math.round((innerHeight-POR_H*e)/2);
 /* El lienzo se estira a un múltiplo entero y se coloca a mano: centrarlo con flex y
    dejarle el tamaño natural lo dejaba a 320×180 en una esquina. */
 if(tcv&&tcv.style){tcv.style.position='absolute';tcv.style.transform='none';
  tcv.style.left=ox+'px';tcv.style.top=oy+'px';
  tcv.style.width=(POR_W*e)+'px';tcv.style.height=(POR_H*e)+'px';
  tcv.style.maxWidth='none';tcv.style.maxHeight='none';}
  const bw=112,bx=(POR_W-bw)/2;
 const poner=(el,y)=>{if(!el||!el.style)return;
  el.style.position='absolute';el.style.left=(ox+bx*e)+'px';el.style.top=(oy+y*e)+'px';
  el.style.width=(bw*e)+'px';el.style.height=(13*e)+'px';
  el.style.padding='0';el.style.margin='0';el.style.border='none';
  el.style.background='transparent';el.style.color='transparent';el.style.fontSize='0';};
 poner(document.getElementById('btnCont'),POR_H-30);
 poner(document.getElementById('btnNuevo'),POR_H-15);}
addEventListener('resize',()=>{if(tituloEl&&tituloEl.style.display!=='none')pintarPortada();});

const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function arrancar(){
 const pasos=[
  ['tiles',()=>generarTiles()],
  ['vehículos',()=>generarVeh()],
  ['props',()=>generarProps()],
