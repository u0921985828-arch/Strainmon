(()=>{
"use strict";
/*═══════════════ BÁSICOS ═══════════════*/
/* El mapa es rectangular a propósito: el valle de Bilbao va tumbado de este a oeste
   y en un cuadrado no cabe sin deformarlo. */
const TS=32, MW=448, MH=288;
const ROAD=0,ACERA=1,EDIF=2,PARQUE=3,AGUA=4,PUENTE=5,PLAZA=6,MUELLE=7,PATIO=8,VIA=9;
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
/* DPR entero a propósito: con 1,5 o 1,75 un píxel de textura cae a caballo de dos de
   pantalla y el pixel art se ve sucio. Mejor perder algo de resolución que el filo. */
function resize(){DPR=Math.min(2,Math.max(1,Math.floor(devicePixelRatio||1)));W=cv.clientWidth;H=cv.clientHeight;
 cv.width=W*DPR|0;cv.height=H*DPR|0;ctx.imageSmoothingEnabled=false;}
addEventListener('resize',resize);resize();
/* Generador propio en vez del de la plataforma: así una partida — o una pasada de la
   batería de pruebas — se puede repetir clavada. Sin sembrar arranca de la hora,
   que es el comportamiento de siempre. mulberry32: corto, rápido y bien repartido. */
let _semilla=(Date.now()^0x9E3779B9)>>>0;
function sembrar(s){_semilla=(s>>>0)||1;}
function azar(){_semilla=(_semilla+0x6D2B79F5)>>>0;let t=_semilla;
 t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);
 return ((t^(t>>>14))>>>0)/4294967296;}
const rnd=(a,b)=>a+azar()*(b-a), rndi=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const modp=(a,n)=>((a%n)+n)%n;   /* el % de JS devuelve negativos y aquí no valen */
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const lerp=(a,b,t)=>a+(b-a)*t;
function hash(a,b){let h=(a*73856093)^(b*19349663);h=(h^(h>>13))*1274126177;return Math.abs(h^(h>>16));}

 if(((x*7+y*13+((x*3)^(y*5)))%100)<d)P(g,x+ox,y+oy,1,1,cols[(x*3+y*7)%cols.length]);}

/*═══════════════ PALETA BLOQUEADA ═══════════════*/
const C={
 negro:'#0b0e12',carbon:'#1c2229',asfalto:'#33383e',asfaltoO:'#2a2f34',asfaltoL:'#3f454c',
 gris:'#4a444c',grisO:'#3a353c',grisL:'#5f5a63',acero:'#8d99a4',aceroO:'#6d7883',hueso:'#e6e2d6',

 piel1:'#f0cfae',piel2:'#e0b48c',piel3:'#c69068',piel4:'#a87247',piel5:'#8d6142',piel6:'#6b482f',
 pelo1:'#2a2018',pelo2:'#4a3520',pelo3:'#7a5a2a',pelo4:'#b09a72',pelo5:'#8d99a4',
 azul:'#1f3a5f',azulO:'#152741',azulL:'#2f5182',
 rojo:'#b7451f',rojoO:'#8e3316',rojoL:'#d05c33',sangre:'#951f18',
 verde:'#3d6b4a',verdeO:'#2d5137',verdeL:'#508a5f',cesped:'#3c6338',cespedO:'#2f5330',
 agua:'#1c4652',aguaL:'#2a6473',
 mostaza:'#e8c547',mostazaO:'#b89a2c',
 morado:'#5b4a76',teja:'#7a5f52',tejaO:'#5f4840',madera:'#6b4326',maderaO:'#4d3019',maderaL:'#8a5c37',
 blanco:'#f4f2ea',crema:'#d8d4c4',
};
const PALETA=[...new Set(Object.values(C))].map(h=>[
 parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16),h]);
const cacheCol=new Map();
function masCercano(r,g,b){const k=(r<<16)|(g<<8)|b;let v=cacheCol.get(k);if(v!==undefined)return v;
 let mej=PALETA[0],md=1e9;
 for(const p of PALETA){const d=(p[0]-r)**2+(p[1]-g)**2+(p[2]-b)**2;if(d<md){md=d;mej=p;}}
 cacheCol.set(k,mej);return mej;}
function cuantizar(c){
 const g=c.getContext('2d'),img=g.getImageData(0,0,c.width,c.height),d=img.data;
 for(let i=0;i<d.length;i+=4){
  if(d[i+3]<128){d[i+3]=0;continue;}
  d[i+3]=255;const p=masCercano(d[i],d[i+1],d[i+2]);d[i]=p[0];d[i+1]=p[1];d[i+2]=p[2];}
 g.putImageData(img,0,0);return c;}
function poligono(g,pts,col,x0,y0,x1,y1){
 const dentro=(px,py)=>{let d=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
   const[xi,yi]=pts[i],[xj,yj]=pts[j];
   if((yi>py)!==(yj>py)&&px<(xj-xi)*(py-yi)/(yj-yi)+xi)d=!d;}
  return d;};
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(dentro(x+.5,y+.5))P(g,x,y,1,1,col);}
const girar=(pts,ang,cx,cy)=>pts.map(([x,y])=>{
 const ca=Math.cos(ang),sa=Math.sin(ang);return[cx+x*ca-y*sa,cy+x*sa+y*ca];});

const AB=0,AR=1,IZ=2,DE=3;

const POSES={
 quieto:{p:[0,0],b:[0,0],y:0},

 andar3:{p:[1,0],b:[-1,1],y:0}, andar4:{p:[0,1],b:[0,0],y:-1},
 correr1:{p:[-2,2],b:[2,-2],y:-1}, correr2:{p:[2,-2],b:[-2,2],y:-1},
 correr3:{p:[-3,3],b:[3,-3],y:-2}, correr4:{p:[3,-3],b:[-3,3],y:-2},
 pega1:{p:[0,0],b:[0,0],y:0,ataque:1}, pega2:{p:[0,1],b:[0,0],y:0,ataque:2},
 apunta:{p:[0,0],b:[0,0],y:0,apunta:1}, dispara:{p:[0,0],b:[0,0],y:-1,apunta:1,fog:1},
 herido:{p:[1,1],b:[2,2],y:1,herido:1},
};
const ORDEN_POSES=['quieto','andar1','andar2','andar3','andar4','correr1','correr2','correr3','correr4',

const IPOSE={};ORDEN_POSES.forEach((p,i)=>IPOSE[p]=i);
const COMPLEX={delgada:{w:6,hom:7},media:{w:8,hom:9},corpulenta:{w:10,hom:11}};
const TORSOS={
 camisa:{b:C.blanco,s:C.crema,l:C.blanco,manga:'larga'},
 camisaRem:{b:C.blanco,s:C.crema,l:C.blanco,manga:'corta'},

};

};

function dibChar(cfg,pose,d8){
 const M=MAPA8[d8], dir=M.b, frente=M.f, espalda=M.e;
 const c=lienzo(20,26),g=c.getContext('2d');
 const P_=POSES[pose],comp=COMPLEX[cfg.comp],T=TORSOS[cfg.torso],PN=PIERNAS[cfg.piernas];
 const diag=frente||espalda, lateral=(dir===DE||dir===IZ)&&!diag;
 const cx=10+(diag?(dir===DE?-1:1):0)+(lateral?(dir===DE?1:-1):0);
 const oy=P_.y, w=comp.w, hom=comp.hom-(diag?1:0)-(lateral?2:0);
 const izqV=dir===IZ, derV=dir===DE, arr=(dir===AR)||espalda;
 const py=17+oy, l1=P_.p[0], l2=P_.p[1];
 if(PN.falda){P(g,cx-w/2-1,py-1,w+2,6,PN.b);P(g,cx-w/2-1,py+4,w+2,1,PN.s);
  P(g,cx-3,py+5,2,4,cfg.piel);P(g,cx+1,py+5,2,4,cfg.piel);}
 else if(lateral){const dx=derV?1:-1;
  P(g,cx-2-dx,py+l2,3,8-l2,PN.s);P(g,cx-2+dx,py+l1,3,8-l1,PN.b);
  if(PN.corto)P(g,cx-2+dx,py+4,3,4,cfg.piel);}
 else{P(g,cx-3,py+l1,3,8-l1,PN.b);P(g,cx,py+l2,3,8-l2,PN.s);
  if(PN.raya){P(g,cx-3,py+l1,1,8-l1,PN.raya);P(g,cx+2,py+l2,1,8-l2,PN.raya);}
  if(PN.corto){P(g,cx-3,py+4,3,4,cfg.piel);P(g,cx,py+4,3,4,cfg.piel);}}

 ['#c9c9c9','#9d9d9d','#eaeaea'],['#2f3f4f','#22303c','#48606f']];
function dibVeh(tipo,lib,estado){
 const K=CHASIS[tipo],c=lienzo(K.l+6,K.an+6),g=c.getContext('2d');
 const ox=3,oy=3,L=K.l,AN=K.an;
 let base=lib[0],osc=lib[1],cl=lib[2];
 if(estado==='quemado'){base='#2a2622';osc='#191612';cl='#3a352f';}
 P(g,ox,oy+1,L,AN-2,C.negro);
 P(g,ox+1,oy+1,L-2,AN-2,base);P(g,ox+1,oy+1,L-2,2,cl);P(g,ox+1,oy+AN-3,L-2,2,osc);
 P(g,ox+2,oy+3,K.morro,AN-6,cl);
 const[cxp,cw]=K.cabina;
 P(g,ox+cxp,oy+3,cw,AN-6,C.carbon);
 P(g,ox+cxp+1,oy+4,3,AN-8,'#3f5566');P(g,ox+cxp+cw-3,oy+4,2,AN-8,'#31424f');
 if(K.caja){const[bx,bw]=K.caja;P(g,ox+bx,oy+2,bw,AN-4,cl);P(g,ox+bx+1,oy+3,bw-2,AN-6,base);}
 if(K.bus)for(let i=8;i<L-6;i+=7)P(g,ox+i,oy+2,5,2,'#3f5566');
 if(K.volquete)P(g,ox+cxp+cw,oy+2,L-cxp-cw-2,AN-4,C.mostazaO);
 P(g,ox+L-4,oy+4,3,3,'#e8dfa8');P(g,ox+L-4,oy+AN-7,3,3,'#e8dfa8');
 P(g,ox+1,oy+4,2,3,C.crema);P(g,ox+1,oy+AN-7,2,3,C.crema);
 const rw=K.alto?4:3;
 P(g,ox+5,oy-1,6,rw,C.negro);P(g,ox+L-12,oy-1,6,rw,C.negro);
 P(g,ox+5,oy+AN-2,6,rw,C.negro);P(g,ox+L-12,oy+AN-2,6,rw,C.negro);
 if(K.taxi){P(g,ox+cxp+2,oy-1,6,3,C.mostaza);
  for(let i=0;i<L-8;i+=4)P(g,ox+2+i,oy+AN/2-1,2,2,C.carbon);}
 if(K.rotativo){P(g,ox+cxp,oy+1,3,AN-2,estado==='rotA'?'#2f6bff':C.gris);
  P(g,ox+cxp+3,oy+1,3,AN-2,estado==='rotA'?C.gris:'#ff3b30');}
 if(K.cruz){P(g,ox+18,oy+AN/2-1,10,2,C.rojo);P(g,ox+22,oy+AN/2-5,2,10,C.rojo);}
 if(estado==='abollado')for(let i=0;i<9;i++)P(g,ox+4+((i*7)%(L-8)),oy+3+((i*5)%(AN-6)),2,2,osc);
 if(estado==='quemado')for(let i=0;i<14;i++)P(g,ox+2+((i*5)%(L-4)),oy+2+((i*3)%(AN-4)),2,2,'#1a1714');
 return cuantizar(c);
}
const VEH={},VEH_QUEMADO={};
function generarVeh(){
 Object.keys(CHASIS).forEach(t=>{
  VEH[t]=LIBREAS.map(l=>dibVeh(t,l,'normal'));
  VEH_QUEMADO[t]=dibVeh(t,LIBREAS[0],'quemado');});
 VEH.patrullaRot=[dibVeh('patrulla',LIBREAS[5],'rotA'),dibVeh('patrulla',LIBREAS[5],'rotB')];
}

/* La ría. Entra por Bolueta al sureste, baja hacia el Arenal, da el meandro ancho de
   Deusto por arriba y sale al suroeste hacia Zorrotza y el mar. La curva de arriba es
   redonda a propósito: con un vértice en punta el plano parecía una tienda de campaña,
   no un río. Los dos brazos son distintos porque en Bilbao tampoco son iguales — el
   Nervión baja recto y el tramo de salida se abre. */
const RIA=[[392,215],[404,200],[418,188],[432,176],[440,160],[432,146],[416,142],[400,146],[386,152],[369,146],[346,137],[326,125],[302,110],[282,92],[262,80],[238,71],[215,68],[196,72],[180,84],[165,96],[148,102],[130,100],[114,90],[96,84],[84,86],[55,68],[35,45],[17,21],[6,6]];

const CANAL=[[196,72],[174,73],[152,75],[130,78],[108,82]];
/* Ancho en casillas a lo largo del recorrido: estrecho aguas arriba, ancho en la salida. */
function lineaRio(pts,a0,a1,t){
 let total=0;const seg=[];
 for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(d);total+=d;}
 let rec=0;
 for(let i=0;i<pts.length-1;i++){
  const[ax,ay]=pts[i],[bx,by]=pts[i+1];
  const n=Math.ceil(seg[i]*3);
  for(let k=0;k<=n;k++){
   const f=(rec+seg[i]*k/n)/total;
   const px=ax+(bx-ax)*k/n, py=ay+(by-ay)*k/n, r=(a0+(a1-a0)*f)/2;
   for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){
    if(dx*dx+dy*dy>r*r)continue;
    pon(Math.round(px+dx),Math.round(py+dy),t);}}
  rec+=seg[i];}}
function puntoRuta(pts,t){
 let total=0;const seg=[];
 for(let i=0;i<pts.length-1;i++){const d=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);seg.push(d);total+=d;}
 let rec=t*total;
 for(let i=0;i<seg.length;i++){
  if(rec<=seg[i]){const f=rec/seg[i];
   return{x:pts[i][0]+(pts[i+1][0]-pts[i][0])*f, y:pts[i][1]+(pts[i+1][1]-pts[i][1])*f,
    ang:Math.atan2(pts[i+1][1]-pts[i][1],pts[i+1][0]-pts[i][0])};}
  rec-=seg[i];}
 const l=pts.length-1;
 return{x:pts[l][0],y:pts[l][1],ang:0};}
function generarCiudad(){
 /* 1 · relleno por zona */
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const Z=ZONAS[charDe(x,y)];
  map[y*MW+x]=Z.verde?PARQUE:EDIF;}
 /* 2 · avenidas en las fronteras entre barrios */
 for(let cy=0;cy<NCY;cy++)for(let cx=0;cx<NCX;cx++){
  const c=ATLAS[cy][cx];
  if(cx<NCX-1&&ATLAS[cy][cx+1]!==c)rect((cx+1)*CEL-1,cy*CEL,3,CEL,ROAD);
  if(cy<NCY-1&&ATLAS[cy+1][cx]!==c)rect(cx*CEL,(cy+1)*CEL-1,CEL,3,ROAD);}
 /* 3 · trama interior de cada barrio */
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){
  const Z=ZONAS[charDe(x,y)];
  if(Z.verde){ /* por el monte y los parques solo pasa algún camino */
   /* Los caminos van cada 13 casillas: con la malla más suelta un parque de barrio
      cabía entero entre dos y salía como un cuadrado verde macizo, un agujero. */
   if(((x+3)%13<1)||((y+7)%13<1))map[y*MW+x]=ACERA;
   continue;}
  if(Z.estadio)continue;
  /* La calle no es (x % sp): es una curva de nivel de un sistema de coordenadas girado
     y ondulado. Como u y v son continuas, las calles salen continuas — curvas de verdad,
     no escaleras — y la trama sigue conectada. */
  const ca=Math.cos(Z.ang*Math.PI/180), sa=Math.sin(Z.ang*Math.PI/180), on=Z.onda||24, cu=Z.curva||0;
  const u= x*ca + y*sa + cu*Math.sin(y/on) + Z.ox;
  const v=-x*sa + y*ca + cu*Math.sin(x/on) + Z.oy;
  if(modp(u,Z.sp)<Z.w||modp(v,Z.spy||Z.sp)<Z.w)map[y*MW+x]=ROAD;}
 /* 4 · Gran Vía: la diagonal del Ensanche, con Moyúa en medio */
 linea([[344,144],[320,160],[296,176],[272,192]],6,ROAD,(x,y)=>!ZONAS[charDe(x,y)].verde);

/* un coche aparcado mira hacia donde va la calle, no siempre al este */
function angCalle(x,y){
 const fx=Math.floor(x),fy=Math.floor(y);
 let h=0,v=0;
 for(let d=1;d<=3;d++){
  if(rodable(fx+d,fy))h++;if(rodable(fx-d,fy))h++;
  if(rodable(fx,fy+d))v++;if(rodable(fx,fy-d))v++;}
 if(h===v)return azar()<.5?0:Math.PI/2;
 return h>v?(azar()<.5?0:Math.PI):(azar()<.5?Math.PI/2:-Math.PI/2);}
function nuevoCoche(x,y,tipo,lib,propio,vmax){
 return{x,y,ang:angCalle(x,y),vx:0,vy:0,tipo,lib,propio,vmax:vmax||11,dano:0,vivo:true};}

const AU={ctx:null,on:true,mus:true,gSfx:null,gMus:null,motor:null,sirena:null,musT:0};
function audioInit(){
 if(AU.ctx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 AU.ctx=new AC();
 AU.gSfx=AU.ctx.createGain();AU.gSfx.gain.value=.32;AU.gSfx.connect(AU.ctx.destination);
 AU.gMus=AU.ctx.createGain();AU.gMus.gain.value=.12;AU.gMus.connect(AU.ctx.destination);
 const o=AU.ctx.createOscillator(),f=AU.ctx.createBiquadFilter(),g=AU.ctx.createGain();
 o.type='sawtooth';o.frequency.value=60;f.type='lowpass';f.frequency.value=520;g.gain.value=0;
 o.connect(f);f.connect(g);g.connect(AU.gSfx);o.start();AU.motor={o,g,f};
 const so=AU.ctx.createOscillator(),sg=AU.ctx.createGain();
 so.type='square';so.frequency.value=680;sg.gain.value=0;so.connect(sg);sg.connect(AU.gSfx);so.start();
 AU.sirena={o:so,g:sg,t:0};}
function ruidoBuf(seg){const n=AU.ctx.sampleRate*seg,b=AU.ctx.createBuffer(1,n,AU.ctx.sampleRate),d=b.getChannelData(0);
 for(let i=0;i<n;i++)d[i]=azar()*2-1;return b;}
function sfx(tipo,vol=1){
 if(!AU.ctx||!AU.on)return;const t=AU.ctx.currentTime,g=AU.ctx.createGain();g.connect(AU.gSfx);
 if(['disparo','escopeta','golpe','explosion','choque','grito'].includes(tipo)){
  const s=AU.ctx.createBufferSource();s.buffer=ruidoBuf(tipo==='explosion'?.9:.28);
  const f=AU.ctx.createBiquadFilter();f.type=tipo==='golpe'?'lowpass':'bandpass';
  f.frequency.value=tipo==='explosion'?180:tipo==='escopeta'?900:tipo==='golpe'?320:tipo==='choque'?260:1500;
  f.Q.value=tipo==='grito'?6:1;s.connect(f);f.connect(g);
  const dur=tipo==='explosion'?.85:tipo==='escopeta'?.3:.14;
  g.gain.setValueAtTime(.9*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  if(tipo==='explosion'){const o=AU.ctx.createOscillator(),og=AU.ctx.createGain();
   o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(24,t+.8);
   og.gain.setValueAtTime(.9,t);og.gain.exponentialRampToValueAtTime(.001,t+.8);
   o.connect(og);og.connect(AU.gSfx);o.start(t);o.stop(t+.9);}
  s.start(t);s.stop(t+dur+.05);
 }else if(tipo==='claxon'){
  const o=AU.ctx.createOscillator(),o2=AU.ctx.createOscillator();o.type=o2.type='square';
  o.frequency.value=370;o2.frequency.value=440;o.connect(g);o2.connect(g);
  g.gain.setValueAtTime(.22*vol,t);g.gain.setValueAtTime(.22*vol,t+.22);g.gain.exponentialRampToValueAtTime(.001,t+.3);
  o.start(t);o2.start(t);o.stop(t+.32);o2.stop(t+.32);
 }else{const o=AU.ctx.createOscillator();o.type='square';
  o.frequency.setValueAtTime(tipo==='dinero'?620:300,t);
  o.frequency.setValueAtTime(tipo==='dinero'?880:200,t+.07);
  o.connect(g);g.gain.setValueAtTime(.25*vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);
  o.start(t);o.stop(t+.18);}}
function motorAudio(vel,vmax){
 if(!AU.motor||!AU.on)return;
 if(vel===null){AU.motor.g.gain.value=0;return;}
 const v=Math.abs(vel)/Math.max(1,vmax);
 AU.motor.o.frequency.value=52+v*140;AU.motor.f.frequency.value=380+v*900;
 AU.motor.g.gain.value=clamp(.05+v*.13,0,.2);}
function sirenaAudio(dt,activa){
 if(!AU.sirena||!AU.on)return;
 if(!activa){AU.sirena.g.gain.value=0;return;}
 AU.sirena.t+=dt;AU.sirena.o.frequency.value=Math.sin(AU.sirena.t*6)>0?720:520;AU.sirena.g.gain.value=.05;}
const ESCALA=[0,3,5,7,10];
function musica(dt){
 if(!AU.ctx||!AU.mus||!AU.on)return;
 AU.musT-=dt;if(AU.musT>0)return;AU.musT=.24;
 const t=AU.ctx.currentTime,base=S.estrellas>0?58:S.escena==='interior'?46:41;
 const paso=(azar()<.75)?ESCALA[rndi(0,4)]:ESCALA[rndi(0,4)]+12;
 const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
 o.type=S.estrellas>0?'sawtooth':'triangle';
 o.frequency.value=440*Math.pow(2,(base+paso-69)/12);
 g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.5,t+.02);
 g.gain.exponentialRampToValueAtTime(.001,t+.23);
 o.connect(g);g.connect(AU.gMus);o.start(t);o.stop(t+.25);
 if(azar()<.5){const b=AU.ctx.createOscillator(),bg=AU.ctx.createGain();
  b.type='square';b.frequency.value=440*Math.pow(2,(base-24-69)/12);
  bg.gain.setValueAtTime(.4,t);bg.gain.exponentialRampToValueAtTime(.001,t+.2);
  b.connect(bg);bg.connect(AU.gMus);b.start(t);b.stop(t+.22);}}

function estrellas(n){
 S.estrellas=clamp(S.estrellas+n,0,5);S.cooldown=0;
 while(policia.length<Math.min(S.estrellas,4)){const p=puntoCalle(player.x|0,player.y|0,28);
  policia.push({x:p.x,y:p.y,tx:p.x|0,ty:p.y|0,vel:5.2+S.estrellas*.35,ang:0,luz:0});}}
function lineaVista(a,b){
 const d=dist(a,b),pasos=Math.ceil(d/.4);
 for(let i=1;i<pasos;i++){const t=i/pasos;
  if(!andable(Tc(Math.floor(a.x+(b.x-a.x)*t),Math.floor(a.y+(b.y-a.y)*t))))return false;}
 return true;}
function disparar(desde,ang,a,dueno){
 const n=a.disp||1;
 for(let i=0;i<n;i++){const sp=(azar()-.5)*(a.spread||0)*2;
  balas.push({x:desde.x+Math.cos(ang)*.5,y:desde.y+Math.sin(ang)*.5,
   vx:Math.cos(ang+sp)*a.vel,vy:Math.sin(ang+sp)*a.vel,dmg:a.dmg,vida:a.alc/a.vel,dueno});}
 particula(desde.x+Math.cos(ang)*.6,desde.y+Math.sin(ang)*.6,'chispa',3);
 sfx(a.id==='escopeta'?'escopeta':'disparo',.8);}
const dirAng=d8=>(2-d8)*Math.PI/4;
let fogT=0,fogTipo=null,fogD=0;
function atacarJugador(){
 if(S.escena!=='ciudad'||player.enCoche)return;
 const a=arma(S.armaAct);
 if(player.cad>0)return;
 if(!a.inf&&!(S.armas[a.id]>0))return aviso('Sin munición');
 player.cad=a.cad;
 let obj=null,md=a.alc+.6;
 for(const e of enemigos){const d=dist(e,player);if(d>md)continue;
  const ang=Math.atan2(e.y-player.y,e.x-player.x);
  const df=Math.abs(((ang-dirAng(player.d8)+Math.PI*3)%(Math.PI*2))-Math.PI);
  if(df<1.05&&lineaVista(player,e)){md=d;obj=e;}}
 if(a.cuerpo&&!obj)for(const p of peatones){const d=dist(p,player);if(d>a.alc+.4)continue;
  const ang=Math.atan2(p.y-player.y,p.x-player.x);
  const df=Math.abs(((ang-dirAng(player.d8)+Math.PI*3)%(Math.PI*2))-Math.PI);
  if(df<1.05){obj=p;break;}}
 const ang=obj?Math.atan2(obj.y-player.y,obj.x-player.x):dirAng(player.d8);
 if(obj)player.d8=dir8De(Math.cos(ang),Math.sin(ang));
 if(a.cuerpo){sfx('golpe',.7);player.pose='pega2';player.golpeT=.22;
  if(obj&&dist(obj,player)<=a.alc+.4){danar(obj,a.dmg);particula(obj.x,obj.y,'sangre',4);}
 }else{S.armas[a.id]--;disparar(player,ang,a,'jugador');
  player.golpeT=.16;player.pose='dispara';
  fogT=.07;fogTipo=a.fog;fogD=player.d8;
  if(S.estrellas<1)estrellas(1);}}
function danar(e,d){
 e.hp-=d;e.herido=.25;
 if(e.hp<=0){
  const i=enemigos.indexOf(e);
  if(i>=0){enemigos.splice(i,1);S.dinero+=rndi(20,70);sfx('dinero',.5);particula(e.x,e.y,'sangre',10);
   if(S.mision){const p=pasoActual();if(p&&p.t==='matar'){p.n--;if(p.n<=0)avanzarPaso();else aviso('QUEDAN '+p.n);}}}
  else{const j=peatones.indexOf(e);if(j>=0){peatones.splice(j,1);peatones.push(nuevoPeaton(player.x|0,player.y|0));
   particula(e.x,e.y,'sangre',8);estrellas(1);sfx('grito',.6);}}
 }else{particula(e.x,e.y,'sangre',3);if(e.huye!==undefined)e.huye=4;}}
function danarJugador(d){
 if(S.muerto>0)return;
 S.hp=Math.max(0,S.hp-d);flashT=.3;player.herido=.25;
 if(S.hp<=0){S.muerto=2.2;grande('K.O.',2.2);}}
function explotar(c){
 c.vivo=false;sfx('explosion');particula(c.x,c.y,'chispa',26);particula(c.x,c.y,'humo',16);
 for(const e of enemigos)if(dist(e,c)<2.6)danar(e,90);

 player.x=poi('poli').p.x;player.y=poi('poli').p.y+1.4;

function libre(x,y,coche){
 if(S.escena==='interior')return !solidoInt(tileInt(x,y));
 const t=Tc(Math.floor(x),Math.floor(y));
 return coche?(t!==EDIF&&t!==AGUA&&t!==PARQUE):andable(t);}
function mover(e,nx,ny,coche){
 if(libre(nx,e.y,coche))e.x=nx;else if(coche)e.golpe=true;
 if(libre(e.x,ny,coche))e.y=ny;else if(coche)e.golpe=true;
 if(S.escena==='ciudad'){e.x=clamp(e.x,1,MW-1);e.y=clamp(e.y,1,MH-1);}}
function rejilla(c,dt,persigue){
 if(c.frenado)return;
 if(Math.hypot(c.tx+.5-c.x,c.ty+.5-c.y)<.15){
  let d=[[1,0],[-1,0],[0,1],[0,-1]].filter(([dx,dy])=>rodable(c.tx+dx,c.ty+dy));
  if(!d.length){c.tx++;return;}
  let el;
  if(persigue){d.sort((a,b)=>Math.hypot(c.tx+a[0]-player.x,c.ty+a[1]-player.y)-Math.hypot(c.tx+b[0]-player.x,c.ty+b[1]-player.y));el=d[0];}
  else{const r=d.find(([dx,dy])=>dx===c.dx&&dy===c.dy);
   el=(r&&azar()<.82)?r:(d.filter(([dx,dy])=>!(dx===-c.dx&&dy===-c.dy))[0]||d[0]);}
  c.dx=el[0];c.dy=el[1];c.tx+=el[0];c.ty+=el[1];}
 c.ang=Math.atan2(c.ty+.5-c.y,c.tx+.5-c.x);
 c.x+=Math.cos(c.ang)*c.vel*dt;c.y+=Math.sin(c.ang)*c.vel*dt;}
function asustar(p,r){for(const q of peatones)if(dist(q,p)<r){q.huye=3.5;if(azar()<.1)sfx('grito',.3);}}
function objetivo(){
 if(S.mision){const p=pasoActual();if(!p)return null;return p.t==='robar'?p.coche:p.p;}
 if(S.job)return S.job.fase===0?S.job.o:S.job.d;
 return null;}

 musica(dt);

  if(S.muerto<=0){
   S.hp=60;S.dinero=Math.max(0,S.dinero-Math.round(S.dinero*.2));
   ARMAS.forEach(a=>{if(!a.inf)delete S.armas[a.id];});S.armaAct='punos';

 for(const b of balas){ctx.fillStyle=C.mostaza;ctx.fillRect(b.x*TS-1.5,b.y*TS-1.5,3,3);}
 for(const p of parts){const a=clamp(p.vida/.7,0,1);
  ctx.fillStyle=p.tipo==='sangre'?`rgba(149,31,24,${a})`:p.tipo==='chispa'?`rgba(232,197,71,${a})`:`rgba(109,120,131,${a*.5})`;
  ctx.beginPath();ctx.arc(p.x*TS,p.y*TS,p.r,0,6.283);ctx.fill();}
 ctx.restore();
 /* tinte de barrio: cada zona con su color, mezclado poco a poco */
 const D=distDe(clamp(player.x|0,0,MW-1),clamp(player.y|0,0,MH-1));
 const rgb=hexRGB(D.tinte);
 cam.tinte[0]=lerp(cam.tinte[0],rgb[0],.02);cam.tinte[1]=lerp(cam.tinte[1],rgb[1],.02);
 cam.tinte[2]=lerp(cam.tinte[2],rgb[2],.02);
 ctx.fillStyle=`rgba(${cam.tinte[0]|0},${cam.tinte[1]|0},${cam.tinte[2]|0},.13)`;
 ctx.fillRect(0,0,W,H);}
function pintaSombraChar(e,esJugador){
 ctx.fillStyle='rgba(0,0,0,.34)';
 ctx.beginPath();ctx.ellipse(e.x*TS,e.y*TS+8,9,4,0,0,6.283);ctx.fill();
 const pose=e.herido>0?'herido':e.pose||'quieto';
 pintaChar(ctx,e.arq,e.d8,pose,e.x*TS,e.y*TS);
 const aid=esJugador?S.armaAct:e.arma;
 if(aid&&ARMA_MANO[aid])ctx.drawImage(ARMA_MANO[aid][e.d8],Math.round(e.x*TS)-10,Math.round(e.y*TS)-19);
 if(esJugador&&fogT>0&&fogTipo)ctx.drawImage(FOG[fogTipo][fogD],Math.round(e.x*TS)-12,Math.round(e.y*TS)-12);}
function pintaCoche(c,esPoli,mio){
 const spr=esPoli?VEH.patrullaRot[Math.sin(c.luz)>0?0:1]
  :(!c.vivo?VEH_QUEMADO[c.tipo]:VEH[c.tipo][c.lib%LIBREAS.length]);
 const w=spr.width,h=spr.height;
 ctx.save();ctx.translate(c.x*TS,c.y*TS);
 ctx.fillStyle='rgba(0,0,0,.32)';ctx.fillRect(-w/2+2,-h/2+3,w-2,h-2);
 ctx.rotate(c.ang);ctx.drawImage(spr,-w/2,-h/2);
 if(mio){ctx.strokeStyle='rgba(232,197,71,.55)';ctx.lineWidth=1;ctx.strokeRect(-w/2,-h/2,w,h);}
 if(c.marcado){ctx.restore();
  ctx.drawImage(MARCA.obj||(MARCA.obj=marcaAbajo(C.mostaza)),c.x*TS-7,c.y*TS-34-Math.abs(Math.sin(performance.now()/300))*5);
  return;}
 ctx.restore();}
function dibInterior(){
 const m=S.interior.mapa,iw=Math.max(...m.map(r=>r.length)),ih=m.length;
 const z=clamp((H/TS)/13.5,1.4,2.6);
 const vw=W/z/TS, vh=H/z/TS;
 const cx=iw<=vw?iw/2:clamp(player.x,vw/2,iw-vw/2);
 const cy=ih<=vh?ih/2:clamp(player.y,vh/2,ih-vh/2);
 ctx.save();ctx.translate(W/2,H/2);ctx.scale(z,z);ctx.translate(-cx*TS,-cy*TS);
 const su=TILE[S.interior.suelo],pa=TILE[S.interior.pared];
 for(let y=0;y<ih;y++)for(let x=0;x<m[y].length;x++){
  ctx.drawImage(su,x*TS,y*TS);const ch=m[y][x];
  if(ch==='#')ctx.drawImage(pa,x*TS,y*TS);
  else if(TILE_INT[ch])ctx.drawImage(TILE[TILE_INT[ch]],x*TS,y*TS);
  else if(ch==='D'){ctx.fillStyle=C.maderaO;ctx.fillRect(x*TS,y*TS,TS,TS);
   ctx.fillStyle=C.mostaza;ctx.fillRect(x*TS+2,y*TS+TS-5,TS-4,3);}}
 const L=[[player.y,()=>pintaSombraChar(player,true)]];
 S.interior.npcs.forEach(n=>L.push([n.y,()=>{
  ctx.fillStyle='rgba(0,0,0,.34)';ctx.beginPath();ctx.ellipse(n.x*TS,n.y*TS+8,9,4,0,0,6.283);ctx.fill();
  pintaChar(ctx,n.arq,0,'quieto',n.x*TS,n.y*TS);
  const m2=MISIONES[S.misionIdx];
  const w=anchoTexto(n.n,1)+6;
  ctx.fillStyle='rgba(7,9,12,.82)';ctx.fillRect(n.x*TS-w/2,n.y*TS-33,w,13);
  texto(ctx,n.n,n.x*TS-w/2+3,n.y*TS-32,1,'hueso');
  if(!S.mision&&m2&&m2.giver===n.n){ctx.fillStyle=C.mostaza;
   const b=Math.abs(Math.sin(performance.now()/300))*4;
   ctx.fillRect(n.x*TS-2,n.y*TS-50-b,4,10);ctx.fillRect(n.x*TS-2,n.y*TS-37-b,4,3);}}]));
 L.sort((a,b)=>a[0]-b[0]).forEach(l=>l[1]());
 ctx.restore();}

/*═══════════════ HUD ═══════════════*/
let _mb=null;
function mapaBase(){
 if(_mb)return _mb;
 _mb=lienzo(MW,MH);const g=_mb.getContext('2d');
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){const t=map[y*MW+x];
  g.fillStyle=t===AGUA?C.agua:t===EDIF?'#262a30':t===PARQUE?'#2e4a2e':t===PLAZA?'#5c574d'
   :t===MUELLE?'#453d33':t===PATIO?'#3a3630':t===PUENTE?C.grisL:'#4a505a';
  g.fillRect(x,y,1,1);}
 return _mb;}
function cajaHUD(x,y,w,h){
 ctx.fillStyle='rgba(7,9,12,.72)';ctx.fillRect(x,y,w,h);
 ctx.fillStyle='rgba(141,153,164,.35)';ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);
 ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h);}
function dibHUD(){
 const T0=Math.max(12,(cv.height/DPR)*0);
 const marg=10, top=marg+(window.visualViewport?0:0);
 /* ── radar circular con anillo de salud ── */
 const R=52, cxr=marg+R, cyr=marg+R+6;
 ctx.save();
 ctx.beginPath();ctx.arc(cxr,cyr,R,0,6.283);ctx.closePath();
 ctx.fillStyle='rgba(7,9,12,.85)';ctx.fill();
 ctx.save();ctx.clip();
 const esc=R*2/64;
 ctx.imageSmoothingEnabled=false;
 ctx.translate(cxr,cyr);ctx.scale(esc,esc);ctx.translate(-player.x,-player.y);
 ctx.drawImage(mapaBase(),0,0);
 POI.forEach(p=>{ctx.fillStyle=C.carbon;ctx.fillRect(p.p.x-2,p.p.y-2,4,4);
  ctx.fillStyle=p.c;ctx.fillRect(p.p.x-1.3,p.p.y-1.3,2.6,2.6);});
 const ob=objetivo();
 if(ob){ctx.fillStyle=C.mostaza;ctx.fillRect(ob.x-2.2,ob.y-2.2,4.4,4.4);}
 policia.forEach(p=>{ctx.fillStyle='#4d9dff';ctx.fillRect(p.x-1.5,p.y-1.5,3,3);});
 enemigos.forEach(e=>{ctx.fillStyle='#ff5a3c';ctx.fillRect(e.x-1.3,e.y-1.3,2.6,2.6);});
 ctx.fillStyle=C.blanco;ctx.fillRect(player.x-1.6,player.y-1.6,3.2,3.2);
 ctx.restore();
 /* anillo de salud */
 ctx.lineWidth=5;
 ctx.strokeStyle='rgba(28,34,41,.9)';ctx.beginPath();ctx.arc(cxr,cyr,R+3,0,6.283);ctx.stroke();
 const frac=clamp(S.hp/100,0,1);
 ctx.strokeStyle=frac>.5?C.sangre:frac>.25?'#d9591f':'#ff3b30';
 ctx.beginPath();ctx.arc(cxr,cyr,R+3,-Math.PI/2,-Math.PI/2+6.283*frac);ctx.stroke();
 ctx.lineWidth=1;ctx.strokeStyle='rgba(141,153,164,.45)';
 ctx.beginPath();ctx.arc(cxr,cyr,R+6,0,6.283);ctx.stroke();
 /* flecha de brújula al objetivo, pegada al borde del radar */
 if(ob){const ang=Math.atan2(ob.y-player.y,ob.x-player.x);
  const d8=((2-Math.round(ang/(Math.PI/4)))%8+8)%8;
  const fl=MARCA['f'+d8]||(MARCA['f'+d8]=flechaDir(d8,C.mostaza));
  ctx.drawImage(fl,cxr+Math.cos(ang)*(R-11)-8,cyr+Math.sin(ang)*(R-11)-8);}
 ctx.restore();
 /* ── estrellas ── */
 const exd=W-marg;
 for(let i=0;i<5;i++)ctx.drawImage(i<S.estrellas?ICO.estrella:ICO.estrellaOff,exd-24-i*20,marg+2,20,20);
 /* ── dinero ── */
 const din=String(Math.round(S.dinero));
 const wd=anchoTexto(din,2)+34;
 cajaHUD(exd-wd,marg+26,wd,26);
 ctx.drawImage(ICO.euro,exd-wd+3,marg+29,20,20);
 texto(ctx,din,exd-wd+26,marg+29,2,'ambar');
 /* ── reloj y día ── */
 const hr=String((S.min/60)|0).padStart(2,'0')+':'+String(S.min%60).padStart(2,'0');
 const wh=Math.max(anchoTexto(hr,2),anchoTexto('DIA '+S.dia,1))+10;
 cajaHUD(exd-wh,marg+58,wh,36);
 texto(ctx,hr,exd-wh+5,marg+61,2,'hueso');
 texto(ctx,'DIA '+S.dia,exd-wh+5,marg+81,1,'hueso');
 /* ── energía y hambre bajo el radar ── */
 const by=cyr+R+14;
 const barra=(y,v,col,ico)=>{
  ctx.drawImage(ico,marg,y-3,14,14);
  ctx.fillStyle='rgba(7,9,12,.8)';ctx.fillRect(marg+18,y,74,8);
  ctx.fillStyle='rgba(141,153,164,.4)';ctx.fillRect(marg+18,y,74,1);ctx.fillRect(marg+18,y+7,74,1);
  ctx.fillStyle=col;ctx.fillRect(marg+19,y+1,72*clamp(v,0,1),6);};
 barra(by,S.energia,'#4d9de0',ICO.energia);
 barra(by+16,S.hambre,'#e0a14d',ICO.hambre);
 /* ── barrio ── */
 const D=distDe(clamp(player.x|0,0,MW-1),clamp(player.y|0,0,MH-1));
 const nb=S.escena==='interior'?S.interior.n:D.n;
 texto(ctx,nb,marg,by+32,1,'hueso');
 /* ── arma y munición ── */
 const a=arma(S.armaAct);
 const mun=a.inf?'∞':String(S.armas[a.id]||0);
 const wa=Math.max(anchoTexto(a.n,1),anchoTexto(mun,2))+34;
 const ay=H-218;
 cajaHUD(W-marg-wa,ay,wa,36);
 ctx.drawImage(ICO[a.id]||ICO.punos,W-marg-wa+3,ay+8,22,22);
 texto(ctx,a.n,W-marg-wa+28,ay+4,1,'hueso');
 texto(ctx,mun,W-marg-wa+28,ay+16,2,'ambar');
 /* ── misión o curro ── */
 if(S.escena==='ciudad'&&(S.mision||S.job)){
  const o=objetivo(),dm=o?Math.round(dist(o,player)*8):0;
  const t1=S.mision?S.mision.def.n:S.job.tt;
  const t2=S.mision?pasoActual().txt:(S.job.fase===0?'RECOGIDA':'ENTREGA');
  const t3=dm+' M'+(S.mision&&S.mision.limite?'  '+Math.max(0,Math.ceil(S.mision.limite-S.mision.t))+' S':
   (S.job?'  '+S.job.pago+' €':''));
  const wm=Math.max(anchoTexto(t1,1),anchoTexto(t2,1),anchoTexto(t3,1))+12;
  const mx=clamp((W-wm)/2,4,W-wm-4), my=cyr+R+62;
  cajaHUD(mx,my,wm,42);
  ctx.fillStyle=C.mostaza;ctx.fillRect(mx,my,wm,2);
  texto(ctx,t1,mx+6,my+4,1,'ambar');
  texto(ctx,t2,mx+6,my+16,1,'hueso');
  texto(ctx,t3,mx+6,my+28,1,'ambar');}
 /* ── deuda ── */
 if(S.deuda>0){const td='ALQUILER '+S.deuda+' €';
  texto(ctx,td,marg,by+46,1,'rojo');}
 /* ── pista contextual ── */
 if(pista1){const w=anchoTexto(pista1,1)+12;
  cajaHUD((W-w)/2,H-190,w,16);
  texto(ctx,pista1,(W-w)/2+6,H-188,1,'hueso');}
 /* ── aviso ── */
 if(avisoT>0&&aviso1){
  let esc=2;while(esc>1&&anchoTexto(aviso1,esc)>W-30)esc--;
  const w=Math.min(W-12,anchoTexto(aviso1,esc)+16), al=clamp(avisoT,0,1);
  ctx.globalAlpha=al;cajaHUD((W-w)/2,H*.42,w,11*esc+8);
  texto(ctx,aviso1,(W-w)/2+8,H*.42+4,esc,'ambar');ctx.globalAlpha=1;}
 /* ── rótulo grande ── */
 if(grandeT>0&&grande1){let esc=W<420?3:4;
  while(esc>1&&anchoTexto(grande1,esc)>W-20)esc--;
  const w=anchoTexto(grande1,esc);
  const al=clamp(grandeT,0,1);
  ctx.globalAlpha=al;
  texto(ctx,grande1,(W-w)/2,H*.3,esc,'ambar');ctx.globalAlpha=1;}}

/*═══════════════ GUARDADO ═══════════════*/
const CLAVE='bilbocity_v4';
const alm={
 async get(k){try{if(window.storage){const r=await window.storage.get(k);return r?r.value:null;}
  return localStorage.getItem(k);}catch(e){return null;}},
 async set(k,v){try{if(window.storage)await window.storage.set(k,v);else localStorage.setItem(k,v);}catch(e){}},
 async del(k){try{if(window.storage)await window.storage.delete(k);else localStorage.removeItem(k);}catch(e){}}};
function guardar(){
 alm.set(CLAVE,JSON.stringify({
  dinero:S.dinero,hp:S.hp,energia:S.energia,hambre:S.hambre,min:S.min,dia:S.dia,rep:S.rep,
  deuda:S.deuda,alquiler:S.alquiler,ultCobro:S.ultCobro,tiene:S.tiene,contrato:S.contrato,
  armas:Object.fromEntries(Object.entries(S.armas).map(([k,v])=>[k,v===Infinity?-1:v])),
  armaAct:S.armaAct,misionIdx:S.misionIdx,x:player.x,y:player.y}));}
async function cargar(){
 const raw=await alm.get(CLAVE);if(!raw)return false;
 try{const d=JSON.parse(raw);
  Object.assign(S,{dinero:d.dinero,hp:d.hp??100,energia:d.energia,hambre:d.hambre,min:d.min,dia:d.dia,
   rep:d.rep||S.rep,deuda:d.deuda||0,alquiler:d.alquiler||220,ultCobro:d.ultCobro||1,
   tiene:d.tiene||S.tiene,contrato:d.contrato||null,misionIdx:d.misionIdx||0,armaAct:d.armaAct||'punos'});
  S.armas={};Object.entries(d.armas||{punos:-1}).forEach(([k,v])=>S.armas[k]=v===-1?Infinity:v);
  if(S.armas.punos===undefined)S.armas.punos=Infinity;
  player.x=d.x;player.y=d.y;
  if(S.tiene.deportivo){tuCoche.tipo='deportivo';tuCoche.lib=2;tuCoche.vmax=15.5;}
  else if(S.tiene.furgo){tuCoche.tipo='furgoLarga';tuCoche.vmax=9.5;}
  tuCoche.x=poi('piso').p.x+1.4;tuCoche.y=poi('piso').p.y;
  return true;}catch(e){return false;}}

/*═══════════════ ARRANQUE ═══════════════*/
const tituloEl=document.getElementById('titulo'),tcv=document.getElementById('tcv'),cargaEl=document.getElementById('carga');
function fondoTitulo(){
 const g=tcv.getContext('2d');tcv.width=MW;tcv.height=MH;g.imageSmoothingEnabled=false;
 g.drawImage(mapaBase(),0,0);
 g.fillStyle='rgba(183,69,31,.3)';g.fillRect(0,0,MW,MH);}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
async function arrancar(){
 const pasos=[
  ['tiles',()=>generarTiles()],
  ['vehículos',()=>generarVeh()],
  ['props',()=>generarProps()],
  ['iconos',()=>generarIconos()],
  ['la ciudad',()=>{generarCiudad();colocarPOIs();}],
  ['el barrio',()=>{player.x=poi('piso').p.x;player.y=poi('piso').p.y;poblar();}],
  ['a la gente',()=>{['protagonista','ertzaina','maton','maton2'].forEach(hoja);}],
 ];
 for(const[n,f]of pasos){cargaEl.textContent='forjando '+n+'…';await espera(12);f();}
 cargaEl.textContent='';
 fondoTitulo();
 const hay=await cargar();
 const bc=document.getElementById('btnCont'),bn=document.getElementById('btnNuevo');
 if(!hay){bc.style.opacity=.32;bc.style.pointerEvents='none';}
 bn.textContent=hay?'Partida nueva':'Empezar';
 const entrar1=nuevo=>{audioInit();tituloEl.style.display='none';
  if(!arrancado){arrancado=true;ult=performance.now();requestAnimationFrame(bucle);}
  aviso(nuevo?'VIVE DONDE PUEDAS. COBRA DONDE TOQUE':'PARTIDA CARGADA · DIA '+S.dia,3.4);};
 bc.addEventListener('click',()=>{if(hay)entrar1(false);});
 bn.addEventListener('click',async()=>{if(hay){await alm.del(CLAVE);location.reload();}else entrar1(true);});
}
arrancar();
})();
</script>
