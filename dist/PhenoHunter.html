<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Strainmon</title>
  <style>
/* ============================================================
   PHENO HUNTER — style.css
   Estética GBA: marco cálido, tipografía monoespaciada, pixel-perfect.
   ============================================================ */
:root {
  --bg: #12100c;
  --panel: #1d2430;
  --panel2: #242c3a;
  --ink: #eaf0e6;
  --dim: #97a1ad;
  --accent: #79c94c;
  --accent2: #f2b134;
  --line: #33404f;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  font-size: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: radial-gradient(circle at 50% 0%, #1c3a1a 0%, #0d120b 72%);
  color: var(--ink);
  font-family: "Courier New", ui-monospace, monospace;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; }

/* --------- HUD --------- */
#hud {
  width: 100%; max-width: 900px; display: flex; justify-content: space-between;
  gap: 8px; padding: 8px 12px; flex-wrap: wrap;
}
.hud-left, .hud-right { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: .72rem; white-space: nowrap; color: var(--ink);
}

/* --------- Stage / canvas --------- */
#stage { position: relative; line-height: 0; box-shadow: var(--shadow); border-radius: 8px; overflow: hidden;
  border: 3px solid #2a2118; background: #000; }
#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* --------- Overlay (paneles) --------- */
#overlay { position: absolute; inset: 0; display: none; line-height: 1.35; }
#overlay.active { display: flex; }
#overlay.center { align-items: center; justify-content: center; }
#overlay.bottom { align-items: flex-end; justify-content: center; }
#overlay::before { content: ""; position: absolute; inset: 0; background: rgba(6,8,10,.62); backdrop-filter: blur(1px); }
#overlay > * { position: relative; z-index: 2; }

/* --------- Toasts --------- */
#toasts { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 50;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: rgba(20,26,34,.95); border: 1px solid var(--line); color: var(--ink);
  padding: 6px 14px; border-radius: 8px; font-size: .78rem; opacity: 0; transform: translateY(-8px);
  transition: .3s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.ok { border-color: var(--accent); }
.toast.bad { border-color: #e05a5a; }

/* --------- Botones --------- */
.btn { font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
  color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: .82rem; transition: .12s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: #10240f; font-weight: bold; border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: .72rem; }
.btn.big { padding: 12px 30px; font-size: 1rem; }

/* --------- Título --------- */
#overlay.title::before { background: rgba(6,10,8,.9); }
.title-screen { text-align: center; padding: 20px; }
.logo { font-size: 2.6rem; font-weight: 900; letter-spacing: 2px; color: var(--accent); text-shadow: 3px 3px 0 #10240f; }
.logo span { color: var(--accent2); display: block; letter-spacing: 8px; font-size: 2rem; }
.tagline { color: var(--dim); margin: 6px 0 14px; letter-spacing: 1px; }
.title-art canvas { image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); }
.title-btns { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
.title-help { color: var(--dim); font-size: .72rem; line-height: 1.7; }

/* --------- Diálogo --------- */
.dialog-box { width: min(92%, 640px); margin-bottom: 14px; background: var(--panel);
  border: 2px solid var(--accent); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); }
.dialog-box p { font-size: .92rem; }
.dlg-hint { text-align: right; color: var(--dim); font-size: .7rem; margin-top: 8px; }
.dialog-box.has-portrait { display: flex; gap: 14px; align-items: flex-start; }
.dlg-portrait { flex: 0 0 auto; text-align: center; }
.dlg-portrait canvas { image-rendering: pixelated; background: #141b13; border: 1px solid var(--line); border-radius: 8px; }
.dlg-portrait span { display: block; font-size: .68rem; color: var(--accent2); margin-top: 4px; max-width: 56px; }
.dlg-text { flex: 1; min-width: 0; }

/* --------- Paneles genéricos --------- */
.panel { width: min(94%, 640px); max-height: 88%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.panel.wide { width: min(96%, 820px); }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel2); }
.panel-head h2 { font-size: 1rem; } .panel-head small { color: var(--dim); font-weight: normal; font-size: .72rem; margin-left: 6px; }
.panel-body { padding: 14px 16px; overflow-y: auto; }
.panel-body h3 { font-size: .8rem; color: var(--accent2); margin: 12px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
.x { background: none; border: none; color: var(--dim); font-size: 1.1rem; cursor: pointer; }
.x:hover { color: #fff; }
.dim { color: var(--dim); font-size: .8rem; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.center-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
.warn { color: var(--accent2); font-size: .72rem; margin-top: 4px; }

/* --------- Mochila / grids de items --------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
.item.sel { border-color: var(--accent); }
.item b { font-size: .84rem; } .item small { display: block; color: var(--dim); font-size: .72rem; margin: 4px 0; }
.item .tag { font-size: .68rem; color: var(--accent); }

/* --------- Ficha de espécimen --------- */
.spec-card { display: flex; gap: 12px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; }
.spec-art canvas { image-rendering: pixelated; background: #161d15; border-radius: 6px; border: 1px solid var(--line); }
.spec-info { flex: 1; min-width: 0; }
.spec-title { font-size: .92rem; font-weight: bold; } .spec-title small { color: var(--dim); font-weight: normal; font-size: .68rem; }
.tier { display: inline-block; font-size: .72rem; color: var(--tc); border: 1px solid var(--tc); border-radius: 999px; padding: 1px 8px; margin: 4px 0; }
.landrace { display: inline-block; font-size: .68rem; color: #7bd66b; border: 1px solid #7bd66b; border-radius: 999px; padding: 1px 8px; }
.hybrid { display: inline-block; font-size: .68rem; color: #8a7dff; border: 1px solid #8a7dff; border-radius: 999px; padding: 1px 8px; }
.spec-desc { font-size: .76rem; color: var(--ink); margin: 4px 0; }
.spec-meta { font-size: .72rem; color: var(--dim); margin-bottom: 6px; }
.spec-stats .stat { display: flex; align-items: center; gap: 6px; font-size: .68rem; margin: 2px 0; }
.stat span { width: 62px; color: var(--dim); } .stat b { width: 26px; text-align: right; }
.bar { flex: 1; height: 7px; background: #121821; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.muts { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.mut { font-size: .66rem; background: #3a2350; color: #d9a6ff; border: 1px solid #6b3fa0; border-radius: 999px; padding: 1px 8px; }

/* --------- Banco --------- */
.panel-body.list { display: flex; flex-direction: column; gap: 10px; }
.bank-row { display: flex; gap: 10px; align-items: stretch; }
.bank-row .spec-card { flex: 1; }
.bank-actions { display: flex; flex-direction: column; gap: 6px; justify-content: center; }

/* --------- Encuentro --------- */
.encounter { width: min(94%, 560px); background: var(--panel); border: 2px solid var(--accent2);
  border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.enc-head { text-align: center; color: var(--accent2); font-weight: bold; margin-bottom: 8px; }
.enc-body { display: flex; gap: 14px; }
.enc-art canvas { image-rendering: pixelated; background: #101710; border-radius: 8px; border: 1px solid var(--line); }
.enc-side { flex: 1; }
.enc-name { font-size: 1rem; font-weight: bold; } .enc-name small { color: var(--dim); font-size: .68rem; }
.enc-rare { color: var(--accent2); font-size: .76rem; margin: 3px 0; }
.enc-desc { font-size: .76rem; color: var(--ink); }
.enc-env { font-size: .7rem; color: var(--dim); margin-top: 4px; }
.enc-fields { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.enc-fields span { font-size: .66rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.enc-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0 6px; }
.enc-tools .tool { display: flex; flex-direction: column; align-items: center; font-size: .76rem; }
.enc-tools .tool small { color: var(--dim); font-size: .62rem; }
.enc-actions { text-align: center; }
.enc-msg { text-align: center; min-height: 18px; margin-top: 8px; font-size: .8rem; }
.enc-msg.ok { color: var(--accent); } .enc-msg.bad { color: #e88; }

/* --------- Catálogo --------- */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.cat-card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.cat-card canvas { image-rendering: pixelated; background: #141b13; border-radius: 6px; }
.cc-name { font-size: .76rem; font-weight: bold; margin-top: 4px; }
.cc-tier { font-size: .7rem; } .cc-meta { font-size: .66rem; color: var(--dim); }
.cc-mut { font-size: .62rem; color: #d9a6ff; } .cc-count { font-size: .62rem; color: var(--dim); margin-top: 2px; }
.cat-grid.select .pick { cursor: pointer; } .cat-grid.select .pick.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }

/* --------- Laboratorio --------- */
.breed-slots { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0 6px; flex-wrap: wrap; }
.slot { width: 90px; min-height: 110px; background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
.slot canvas { image-rendering: pixelated; }
.cross-sign, .cross-eq { font-size: 1.4rem; color: var(--accent2); }
.newbadge { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #10240f; font-weight: bold;
  padding: 6px 14px; border-radius: 999px; margin-bottom: 10px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

/* --------- Mercado --------- */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.shop-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.shop-item b { font-size: .84rem; } .shop-item small { color: var(--dim); font-size: .72rem; flex: 1; }

/* --------- Misiones --------- */
.quest { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.quest.done { opacity: .6; } .q-name { font-size: .86rem; font-weight: bold; }
.q-desc { font-size: .76rem; color: var(--ink); margin: 3px 0; } .q-reward { font-size: .7rem; color: var(--accent2); }

/* --------- Controles táctiles --------- */
#touch { display: none; width: 100%; max-width: 900px; justify-content: space-between; padding: 12px 18px; }
.dpad { position: relative; width: 132px; height: 132px; }
.tb { font-family: inherit; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  border-radius: 10px; font-size: 1rem; cursor: pointer; }
.dpad .tb { position: absolute; width: 44px; height: 44px; }
.dpad .up { top: 0; left: 44px; } .dpad .down { bottom: 0; left: 44px; }
.dpad .left { top: 44px; left: 0; } .dpad .right { top: 44px; right: 0; }
.abtns { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.abtns .a { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #10240f; font-weight: bold; }
.menu-keys { display: flex; gap: 8px; } .menu-keys .s { width: 44px; height: 44px; }

/* --------- Invernadero / cultivo --------- */
.garden-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 6px; }
.plot { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 170px; justify-content: space-between; }
.plot.ready { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.plot.empty { border-style: dashed; justify-content: center; }
.plot-add { cursor: pointer; color: var(--dim); font-size: 1.8rem; display: flex; flex-direction: column; align-items: center; }
.plot-add small { font-size: .7rem; } .plot-add:hover { color: var(--accent); }
.plot-sprite { position: relative; background:
    linear-gradient(0deg, rgba(90,140,70,.25), rgba(20,26,20,.1)); border-radius: 8px; padding: 2px;
    height: 96px; width: 100px; display: flex; align-items: flex-end; justify-content: center; }
.plot-sprite img { image-rendering: pixelated; display: block; height: 92px; width: auto; max-width: 96px; object-fit: contain; object-position: bottom; }
.phdot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); }
.plot-name { font-size: .78rem; font-weight: bold; } .plot-stage { font-size: .7rem; }
.plot .bar { width: 100%; }
.plot.sick { border-color: #c8813a; box-shadow: 0 0 0 1px rgba(200,129,58,.5) inset; }
.plot-badge { position: absolute; top: 4px; left: 4px; font-size: .58rem; font-weight: bold; padding: 1px 5px;
  border-radius: 6px; background: rgba(0,0,0,.55); color: #cfe8c8; letter-spacing: .3px; }
.plot-badge.warn { background: rgba(200,150,40,.85); color: #241a05; }
.plot-badge.bad { background: rgba(200,60,60,.9); color: #fff; }
.plot-badge.ok { background: rgba(70,150,80,.85); color: #eaffe6; }
.vitals { display: flex; gap: 6px; width: 100%; }
.vit { flex: 1; display: flex; align-items: center; gap: 3px; font-size: .62rem; }
.vit b { flex: 1; display: block; height: 5px; border-radius: 3px; background: #121821; overflow: hidden; }
.vit b i { display: block; height: 100%; background: #2a7bd0; }
.vit.health b i { background: #57b85a; }
.vit.water.warn b i { background: #c89628; } .vit.water.bad b i { background: #c83c3c; }
.vit.health.bad b i { background: #c83c3c; }
.plot-actions { display: flex; gap: 4px; }
.btn.small.warn { background: #7a4e17; border-color: #c8813a; color: #ffe9c4; }
.hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.btn.hub { padding: 18px 10px; line-height: 1.5; font-size: .8rem; }

/* --------- Investigación / ADN --------- */
.pill.event { background: linear-gradient(90deg, #3a2350, #6b3fa0); border-color: #a06bff; color: #f0e0ff; animation: pulse 1.2s infinite; }
.pill.heat { background: linear-gradient(90deg, #5a1420, #b02436); border-color: #ff5a6a; color: #ffe0e4; animation: pulse 0.8s infinite; }
.dna { font-family: monospace; font-size: .7rem; letter-spacing: 1px; word-break: break-all; background: #0f1520;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: #7bd66b; line-height: 1.6; }
.hidden-list { list-style: none; font-size: .76rem; } .hidden-list li { padding: 3px 0; border-bottom: 1px solid var(--line); }
.hidden-list i { color: var(--accent2); font-style: normal; }
.rel-row { display: flex; align-items: center; gap: 8px; font-size: .72rem; margin: 4px 0; }
.rel-row span { width: 110px; } .rel-row small { color: var(--dim); }
.seq-head { margin-bottom: 8px; }
.stats-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 10px 0;
  text-align: left; font-size: .8rem; line-height: 1.8; width: 100%; }
.stats-box small { color: var(--dim); }
.ev-row { display: flex; gap: 10px; align-items: flex-start; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
.ev-ico { font-size: 1.3rem; } .ev-row b { font-size: .82rem; } .ev-row small { display: block; color: var(--dim); font-size: .72rem; }

/* ============================================================
   CONSOLA PORTÁTIL "STRAINBOY" (diseño original, no comercial)
   Ocupa toda la pantalla; LCD grande para jugar bien.
   ============================================================ */
#device {
  position: fixed; inset: 0; width: 100vw; height: 100dvh;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vmin;
  padding: 2vmin 3vmin;
  background:
    radial-gradient(120% 80% at 50% -10%, #2e7d55 0%, #1f5e40 40%, #163f2c 100%);
  box-shadow: inset 0 0 12vmin rgba(0,0,0,.4);
  overflow: hidden;
}
/* Columna interior con la silueta real de la consola DMG (cuerpo ~90×148 mm,
   relación an/al ≈ 0.61): el ancho se ata a la altura de viewport para que
   la máquina se lea como un portátil de bolsillo en cualquier pantalla. */
#device > * { width: min(96vw, 60vh, 600px); }

#brand { display: flex; align-items: center; gap: 10px; padding: 0 4px; height: 5vmin; min-height: 26px; }
#brand .mark { font-weight: 900; letter-spacing: 1px; color: #eafff3; font-size: clamp(14px, 3.2vmin, 24px); text-shadow: 1px 1px 0 #0c281c; }
#brand .mark b { color: #ffd34d; }
#brand .led { width: 10px; height: 10px; border-radius: 50%; background: #ff5d5d; box-shadow: 0 0 8px #ff5d5d, inset 0 0 2px #7a1515; }
#brand .tag { margin-left: auto; color: #bfe8cf; font-size: clamp(7px, 1.6vmin, 11px); letter-spacing: 2px; }

/* --------- LCD --------- */
#lcd {
  position: relative; flex: 0 1 auto; min-height: 0; max-height: 58vh; margin: 0 auto;
  /* Marco de la LCD: aloja una pantalla activa 10:9 (matriz 160×144) y una
     banda de bisel inferior más ancha, como el cuerpo DMG del manual. */
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  background: #0c110d; border-radius: 12px 12px 16px 16px;
  padding: 2.4vmin 2.4vmin 5.2vmin;
  box-shadow: 0 8px 26px rgba(0,0,0,.5), inset 0 0 0 2px #08120b, inset 0 0 3vmin rgba(0,0,0,.6);
  border: 2px solid #0a1a10;
}
/* Rótulo bajo la pantalla (banda inferior del bisel), diseño propio. */
#lcd::after { content: "DOT-MATRIX · 160×144 · 4-TONE"; position: absolute;
  left: 0; right: 0; bottom: 1.4vmin; text-align: center; pointer-events: none;
  color: #16482f; font-size: clamp(6px, 1.3vmin, 10px); letter-spacing: 2px; font-weight: 700; }
/* Pantalla activa: altura manda y la relación 10:9 fija el ancho -> píxeles
   cuadrados exactos, sin deformación. */
.lcd-inner { position: relative; height: 100%; aspect-ratio: 10 / 9; width: auto; max-width: 100%;
  overflow: hidden; border-radius: 6px;
  background: #8b9c2f; box-shadow: inset 0 0 0 2px #05321f, inset 0 0 20px rgba(0,0,0,.45); }
#lcd .lcd-glare { position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
  background: linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 35%); }
/* object-fit:contain preserva el 10:9 exacto -> píxeles cuadrados (matriz de
   puntos 160×144 del manual), sin deformar aunque el marco no sea 10:9. */
#screen { width: 100%; height: 100%; display: block; object-fit: contain;
  background: #8b9c2f; image-rendering: pixelated; image-rendering: crisp-edges; }

/* HUD dentro de la LCD (barra fina superior) */
#hud { position: absolute; top: 0; left: 0; right: 0; z-index: 3;
  max-width: none; padding: 3px 5px; gap: 4px; pointer-events: none;
  background: linear-gradient(180deg, rgba(8,12,10,.72), rgba(8,12,10,0)); }
.pill { font-size: clamp(7px, 1.5vmin, 11px); padding: 2px 7px; }

#overlay { position: absolute; inset: 0; z-index: 5; }
#toasts { top: 4px; z-index: 8; }

/* --------- Controles físicos --------- */
#controls { display: flex; align-items: center; justify-content: space-between; gap: 4vmin; }
.dpad { position: relative; width: 34vmin; height: 34vmin; max-width: 150px; max-height: 150px; flex: 0 0 auto; }
.db { position: absolute; width: 33%; height: 33%; background: linear-gradient(180deg, #2a2f35, #14181c);
  color: #cfd6dd; border: 1px solid #0a0d10; border-radius: 6px; font-size: 2.4vmin; cursor: pointer;
  box-shadow: 0 2px 0 #0a0d10; -webkit-user-select: none; user-select: none; }
.db:active { transform: translateY(1px); box-shadow: 0 1px 0 #0a0d10; }

  <script>
/* ==== src/util.js ==== */
/* ============================================================
   PHENO HUNTER — util.js
   Núcleo de utilidades: RNG, matemáticas, helpers de color.
   ============================================================ */
(function (PH) {
  'use strict';

  // ---- RNG con semilla (mulberry32) para generación reproducible ----
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // RNG global del juego (no sembrado -> usa Math.random para el mundo vivo)
  const RNG = {
    // número flotante [0,1)
    f: () => Math.random(),
    // entero [min,max] inclusivo
    i: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
    // rango flotante
    r: (min, max) => min + Math.random() * (max - min),
    // probabilidad p (0..1)
    chance: (p) => Math.random() < p,
    // elemento aleatorio de un array
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    // elección ponderada: [{w, ...}] devuelve el objeto
    weighted: (arr, wkey) => {
      let total = 0;
      for (const it of arr) total += (wkey ? it[wkey] : it.w) || 0;
      let roll = Math.random() * total;
      for (const it of arr) {
        roll -= (wkey ? it[wkey] : it.w) || 0;
        if (roll <= 0) return it;
      }
      return arr[arr.length - 1];
    },
    // baraja Fisher-Yates (in place)
    shuffle: (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    // gaussiana aproximada, media 0, desv 1
    gauss: () => {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
  };

  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Color helpers ----
  function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => {
      const c = l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return Math.round(255 * c).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  }
  function shade(hex, amt) {
    // amt: -1..1  oscurece/aclara
    const n = parseInt(hex.replace('#', ''), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255;
    const p = Math.abs(amt);
    r = Math.round((t - r) * p) + r;
    g = Math.round((t - g) * p) + g;
    b = Math.round((t - b) * p) + b;
    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
  }

  // Formato: 12345 -> "12.3k"
  function fmt(n) {
    if (n < 1000) return '' + n;
    if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k';
    return (n / 1e6).toFixed(1) + 'M';
  }

  function id() { return 'g' + (id._c = (id._c || 0) + 1) + '_' + Math.floor(Math.random() * 1e6).toString(36); }

  // capitaliza
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  PH.util = { mulberry32, RNG, clamp, lerp, hsl, hslToHex, shade, fmt, id, cap };
})(window.PH = window.PH || {});

/* ==== src/genetics.js ==== */
/* ============================================================
   PHENO HUNTER — genetics.js
   Motor genético diploide con dominancia, poligenes, mutaciones,
   poliploidía, patrones, secuencia de ADN y parentesco.
   Es el corazón del juego.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp, hslToHex, cap } = PH.util;

  /* --------------------------------------------------------
     Definición de GENES
     -------------------------------------------------------- */

  // Color de flor — cualitativo. hue base para render.
  const COLORS = [
    { key: 'verde',    dom: 5, hue: 110, rarity: 1 },
    { key: 'lima',     dom: 4, hue: 85,  rarity: 2 },
    { key: 'ambar',    dom: 4, hue: 40,  rarity: 3 },
    { key: 'purpura',  dom: 6, hue: 280, rarity: 4 },
    { key: 'violeta',  dom: 6, hue: 300, rarity: 5 },
    { key: 'carmesi',  dom: 7, hue: 350, rarity: 6 },
    { key: 'azur',     dom: 7, hue: 205, rarity: 8 },
    { key: 'turquesa', dom: 6, hue: 175, rarity: 7 },
    { key: 'oro',      dom: 8, hue: 48,  rarity: 9 },
    { key: 'rosa',     dom: 3, hue: 330, rarity: 4 },
    { key: 'magenta',  dom: 7, hue: 320, rarity: 7 },
    { key: 'obsidiana',dom: 9, hue: 260, rarity: 11, dark: true },
    { key: 'blanco',   dom: 1, hue: 0,   rarity: 12, albino: true }, // recesivo -> albinismo
  ];
  const COLOR_BY_KEY = Object.fromEntries(COLORS.map(c => [c.key, c]));

  // Forma de hoja — cualitativo
  const LEAF = [
    { key: 'ancha',     dom: 5, rarity: 1 },
    { key: 'estrecha',  dom: 5, rarity: 1 },
    { key: 'serrada',   dom: 4, rarity: 2 },
    { key: 'palmada',   dom: 3, rarity: 3 },
    { key: 'digitada',  dom: 6, rarity: 4 },
    { key: 'lobulada',  dom: 4, rarity: 3 },
    { key: 'aciculada', dom: 5, rarity: 5 },
    { key: 'reticulada',dom: 2, rarity: 7 },
  ];

  // Terpeno dominante / aroma — cualitativo
  const TERP = [
    { key: 'citrico',    dom: 4, rarity: 1 },
    { key: 'pino',       dom: 4, rarity: 1 },
    { key: 'floral',     dom: 5, rarity: 2 },
    { key: 'terroso',    dom: 3, rarity: 2 },
    { key: 'combustible',dom: 6, rarity: 4 },
    { key: 'dulce',      dom: 4, rarity: 3 },
    { key: 'especiado',  dom: 5, rarity: 4 },
    { key: 'mentolado',  dom: 7, rarity: 6 },
    { key: 'ahumado',    dom: 6, rarity: 5 },
    { key: 'marino',     dom: 5, rarity: 5 },
    { key: 'incienso',   dom: 8, rarity: 9 },
  ];

  // Patrón de pigmentación — cualitativo, afecta al render de la flor
  const PATTERN = [
    { key: 'liso',      dom: 5, rarity: 1 },
    { key: 'moteado',   dom: 4, rarity: 3 },
    { key: 'rayado',    dom: 4, rarity: 4 },
    { key: 'jaspeado',  dom: 3, rarity: 5 },
    { key: 'aureolado', dom: 6, rarity: 7 },
  ];

  // Genes cuantitativos: cada alelo aporta un valor 0..100
  const QUANT = ['altura', 'produccion', 'vigor', 'resistencia', 'velocidad', 'resina', 'aroma'];

  // Mutaciones especiales (flags fenotípicos).
  const MUTATIONS = {
    variegacion:  { rarity: 8,  label: 'Variegación',     desc: 'Sectores sin clorofila; patrón jaspeado único.' },
    gigantismo:   { rarity: 9,  label: 'Gigantismo',      desc: 'Crecimiento descomunal; +altura +producción.' },
    enanismo:     { rarity: 7,  label: 'Enanismo',        desc: 'Porte minúsculo; densa y compacta.' },
    quimera:      { rarity: 11, label: 'Quimera',         desc: 'Dos genotipos coexistiendo en un cuerpo.' },
    fasciacion:   { rarity: 10, label: 'Fasciación',      desc: 'Tallos fusionados en forma de cresta.' },
    fluorescente: { rarity: 13, label: 'Bioluminiscencia',desc: 'Tejidos que brillan en la oscuridad.' },
    cristalina:   { rarity: 12, label: 'Cristalina',      desc: 'Resina hipertrófica; recubre la planta de escarcha.' },
    hexaploide:   { rarity: 14, label: 'Aura hexaploide', desc: 'Duplicación genómica extrema; vigor legendario.' },
  };

  const PLOIDY = {
    2: { label: 'Diploide',    yieldMul: 1.0,  sizeMul: 1.0,  rarity: 1 },
    3: { label: 'Triploide',   yieldMul: 1.25, sizeMul: 1.15, rarity: 8,  sterile: true },
    4: { label: 'Tetraploide', yieldMul: 1.45, sizeMul: 1.3,  rarity: 10 },
  };

  const QUAL_GENES = [
    { key: 'color', list: COLORS },
    { key: 'leaf', list: LEAF },
    { key: 'terp', list: TERP },
    { key: 'pattern', list: PATTERN },
  ];

  /* --------------------------------------------------------
     Construcción de un GENOTIPO
     -------------------------------------------------------- */
  function randAlleleFrom(list, biasCommon) {
    const arr = list.map(a => ({ ref: a, w: biasCommon ? 1 / a.rarity : 1 }));
    return RNG.weighted(arr, 'w').ref.key;
  }
  function wildQuant(base, spread) {
    return clamp(Math.round(base + RNG.gauss() * spread), 1, 100);
  }

  function wildGenotype(profile) {
    const g = { color: [], leaf: [], terp: [], pattern: [], quant: {}, ploidy: 2, mut: {} };
    for (let i = 0; i < 2; i++) g.color.push(pickProfile(profile.colors, COLORS));
    for (let i = 0; i < 2; i++) g.leaf.push(pickProfile(profile.leaves, LEAF));
    for (let i = 0; i < 2; i++) g.terp.push(pickProfile(profile.terps, TERP));
    for (let i = 0; i < 2; i++) g.pattern.push(pickProfile(profile.patterns, PATTERN));
    for (const q of QUANT) {
      const base = (profile.quant && profile.quant[q]) || 45;
      g.quant[q] = [wildQuant(base, 14), wildQuant(base, 14)];
    }
    maybeWildMutation(g, profile.mutBoost || 1);
    maybeWildPloidy(g, profile.ploidyBoost || 1);
    return g;
  }

  function pickProfile(pool, list) {
    if (pool && pool.length) {
      if (typeof pool[0] === 'string') return RNG.pick(pool);
      return RNG.weighted(pool, 'w').key;
    }
    return randAlleleFrom(list, true);
  }

  function globalMutBoost() {
    // Eventos activos y equipo de laboratorio pueden amplificar mutaciones.
    let b = 1;
    if (PH.events && PH.events.mutationBoost) b *= PH.events.mutationBoost();
    return b;
  }

  function maybeWildMutation(g, boost) {
    const gb = globalMutBoost();
    for (const [k, m] of Object.entries(MUTATIONS)) {

    else if (RNG.chance(0.02 * boost * gb)) g.ploidy = 3;

  /* --------------------------------------------------------
     EXPRESIÓN — genotipo -> fenotipo observable
     -------------------------------------------------------- */
  function expressQual(alleles, list) {
    const A = list.find(x => x.key === alleles[0]) || list[0];
    const B = list.find(x => x.key === alleles[1]) || list[0];
    if (A.dom === B.dom && A.key !== B.key) return { expressed: A.key, hidden: B.key, co: B.key };
    const dom = A.dom >= B.dom ? A : B;
    const rec = A.dom >= B.dom ? B : A;
    return { expressed: dom.key, hidden: rec.key, co: null };
  }

  function express(genotype) {
    const p = PLOIDY[genotype.ploidy] || PLOIDY[2];
    const color = expressQual(genotype.color, COLORS);
    const leaf = expressQual(genotype.leaf, LEAF);
    const terp = expressQual(genotype.terp, TERP);
    const pattern = expressQual(genotype.pattern || ['liso', 'liso'], PATTERN);

    const q = {};
    for (const key of QUANT) {
      const a = genotype.quant[key] || [45, 45];
      q[key] = clamp(Math.round((a[0] + a[1]) / 2), 1, 100);
    }
    const mut = Object.keys(genotype.mut || {}).filter(k => genotype.mut[k]);
    if (genotype.mut.gigantismo) { q.altura = clamp(q.altura + 30, 1, 130); q.produccion = clamp(q.produccion + 20, 1, 130); }
    if (genotype.mut.enanismo)  { q.altura = clamp(Math.round(q.altura * 0.4), 1, 100); q.resina = clamp(q.resina + 15, 1, 100); }
    if (genotype.mut.cristalina) { q.resina = clamp(q.resina + 25, 1, 130); }
    if (genotype.mut.hexaploide) { q.vigor = clamp(q.vigor + 25, 1, 130); q.produccion = clamp(q.produccion + 25, 1, 150); }
    q.produccion = clamp(Math.round(q.produccion * p.yieldMul), 1, 150);
    q.altura = clamp(Math.round(q.altura * p.sizeMul), 1, 150);

    const colorInfo = COLOR_BY_KEY[color.expressed] || COLORS[0];

    return {
      color: color.expressed, colorHidden: color.hidden, colorCo: color.co,
      hue: colorInfo.hue, albino: colorInfo.albino || false, dark: colorInfo.dark || false,
      leaf: leaf.expressed, leafHidden: leaf.hidden,
      terp: terp.expressed, terpHidden: terp.hidden,
      pattern: pattern.expressed,
      quant: q, ploidy: genotype.ploidy, ploidyLabel: p.label, sterile: !!p.sterile,
      mutations: mut,
    };
  }

  /* --------------------------------------------------------
     RAREZA
     -------------------------------------------------------- */
  function rarityScore(genotype) {
    const ph = express(genotype);
    let score = 0;
    score += (COLOR_BY_KEY[ph.color]?.rarity || 1) * 1.4;
    if (ph.colorCo) score += 6;
    score += (LEAF.find(l => l.key === ph.leaf)?.rarity || 1);
    score += (TERP.find(t => t.key === ph.terp)?.rarity || 1) * 1.2;
    score += (PATTERN.find(t => t.key === ph.pattern)?.rarity || 1) * 1.1;
    for (const k of QUANT) {
      const v = ph.quant[k];
      if (v >= 95) score += 5; else if (v >= 88) score += 3; else if (v >= 80) score += 1.5;
      if (v <= 6) score += 2;
    }
    for (const m of ph.mutations) score += (MUTATIONS[m]?.rarity || 5) * 1.6;
    score += (PLOIDY[ph.ploidy]?.rarity || 1) * 1.2;
    return Math.round(clamp(score, 1, 100));
  }

  function rarityTier(score) {
    if (score >= 82) return { key: 'quimerica', label: 'Quimérica', color: '#ff3d7f', stars: 7 };
    if (score >= 70) return { key: 'mitica', label: 'Mítica', color: '#ff5da2', stars: 6 };
    if (score >= 55) return { key: 'legendaria', label: 'Legendaria', color: '#ffb02e', stars: 5 };
    if (score >= 40) return { key: 'rara', label: 'Rara', color: '#8a7dff', stars: 4 };
    if (score >= 28) return { key: 'inusual', label: 'Inusual', color: '#37c2ff', stars: 3 };
    if (score >= 16) return { key: 'comun', label: 'Común', color: '#7bd66b', stars: 2 };
    return { key: 'basica', label: 'Básica', color: '#a8b0b8', stars: 1 };

  /* --------------------------------------------------------
     FIRMA fenotípica
     -------------------------------------------------------- */
  function phenoSignature(genotype) {
    const ph = express(genotype);

      ph.color, ph.leaf, ph.terp, ph.pattern,
      'a' + bucket(ph.quant.altura),
      'p' + bucket(ph.quant.produccion),
      'r' + bucket(ph.quant.resina),
      ph.ploidy,
      ph.mutations.slice().sort().join('+') || '-'

    // marcador de ploidía y mutaciones
    seq += 'GG'.repeat(genotype.ploidy - 1);
    for (const k of Object.keys(MUTATIONS)) if (genotype.mut[k]) seq += 'CATG';
    return seq;
  }

  // Parentesco 0..1 comparando alelos compartidos
  function relatedness(gA, gB) {
    let match = 0, total = 0;
    for (const g of QUAL_GENES) {
      const a = gA[g.key] || [], b = gB[g.key] || [];
      total += 2;
      const bb = b.slice();
      for (const x of a) { const i = bb.indexOf(x); if (i >= 0) { match++; bb.splice(i, 1); } }
    }
    for (const q of QUANT) {
      total += 1;
      const va = gA.quant[q] || [45, 45], vb = gB.quant[q] || [45, 45];
      const d = Math.abs((va[0] + va[1]) / 2 - (vb[0] + vb[1]) / 2);
      match += clamp(1 - d / 60, 0, 1);
    }
    return clamp(match / total, 0, 1);
  }

  /* --------------------------------------------------------
     CRUCE / BREEDING
     -------------------------------------------------------- */
  function inheritQual(pA, pB) { return [RNG.pick(pA), RNG.pick(pB)]; }

  function breed(genoA, genoB, opts) {
    opts = opts || {};
    const mutRate = (opts.mutRate != null ? opts.mutRate : 0.06) * globalMutBoost();
    const child = { color: [], leaf: [], terp: [], pattern: [], quant: {}, ploidy: 2, mut: {} };

    child.color = inheritQual(genoA.color, genoB.color);
    child.leaf = inheritQual(genoA.leaf, genoB.leaf);
    child.terp = inheritQual(genoA.terp, genoB.terp);
    child.pattern = inheritQual(genoA.pattern || ['liso', 'liso'], genoB.pattern || ['liso', 'liso']);

    for (const q of QUANT) {
      const a = RNG.pick(genoA.quant[q] || [45, 45]);
      const b = RNG.pick(genoB.quant[q] || [45, 45]);
      child.quant[q] = [clamp(Math.round(a + RNG.gauss() * 6), 1, 100), clamp(Math.round(b + RNG.gauss() * 6), 1, 100)];
    }

    const pa = genoA.ploidy, pb = genoB.ploidy;
    child.ploidy = 2;
    if (RNG.chance(0.02)) child.ploidy = 4;
    else if ((pa >= 3 || pb >= 3) && RNG.chance(0.25)) child.ploidy = RNG.chance(0.5) ? 3 : 4;

    for (const k of Object.keys(MUTATIONS)) {
      const parents = (genoA.mut[k] ? 1 : 0) + (genoB.mut[k] ? 1 : 0);
      if (parents === 2 && RNG.chance(0.6)) child.mut[k] = true;
      else if (parents === 1 && RNG.chance(0.3)) child.mut[k] = true;
    }
    for (const [k, m] of Object.entries(MUTATIONS)) {
      const p = (mutRate / m.rarity) * (opts.mutBoost || 1);
      if (RNG.chance(p)) child.mut[k] = true;
    }
    if (RNG.chance(mutRate * 0.5)) {
      const idx = RNG.i(0, 1);
      child.color[idx] = RNG.weighted(COLORS.map(c => ({ ref: c, w: 1 / c.rarity })), 'w').ref.key;
    }
    return child;
  }

  /* --------------------------------------------------------
     Presentación
     -------------------------------------------------------- */
  function paletteFor(pheno) {
    let hue = pheno.hue;
    let sat = pheno.albino ? 6 : 62;
    let lig = pheno.albino ? 88 : (pheno.dark ? 26 : 48);
    if (pheno.mutations.includes('fluorescente')) { sat = 90; lig = 62; }
    if (pheno.mutations.includes('cristalina')) { lig = Math.min(80, lig + 14); }
    const base = hslToHex(hue, sat, lig);
    const dark = hslToHex(hue, sat, Math.max(10, lig - 22));
    const light = hslToHex(hue, sat, Math.min(96, lig + 22));
    const leafC = pheno.albino ? '#e8e2c8' : hslToHex(120, pheno.mutations.includes('variegacion') ? 24 : 46, 34);
    return { base, dark, light, leaf: leafC };
  }

  function describe(pheno) {
    const bits = [];
    bits.push(`Flor ${pheno.color}${pheno.colorCo ? '/' + pheno.colorCo : ''}`);
    if (pheno.pattern && pheno.pattern !== 'liso') bits.push(`patrón ${pheno.pattern}`);
    bits.push(`hoja ${pheno.leaf}`);
    bits.push(`aroma ${pheno.terp}`);
    if (pheno.ploidy !== 2) bits.push(pheno.ploidyLabel.toLowerCase());
    for (const m of pheno.mutations) bits.push(MUTATIONS[m].label.toLowerCase());
    return cap(bits.join(', ')) + '.';
  }

  PH.gen = {
    COLORS, LEAF, TERP, PATTERN, QUANT, MUTATIONS, PLOIDY, COLOR_BY_KEY, QUAL_GENES,
    wildGenotype, express, rarityScore, rarityTier, phenoSignature,
    breed, paletteFor, describe, dnaSequence, relatedness,
  };
})(window.PH = window.PH || {});

        break;
      case 'bush': drawGround(); px(ctx, sx + 2, sy + 5, 12, 9, shade(P.blade, -0.1)); px(ctx, sx + 4, sy + 6, 5, 4, P.blade2); break;
      case 'rock': px(ctx, sx, sy, TS, TS, '#8a8f97'); px(ctx, sx + 2, sy + 2, 12, 12, '#6d727a'); px(ctx, sx + 4, sy + 3, 5, 4, '#a2a7ae'); break;
      case 'cavefloor': px(ctx, sx, sy, TS, TS, '#3f3b47'); px(ctx, sx + 4, sy + 5, 3, 3, '#332f3a'); px(ctx, sx + 10, sy + 10, 2, 2, '#4a4652'); break;
      case 'stalag': px(ctx, sx, sy, TS, TS, '#3f3b47'); px(ctx, sx + 5, sy + 2, 6, 14, '#5a5566'); px(ctx, sx + 7, sy + 4, 2, 10, '#726c82'); break;
      case 'water': case 'deepwater': {
        const deep = name === 'deepwater';
        px(ctx, sx, sy, TS, TS, deep ? '#2f6bb0' : '#4b8fd6');
        // ondas animadas deterministas
        const ph = (time || 0) / 500 + (tx + ty);
        const o1 = Math.round(Math.sin(ph) * 2), o2 = Math.round(Math.cos(ph * 0.8) * 2);
        px(ctx, sx + 2 + o1, sy + 4, 6, 1, deep ? '#4b8fd6' : '#7bb4ec');
        px(ctx, sx + 8 + o2, sy + 10, 5, 1, deep ? '#4b8fd6' : '#9cc9f2');
        // espuma hacia la orilla (vecino no-agua)
        const foam = '#dff0ff';
        if (nGroup(0, -1) && nGroup(0, -1) !== 'water') px(ctx, sx, sy, TS, 2, foam);
        if (nGroup(0, 1) && nGroup(0, 1) !== 'water') px(ctx, sx, sy + TS - 2, TS, 2, foam);
        if (nGroup(-1, 0) && nGroup(-1, 0) !== 'water') px(ctx, sx, sy, 2, TS, foam);
        if (nGroup(1, 0) && nGroup(1, 0) !== 'water') px(ctx, sx + TS - 2, sy, 2, TS, foam);
        break;
      }
      case 'mud': px(ctx, sx, sy, TS, TS, '#6b5637'); px(ctx, sx + 2 + ((tx * 3) % 8), sy + 3 + ((ty * 3) % 8), 4, 3, '#54432a'); px(ctx, sx + 9, sy + 10, 4, 3, '#7d6543'); if (rnd > 0.6) px(ctx, sx + 5, sy + 7, 3, 2, '#3f7d34'); break;
      case 'sand': px(ctx, sx, sy, TS, TS, P.grass); px(ctx, sx + 3 + ((tx * 5) % 9), sy + 4 + ((ty * 3) % 8), 2, 1, P.grassD); px(ctx, sx + 10, sy + 11, 1, 1, shade(P.grass, 0.1)); if (nGroup(0, 1) === 'water') px(ctx, sx, sy + TS - 2, TS, 2, shade(P.grass, 0.12)); break;
      case 'snow': px(ctx, sx, sy, TS, TS, '#e9f0f6'); px(ctx, sx + 4 + ((tx * 3) % 8), sy + 5 + ((ty * 5) % 7), 2, 2, '#d3ddea'); if (rnd > 0.7) px(ctx, sx + 9, sy + 10, 1, 1, '#c3d0dc'); break;
      case 'ice': px(ctx, sx, sy, TS, TS, '#bfe0ef'); px(ctx, sx + 2, sy + 2, 6, 1, '#e6f6ff'); px(ctx, sx + 8, sy + 9, 5, 1, '#e6f6ff'); break;
      case 'ash': px(ctx, sx, sy, TS, TS, '#4a3b34'); px(ctx, sx + 3, sy + 5, 3, 2, '#5c4a42'); px(ctx, sx + 10, sy + 10, 2, 2, '#3a2d28'); break;
      case 'lava': px(ctx, sx, sy, TS, TS, '#e8531f'); px(ctx, sx + 2, sy + 3, 5, 3, '#ffb02e'); px(ctx, sx + 9, sy + 9, 4, 3, '#ffd34d'); px(ctx, sx + 6, sy + 11, 3, 2, '#c0331a'); break;
      case 'flowers': drawGround(); px(ctx, sx + 3, sy + 4, 2, 2, '#ffd34d'); px(ctx, sx + 9, sy + 8, 2, 2, '#ff7ba0'); px(ctx, sx + 6, sy + 11, 2, 2, '#8ac6ff'); break;
      case 'house': px(ctx, sx, sy, TS, TS, '#c86b52'); px(ctx, sx, sy, TS, 5, '#8f3f30'); px(ctx, sx + 2, sy + 7, 4, 4, '#8fd0e8'); px(ctx, sx + 10, sy + 7, 4, 4, '#8fd0e8'); break;
      case 'door': px(ctx, sx, sy, TS, TS, '#c86b52'); px(ctx, sx + 4, sy + 3, 8, 13, '#5a3a26'); px(ctx, sx + 9, sy + 9, 2, 2, '#ffd34d'); break;
      default:
        if (isWarp(ch)) { drawGround(); px(ctx, sx + 3, sy + 3, 10, 10, '#3a3f4a'); px(ctx, sx + 5, sy + 5, 6, 6, '#20242c'); }
        else drawGround();
    }
  }

  // ---- Personaje con contorno, sombreado y ciclo de caminado ----
  // Se dibuja primero en un búfer offscreen y luego se compone con una
  // silueta oscura desplazada (contorno 1px estilo GBA).
  const _buf = document.createElement('canvas'); _buf.width = 16; _buf.height = 18;
  const _sil = document.createElement('canvas'); _sil.width = 16; _sil.height = 18;
  const OUTLINE = '#20161f';

  function drawActorRaw(g, dir, frame, p) {
    const shS = shade(p.shirt, -0.24), liS = shade(p.shirt, 0.16);
    const skD = shade(p.skin, -0.16), skL = shade(p.skin, 0.14);
    const paD = shade(p.pants, -0.22);
    const bob = frame === 1 ? 1 : 0;
    const oy = -bob;
    g.clearRect(0, 0, 16, 18);

    // ---- Piernas / botas (animadas) ----
    const legY = 12;
    if (dir === 'left' || dir === 'right') {
      let f1 = 6, f2 = 8;
      if (frame === 1) { f1 = 4; f2 = 9; } else if (frame === 2) { f1 = 8; f2 = 5; }
      px(g, f2, legY, 3, 4, paD);
      px(g, f2, 15, 3, 1, '#241a22');            // bota
      px(g, f1, legY, 3, 4, p.pants);
      px(g, f1, 15, 3, 1, '#2a1f28');
    } else {
      let lx = 5, rx = 8;
      if (frame === 1) { lx = 4; rx = 9; } else if (frame === 2) { lx = 6; rx = 7; }
      px(g, lx, legY, 3, 4, p.pants); px(g, lx, 15, 3, 1, '#2a1f28');
      px(g, rx, legY, 3, 4, paD);      px(g, rx, 15, 3, 1, '#241a22');
    }

    // ---- Torso con sombreado ----
    px(g, 4, 8 + oy, 8, 5, p.shirt);
    px(g, 4, 8 + oy, 8, 1, liS);                 // luz superior
    px(g, 4, 12 + oy, 8, 1, shS);                // sombra inferior
    px(g, 4, 8 + oy, 1, 5, shade(p.shirt, -0.12));
    // mochila
    if (p.pack) {
      const pkD = shade(p.pack, -0.2);
      if (dir === 'up') { px(g, 4, 8 + oy, 8, 5, p.pack); px(g, 6, 9 + oy, 4, 3, pkD); }
      else if (dir === 'down') { px(g, 3, 9 + oy, 1, 3, p.pack); px(g, 12, 9 + oy, 1, 3, p.pack); }
      else if (dir === 'left') px(g, 10, 8 + oy, 2, 4, p.pack);
      else px(g, 4, 8 + oy, 2, 4, p.pack);
    }
    // ---- Brazos ----
    const armY = 8 + oy;
    if (dir === 'left') px(g, 4, armY + (frame === 1 ? 1 : 0), 2, 4, p.skin);
    else if (dir === 'right') px(g, 10, armY + (frame === 1 ? 1 : 0), 2, 4, p.skin);
    else {
      px(g, 3, armY + (frame === 2 ? 1 : 0), 2, 4, p.skin);
      px(g, 11, armY + (frame === 1 ? 1 : 0), 2, 4, p.skin);
    }

    // ---- Cabeza ----
    px(g, 4, 2 + oy, 8, 7, p.skin);
    px(g, 4, 2 + oy, 8, 1, skL);                 // luz frente
    px(g, 4, 8 + oy, 8, 1, skD);                 // barbilla
    // pelo
    px(g, 3, 1 + oy, 10, 3, p.hair);
    px(g, 3, 2 + oy, 1, 4, p.hair); px(g, 12, 2 + oy, 1, 4, p.hair);
    px(g, 4, 1 + oy, 8, 1, shade(p.hair, 0.18));
    if (p.hat) {
      const htD = shade(p.hat, -0.22);
      px(g, 3, 0 + oy, 10, 3, p.hat); px(g, 4, -1 + oy < 0 ? 0 : -1 + oy, 8, 1, p.hat);
      px(g, 3, 2 + oy, 10, 1, htD);
      if (dir !== 'up') px(g, 11, 3 + oy, 3, 1, htD); // visera
    }
    // rostro por dirección
    const ey = 5 + oy;
    if (dir === 'down') {
      px(g, 6, ey, 1, 2, '#20202a'); px(g, 9, ey, 1, 2, '#20202a');
      px(g, 6, ey, 1, 1, '#3a6ea5');            // brillo ojo
      px(g, 7, 7 + oy, 2, 1, skD);
    } else if (dir === 'up') {
      px(g, 3, 1 + oy, 10, 6, p.hair);
      px(g, 4, 1 + oy, 8, 1, shade(p.hair, 0.18));
    } else if (dir === 'left') {
      px(g, 4, 2 + oy, 2, 5, p.hair);
      px(g, 6, ey, 1, 2, '#20202a');
      px(g, 4, 6 + oy, 1, 1, skD);
    } else if (dir === 'right') {
      px(g, 10, 2 + oy, 2, 5, p.hair);
      px(g, 9, ey, 1, 2, '#20202a');
      px(g, 11, 6 + oy, 1, 1, skD);
    }
  }

  function drawActor(ctx, sx, sy, dir, frame, palette) {
    const p = palette || { skin: '#f0c088', hair: '#4a3b2a', shirt: '#3a7bd6', pants: '#33333f' };
    // sombra elíptica en el suelo (bajo el contorno)
    px(ctx, sx + 4, sy + 15, 8, 2, 'rgba(0,0,0,0.22)');
    px(ctx, sx + 3, sy + 16, 10, 1, 'rgba(0,0,0,0.12)');

    const bctx = _buf.getContext('2d'); bctx.imageSmoothingEnabled = false;
    drawActorRaw(bctx, dir, frame, p);
    // silueta oscura
    const sctx = _sil.getContext('2d'); sctx.imageSmoothingEnabled = false;
    sctx.globalCompositeOperation = 'source-over';
    sctx.clearRect(0, 0, 16, 18);
    sctx.drawImage(_buf, 0, 0);
    sctx.globalCompositeOperation = 'source-in';
    sctx.fillStyle = OUTLINE; sctx.fillRect(0, 0, 16, 18);
    sctx.globalCompositeOperation = 'source-over';
    // contorno (4 desplazamientos) + cuerpo encima
    const off = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (const o of off) ctx.drawImage(_sil, sx + o[0], sy + o[1]);
    ctx.drawImage(_buf, sx, sy);
  }

  const NPC_PALETTES = {
    mentor: { skin: '#f0c088', hair: '#d8d8e0', shirt: '#e8e8ee', pants: '#555' },
    npc2:   { skin: '#e0a878', hair: '#6a3d2a', shirt: '#d64a6b', pants: '#333' },
    npc3:   { skin: '#f0c088', hair: '#2a2a2a', shirt: '#4aa86b', pants: '#333' },
    npc4:   { skin: '#c98d5a', hair: '#3a2a1a', shirt: '#d68a3a', pants: '#333' },
    npc5:   { skin: '#f0c088', hair: '#8a5a2a', shirt: '#8a6bd6', pants: '#333' },
    npc6:   { skin: '#b98a5a', hair: '#1a1a1a', shirt: '#555', pants: '#222' },
  };

  // ---- Criatura-cepa "Strainmon": planta en maceta con cara y carácter ----
  const OUTL = '#20161f';
  function oRect(ctx, x, y, w, h, fill) { px(ctx, x - 1, y - 1, w + 2, h + 2, OUTL); px(ctx, x, y, w, h, fill); }

  function drawPlant(ctx, cx, cy, pheno, scale, t) {
    scale = scale || 1;
    const pal = PH.gen.paletteFor(pheno);
    const leafCol = pheno.albino ? '#dcd6b8' : '#3f8f3a';
    const leafSh = shade(leafCol, -0.22), leafHi = shade(leafCol, 0.2);
    const muts = pheno.mutations || [];
    const gig = muts.includes('gigantismo'), dwf = muts.includes('enanismo');
    const flick = muts.includes('fluorescente') ? (0.6 + 0.4 * Math.abs(Math.sin(t / 300))) : 1;
    const wob = Math.round(Math.sin(t / 600) * 0.6);   // leve balanceo

    // dimensiones según genética
    const bw = dwf ? 8 : (gig ? 14 : 11);              // ancho cuerpo
    const bh = dwf ? 7 : (gig ? 12 : 9) + Math.round((pheno.quant.altura / 100) * 3);
    const hw = dwf ? 7 : (gig ? 11 : 9);               // ancho cabeza (cogollo)

    ctx.save();
    ctx.translate(Math.round(cx), Math.round(cy));
    ctx.scale(scale, scale);

    // sombra
    px(ctx, -bw / 2 - 1, 1, bw + 2, 3, 'rgba(0,0,0,0.22)');

    // --- Maceta de terracota ---
    const potW = bw + 2, potH = 6, potY = -6;
    oRect(ctx, -potW / 2, potY, potW, potH, '#c07048');
    px(ctx, -potW / 2, potY, potW, 1, '#d98a5f');                       // brillo borde
    oRect(ctx, -potW / 2 - 1, potY - 2, potW + 2, 2, '#a85a38');        // reborde
    px(ctx, -potW / 2, potY - 2, potW, 1, '#5a3a26');                   // tierra
    px(ctx, -potW / 2 + 1, potY + 3, potW - 2, 1, '#9a5636');           // sombra interior

    // --- Cuerpo (planta) ---
    const bodyY = potY - 2 - bh + 1 + wob;
    oRect(ctx, -bw / 2, bodyY, bw, bh, leafCol);
    px(ctx, -bw / 2, bodyY, bw, 1, leafHi);                              // luz superior
    px(ctx, -bw / 2, bodyY + bh - 1, bw, 1, leafSh);                     // sombra inferior
    px(ctx, -bw / 2, bodyY, 1, bh, leafSh);
    if (muts.includes('variegacion')) { px(ctx, -bw / 2 + 1, bodyY + 2, 2, 3, '#eae4c4'); px(ctx, bw / 2 - 3, bodyY + 4, 2, 2, '#eae4c4'); }

    // brazos-hoja (según forma de hoja)
    const armY = bodyY + 2;
    const armLen = pheno.leaf === 'estrecha' || pheno.leaf === 'aciculada' ? 4 : (pheno.leaf === 'ancha' ? 6 : 5);
    drawArm(ctx, -bw / 2, armY, -1, armLen, pheno.leaf, leafCol, leafSh);
    drawArm(ctx, bw / 2, armY, 1, armLen, pheno.leaf, leafCol, leafSh);

    // --- Cabeza / cogollo (color del fenotipo) con cara ---
    const headY = bodyY - hw + 2 + wob;
    ctx.globalAlpha = flick;
    oRect(ctx, -hw / 2, headY, hw, hw, pal.base);
    px(ctx, -hw / 2, headY, hw, 1, pal.light);
    px(ctx, -hw / 2, headY + hw - 1, hw, 1, pal.dark);
    px(ctx, -hw / 2, headY, 1, hw, pal.light);
    // patrones de pigmentación
    if (pheno.pattern === 'moteado') { px(ctx, -hw / 2 + 1, headY + 2, 1, 1, pal.dark); px(ctx, hw / 2 - 2, headY + hw - 3, 1, 1, pal.dark); }
    else if (pheno.pattern === 'rayado') { for (let i = -hw / 2 + 1; i < hw / 2; i += 2) px(ctx, i, headY, 1, hw, pal.dark); }
    else if (pheno.pattern === 'jaspeado') px(ctx, -hw / 2, headY + hw / 2, hw / 2, hw / 2, pal.dark);
    // codominancia / quimera: media cabeza de otro tono
    if (pheno.colorCo) { const co = PH.gen.COLOR_BY_KEY[pheno.colorCo]; if (co) px(ctx, 0, headY, hw / 2, hw, hslToHex(co.hue, 60, 52)); }
    if (muts.includes('quimera')) px(ctx, -hw / 2, headY, hw / 2, hw / 2, pal.dark);

    // hojita de azúcar arriba
    px(ctx, -1, headY - 3, 2, 3, leafCol); px(ctx, -2, headY - 2, 1, 1, leafSh); px(ctx, 1, headY - 2, 1, 1, leafSh);
    if (muts.includes('hexaploide')) { px(ctx, -4, headY - 2, 2, 2, pal.light); px(ctx, 3, headY - 2, 2, 2, pal.light); }
    if (gig) { px(ctx, -hw / 2 - 1, headY - 2, 1, 3, leafSh); px(ctx, hw / 2, headY - 2, 1, 3, leafSh); } // "cuernos"

    // cara
    const eyeY = headY + Math.max(2, hw / 2 - 1);
    const ex = Math.max(2, Math.round(hw / 4));
    const eye = (x) => { px(ctx, x, eyeY, 2, 2, '#f4f4ec'); px(ctx, x + (x < 0 ? 1 : 0), eyeY, 1, 2, '#20202a'); px(ctx, x, eyeY, 1, 1, 'rgba(255,255,255,.7)'); };
    eye(-ex); eye(ex - 1);
    // boca por "ánimo" (resina/rareza)
    const my = eyeY + 3;
    if (pheno.quant.resina > 72 || muts.length) { px(ctx, -2, my, 4, 1, '#3a2230'); px(ctx, -3, my - 1, 1, 1, '#3a2230'); px(ctx, 2, my - 1, 1, 1, '#3a2230'); } // sonrisa
    else px(ctx, -1, my, 2, 1, '#3a2230');
    // mejillas
    px(ctx, -ex - 1, eyeY + 1, 1, 1, 'rgba(255,120,140,.5)'); px(ctx, ex, eyeY + 1, 1, 1, 'rgba(255,120,140,.5)');
    ctx.globalAlpha = 1;

    // resina / escarcha
    if (muts.includes('cristalina') || pheno.quant.resina > 55) {
      const n = Math.round((pheno.quant.resina - 45) / 10) + (muts.includes('cristalina') ? 5 : 0);
      for (let i = 0; i < n; i++) px(ctx, -hw / 2 + (i * 3) % hw, headY + ((i * 5) % hw), 1, 1, 'rgba(255,255,255,0.85)');
    }
    // aura de bioluminiscencia
    if (muts.includes('fluorescente')) { ctx.globalAlpha = 0.25 * flick; px(ctx, -hw / 2 - 2, headY - 2, hw + 4, hw + 4, pal.light); ctx.globalAlpha = 1; }

    ctx.restore();
  }

  function drawArm(ctx, ox, oy, sign, len, form, col, sh) {
    const seg = form === 'ancha' ? 3 : (form === 'estrecha' || form === 'aciculada' ? 1 : 2);
    for (let j = 0; j < len; j++) {
      const yy = oy - (form === 'palmada' || form === 'digitada' ? j : (j * 0.4 | 0));
      px(ctx, ox + sign * (j + 1), yy, 1, seg, j === len - 1 ? sh : col);
    }
    // "mano"-hoja al final
    px(ctx, ox + sign * (len + 1), oy - (form === 'palmada' || form === 'digitada' ? len : (len * 0.4 | 0)) - 1, 1, seg + 1, col);
  }

  function leafShape(ctx, ox, oy, sign, lw, form, col, pheno) {
    const vg = pheno.mutations.includes('variegacion');
    for (let j = 0; j < lw; j++) {
      const seg = form === 'estrecha' || form === 'aciculada' ? 1 : (form === 'ancha' ? 3 : 2);
      const yy = oy - (form === 'palmada' ? j * 0.2 : 0);
      const c = (vg && j % 2 === 0) ? '#e9e2c0' : col;
      px(ctx, ox + sign * j, yy - (j * 0.1 | 0), 1, seg, c);
      if (form === 'serrada' && j % 2 === 0) px(ctx, ox + sign * j, yy - seg, 1, 1, shade(col, -0.2));
    }
  }

  function drawFlower(ctx, cx, cy, w, pal, pheno) {
    const half = w / 2;
    px(ctx, cx - half, cy - half, w, w, pal.base);
    px(ctx, cx - half, cy - half, w, 2, pal.light);
    px(ctx, cx - half, cy + half - 2, w, 2, pal.dark);
    // patrones
    if (pheno.pattern === 'moteado') { px(ctx, cx - half + 1, cy - 1, 2, 2, pal.dark); px(ctx, cx + 1, cy + 1, 1, 1, pal.light); }
    else if (pheno.pattern === 'rayado') { for (let i = -half; i < half; i += 3) px(ctx, cx + i, cy - half, 1, w, pal.dark); }
    else if (pheno.pattern === 'jaspeado') { px(ctx, cx - half, cy - half, half, half, pal.light); px(ctx, cx, cy, half, half, pal.dark); }
    else if (pheno.pattern === 'aureolado') { px(ctx, cx - half, cy - half, w, w, pal.dark); px(ctx, cx - half + 2, cy - half + 2, w - 4, w - 4, pal.base); }
    if (pheno.colorCo) { const co = PH.gen.COLOR_BY_KEY[pheno.colorCo]; if (co) px(ctx, cx, cy - half, half, w, PH.util.hslToHex(co.hue, 60, 50)); }
    px(ctx, cx - half + 1, cy - half + 1, 2, 2, pal.light);
    if (pheno.mutations.includes('quimera')) px(ctx, cx - half, cy, half, half, pal.dark);
  }

  PH.render = { TS, VW, VH, W, H, THEMES, drawTile, drawActor, drawPlant, NPC_PALETTES };
})(window.PH = window.PH || {});

/* ============================================================
   PHENO HUNTER — sprites.js
   Sprites de cultivo (48x48) inline en base64. Fases de crecimiento
   de la planta en maceta. Sin dependencias ni carga externa.
   ============================================================ */
(function (PH) {

  function img(k) { return images[k] || null; }
  function uri(k) { return DATA[k] || null; }
  function has(id) { return !!DATA[id + '_5']; }
  function stageKey(id, s) { s = Math.max(1, Math.min(5, s | 0)); return DATA[id + '_' + s] ? id + '_' + s : null; }

/* ============================================================
   PHENO HUNTER — state.js
   Estado global: jugador, banco genético, catálogo, misiones,
   ambiente (clima/estación/ciclo día-noche) y guardado.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp } = PH.util;

  const SAVE_KEY = 'phenohunter_save_v1';

  function freshState() {
    return {
      version: 1,
      player: {
        name: 'Aprendiz',
        map: 'lab',
        x: PH.world.MAPS.lab.spawn.x,
        y: PH.world.MAPS.lab.spawn.y,
        dir: 'down',
        credits: 300,
        prestige: 0,
        tools: ['frasco', 'polen'],   // ids de herramientas poseídas
        gear: [],                      // ids de equipo
        activeTool: 'frasco',
        cebosActivos: 0,               // encuentros con feromona
        labLevel: 1,                   // mejora del laboratorio (mutaciones en cruce)
        heat: 0,                       // presión policial 0..100 (Fase 4)
        busts: 0,                      // veces pillado por la poli
      },
      bank: [],          // especímenes almacenados
      garden: [],        // plantas creciendo en el invernadero
      catalog: {},       // signature -> {sig, speciesId, name, tier, rarity, count, firstAt, pheno}
      species: {},       // speciesId -> {seen, obtained}
      quests: {},        // questId -> {state:'active'|'done', progress}
      flags: {},         // banderas de historia
      stats: { discoveries: 0, crosses: 0, mutationsFound: 0, distance: 0, sequenced: 0, harvests: 0, perfectHarvests: 0, deals: 0 },
      env: makeEnv(),
      playtime: 0,
    };
  }

  function makeEnv() {
    return {
      time: 8 * 60,          // minutos del día (0..1440)
      dayLength: 8 * 60 * 1000, // ms reales por día de juego
      season: 'primavera',
      weather: 'despejado',
      weatherTimer: 30000,
      night: false,
      heat: false,
    };
  }

  const SEASONS = ['primavera', 'verano', 'otono', 'invierno'];
  const WEATHERS = [
    { key: 'despejado', w: 40 },
    { key: 'lluvia', w: 16 },
    { key: 'niebla', w: 12 },
    { key: 'tormenta', w: 6 },
    { key: 'ola_calor', w: 6 },
    { key: 'nublado', w: 20 },
  ];

  const state = { data: freshState() };

  function get() { return state.data; }

  // Avanza el ambiente (dt en ms)
  function updateEnv(dt) {
    const env = state.data.env;
    // ciclo día/noche: mapea dayLength al reloj interno
    env.time += (dt / env.dayLength) * 1440;
    if (env.time >= 1440) { env.time -= 1440; advanceSeason(env); }
    env.night = env.time < 5 * 60 || env.time >= 20 * 60;
    env.heat = env.weather === 'ola_calor';
    // clima
    env.weatherTimer -= dt;
    if (env.weatherTimer <= 0) {
      env.weather = RNG.weighted(WEATHERS, 'w').key;
      env.weatherTimer = RNG.i(20000, 60000);
    }
  }
  function advanceSeason(env) {
    const i = SEASONS.indexOf(env.season);
    env.season = SEASONS[(i + 1) % 4];
  }

  function timeLabel(env) {
    const h = Math.floor(env.time / 60), m = Math.floor(env.time % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  /* ---------------- BANCO GENÉTICO ---------------- */
  function bankAdd(specimen) {
    state.data.bank.push(specimen);
    registerCatalog(specimen);
  }
  function bankRemove(uid) {
    const i = state.data.bank.findIndex(s => s.uid === uid);
    if (i >= 0) return state.data.bank.splice(i, 1)[0];
    return null;
  }
  function bankGet(uid) { return state.data.bank.find(s => s.uid === uid); }

  /* ---------------- CATÁLOGO ---------------- */
  // Devuelve {isNewSignature, isNewSpecies, entry}
  function registerCatalog(specimen) {
    const sp = state.data.species[specimen.speciesId] || { seen: 0, obtained: 0 };
    const isNewSpecies = sp.obtained === 0;
    sp.obtained++;
    state.data.species[specimen.speciesId] = sp;

    const sig = specimen.signature;
    let entry = state.data.catalog[sig];
    let isNewSignature = false;
    if (!entry) {
      isNewSignature = true;
      entry = {
        sig, speciesId: specimen.speciesId, name: specimen.name,
        tier: specimen.tier, rarity: specimen.rarity,
        count: 0, firstAt: PH.state.timeLabel(state.data.env),
        pheno: specimen.pheno, genotype: specimen.genotype,
        mutations: specimen.pheno.mutations.slice(),
      };
      state.data.catalog[sig] = entry;
      state.data.stats.discoveries++;
      if (specimen.pheno.mutations.length) state.data.stats.mutationsFound++;
      // Prestigio por descubrimiento, escalado por rareza
      addPrestige(Math.round(3 + specimen.rarity / 3));
    }
    entry.count++;
    return { isNewSignature, isNewSpecies, entry };
  }

  function markSeen(speciesId) {
    const sp = state.data.species[speciesId] || { seen: 0, obtained: 0 };
    sp.seen++;
    state.data.species[speciesId] = sp;
  }

  function addPrestige(n) {
    state.data.player.prestige += n;
  }
  function addCredits(n) { state.data.player.credits = Math.max(0, state.data.player.credits + n); }

  // Umbrales de prestigio que desbloquean contenido
  const PRESTIGE_UNLOCKS = [
    { at: 0, id: 'pradera', label: 'Pradera de Auralia' },
    { at: 8, id: 'bosque', label: 'Bosque de Vael' },
    { at: 18, id: 'cueva', label: 'Cueva de Vael' },
    { at: 25, id: 'pantano', label: 'Cenagal de Mureb' },
    { at: 40, id: 'isla', label: 'Islas Vireo' },
    { at: 45, id: 'desierto', label: 'Erg de Sael' },
    { at: 65, id: 'volcan', label: 'Monte Calder' },
    { at: 85, id: 'nieve', label: 'Manto de Yrr' },
    { at: 120, id: 'reliquias', label: 'Licencia de reliquias' },
  ];

/* ============================================================
   PHENO HUNTER — research.js
   Investigación de ADN: secuenciación (revela alelos ocultos),
   comparación/parentesco y árbol filogenético del banco.
   ============================================================ */
(function (PH) {
  'use strict';
  const { cap } = PH.util;

  // Secuenciar un espécimen: marca sequenced y revela alelos recesivos ocultos.
  function sequence(spec) {
    spec.sequenced = true;
    const g = spec.genotype;
    const ph = spec.pheno;
    const hidden = [];
    for (const gene of PH.gen.QUAL_GENES) {
      const alleles = g[gene.key] || [];
      if (alleles[0] !== alleles[1]) {
        // hay heterocigosis: reporta el recesivo oculto
        const list = gene.list;
        const A = list.find(x => x.key === alleles[0]);
        const B = list.find(x => x.key === alleles[1]);
        const rec = (A.dom <= B.dom ? A : B).key;
        const dom = (A.dom > B.dom ? A : B).key;
        if (rec !== dom) hidden.push({ gene: gene.key, hidden: rec, expressed: dom });
      }
    }
    return { seq: PH.gen.dnaSequence(g), hidden };
  }

  // Compara dos especímenes -> parentesco y diferencias
  function compare(a, b) {
    const rel = PH.gen.relatedness(a.genotype, b.genotype);
    const relation = rel > 0.85 ? 'clones/idénticos' : rel > 0.6 ? 'parientes cercanos' : rel > 0.35 ? 'parientes lejanos' : 'no emparentados';
    return { rel: Math.round(rel * 100), relation };
  }

  // Construye un árbol de linaje a partir de `parents` en el banco.
  function lineage(spec, bankIndex) {
    function node(s, depth) {
      if (!s || depth > 4) return null;
      const n = { name: s.nickname || s.name, tier: s.tier, gen: s.generation, children: [] };
      if (s.parents) {
        for (const pid of s.parents) {
          const p = bankIndex[pid];
          const child = node(p, depth + 1);
          if (child) n.children.push(child);
        }
      }
      return n;
    }
    return node(spec, 0);
  }

  // Agrupa el catálogo por especie -> ramas filogenéticas simples
  function phylogeny(catalog) {
    const bySpecies = {};
    for (const e of Object.values(catalog)) {
      (bySpecies[e.speciesId] = bySpecies[e.speciesId] || []).push(e);
    }
    return bySpecies;
  }

  PH.research = { sequence, compare, lineage, phylogeny };
})(window.PH = window.PH || {});

/* ==== src/garden.js ==== */
/* ============================================================
   PHENO HUNTER — garden.js
   Invernadero / cultivo: planta clones y semillas, obsérvalos crecer
   por fases (plántula → veg → floración → cosecha) y cosecha para
   propagar la genética. Usa los sprites de cultivo (sprites.js).

   FASE 3 — estrés de cultivo: el agua se consume con el tiempo; sin
   agua la planta se estresa y detiene su crecimiento. La humedad alta
   (riego excesivo, eventos de bruma/niebla) puede provocar la aparición
   de moho/patógenos, que se resuelven con manejo BIOLÓGICO limpio y no
   tóxico (poda sanitaria + control de humedad), nunca con fungicidas
   agresivos. La salud final modula el rendimiento de la cosecha.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp } = PH.util;
  const G = () => PH.state.get();

  // Umbrales acumulados (ms reales) por fase. Ciclo completo ~130s base.
  const STAGE_TIMES = [0, 25000, 55000, 90000, 130000];
  const FINAL = STAGE_TIMES.length - 1;

  // Modelo hídrico/sanitario (Fase 3).
  const WATER_MAX = 100;
  const WATER_DECAY = 100 / 42000;   // se seca por completo en ~42 s reales
  const WATER_FULL = 96;             // nivel tras regar
  const THIRST = 22;                 // por debajo: estrés hídrico
  const SOGGY = 88;                  // por encima: encharcamiento (favorece hongos)
  const HEALTH_MAX = 100;
  const DRY_DMG = 100 / 60000;       // seca sin agua: pierde salud en ~60 s
  const MOLD_DMG = 100 / 45000;      // infectada: pierde salud en ~45 s
  const HEALTH_REGEN = 100 / 80000;  // en buenas condiciones se recupera lento

  function capacity() {
    const s = G();
    return clamp(3 + Math.floor(s.player.prestige / 40), 3, 8);
  }

  function growRate(plant) {
    // velocidad y vigor aceleran; floración global también
    let r = 1 + ((plant.pheno.quant.velocidad || 50) - 50) / 120;
    if (PH.events && PH.events.current() && PH.events.current().id === 'floracion') r *= 1.6;
    // el estrés hídrico frena el desarrollo; la enfermedad también
    if (plant.water < THIRST) r *= 0.15;
    else if (plant.water < THIRST * 1.8) r *= 0.6;
    if (plant.diseased) r *= 0.4;
    if (plant.health < 40) r *= 0.7;
    return clamp(r, 0.06, 2.2);
  }

  function stageOf(growMs) {
    let idx = 0;
    for (let i = 0; i < STAGE_TIMES.length; i++) if (growMs >= STAGE_TIMES[i]) idx = i;
    return idx;
  }

  function plantFromBank(uid) {
    const s = G();
    if (!s.garden) s.garden = [];
    if (s.garden.length >= capacity()) return { ok: false, msg: 'No hay parcelas libres en el invernadero.' };
    const sp = PH.state.bankGet(uid);
    if (!sp) return { ok: false, msg: 'Muestra no encontrada.' };
    if (sp.form === 'polen') return { ok: false, msg: 'El polen no se planta; úsalo en cruces.' };
    PH.state.bankRemove(uid);
    // resistencia al moho: rasgo cualitativo/mutación reduce el riesgo
    let resist = 0.5 + (((sp.pheno && sp.pheno.quant && sp.pheno.quant.resistencia) || 50) - 50) / 120;
    if (sp.pheno && sp.pheno.mutations && sp.pheno.mutations.includes('resina_blindada')) resist += 0.35;
    const plant = {
      id: 'G' + Date.now().toString(36) + RNG.i(100, 999),
      name: sp.nickname || sp.name, speciesId: sp.speciesId,
      genotype: sp.genotype, pheno: sp.pheno, rarity: sp.rarity, tier: sp.tier,
      quality: sp.quality, generation: sp.generation, form: sp.form,
      growMs: 0, stage: 0, ready: false,
      water: 78, health: HEALTH_MAX, diseased: false, moldResist: clamp(resist, 0.35, 1.6),
      seedSprite: RNG.pick(PH.sprites.SEEDLING_VARIANTS),
      vegSprite: RNG.pick(PH.sprites.VEG_VARIANTS),
    };
    s.garden.push(plant);

  // Presión ambiental de humedad: bruma/niebla y floración húmeda suben el riesgo.
  function humidityPressure() {

  function update(dt) {

    if (!s.garden || !s.garden.length) return;
    const hum = humidityPressure();
    for (const p of s.garden) {

      if (p.water == null) p.water = 78;

      if (p.diseased == null) p.diseased = false;
      if (p.moldResist == null) p.moldResist = 1;

        p.health = clamp(p.health - dt * MOLD_DMG, 0, HEALTH_MAX);
      } else if (p.water < 4) {
        p.health = clamp(p.health - dt * DRY_DMG, 0, HEALTH_MAX);
      } else if (p.water >= THIRST && p.water <= SOGGY) {
        p.health = clamp(p.health + dt * HEALTH_REGEN, 0, HEALTH_MAX);
      }

      // 3) aparición de moho/patógenos: encharcamiento + humedad ambiental
      if (!p.diseased && !p.ready && p.stage >= 1) {
        let risk = 0;
        if (p.water > SOGGY) risk += (p.water - SOGGY) / 12; // exceso de riego
        risk *= hum / p.moldResist;
        // prob. por segundo → por dt
        if (RNG.f() < risk * (dt / 1000) * 0.06) {
          p.diseased = true;
          if (PH.ui && PH.ui.toast) PH.ui.toast(`🍄 ${p.name} muestra moho. Trátala (poda + ventilación).`, 'warn');
          if (PH.audio) PH.audio.sfx('error');
        }
      }

      // 4) avance del cultivo (modulado por growRate → estrés y enfermedad frenan)
      if (p.ready) continue;
      p.growMs += dt * growRate(p);
      p.stage = stageOf(p.growMs);
      if (p.growMs >= STAGE_TIMES[FINAL]) { p.ready = true; p.stage = FINAL; }
    }
  }

  // Estado sanitario legible para la UI.
  function statusOf(p) {
    if (p.ready) return { key: 'ready', label: 'Lista', tone: 'ok' };
    if (p.diseased) return { key: 'mold', label: 'Moho', tone: 'bad' };
    if ((p.water != null ? p.water : 78) < THIRST) return { key: 'thirsty', label: 'Sed', tone: 'warn' };
    if ((p.water != null ? p.water : 78) > SOGGY) return { key: 'soggy', label: 'Encharcada', tone: 'warn' };
    if ((p.health != null ? p.health : 100) < 45) return { key: 'weak', label: 'Débil', tone: 'warn' };
    return { key: 'healthy', label: 'Sana', tone: 'ok' };
  }
  function waterPct(p) { return clamp(p.water != null ? p.water : 78, 0, 100); }
  function healthPct(p) { return clamp(p.health != null ? p.health : 100, 0, 100); }

  // Sprite de la fase actual: arte real por cepa (fase 1..5). Fallback a sprites.
  function spriteKey(p) {
    const k = PH.plantart && PH.plantart.stageKey(p.speciesId, (p.stage || 0) + 1);
    return k || (PH.sprites ? PH.sprites.LIFECYCLE[Math.min(p.stage, 4)].sprite : null);
  }
  function spriteUri(p) {
    const k = PH.plantart && PH.plantart.stageKey(p.speciesId, (p.stage || 0) + 1);
    if (k) return PH.plantart.uri(k);
    return PH.sprites ? PH.sprites.uri(spriteKey(p)) : null;
  }

  function progressPct(p) {
    const total = STAGE_TIMES[FINAL];
    return clamp((p.growMs / total) * 100, 0, 100);
  }

  // Riego: repone agua. El exceso encharca (riesgo de hongos), no acelera.
  function regar(id) {
    const s = G();
    const p = (s.garden || []).find(x => x.id === id);
    if (!p) return false;
    p.water = WATER_FULL;
    return true;
  }

  // Tratamiento biológico limpio (Fase 3): poda sanitaria + ventilación.
  // Cura el moho sin químicos agresivos; baja la humedad de la maceta y
  // deja algo de estrés (leve pérdida de salud) por la poda.
  function treat(id) {
    const s = G();
    const p = (s.garden || []).find(x => x.id === id);
    if (!p) return { ok: false };
    if (!p.diseased) return { ok: false, msg: 'La planta no necesita tratamiento.' };
    p.diseased = false;
    p.water = clamp(p.water - 22, 0, WATER_MAX); // ventilar seca el sustrato
    p.health = clamp(p.health - 6, 0, HEALTH_MAX); // la poda estresa un poco
    p.moldResist = clamp(p.moldResist + 0.08, 0.35, 1.8); // sanidad reforzada
    return { ok: true, msg: `Trataste ${p.name}: poda sanitaria y ventilación. Moho eliminado.` };
  }

  function harvest(id) {
    const s = G();
    const i = (s.garden || []).findIndex(x => x.id === id);
    if (i < 0) return { ok: false };
    const p = s.garden[i];
    if (!p.ready) return { ok: false, msg: 'Aún no está lista para cosechar.' };
    s.garden.splice(i, 1);

    // Factor de salud: una planta descuidada rinde menos y de peor calidad.
    const hf = clamp((p.health != null ? p.health : 100) / 100, 0.25, 1);

    // Rendimiento: nº de clones propagados según producción, ploidía y salud
    const ploid = p.pheno.ploidy || 2;
    let clones = 1 + Math.floor(((p.pheno.quant.produccion || 50) * hf) / 30) + (ploid > 2 ? 1 : 0);
    if (p.pheno.mutations.includes('gigantismo')) clones += 1;
    if (hf < 0.4) clones = Math.min(clones, 1);
    clones = clamp(clones, 1, 6);

    const made = [];
    for (let k = 0; k < clones; k++) {
      const spec = PH.species.makeSpecimen(PH.species.SPECIES_BY_ID[p.speciesId], s.env, {
        genotype: JSON.parse(JSON.stringify(p.genotype)),
        form: 'clon', quality: clamp(Math.round((p.quality || 80) * (0.6 + hf * 0.4)) + RNG.i(-3, 5), 5, 100),
        generation: p.generation, caughtAt: { biome: 'invernadero', weather: '-', time: PH.state.timeLabel(s.env) },
      });
      PH.state.bankAdd(spec);
      made.push(spec);
    }
    // Crédito por cosecha según resina/producción/rareza, modulado por salud
    const credits = Math.round((40 + (p.pheno.quant.resina || 40) * 1.4 + (p.pheno.quant.produccion || 40) * 1.2 + p.rarity * 3) * (0.5 + hf * 0.5));
    PH.state.addCredits(credits);
    s.stats.harvests = (s.stats.harvests || 0) + 1;
    if (hf >= 0.9) s.stats.perfectHarvests = (s.stats.perfectHarvests || 0) + 1;
    PH.state.addPrestige(2);
    return { ok: true, clones: made, credits, name: p.name, health: Math.round(hf * 100) };
  }

  function compost(id) {
    const s = G();
    const i = (s.garden || []).findIndex(x => x.id === id);
    if (i >= 0) s.garden.splice(i, 1);
  }

  PH.garden = {
    STAGE_TIMES, capacity, update, plantFromBank, spriteKey, spriteUri, progressPct,
    regar, treat, harvest, compost, stageOf, statusOf, waterPct, healthPct,
  };
})(window.PH = window.PH || {});

/* ============================================================
   PHENO HUNTER — encounter.js
   Resolución de recolección: éxito, calidad y forma obtenida.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp } = PH.util;
  const { TOOLS, toolQuality } = PH.items;

  // Intenta recolectar `wild` con la herramienta `toolId`.
  // Devuelve { success, specimen?, form, quality, msg }
  function harvest(wild, toolId) {
    const s = PH.state.get();
    const tool = TOOLS[toolId];
    if (!tool) return { success: false, msg: 'Herramienta no válida.' };

    // Modificadores de equipo
    const hasStab = s.player.gear.includes('estabilizador');
    const qualityBonus = hasStab ? 8 : 0;

    // Probabilidad de éxito baja con la rareza (rarezas se resisten)
    let successP = tool.success - (wild.rarity / 300);
    successP = clamp(successP, 0.15, 0.98);
    const ok = RNG.chance(successP);

    if (!ok) {
      return { success: false, form: tool.form, msg: `La ${wild.name} se resistió. No obtuviste ${tool.form}.` };
    }

    const quality = toolQuality(tool, qualityBonus);
    // El polen no crea un espécimen completo: crea material de cruce (guardamos como espécimen "polen")
    const form = tool.form;

    // Construye el espécimen recolectado. Copia el genotipo salvaje.
    const spec = PH.species.makeSpecimen(
      PH.species.SPECIES_BY_ID[wild.speciesId],
      s.env,
      {
        genotype: JSON.parse(JSON.stringify(wild.genotype)),
        form, quality,
        caughtAt: { biome: mapBiome(), weather: s.env.weather, time: PH.state.timeLabel(s.env) },
        generation: 0,
      }
    );
    // conserva firma/rareza del salvaje (mismo genotipo => misma firma)
    spec.signature = wild.signature;
    spec.rarity = wild.rarity;
    spec.tier = wild.tier;

    return { success: true, specimen: spec, form, quality, msg: `¡Obtuviste ${form} de ${wild.name}! (calidad ${quality})` };
  }

  function mapBiome() {
    const s = PH.state.get();
    const map = PH.world.MAPS[s.player.map];
    return map ? map.biome : null;
  }

  // Probabilidad de encuentro al pisar hierba alta
  function encounterChance(biome) {
    const s = PH.state.get();
    const b = PH.species.BIOMES[biome];
    let p = b ? b.baseEncounter : 0.12;
    if (s.player.cebosActivos > 0) p += 0.05;
    if (PH.events && PH.events.encounterBoost) p *= PH.events.encounterBoost();
    return Math.min(0.6, p);
  }

  PH.encounter = { harvest, encounterChance };
})(window.PH = window.PH || {});

(function (PH) {

  // Dibuja una planta en un <canvas> por id tras insertar el HTML
  // Acepta un espécimen {pheno,speciesId,form} o un pheno suelto.
  function paintPlant(canvasId, specOrPheno, scale) {
    const c = document.getElementById(canvasId);
    if (!c) return;
    const ctx = c.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const spec = specOrPheno && specOrPheno.pheno ? specOrPheno : null;
    const pheno = spec ? spec.pheno : specOrPheno;
    const speciesId = spec ? spec.speciesId : null;
    // Retrato de cepa (fase 5). Híbridos (cruce) usan procedural.
    const key = speciesId && spec.form !== 'cruce' && PH.plantart ? PH.plantart.portrait(speciesId) : null;
    const im = key && PH.plantart.img(key);
    const drawProc = () => { ctx.clearRect(0, 0, c.width, c.height); PH.render.drawPlant(ctx, c.width / 2, c.height - 8, pheno, scale || 2, performance.now()); };
    const drawImg = () => {
      const pad = 3, aw = c.width - pad * 2, ah = c.height - pad * 2;
      const r = Math.min(aw / im.naturalWidth, ah / im.naturalHeight);
      const w = Math.round(im.naturalWidth * r), h = Math.round(im.naturalHeight * r);
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.drawImage(im, (c.width - w) / 2, c.height - h - 2, w, h);

    if (im && im.complete && im.naturalWidth) drawImg();
    else if (im) { drawProc(); im.addEventListener('load', drawImg, { once: true }); }
