    overlay.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => { sell(b.dataset.sell); bank(); });
    overlay.querySelectorAll('[data-rel]').forEach(b => b.onclick = () => { PH.state.bankRemove(b.dataset.rel); toast('Muestra liberada.'); bank(); });
    overlay.querySelectorAll('[data-seq]').forEach(b => b.onclick = () => sequencePanel(b.dataset.seq));
  }

  /* ---------------- INVESTIGACIÓN: SECUENCIACIÓN Y ADN ---------------- */
  function sequencePanel(uid) {
    const s = G();
    const sp = PH.state.bankGet(uid);
    if (!sp) return;
    const wasSequenced = sp.sequenced;
    const res = PH.research.sequence(sp);
    if (!wasSequenced) { s.stats.sequenced++; PH.game.afterQuestCheck(); }
    const dna = res.seq.match(/.{1,3}/g).join(' ');
    const hidden = res.hidden.length
      ? res.hidden.map(h => `<li><b>${cap(h.gene)}</b>: expresa <i>${h.expressed}</i>, oculta recesivo <i>${h.hidden}</i></li>`).join('')
      : '<li class="dim">Homocigoto en genes visibles: sin recesivos ocultos.</li>';
    // parientes en el banco
    const rels = s.bank.filter(x => x.uid !== uid).map(x => ({ x, c: PH.research.compare(sp, x) }))
      .sort((a, b) => b.c.rel - a.c.rel).slice(0, 3);
    open(`
      <div class="panel">
        <div class="panel-head"><h2>🧬 Secuenciación de ADN</h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body">
          <div class="seq-head">${specimenCard(sp)}</div>
          <h3>Cadena genómica</h3>
          <div class="dna">${dna}</div>
          <h3>Genes recesivos ocultos</h3>
          <ul class="hidden-list">${hidden}</ul>
          <h3>Parentesco en tu banco</h3>
          ${rels.length ? rels.map(r => `<div class="rel-row"><span>${r.x.nickname || r.x.name}</span>
            <div class="bar"><i style="width:${r.c.rel}%"></i></div><b>${r.c.rel}%</b> <small>${r.c.relation}</small></div>`).join('') : '<p class="dim">No hay otras muestras para comparar.</p>'}
        </div>
      </div>`, 'center');
    document.getElementById('p_close').onclick = bank;
    paintPlant('pc_' + sp.uid, sp, 2);
  }
  function sellPrice(sp) {
    return Math.round(30 + sp.rarity * sp.rarity * 0.9 + sp.quality * 1.5);
  }
  function sell(uid) {
    const sp = PH.state.bankGet(uid);
    if (!sp) return;
    // no permitir vender la última copia única del catálogo si es la única muestra de esa firma? Permitimos, el catálogo persiste.
    const price = sellPrice(sp);
    PH.state.bankRemove(uid);
    PH.state.addCredits(price);
    toast(`Vendido por 💰${price}.`, 'ok');
    updateHUD();
  }

  /* ---------------- CATÁLOGO ---------------- */
  function catalog() {
    const s = G();
    const entries = Object.values(s.catalog).sort((a, b) => b.rarity - a.rarity);
    const total = PH.species.SPECIES.length;
    const seenSpecies = Object.keys(s.species).filter(id => s.species[id].obtained > 0).length;
    open(`
      <div class="panel wide">
        <div class="panel-head"><h2>🌿 Strain-dex mundial <small>${entries.length} fenotipos · ${seenSpecies}/${total} cepas</small></h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body">
          ${entries.length ? `<div class="cat-grid">${entries.map(e => catCard(e)).join('')}</div>` : '<p class="dim">Aún no has catalogado nada.</p>'}
        </div>
      </div>`, 'center');
    document.getElementById('p_close').onclick = close;
    entries.forEach((e, i) => paintPlant('cat_' + i, e, 1.7));
  }
  function catCard(e) {
    const idx = catCard._i = (catCard._i || 0);
    const t = PH.gen.rarityTier(e.rarity);
    catCard._i++;
    const cid = 'cat_' + idx;
    const muts = e.mutations.map(m => PH.gen.MUTATIONS[m].label).join(', ');
    return `<div class="cat-card">
      <canvas id="${cid}" width="70" height="90"></canvas>
      <div class="cc-name">${e.name}</div>
      <div class="cc-tier" style="color:${t.color}">${'★'.repeat(t.stars)}</div>
      <div class="cc-meta">${cap(e.pheno.color)} · ${cap(e.pheno.terp)}</div>
      ${muts ? `<div class="cc-mut">${muts}</div>` : ''}
      <div class="cc-count">×${e.count} · desc. ${e.firstAt}</div>
    </div>`;
  }

  /* ---------------- LABORATORIO (CRUCE) ---------------- */
  let breedSel = [];
  function lab() {
    const s = G();
    const fertile = s.bank.filter(sp => sp.form !== 'polen' && !sp.pheno.sterile);
    const pollen = s.bank.filter(sp => sp.form === 'polen');
    const usable = fertile.concat(pollen);
    breedSel = breedSel.filter(uid => s.bank.find(x => x.uid === uid));
    open(`
      <div class="panel wide">
        <div class="panel-head"><h2>🔬 Laboratorio — Cruces genéticos</h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body">
          <p class="dim">Selecciona dos parentales. La descendencia hereda un alelo de cada uno por gen; pueden surgir fenotipos, colores y mutaciones nuevos.</p>
          <div class="breed-slots">
            <div class="slot">${slotView(0)}</div>
            <div class="cross-sign">✕</div>
            <div class="slot">${slotView(1)}</div>
            <div class="cross-eq">→</div>
            <button class="btn primary" id="do_cross" ${breedSel.length === 2 ? '' : 'disabled'}>Cruzar</button>
          </div>
          <h3>Parentales disponibles (${usable.length})</h3>
          <div class="cat-grid select">
            ${usable.map(sp => `<div class="cat-card pick ${breedSel.includes(sp.uid) ? 'picked' : ''}" data-pick="${sp.uid}">
              <canvas id="lp_${sp.uid}" width="70" height="90"></canvas>
              <div class="cc-name">${sp.nickname || sp.name}</div>
              <div class="cc-tier" style="color:${PH.gen.rarityTier(sp.rarity).color}">${'★'.repeat(PH.gen.rarityTier(sp.rarity).stars)}</div>
              <div class="cc-meta">${cap(sp.form)} · ${cap(sp.pheno.color)}</div>
            </div>`).join('')}
          </div>
        </div>
      </div>`, 'center');
    document.getElementById('p_close').onclick = () => { breedSel = []; close(); };
    usable.forEach(sp => paintPlant('lp_' + sp.uid, sp, 1.7));
    overlay.querySelectorAll('[data-pick]').forEach(el => el.onclick = () => togglePick(el.dataset.pick));
    document.getElementById('do_cross').onclick = doCross;
  }
  function slotView(i) {
    const uid = breedSel[i];
    if (!uid) return '<span class="dim">vacío</span>';
    const sp = PH.state.bankGet(uid);
    return `<canvas id="slot_${i}" width="70" height="90"></canvas><div class="cc-name">${sp.name}</div>`;
  }
  function togglePick(uid) {
    const i = breedSel.indexOf(uid);
    if (i >= 0) breedSel.splice(i, 1);
    else if (breedSel.length < 2) breedSel.push(uid);
    lab();
    breedSel.forEach((u, k) => paintPlant('slot_' + k, PH.state.bankGet(u), 1.7));
  }
  function doCross() {
    if (breedSel.length !== 2) return;
    const s = G();
    const A = PH.state.bankGet(breedSel[0]);
    const B = PH.state.bankGet(breedSel[1]);
    const labBonus = 1 + (s.player.labLevel - 1) * 0.6; // mejoras de laboratorio
    const childGeno = PH.gen.breed(A.genotype, B.genotype, { mutRate: 0.08, mutBoost: labBonus });
    const sameStrain = A.speciesId === B.speciesId;
    const purity = Math.max(0, Math.round(((A.purity != null ? A.purity : 100) + (B.purity != null ? B.purity : 100)) / 2 * (sameStrain ? 0.98 : 0.6)));
    const spec = PH.species.makeSpecimen(PH.species.SPECIES_BY_ID[A.speciesId], s.env, {
      genotype: childGeno, form: 'cruce', quality: Math.round((A.quality + B.quality) / 2),
      parents: [A.uid, B.uid], generation: Math.max(A.generation, B.generation) + 1,
      purity, landrace: sameStrain && purity >= 90,
    });
    s.stats.crosses++;
    const before = Object.keys(s.catalog).length;
    PH.state.bankAdd(spec);
    const isNew = Object.keys(s.catalog).length > before;
    breedSel = [];
    // pantalla de resultado
    crossResult(spec, isNew, A, B);
    PH.game.afterQuestCheck();
  }
  function crossResult(spec, isNew, A, B) {
    open(`
      <div class="panel">
        <div class="panel-head"><h2>🌱 Descendencia obtenida</h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body center-col">
          ${isNew ? '<div class="newbadge">✨ ¡FENOTIPO NUEVO PARA EL CATÁLOGO! ✨</div>' : '<div class="dim">Fenotipo ya conocido.</div>'}
          ${specimenCard(spec)}
          <p class="dim">Parentales: ${A.name} ✕ ${B.name}</p>
          <div class="row">
            <button class="btn primary" id="again">Volver al laboratorio</button>
            <button class="btn ghost" id="p_close2">Cerrar</button>
          </div>
        </div>
      </div>`, 'center');
    paintPlant('pc_' + spec.uid, spec, 2.4);
    document.getElementById('p_close').onclick = close;
    document.getElementById('p_close2').onclick = close;
    document.getElementById('again').onclick = lab;
    if (isNew) toast('✨ Nuevo fenotipo catalogado: ' + spec.name, 'ok');
  }

  /* ---------------- INVERNADERO / CULTIVO ---------------- */
  let plantPicker = false;
  function greenhouse() {
    const s = G();
    if (!s.garden) s.garden = [];
    const cap = PH.garden.capacity();
    const plots = [];
    for (let i = 0; i < cap; i++) {
      const p = s.garden[i];
      if (p) plots.push(plotView(p));
      else plots.push(`<div class="plot empty"><div class="plot-add" data-add="1">＋<small>Plantar</small></div></div>`);
    }
    open(`
      <div class="panel wide">
        <div class="panel-head"><h2>🌿 Invernadero <small>${s.garden.length}/${cap} parcelas</small></h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body">
          <p class="dim">Planta clones o semillas y obsérvalos crecer por fases. Riega cuando tengan sed: sin agua se estresan y frenan. El riego excesivo y la humedad ambiental favorecen el moho — trátalo con poda sanitaria y ventilación (bio, sin químicos). Una planta sana rinde más al cosechar.</p>
          <div class="garden-grid">${plots.join('')}</div>
        </div>
      </div>`, 'center');
    document.getElementById('p_close').onclick = () => { plantPicker = false; close(); };
    overlay.querySelectorAll('[data-add]').forEach(b => b.onclick = plantPickerView);
    overlay.querySelectorAll('[data-water]').forEach(b => b.onclick = () => { PH.garden.regar(b.dataset.water); if (PH.audio) PH.audio.sfx('blip'); greenhouse(); });
    overlay.querySelectorAll('[data-treat]').forEach(b => b.onclick = () => { const r = PH.garden.treat(b.dataset.treat); if (r.msg) toast(r.msg, r.ok ? 'ok' : 'bad'); if (r.ok && PH.audio) PH.audio.sfx('confirm'); greenhouse(); });
    overlay.querySelectorAll('[data-harv]').forEach(b => b.onclick = () => doHarvest(b.dataset.harv));
    overlay.querySelectorAll('[data-comp]').forEach(b => b.onclick = () => { if (confirm('¿Compostar esta planta? Se pierde.')) { PH.garden.compost(b.dataset.comp); greenhouse(); } });
  }

  const STAGE_LABELS = ['Plántula', 'Vegetativo temp.', 'Vegetativo', 'Floración', 'Cosecha'];
  function plotView(p) {
    const label = STAGE_LABELS[p.stage] || 'Cosecha';
    const uri = PH.garden.spriteUri(p);
    const pct = PH.garden.progressPct(p);
    const t = PH.gen.rarityTier(p.rarity);
    const pal = PH.gen.paletteFor(p.pheno);
    const st = PH.garden.statusOf(p);
    const wp = PH.garden.waterPct(p), hp = PH.garden.healthPct(p);
    const wtone = wp < 22 ? 'bad' : (wp > 88 ? 'warn' : 'ok');
    return `<div class="plot ${p.ready ? 'ready' : ''} ${p.diseased ? 'sick' : ''}">
      <div class="plot-sprite"><img src="${uri}" alt=""><span class="phdot" style="background:${pal.base}"></span>
        <span class="plot-badge ${st.tone}">${st.label}</span></div>
      <div class="plot-name">${p.name}</div>
      <div class="plot-stage" style="color:${t.color}">${p.ready ? '✅ Lista' : label}</div>
      <div class="bar grow"><i style="width:${pct}%"></i></div>
      <div class="vitals">
        <span class="vit water ${wtone}" title="Agua ${Math.round(wp)}%">💧<b><i style="width:${wp}%"></i></b></span>
        <span class="vit health ${hp < 45 ? 'bad' : 'ok'}" title="Salud ${Math.round(hp)}%">❤️<b><i style="width:${hp}%"></i></b></span>
      </div>
      <div class="plot-actions">
        ${p.ready
          ? `<button class="btn small primary" data-harv="${p.id}">Cosechar</button>`
          : (p.diseased
            ? `<button class="btn small warn" data-treat="${p.id}">🌿 Tratar</button>`
            : `<button class="btn small" data-water="${p.id}">💧 Regar</button>`)}
        <button class="btn small ghost" data-comp="${p.id}">🗑</button>
      </div>
    </div>`;
  }

  function plantPickerView() {
    const s = G();
    const usable = s.bank.filter(sp => sp.form !== 'polen');
    open(`
      <div class="panel wide">
        <div class="panel-head"><h2>🌱 Plantar en el invernadero</h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body">
          <p class="dim">Elige una muestra del banco para cultivar. La cosecha te devolverá varios clones de esa misma genética.</p>
          ${usable.length ? `<div class="cat-grid select">${usable.map(sp => `<div class="cat-card pick" data-plant="${sp.uid}">
            <canvas id="gp_${sp.uid}" width="70" height="90"></canvas>
            <div class="cc-name">${sp.nickname || sp.name}</div>

      </div>`, 'center');
    document.getElementById('p_close').onclick = close;

    overlay.querySelectorAll('[data-plant]').forEach(el => el.onclick = () => {

  function doHarvest(id) {
    const res = PH.garden.harvest(id);
    if (!res.ok) { toast(res.msg || 'No se pudo cosechar.', 'bad'); return; }
    if (PH.audio) PH.audio.sfx('harvest'); toast(`🌾 Cosechaste ${res.name} (salud ${res.health}%): ${res.clones.length} clones + 💰${res.credits}`, 'ok');
    updateHUD();
    PH.game.afterQuestCheck();
    greenhouse();
  }

  /* ---------------- MERCADO ---------------- */
  function shop() {
    const s = G();
    const toolStock = Object.values(PH.items.TOOLS).filter(t => t.price > 0 && !s.player.tools.includes(t.id));
    const gearStock = Object.values(PH.items.GEAR).filter(g => !g.consumable && !s.player.gear.includes(g.id))
      .concat(Object.values(PH.items.GEAR).filter(g => g.consumable));
    open(`
      <div class="panel wide">
        <div class="panel-head"><h2>🛒 Mercado <small>💰 ${fmt(s.player.credits)}</small></h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body">
          <h3>Herramientas</h3>
          <div class="shop-grid">
            ${toolStock.length ? toolStock.map(t => shopItem(t, 'tool')).join('') : '<p class="dim">Tienes todas las herramientas.</p>'}
          </div>
          <h3>Equipo y consumibles</h3>
          <div class="shop-grid">
            ${gearStock.map(g => shopItem(g, 'gear')).join('')}
          </div>
        </div>
      </div>`, 'center');
    document.getElementById('p_close').onclick = close;
    overlay.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => { buy(b.dataset.buy, b.dataset.kind); });
  }
  function shopItem(it, kind) {
    return `<div class="shop-item">
      <b>${it.name}</b><small>${it.desc}</small>
      <button class="btn small" data-buy="${it.id}" data-kind="${kind}">💰 ${fmt(it.price)}</button>
    </div>`;
  }
  function buy(id, kind) {
    const s = G();
    const it = kind === 'tool' ? PH.items.TOOLS[id] : PH.items.GEAR[id];
    if (s.player.credits < it.price) { toast('Créditos insuficientes.', 'bad'); return; }
    PH.state.addCredits(-it.price);
    if (kind === 'tool') { if (!s.player.tools.includes(id)) s.player.tools.push(id); }
    else if (it.consumable) { s.player.cebosActivos += 8; }
    else { if (!s.player.gear.includes(id)) s.player.gear.push(id); }
    toast('Comprado: ' + it.name, 'ok');
    updateHUD(); shop();
  }

    open(`

  function rewardText(r) {
    const bits = [];
    if (r.credits) bits.push('💰' + r.credits);

    if (r.tool) bits.push(PH.items.TOOLS[r.tool].name);

/* ============================================================
   STRAINMON — audio.js
   Motor de sonido chiptune inspirado en la APU de la Game Boy:
   canales de PULSO (onda cuadrada con duty), ONDA (periódica) y
   RUIDO. SFX + bucle de música. Web Audio, sin dependencias.
   Se inicializa en el primer gesto del usuario (política autoplay).
   ============================================================ */
(function (PH) {
  'use strict';
  let ctx = null, master = null, muted = false;
  let musicOn = false, musicTimer = null, step = 0, noiseBuf = null;

  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC(); } catch (e) { return null; }
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ctx.destination);
    return ctx;
  }
  const t = () => (ctx ? ctx.currentTime : 0);

  // Voz de pulso/onda con envolvente rápida (chip).
  function tone(freq, dur, o) {
    o = o || {}; if (!ensure()) return;
    const osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'square';
    osc.frequency.setValueAtTime(freq, t());
    if (o.slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, o.slideTo), t() + dur);
    const vol = o.vol != null ? o.vol : 0.25, atk = o.attack || 0.004;
    g.gain.setValueAtTime(0.0001, t());
    g.gain.linearRampToValueAtTime(vol, t() + atk);
    g.gain.exponentialRampToValueAtTime(0.0008, t() + dur);
    osc.connect(g); g.connect(master); osc.start(); osc.stop(t() + dur + 0.03);
  }
  // Canal de ruido (percusión / efectos).
  function noise(dur, o) {
    o = o || {}; if (!ensure()) return;
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, (ctx.sampleRate * 0.5) | 0, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = o.hp || 1600;
    const g = ctx.createGain(); const vol = o.vol != null ? o.vol : 0.2;
    g.gain.setValueAtTime(vol, t()); g.gain.exponentialRampToValueAtTime(0.001, t() + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(); s.stop(t() + dur + 0.03);
  }

  const SFX = {
    step: () => tone(200, 0.045, { vol: 0.05 }),
    confirm: () => { tone(660, 0.06, { vol: 0.22 }); tone(990, 0.09, { vol: 0.16 }); },
    cancel: () => tone(320, 0.10, { vol: 0.2, slideTo: 170 }),
    open: () => { tone(520, 0.05, { vol: 0.18 }); tone(760, 0.08, { vol: 0.14 }); },
    warp: () => tone(360, 0.20, { vol: 0.2, slideTo: 900 }),
    blip: () => tone(880, 0.05, { vol: 0.18 }),
    cash: () => { tone(784, 0.06, { vol: 0.2 }); tone(1046, 0.08, { vol: 0.2 }); tone(1318, 0.13, { vol: 0.16 }); },
    harvest: () => { tone(523, 0.08, { vol: 0.2 }); tone(659, 0.08, { vol: 0.2 }); tone(784, 0.16, { vol: 0.18 }); },
    encounter: () => { tone(300, 0.09, { vol: 0.22, slideTo: 620 }); noise(0.10, { vol: 0.1 }); },
    error: () => tone(150, 0.12, { vol: 0.2 }),
  };
  function sfx(k) { if (muted) return; const f = SFX[k]; if (f) f(); }

  // --- Música: bucle pentatónico simple (lead pulso + bajo onda + hats ruido) ---
  const SCALE = [0, 3, 5, 7, 10];
  const LEAD = [0, 3, 5, 7, 5, 3, 7, 10, 7, 5, 3, 0, 3, 5, 7, 3];
  const BASS = [110, 110, 146.83, 130.81];
  function tick() {
    if (!ctx || muted || !musicOn) { step++; return; }
    const s = step % 16;
    if (s % 4 === 0) tone(BASS[(step / 4 | 0) % BASS.length], 0.26, { type: 'triangle', vol: 0.12 });
    if (s % 2 === 0) { const semi = LEAD[s % LEAD.length]; tone(261.63 * Math.pow(2, semi / 12), 0.14, { vol: 0.08 }); }
    if (s % 4 === 2) noise(0.03, { vol: 0.045, hp: 4000 });
    step++;
  }
  function musicStart() { musicOn = true; ensure(); if (!musicTimer) musicTimer = setInterval(tick, 175); }
  function musicStop() { musicOn = false; if (musicTimer) { clearInterval(musicTimer); musicTimer = null; } }

  function setMuted(m) { muted = m; if (master) master.gain.value = m ? 0 : 0.5; }
  function toggleMute() { setMuted(!muted); return muted; }
  function isMuted() { return muted; }

  PH.audio = { ensure, sfx, tone, noise, musicStart, musicStop, setMuted, toggleMute, isMuted };
})(window.PH = window.PH || {});

/* ============================================================
   STRAINMON — heat.js
   FASE 4 — presión policial ("heat", estilo GTA-lite). Trapichear en
   la calle sube el nivel de búsqueda (0..5 estrellas). Con suficiente
   heat aparecen patrullas que te persiguen por la calle; si te pillan,
   pagas una multa y te confiscan género. El heat se enfría solo con el
   tiempo, y basta con meterte en un interior para despistar a la poli.
   Estado en s.player.heat para persistir en el guardado.
   ============================================================ */
(function (PH) {
  'use strict';
  const { clamp } = PH.util;
  const G = () => PH.state.get();

  const MAX = 100;
  const DECAY = 100 / 90000;   // se enfría por completo en ~90 s reales
  const COP_THRESHOLD = 55;    // a partir de aquí patrullan
  let lastLevel = 0;

  function heat() { const p = G().player; if (p.heat == null) p.heat = 0; return p.heat; }
  function set(v) { G().player.heat = clamp(v, 0, MAX); }
  function level() { return clamp(Math.floor(heat() / 20), 0, 5); } // 0..5 estrellas
  function copsActive() { return heat() >= COP_THRESHOLD; }

  function add(n) {
    const before = level();
    set(heat() + n);
    const lv = level();
    if (lv > before && PH.ui && PH.ui.toast) {
      PH.ui.toast(`🚨 Nivel de búsqueda ${'★'.repeat(lv)} — baja el perfil.`, 'warn');
      if (PH.audio) PH.audio.sfx('error');
    }
    lastLevel = lv;
  }
  function cool(n) { set(heat() - n); lastLevel = level(); }

  function update(dt) {
    if (heat() > 0) { set(heat() - dt * DECAY); lastLevel = level(); }
  }

  PH.heat = { MAX, COP_THRESHOLD, heat, add, cool, set, level, copsActive, update };
})(window.PH = window.PH || {});

/* ============================================================
   STRAINMON — iso.js
   Motor isométrico original (proyección 2:1, painter's algorithm).
   Sin relación con Habbo/Sulake: matemática y arte propios.
   ============================================================ */
(function (PH) {
  'use strict';
  const { shade } = PH.util;
  const TW = 64, TH = 32;            // ancho/alto de rombo de suelo (2:1)
  const WH = 40;                     // alto de pared/cubo
  const px = (ctx, x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };

  // grid -> pantalla (centro superior del rombo)
  function project(gx, gy, cam) {
    return {
      x: (gx - gy) * (TW / 2) + cam.x,
      y: (gx + gy) * (TH / 2) + cam.y,
    };
  }
  // pantalla -> grid (para clics)
  function unproject(sx, sy, cam) {
    const x = sx - cam.x, y = sy - cam.y;
    return { gx: Math.floor((y / (TH / 2) + x / (TW / 2)) / 2), gy: Math.floor((y / (TH / 2) - x / (TW / 2)) / 2) };
  }

  // rombo de suelo con relieve
  function floorDiamond(ctx, sx, sy, top, side) {
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + TW / 2, sy + TH / 2);
    ctx.lineTo(sx, sy + TH);
    ctx.lineTo(sx - TW / 2, sy + TH / 2);
    ctx.closePath();
    ctx.fillStyle = top; ctx.fill();
    ctx.strokeStyle = side; ctx.lineWidth = 1; ctx.stroke();
  }

  // cubo (pared / bloque) de altura h
  function cube(ctx, sx, sy, h, pal) {
    const topY = sy - h;
    // cara izquierda
    ctx.beginPath();
    ctx.moveTo(sx - TW / 2, sy + TH / 2);
    ctx.lineTo(sx, sy + TH);
    ctx.lineTo(sx, sy + TH - h);
    ctx.lineTo(sx - TW / 2, sy + TH / 2 - h);
    ctx.closePath(); ctx.fillStyle = pal.left; ctx.fill();
    // cara derecha
    ctx.beginPath();
    ctx.moveTo(sx + TW / 2, sy + TH / 2);
    ctx.lineTo(sx, sy + TH);
    ctx.lineTo(sx, sy + TH - h);
    ctx.lineTo(sx + TW / 2, sy + TH / 2 - h);
    ctx.closePath(); ctx.fillStyle = pal.right; ctx.fill();
    // tapa
    ctx.beginPath();
    ctx.moveTo(sx, sy - h);
    ctx.lineTo(sx + TW / 2, sy + TH / 2 - h);
    ctx.lineTo(sx, sy + TH - h);
    ctx.lineTo(sx - TW / 2, sy + TH / 2 - h);

  }

  // Personaje isométrico. Si hay sprite de arte para su rol+dirección, lo usa
  // (billboard anclado a la base, con bob al andar); si no, dibujo procedural.
  const CHAR_H = 42;
  function actor(ctx, sx, sy, dir, frame, p, char) {
    const cx = sx, by = sy + TH / 2;
    if (char && PH.charart && PH.charart.has(char)) {

      <div class="panel">
        <div class="panel-head"><h2>🤝 Trato callejero</h2><button class="x" id="p_close">✕</button></div>
        <div class="panel-body center-col">
          <p><b>${npc.name}:</b> te compro tu <b>${want.nickname || want.name}</b> (${want.speciesId}) por <b>💰 ${price}</b>.</p>
          <div style="width:120px">${PH.ui.specimenCard(want)}</div>
          <div class="row">
            <button class="btn primary" id="d_yes">Vender 💰${price}</button>
            <button class="btn ghost" id="d_no">Paso</button>
          </div>
        </div>
      </div>`, 'center');
    PH.ui.paintPlant('pc_' + want.uid, want, 2);
    document.getElementById('p_close').onclick = PH.ui.close;
    document.getElementById('d_no').onclick = PH.ui.close;
    document.getElementById('d_yes').onclick = () => {
      PH.state.bankRemove(want.uid); PH.state.addCredits(price);
      s.stats.deals = (s.stats.deals || 0) + 1; if (PH.audio) PH.audio.sfx('cash');
      // trapicheo en la calle -> sube el nivel de búsqueda (más si es de día)
      if (PH.heat) PH.heat.add(G().env.night ? 12 : 20);
      PH.ui.toast(`Vendido a ${npc.name}: 💰${price}`, 'ok');
      PH.ui.updateHUD(); PH.game.afterQuestCheck(); PH.ui.close();
    };
  }

  /* ------------------------- MOVIMIENTO ------------------------- */
  function tryMove() {
    if (game.moving || game.mode !== 'overworld') return;
    const p = G().player; let dir = null;
    if (game.keys['arrowup'] || game.keys['w']) dir = 'NE';
    else if (game.keys['arrowdown'] || game.keys['s']) dir = 'SW';
    else if (game.keys['arrowleft'] || game.keys['a']) dir = 'NW';
    else if (game.keys['arrowright'] || game.keys['d']) dir = 'SE';
    if (!dir) return;
    p.dir = dir;
    const m = room(p.map), d = DIRV[dir];
    const nx = p.x + d[0], ny = p.y + d[1];
    const door = doorAt(m, nx, ny);
    if (door) { warp(door); return; }
    if (solidAt(m, nx, ny)) return;
    game.moving = true; game.moveT = 0; game.from = { x: p.x, y: p.y }; game.to = { x: nx, y: ny };
  }
  function finishMove() {
    const p = G().player; p.x = game.to.x; p.y = game.to.y; game.moving = false;
    G().stats.distance++;
    A('step');
    // parterres silvestres 'g' -> posible encuentro
    const m = room(p.map);
    if (m.wild && tileAt(m, p.x, p.y) === 'g') {
      if (PH.util.RNG.chance(0.22)) {
        A('encounter');
        const biome = PH.util.RNG.pick(['pradera', 'bosque', 'pantano', 'desierto', 'nieve', 'volcan', 'cueva', 'isla']);
        PH.ui.encounter(PH.species.rollEncounter(biome, G().env));
      }
    }
  }
  function warp(d) {
    const p = G().player; const t = room(d.to); if (!t) return;
    A('warp');
    const hadCop = !!game.cop;
    p.map = d.to; p.x = d.tgx; p.y = d.tgy; game.moving = false;
    if (hadCop && t.id !== 'street') { game.cop = null; PH.ui.toast('🚪 Despistaste a la patrulla.', 'ok'); }
    centerCam(true); PH.ui.updateHUD(); PH.ui.toast('📍 ' + t.name, '');
  }

  /* ------------------------- IA DE NPCs ------------------------- */
  // Estados: 'idle' | 'walk'. Deambulan por tiles caminables respetando
  // colisión (paredes, objetos, jugador y otros NPCs). Los 'dealer'/'neighbor'
  // se quedan cerca de su sitio; 'customer'/'walker' pasean más.
  const NPC_STEP = 240;
  function npcSolid(m, gx, gy, self) {
    if (solidAt(m, gx, gy, true)) return true;              // pared/objeto/fuera
    const p = G().player; if (p.x === gx && p.y === gy) return true; // jugador
    for (const n of m.npcs) if (n !== self && n.gx === gx && n.gy === gy) return true; // otros NPCs
    return false;
  }
  function updateNPCs(dt) {
    const m = room(G().player.map); if (!m) return;
    for (const n of m.npcs) {
      // horario: fuera de su ventana, el NPC "se retira" (no colisiona ni se dibuja)
      const on = npcActive(n);
      if (!on) { n._inactive = true; n._mv = false; continue; }
      n._inactive = false;
      if (n._talk) continue;                                 // pausado al hablar
      if (n._mv) {
        n._t += dt;
        if (n._t >= NPC_STEP) { n.gx = n._tx; n.gy = n._ty; n._mv = false; n._wait = PH.util.RNG.i(500, 2600); }
        continue;
      }
      n._wait = (n._wait == null) ? PH.util.RNG.i(300, 1800) : n._wait - dt;
      if (n._wait > 0) continue;
      // homebound: dealer/neighbor no se alejan de su origen
      if (n._hx == null) { n._hx = n.gx; n._hy = n.gy; }
      const roam = (n.role === 'customer' || n.role === 'walker') ? 6 : 2;
      const dirs = PH.util.RNG.shuffle([['NE', 0, -1], ['SW', 0, 1], ['NW', -1, 0], ['SE', 1, 0]]);
      let moved = false;
      for (const d of dirs) {
        const nx = n.gx + d[1], ny = n.gy + d[2];
        if (Math.abs(nx - n._hx) + Math.abs(ny - n._hy) > roam) continue;
        if (npcSolid(m, nx, ny, n)) continue;
        n.dir = d[0]; n._tx = nx; n._ty = ny; n._fx = n.gx; n._fy = n.gy; n._mv = true; n._t = 0; moved = true; break;
      }
      if (!moved) n._wait = PH.util.RNG.i(600, 2000);        // atrapado -> espera
    }
  }
  function npcRender(n) {
    let gx = n.gx, gy = n.gy, frame = 0;
    if (n._mv) { const t = clamp(n._t / NPC_STEP, 0, 1); gx = lerp(n._fx, n._tx, t); gy = lerp(n._fy, n._ty, t); frame = (Math.floor(n._t / (NPC_STEP / 2)) % 2 === 0 ? 1 : 2); }
    return { gx, gy, dir: n.dir || 'SW', frame, pal: PH.render.NPC_PALETTES[n.sprite], char: n.char };
  }

  /* ------------------------- POLICÍA / HEAT (Fase 4) ------------------------- */
  // Con nivel de búsqueda alto aparece una patrulla en la calle que te
  // persigue. Si te alcanza: multa + confiscación. Métete en un interior
  // para despistarla (no entra a las salas). Paleta azul, sprite reutilizado.
  const COP_STEP = 210, COP_PAL = { skin: '#e8c49a', hair: '#1a2740', shirt: '#26407a', pants: '#182238' };
  function copRender(c) {
    let gx = c.gx, gy = c.gy, frame = 0;
    if (c._mv) { const t = clamp(c._t / COP_STEP, 0, 1); gx = lerp(c._fx, c._tx, t); gy = lerp(c._fy, c._ty, t); frame = (Math.floor(c._t / (COP_STEP / 2)) % 2 === 0 ? 1 : 2); }
    return { gx, gy, dir: c.dir || 'SW', frame, pal: COP_PAL, char: 'walker' };
  }
  function copSpawnPoint(m) {
    // aparece por un borde caminable de la calle, lejos del jugador
    const p = G().player, cand = [];
    for (let gy = 0; gy < m.grid.length; gy++) for (let gx = 0; gx < m.grid[gy].length; gx++) {
      if (!walkableChar(tileAt(m, gx, gy))) continue;
      if (doorAt(m, gx, gy)) continue;
      const d = Math.abs(gx - p.x) + Math.abs(gy - p.y);
      if (d >= 5) cand.push({ gx, gy, d });
    }
    if (!cand.length) return null;
    cand.sort((a, b) => b.d - a.d);
    return cand[Math.min(cand.length - 1, PH.util.RNG.i(0, Math.min(3, cand.length - 1)))];
  }
  function copBlocked(m, gx, gy) {
    if (!walkableChar(tileAt(m, gx, gy))) return true;
    const o = objAt(m, gx, gy); if (o && o.solid !== false) return true;
    for (const n of m.npcs) if (!n._inactive && n.gx === gx && n.gy === gy) return true;
    return false;
  }
  function updateCop(dt) {
    const p = G().player, m = room(p.map);
    const active = PH.heat && PH.heat.copsActive() && m && m.id === 'street';
    if (!active) {
      // sin heat o fuera de la calle -> la patrulla se marcha (despiste)
      if (game.cop) { if (game.cop.map !== p.map && PH.heat && PH.heat.heat() > 0) { /* despistado */ }
        game.cop = null; }
      return;
    }
    if (!game.cop || game.cop.map !== 'street') {
      const sp = copSpawnPoint(m); if (!sp) return;
      game.cop = { map: 'street', gx: sp.gx, gy: sp.gy, dir: 'SW', _mv: false, _wait: 300 };
      PH.ui.toast('🚔 ¡Patrulla en la calle! Piérdete en un interior.', 'bad');
      if (PH.audio) PH.audio.sfx('encounter');
    }
    const c = game.cop;
    // ¿alcanzado? adyacencia manhattan 1 (o misma casilla)
    const md = Math.abs(c.gx - p.x) + Math.abs(c.gy - p.y);
    if (!c._mv && md <= 1) { bust(); return; }
    if (c._mv) {
      c._t += dt;
      if (c._t >= COP_STEP) { c.gx = c._tx; c.gy = c._ty; c._mv = false; c._wait = 40; }
      return;
    }
    c._wait = (c._wait == null ? 0 : c._wait - dt);
    if (c._wait > 0) return;
    // persecución voraz: elige el eje que más acerca al jugador
    const opts = [];
    if (p.x !== c.gx) opts.push(p.x > c.gx ? ['SE', 1, 0] : ['NW', -1, 0]);
    if (p.y !== c.gy) opts.push(p.y > c.gy ? ['SW', 0, 1] : ['NE', 0, -1]);
    // prioriza el eje de mayor distancia
    opts.sort((a, b) => Math.abs((a[1] ? p.x - c.gx : p.y - c.gy)) < Math.abs((b[1] ? p.x - c.gx : p.y - c.gy)) ? 1 : -1);
    for (const d of opts) {
      const nx = c.gx + d[1], ny = c.gy + d[2];
      if (nx === p.x && ny === p.y) { bust(); return; }
      if (copBlocked(m, nx, ny)) continue;
      c.dir = d[0]; c._fx = c.gx; c._fy = c.gy; c._tx = nx; c._ty = ny; c._mv = true; c._t = 0; return;
    }
    c._wait = 160; // bloqueado: espera un pelín
  }
  function bust() {
    const s = G(), c = game.cop; game.cop = null;
    if (PH.audio) PH.audio.sfx('error');
    // multa proporcional + confiscación de la muestra menos valiosa
    const fine = Math.min(s.player.credits, Math.max(40, Math.round(s.player.credits * 0.3)));
    PH.state.addCredits(-fine);
    let seized = null;
    const stock = s.bank.filter(x => x.form !== 'polen');
    if (stock.length) {
      seized = stock.slice().sort((a, b) => a.rarity - b.rarity)[0];
      PH.state.bankRemove(seized.uid);
    }
    s.player.busts = (s.player.busts || 0) + 1;
    if (PH.heat) PH.heat.set(18); // te sueltan con un aviso; el heat baja
    const msg = seized ? `🚨 ¡Te pillaron! Multa 💰${fine} y confiscan ${seized.nickname || seized.name}.`
      : `🚨 ¡Te pillaron! Multa 💰${fine}.`;
    PH.ui.toast(msg, 'bad');
    PH.ui.updateHUD();
  }

  game.roomName = function () { const m = room(G().player.map); return m ? m.name : ''; };
  game.audit = audit;
  game.canWalk = function (mapId, gx, gy) { const m = room(mapId); return m ? !solidAt(m, gx, gy) : false; };
  game.ROOMS = ROOMS;
  game.afterQuestCheck = function () {
    const done = PH.quests.checkAll();
    for (const q of done) PH.ui.toast('✅ Misión completada: ' + q.name, 'ok');
    PH.ui.updateHUD();
  };

  /* ------------------------- CÁMARA ------------------------- */
  function playerScreen() {
    const p = G().player; let gx = p.x, gy = p.y;
    if (game.moving) { const t = clamp(game.moveT / game.moveDur, 0, 1); gx = lerp(game.from.x, game.to.x, t); gy = lerp(game.from.y, game.to.y, t); }
    return ISO.project(gx, gy, { x: 0, y: 0 });
  }
  function centerCam(snap) {
    const ps = playerScreen();
    const tx = game.W / 2 - ps.x, ty = game.H / 2 - ps.y - 20;
    if (snap) { game.cam.x = tx; game.cam.y = ty; }
    else { game.cam.x = lerp(game.cam.x, tx, 0.15); game.cam.y = lerp(game.cam.y, ty, 0.15); }
  }

  /* ------------------------- BUCLE ------------------------- */
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(50, now - last); last = now;
    game.animT += dt;
    if (game.animT > 240) { game.frame ^= 1; game.animT = 0; }
    if (game.mode === 'overworld' || game.mode === 'menu' || game.mode === 'dialog' || game.mode === 'encounter') {
      PH.state.updateEnv(dt); if (PH.events) PH.events.update(dt); if (PH.garden) PH.garden.update(dt);
      if (PH.heat) PH.heat.update(dt);
    }
    if (game.mode === 'overworld') {
      tryMove();
      if (game.moving) { game.moveT += dt; if (game.moveT >= game.moveDur) finishMove(); }
      updateNPCs(dt);
      updateCop(dt);
      centerCam(false);
      if (now - game.lastSave > 20000) { PH.state.save(); game.lastSave = now; }
    }
    if (game.mode !== 'title' && game.mode !== 'boot') render(now);
    if (game.mode === 'overworld' && game.frame === 0) PH.ui.updateHUD();
    requestAnimationFrame(loop);
  }

  /* ------------------------- RENDER ------------------------- */
  function render(now) {
    const ctx = game.ctx, m = room(G().player.map); if (!m) return;
    // fondo por tema
    ctx.fillStyle = m.theme === 'street' ? '#2a3550' : '#14100c';
    ctx.fillRect(0, 0, game.W, game.H);

    // parterres 'g' como suelo especial + suelo calle 'H' fachadas
    const extraFloors = [];
    const walls = [];
    for (let gy = 0; gy < m.grid.length; gy++) for (let gx = 0; gx < m.grid[gy].length; gx++) {
      const ch = m.grid[gy][gx];
      if (ch === 'g') extraFloors.push({ gx, gy, col: '#3f7d34', edge: '#2f5b26' });
      else if (ch === 'H') walls.push({ gx, gy, h: 56, pal: ISO.THEMES.street.wall });
      else if (ch === 'P') walls.push({ gx, gy, h: 30, lamp: true, pal: { top: '#ffd34d', left: '#7c6a2a', right: '#9a8330' } });
    }

    const p = G().player;
    const pss = playerScreen();
    const px = pss.x, py = pss.y;
    // actores
    const actors = [];
    for (const n of (m.npcs || [])) { if (n._inactive) continue; actors.push(npcRender(n)); }
    if (game.cop && game.cop.map === p.map) actors.push(copRender(game.cop));
    // jugador con posición interpolada -> insertamos como actor con coords fraccionarias
    let pgx = p.x, pgy = p.y;
    if (game.moving) { const t = clamp(game.moveT / game.moveDur, 0, 1); pgx = lerp(game.from.x, game.to.x, t); pgy = lerp(game.from.y, game.to.y, t); }
    const walkFrame = game.moving ? (Math.floor(game.moveT / (game.moveDur / 2)) % 2 === 0 ? 1 : 2) : 0;
    actors.push({ gx: pgx, gy: pgy, dir: p.dir, frame: walkFrame, pal: { skin: '#f0c088', hair: '#3a2a1a', shirt: '#2f9e6b', pants: '#33333f' }, char: 'player', hero: true });

    // objetos: dibujarlos como parte del render (cubos etiquetados / grow con planta)
    const objects = (m.objects || []).map(o => ({ gx: o.gx, gy: o.gy, draw: (ctx, sx, sy) => drawObject(ctx, sx, sy, o) }));

    // combinar extraFloors dentro de renderRoom: hack -> dibujar suelos extra antes
    for (const ef of extraFloors) { const s = ISO.project(ef.gx, ef.gy, game.cam); ISO.floorDiamond(ctx, s.x, s.y, ef.col, ef.edge); }

    // paredes 'H' como objetos altos; farolas 'P' con su sprite si existe
    for (const w of walls) objects.push({
      gx: w.gx, gy: w.gy, draw: (ctx, sx, sy) => {
        if (w.lamp && drawFurni(ctx, sx, sy, 'lamp', 52)) return;
        ISO.cube(ctx, sx, sy, w.h, w.pal);
      }
    });

    ISO.renderRoom(ctx, m, game.cam, now, actors, objects);

    // etiqueta del objeto/npc al frente si el jugador mira algo interactuable
    hudFacingLabel(ctx, m);
    envTint(ctx);
    if (game.dmg) applyDMG();
  }

  // Post-proceso "modo DMG": reduce a 160x144, cuantiza luminancia a 4 tonos
  // (paleta verde-oliva clásica) y reescala. Barato (~23k px/frame).
  const DMG_PAL = [[15, 56, 15], [48, 98, 48], [139, 172, 15], [155, 188, 15]];
  function applyDMG() {
    if (!game._dmg) { const c = document.createElement('canvas'); c.width = 160; c.height = 144; game._dmg = c; }
    const sc = game._dmg.getContext('2d'); sc.imageSmoothingEnabled = false;
    sc.drawImage(game.canvas, 0, 0, 160, 144);
    const id = sc.getImageData(0, 0, 160, 144), d = id.data;
    for (let i = 0; i < d.length; i += 4) {
      const l = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11;
      const c = DMG_PAL[l < 48 ? 0 : l < 108 ? 1 : l < 176 ? 2 : 3];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    }
    sc.putImageData(id, 0, 0);
    const ctx = game.ctx; ctx.imageSmoothingEnabled = false;
    ctx.drawImage(game._dmg, 0, 0, game.W, game.H);
  }

  // Dibuja un sprite de mueble anclado a la base del tile (fallback: cubo).
  function drawFurni(ctx, sx, sy, kind, hCap) {
    const im = PH.furniart && PH.furniart.forKind(kind);
    if (im && im.complete && im.naturalWidth) {
      const H = hCap || 46, s = H / im.naturalHeight, w = Math.round(im.naturalWidth * s), h = Math.round(im.naturalHeight * s);
      const base = sy + ISO.TH * 0.85;
      ctx.drawImage(im, Math.round(sx - w / 2), Math.round(base - h), w, h);
      return true;
    }
    return false;
  }
  function drawObject(ctx, sx, sy, o) {
    if (PH.furniart && PH.furniart.has(o.kind)) {
      const done = drawFurni(ctx, sx, sy, o.kind, o.kind === 'grow' ? 40 : 48);
      if (o.kind === 'grow') {
        // planta encima de la mesa de cultivo (fase 4 de una cepa del banco)
        const bank = G().bank.find(b => b.form !== 'polen');
        const key = bank && PH.plantart ? PH.plantart.stageKey(bank.speciesId, 4) : null;
        const im = key && PH.plantart.img(key);
        if (im && im.complete) { const h = 34; ctx.drawImage(im, sx - h * 0.4, sy + ISO.TH * 0.85 - 30 - h, h * 0.8, h); }
      }
      if (done) return;
    }
    if (o.kind === 'grow') {
      ISO.cube(ctx, sx, sy, 12, { top: '#6b4a2a', left: '#4a3320', right: '#5a3f28' }); // mesa
      // planta encima (retrato de una cepa del banco si hay)
      const bank = G().bank.find(b => b.form !== 'polen');
      const key = bank && PH.plantart ? PH.plantart.stageKey(bank.speciesId, 4) : null;
      const im = key && PH.plantart.img(key);
      if (im && im.complete) { const h = 40; ctx.drawImage(im, sx - h * 0.4, sy - h + 6, h * 0.8, h); }
      else ISO.cube(ctx, sx, sy - 12, 22, { top: '#5aa64a', left: '#2f6b2a', right: '#3f8f3a' });
    } else if (o.kind === 'pc') ISO.cube(ctx, sx, sy, 20, { top: '#3a6ea5', left: '#233f5a', right: '#2d5273' });
    else if (o.kind === 'bed') ISO.cube(ctx, sx, sy, 8, { top: '#d64a6b', left: '#8f2f45', right: '#b03a55' });
    else if (o.kind === 'lab') ISO.cube(ctx, sx, sy, 14, { top: '#cfe0ea', left: '#8fa3b0', right: '#aebfc9' });
    else if (o.kind === 'shop') ISO.cube(ctx, sx, sy, 14, { top: '#ffb02e', left: '#9a6a18', right: '#c98d22' });
    else ISO.cube(ctx, sx, sy, 14, { top: '#999', left: '#555', right: '#777' });
  }

  function hudFacingLabel(ctx, m) {
    if (game.mode !== 'overworld' || game.moving) return;
    const f = facing();
    const target = npcAt(m, f.gx, f.gy) || objAt(m, f.gx, f.gy) || doorAt(m, f.gx, f.gy);
    if (!target) return;
    const s = ISO.project(f.gx, f.gy, game.cam);
    const label = target.name || target.label || (target.to ? '→ ' + (room(target.to) ? room(target.to).name : '') : '');
    if (!label) return;
    ctx.font = '8px monospace'; ctx.textAlign = 'center';
    const w = ctx.measureText(label).width + 8;
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(s.x - w / 2, s.y - 6, w, 11);
    ctx.fillStyle = '#fff'; ctx.fillText(label, s.x, s.y + 2);
  }

  function envTint(ctx) {
    const env = G().env; const t = env.time; let a = 0;
    if (t < 5 * 60) a = 0.42; else if (t < 7 * 60) a = lerp(0.42, 0, (t - 300) / 120);
    else if (t < 18 * 60) a = 0; else if (t < 20 * 60) a = lerp(0, 0.38, (t - 1080) / 120); else a = 0.42;
    if (a > 0) { ctx.fillStyle = `rgba(0,0,25,${a})`; ctx.fillRect(0, 0, game.W, game.H); }
  }

  PH.game.init = init;
  window.addEventListener('DOMContentLoaded', init);
})(window.PH = window.PH || {});

</script>
</body>
</html>
