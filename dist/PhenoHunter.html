<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pheno Hunter</title>
  <style>
/* ============================================================
   PHENO HUNTER — style.css
   Estética GBA: marco cálido, tipografía monoespaciada, pixel-perfect.
   ============================================================ */
:root {
  --bg: #12100c;
  --panel: #1d2430;
  --panel2: #242c3a;
  --ink: #eaf0e6;
  --dim: #97a1ad;
  --accent: #7bd66b;
  --accent2: #ffb02e;
  --line: #33404f;
  --shadow: 0 6px 24px rgba(0,0,0,.5);
  font-size: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  background: radial-gradient(circle at 50% 0%, #21351f 0%, #0f130d 70%);
  color: var(--ink);
  font-family: "Courier New", ui-monospace, monospace;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
  touch-action: none;
}
#app { height: 100%; display: flex; flex-direction: column; align-items: center; }

/* --------- HUD --------- */
#hud {
  width: 100%; max-width: 900px; display: flex; justify-content: space-between;
  gap: 8px; padding: 8px 12px; flex-wrap: wrap;
}
.hud-left, .hud-right { display: flex; gap: 6px; flex-wrap: wrap; }
.pill {
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 10px; font-size: .72rem; white-space: nowrap; color: var(--ink);
}

/* --------- Stage / canvas --------- */
#stage { position: relative; line-height: 0; box-shadow: var(--shadow); border-radius: 8px; overflow: hidden;
  border: 3px solid #2a2118; background: #000; }
#screen { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }

/* --------- Overlay (paneles) --------- */
#overlay { position: absolute; inset: 0; display: none; line-height: 1.35; }
#overlay.active { display: flex; }
#overlay.center { align-items: center; justify-content: center; }
#overlay.bottom { align-items: flex-end; justify-content: center; }
#overlay::before { content: ""; position: absolute; inset: 0; background: rgba(6,8,10,.62); backdrop-filter: blur(1px); }
#overlay > * { position: relative; z-index: 2; }

/* --------- Toasts --------- */
#toasts { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 50;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.toast { background: rgba(20,26,34,.95); border: 1px solid var(--line); color: var(--ink);
  padding: 6px 14px; border-radius: 8px; font-size: .78rem; opacity: 0; transform: translateY(-8px);
  transition: .3s; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; transform: translateY(0); }
.toast.ok { border-color: var(--accent); }
.toast.bad { border-color: #e05a5a; }

/* --------- Botones --------- */
.btn { font-family: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--panel2);
  color: var(--ink); padding: 8px 14px; border-radius: 8px; font-size: .82rem; transition: .12s; }
.btn:hover { border-color: var(--accent); transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--accent); color: #10240f; font-weight: bold; border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: .72rem; }
.btn.big { padding: 12px 30px; font-size: 1rem; }

/* --------- Título --------- */
#overlay.title::before { background: rgba(6,10,8,.9); }
.title-screen { text-align: center; padding: 20px; }
.logo { font-size: 2.6rem; font-weight: 900; letter-spacing: 2px; color: var(--accent); text-shadow: 3px 3px 0 #10240f; }
.logo span { color: var(--accent2); display: block; letter-spacing: 8px; font-size: 2rem; }
.tagline { color: var(--dim); margin: 6px 0 14px; letter-spacing: 1px; }
.title-art canvas { image-rendering: pixelated; border-radius: 6px; border: 1px solid var(--line); }
.title-btns { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
.title-help { color: var(--dim); font-size: .72rem; line-height: 1.7; }

/* --------- Diálogo --------- */
.dialog-box { width: min(92%, 640px); margin-bottom: 14px; background: var(--panel);
  border: 2px solid var(--accent); border-radius: 10px; padding: 16px 18px; box-shadow: var(--shadow); }
.dialog-box p { font-size: .92rem; }
.dlg-hint { text-align: right; color: var(--dim); font-size: .7rem; margin-top: 8px; }

/* --------- Paneles genéricos --------- */
.panel { width: min(94%, 640px); max-height: 88%; background: var(--panel); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.panel.wide { width: min(96%, 820px); }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;
  border-bottom: 1px solid var(--line); background: var(--panel2); }
.panel-head h2 { font-size: 1rem; } .panel-head small { color: var(--dim); font-weight: normal; font-size: .72rem; margin-left: 6px; }
.panel-body { padding: 14px 16px; overflow-y: auto; }
.panel-body h3 { font-size: .8rem; color: var(--accent2); margin: 12px 0 8px; text-transform: uppercase; letter-spacing: 1px; }
.x { background: none; border: none; color: var(--dim); font-size: 1.1rem; cursor: pointer; }
.x:hover { color: #fff; }
.dim { color: var(--dim); font-size: .8rem; }
.row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; }
.center-col { display: flex; flex-direction: column; align-items: center; text-align: center; }
.warn { color: var(--accent2); font-size: .72rem; margin-top: 4px; }

/* --------- Mochila / grids de items --------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; }
.item.sel { border-color: var(--accent); }
.item b { font-size: .84rem; } .item small { display: block; color: var(--dim); font-size: .72rem; margin: 4px 0; }
.item .tag { font-size: .68rem; color: var(--accent); }

/* --------- Ficha de espécimen --------- */
.spec-card { display: flex; gap: 12px; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 10px; padding: 12px; }
.spec-art canvas { image-rendering: pixelated; background: #161d15; border-radius: 6px; border: 1px solid var(--line); }
.spec-info { flex: 1; min-width: 0; }
.spec-title { font-size: .92rem; font-weight: bold; } .spec-title small { color: var(--dim); font-weight: normal; font-size: .68rem; }
.tier { display: inline-block; font-size: .72rem; color: var(--tc); border: 1px solid var(--tc); border-radius: 999px; padding: 1px 8px; margin: 4px 0; }
.spec-desc { font-size: .76rem; color: var(--ink); margin: 4px 0; }
.spec-meta { font-size: .72rem; color: var(--dim); margin-bottom: 6px; }
.spec-stats .stat { display: flex; align-items: center; gap: 6px; font-size: .68rem; margin: 2px 0; }
.stat span { width: 62px; color: var(--dim); } .stat b { width: 26px; text-align: right; }
.bar { flex: 1; height: 7px; background: #121821; border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
.muts { margin-top: 6px; display: flex; gap: 4px; flex-wrap: wrap; }
.mut { font-size: .66rem; background: #3a2350; color: #d9a6ff; border: 1px solid #6b3fa0; border-radius: 999px; padding: 1px 8px; }

/* --------- Banco --------- */
.panel-body.list { display: flex; flex-direction: column; gap: 10px; }
.bank-row { display: flex; gap: 10px; align-items: stretch; }
.bank-row .spec-card { flex: 1; }
.bank-actions { display: flex; flex-direction: column; gap: 6px; justify-content: center; }

/* --------- Encuentro --------- */
.encounter { width: min(94%, 560px); background: var(--panel); border: 2px solid var(--accent2);
  border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.enc-head { text-align: center; color: var(--accent2); font-weight: bold; margin-bottom: 8px; }
.enc-body { display: flex; gap: 14px; }
.enc-art canvas { image-rendering: pixelated; background: #101710; border-radius: 8px; border: 1px solid var(--line); }
.enc-side { flex: 1; }
.enc-name { font-size: 1rem; font-weight: bold; } .enc-name small { color: var(--dim); font-size: .68rem; }
.enc-rare { color: var(--accent2); font-size: .76rem; margin: 3px 0; }
.enc-desc { font-size: .76rem; color: var(--ink); }
.enc-env { font-size: .7rem; color: var(--dim); margin-top: 4px; }
.enc-fields { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.enc-fields span { font-size: .66rem; background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.enc-tools { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0 6px; }
.enc-tools .tool { display: flex; flex-direction: column; align-items: center; font-size: .76rem; }
.enc-tools .tool small { color: var(--dim); font-size: .62rem; }
.enc-actions { text-align: center; }
.enc-msg { text-align: center; min-height: 18px; margin-top: 8px; font-size: .8rem; }
.enc-msg.ok { color: var(--accent); } .enc-msg.bad { color: #e88; }

/* --------- Catálogo --------- */
.cat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.cat-card { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px; text-align: center; }
.cat-card canvas { image-rendering: pixelated; background: #141b13; border-radius: 6px; }
.cc-name { font-size: .76rem; font-weight: bold; margin-top: 4px; }
.cc-tier { font-size: .7rem; } .cc-meta { font-size: .66rem; color: var(--dim); }
.cc-mut { font-size: .62rem; color: #d9a6ff; } .cc-count { font-size: .62rem; color: var(--dim); margin-top: 2px; }
.cat-grid.select .pick { cursor: pointer; } .cat-grid.select .pick.picked { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }

/* --------- Laboratorio --------- */
.breed-slots { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 10px 0 6px; flex-wrap: wrap; }
.slot { width: 90px; min-height: 110px; background: var(--panel2); border: 1px dashed var(--line); border-radius: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; }
.slot canvas { image-rendering: pixelated; }
.cross-sign, .cross-eq { font-size: 1.4rem; color: var(--accent2); }
.newbadge { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: #10240f; font-weight: bold;
  padding: 6px 14px; border-radius: 999px; margin-bottom: 10px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

/* --------- Mercado --------- */
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
.shop-item { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.shop-item b { font-size: .84rem; } .shop-item small { color: var(--dim); font-size: .72rem; flex: 1; }

/* --------- Misiones --------- */
.quest { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
.quest.done { opacity: .6; } .q-name { font-size: .86rem; font-weight: bold; }
.q-desc { font-size: .76rem; color: var(--ink); margin: 3px 0; } .q-reward { font-size: .7rem; color: var(--accent2); }

/* --------- Controles táctiles --------- */
#touch { display: none; width: 100%; max-width: 900px; justify-content: space-between; padding: 12px 18px; }
.dpad { position: relative; width: 132px; height: 132px; }
.tb { font-family: inherit; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  border-radius: 10px; font-size: 1rem; cursor: pointer; }
.dpad .tb { position: absolute; width: 44px; height: 44px; }
.dpad .up { top: 0; left: 44px; } .dpad .down { bottom: 0; left: 44px; }
.dpad .left { top: 44px; left: 0; } .dpad .right { top: 44px; right: 0; }
.abtns { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.abtns .a { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: #10240f; font-weight: bold; }
.menu-keys { display: flex; gap: 8px; } .menu-keys .s { width: 44px; height: 44px; }

/* --------- Invernadero / cultivo --------- */
.garden-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 6px; }
.plot { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 170px; justify-content: space-between; }
.plot.ready { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.plot.empty { border-style: dashed; justify-content: center; }
.plot-add { cursor: pointer; color: var(--dim); font-size: 1.8rem; display: flex; flex-direction: column; align-items: center; }
.plot-add small { font-size: .7rem; } .plot-add:hover { color: var(--accent); }
.plot-sprite { position: relative; background:
    linear-gradient(0deg, rgba(90,140,70,.25), rgba(20,26,20,.1)); border-radius: 8px; padding: 2px; }
.plot-sprite img { image-rendering: pixelated; display: block; }
.phdot { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(0,0,0,.4); }
.plot-name { font-size: .78rem; font-weight: bold; } .plot-stage { font-size: .7rem; }
.plot .bar { width: 100%; }
.plot-actions { display: flex; gap: 4px; }
.hub-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
.btn.hub { padding: 18px 10px; line-height: 1.5; font-size: .8rem; }

/* --------- Investigación / ADN --------- */
.pill.event { background: linear-gradient(90deg, #3a2350, #6b3fa0); border-color: #a06bff; color: #f0e0ff; animation: pulse 1.2s infinite; }
.dna { font-family: monospace; font-size: .7rem; letter-spacing: 1px; word-break: break-all; background: #0f1520;
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; color: #7bd66b; line-height: 1.6; }
.hidden-list { list-style: none; font-size: .76rem; } .hidden-list li { padding: 3px 0; border-bottom: 1px solid var(--line); }
.hidden-list i { color: var(--accent2); font-style: normal; }
.rel-row { display: flex; align-items: center; gap: 8px; font-size: .72rem; margin: 4px 0; }
.rel-row span { width: 110px; } .rel-row small { color: var(--dim); }
.seq-head { margin-bottom: 8px; }
.stats-box { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 10px 0;
  text-align: left; font-size: .8rem; line-height: 1.8; width: 100%; }
.stats-box small { color: var(--dim); }
.ev-row { display: flex; gap: 10px; align-items: flex-start; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; }
.ev-ico { font-size: 1.3rem; } .ev-row b { font-size: .82rem; } .ev-row small { display: block; color: var(--dim); font-size: .72rem; }

/* --------- Footer --------- */
#foot { color: var(--dim); font-size: .68rem; padding: 8px; text-align: center; }

@media (max-width: 760px) {
  #touch { display: flex; }
  #foot { display: none; }
  .logo { font-size: 2rem; }
}
@media (hover: none) and (pointer: coarse) {
  #touch { display: flex; }
}

</style>

  <script>
/* ==== src/util.js ==== */
/* ============================================================
   PHENO HUNTER — util.js
   Núcleo de utilidades: RNG, matemáticas, helpers de color.
   ============================================================ */
(function (PH) {
  'use strict';

  // ---- RNG con semilla (mulberry32) para generación reproducible ----
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // RNG global del juego (no sembrado -> usa Math.random para el mundo vivo)
  const RNG = {
    // número flotante [0,1)
    f: () => Math.random(),
    // entero [min,max] inclusivo
    i: (min, max) => Math.floor(Math.random() * (max - min + 1)) + min,
    // rango flotante
    r: (min, max) => min + Math.random() * (max - min),
    // probabilidad p (0..1)
    chance: (p) => Math.random() < p,
    // elemento aleatorio de un array
    pick: (arr) => arr[Math.floor(Math.random() * arr.length)],
    // elección ponderada: [{w, ...}] devuelve el objeto
    weighted: (arr, wkey) => {
      let total = 0;
      for (const it of arr) total += (wkey ? it[wkey] : it.w) || 0;
      let roll = Math.random() * total;
      for (const it of arr) {
        roll -= (wkey ? it[wkey] : it.w) || 0;
        if (roll <= 0) return it;
      }
      return arr[arr.length - 1];
    },
    // baraja Fisher-Yates (in place)
    shuffle: (arr) => {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    },
    // gaussiana aproximada, media 0, desv 1
    gauss: () => {
      let u = 0, v = 0;
      while (u === 0) u = Math.random();
      while (v === 0) v = Math.random();
      return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    }
  };

  const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;

  // ---- Color helpers ----
  function hsl(h, s, l) { return `hsl(${h},${s}%,${l}%)`; }
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = (n) => {
      const c = l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
      return Math.round(255 * c).toString(16).padStart(2, '0');
    };
    return `#${f(0)}${f(8)}${f(4)}`;
  }
  function shade(hex, amt) {
    // amt: -1..1  oscurece/aclara
    const n = parseInt(hex.replace('#', ''), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    const t = amt < 0 ? 0 : 255;
    const p = Math.abs(amt);
    r = Math.round((t - r) * p) + r;
    g = Math.round((t - g) * p) + g;
    b = Math.round((t - b) * p) + b;
    return `#${((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1)}`;
  }

  // Formato: 12345 -> "12.3k"
  function fmt(n) {
    if (n < 1000) return '' + n;
    if (n < 1e6) return (n / 1000).toFixed(n < 1e4 ? 1 : 0) + 'k';
    return (n / 1e6).toFixed(1) + 'M';
  }

  function id() { return 'g' + (id._c = (id._c || 0) + 1) + '_' + Math.floor(Math.random() * 1e6).toString(36); }

  // capitaliza
  const cap = (s) => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;

  PH.util = { mulberry32, RNG, clamp, lerp, hsl, hslToHex, shade, fmt, id, cap };
})(window.PH = window.PH || {});

/* ==== src/genetics.js ==== */
/* ============================================================
   PHENO HUNTER — genetics.js
   Motor genético diploide con dominancia, poligenes, mutaciones,
   poliploidía, patrones, secuencia de ADN y parentesco.
   Es el corazón del juego.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp, hslToHex, cap } = PH.util;

  /* --------------------------------------------------------
     Definición de GENES
     -------------------------------------------------------- */

  // Color de flor — cualitativo. hue base para render.
  const COLORS = [
    { key: 'verde',    dom: 5, hue: 110, rarity: 1 },
    { key: 'lima',     dom: 4, hue: 85,  rarity: 2 },
    { key: 'ambar',    dom: 4, hue: 40,  rarity: 3 },
    { key: 'purpura',  dom: 6, hue: 280, rarity: 4 },
    { key: 'violeta',  dom: 6, hue: 300, rarity: 5 },
    { key: 'carmesi',  dom: 7, hue: 350, rarity: 6 },
    { key: 'azur',     dom: 7, hue: 205, rarity: 8 },
    { key: 'turquesa', dom: 6, hue: 175, rarity: 7 },
    { key: 'oro',      dom: 8, hue: 48,  rarity: 9 },
    { key: 'rosa',     dom: 3, hue: 330, rarity: 4 },

  const BIOMES = {
    pradera:  { name: 'Pradera de Auralia', baseEncounter: 0.14 },
    bosque:   { name: 'Bosque de Vael',     baseEncounter: 0.16 },

    desierto: { name: 'Erg de Sael',        baseEncounter: 0.15 },
    nieve:    { name: 'Manto de Yrr',       baseEncounter: 0.16 },
    volcan:   { name: 'Monte Calder',       baseEncounter: 0.17 },
    cueva:    { name: 'Cueva de Vael',      baseEncounter: 0.20 },
    isla:     { name: 'Islas Vireo',        baseEncounter: 0.17 },
  };

  function envMultiplier(species, env) {
    let m = 1;
    if (env.weather === 'niebla' && species.id === 'PH-006') m *= 3;
    if (env.weather === 'lluvia' && species.biomes.includes('pantano')) m *= 1.5;
    if (env.night && (species.id === 'PH-003' || species.id === 'PH-011' || species.relic)) m *= 2;
    if (env.weather === 'tormenta' && species.mutBoost) m *= 1.4;
    if (env.season === 'invierno' && (species.id === 'PH-003' || species.biomes.includes('nieve'))) m *= 1.4;
    if (env.season === 'verano' && species.biomes.includes('desierto')) m *= 1.3;
    if ((env.heat || env.weather === 'ola_calor') && (species.id === 'PH-002' || species.biomes.includes('desierto') || species.biomes.includes('volcan'))) m *= 1.6;
    // Eventos raros globales
    if (PH.events && PH.events.spawnMultiplier) m *= PH.events.spawnMultiplier(species, env);
    return m;
  }

  function spawnTable(biome, env) {
    const list = SPECIES.filter(s => s.biomes.includes(biome));
    return list.map(s => {
      let w = s.relic ? 1 : 20;
      w *= envMultiplier(s, env);
      return { ref: s, w };
    });
  }

  let uidc = 0;
  function makeSpecimen(species, env, opts) {
    opts = opts || {};
    const genotype = opts.genotype || wildGenotype(species.profile);
    const pheno = express(genotype);
    const score = rarityScore(genotype);
    const tier = rarityTier(score);
    const sig = phenoSignature(genotype);
    return {
      uid: 'S' + (++uidc) + Date.now().toString(36).slice(-3),
      speciesId: species.id, name: species.name,
      genotype, pheno, rarity: score, tier: tier.key, signature: sig,
      form: opts.form || 'salvaje',
      quality: opts.quality != null ? opts.quality : 100,
      parents: opts.parents || null,
      caughtAt: opts.caughtAt || null,
      generation: opts.generation || 0,
      sequenced: opts.sequenced || false,
      nickname: null,
    };
  }

  function rollEncounter(biome, env) {
    const table = spawnTable(biome, env);
    const chosen = RNG.weighted(table, 'w').ref;
    return makeSpecimen(chosen, env, { form: 'salvaje', caughtAt: null });
  }

  PH.species = { SPECIES, SPECIES_BY_ID, BIOMES, spawnTable, makeSpecimen, rollEncounter, envMultiplier };
})(window.PH = window.PH || {});

  const MAPS = { lab: laboratorio, pradera, bosque, pantano, desierto, volcan, nieve, cueva, isla };

  // Normaliza cada mapa a una cuadrícula rectangular (robusto ante erratas).
  (function normalizeAll() {
    const FILL = { cave: '#', desert: '#', volcano: 'T', island: '~', snow: 'T' };
    for (const m of Object.values(MAPS)) {
      const fill = FILL[m.theme] || 'T';
      let w = 0; for (const r of m.grid) w = Math.max(w, r.length);

    const t = TILE[ch];

/* ============================================================
   PHENO HUNTER — render.js
   Render pixel-art 16-bit. Tiles procedurales, personajes y
   sprites de planta derivados del fenotipo. GBA: 240x160, 16px.
   ============================================================ */
(function (PH) {
  'use strict';
  const { shade } = PH.util;
  const { TILE, isWarp } = PH.world;

  const TS = 16;
  const VW = 15, VH = 10;
  const W = VW * TS, H = VH * TS;

  const THEMES = {
    town:    { grass: '#6fae4a', grassD: '#5c9a3c', path: '#caa96b', pathD: '#b2925a', blade: '#3f7d34', blade2: '#589b45' },
    meadow:  { grass: '#7cbd50', grassD: '#68a742', path: '#cbb06f', pathD: '#b2955a', blade: '#3f7d34', blade2: '#589b45' },
    forest:  { grass: '#4f9440', grassD: '#3f7d34', path: '#b39b64', pathD: '#997f4f', blade: '#2f6b2a', blade2: '#458f3a' },
    swamp:   { grass: '#5f7d47', grassD: '#4d6739', path: '#8f7c4e', pathD: '#75643d', blade: '#3d5a2c', blade2: '#4f7038' },
    desert:  { grass: '#e0cd8f', grassD: '#cbb672', path: '#d8c079', pathD: '#c0a860', blade: '#b39a4d', blade2: '#caa95c' },
    volcano: { grass: '#5a4038', grassD: '#4a332c', path: '#3a2822', pathD: '#2e201b', blade: '#8a3520', blade2: '#c04a24' },
    snow:    { grass: '#e9f0f6', grassD: '#cfd9e4', path: '#dbe6f0', pathD: '#c3d2e0', blade: '#8fb0c9', blade2: '#b6d0e2' },
    cave:    { grass: '#4a4650', grassD: '#3b3843', path: '#3a3742', pathD: '#2e2b35', blade: '#4a8f7a', blade2: '#6bd0b0' },
    island:  { grass: '#e6d79a', grassD: '#d3c17f', path: '#e0cd8f', pathD: '#cbb672', blade: '#4faf7a', blade2: '#6bd0a0' },
  };

  function px(ctx, x, y, w, h, col) { ctx.fillStyle = col; ctx.fillRect(x, y, w, h); }

  function drawTile(ctx, ch, sx, sy, theme, t) {
    const P = THEMES[theme] || THEMES.meadow;
    const drawGround = () => {
      px(ctx, sx, sy, TS, TS, P.grass);
      px(ctx, sx + 3, sy + 4, 2, 2, P.grassD);
      px(ctx, sx + 10, sy + 9, 2, 2, P.grassD);
      px(ctx, sx + 6, sy + 12, 1, 1, P.grassD);
    };
    const name = (TILE[ch] || {}).name;
    switch (name) {
      case 'grass': drawGround(); break;
      case 'tallgrass': {
        drawGround();
        for (let i = 0; i < 5; i++) {
          const bx = sx + 2 + i * 3;
          px(ctx, bx, sy + 6 + ((i % 2) ? 0 : 2), 2, 8, i % 2 ? P.blade : P.blade2);
          px(ctx, bx, sy + 5 + ((i % 2) ? 0 : 2), 1, 2, shade(P.blade2, 0.3));
        }
        break;
      }
      case 'path': px(ctx, sx, sy, TS, TS, P.path); px(ctx, sx + 2, sy + 6, 2, 2, P.pathD); px(ctx, sx + 11, sy + 3, 2, 2, P.pathD); break;
      case 'bridge': px(ctx, sx, sy, TS, TS, '#a9793f'); for (let i = 0; i < TS; i += 4) px(ctx, sx + i, sy, 1, TS, '#7c531f'); break;
      case 'tree':
        drawGround();
        px(ctx, sx + 6, sy + 10, 4, 6, '#6b4a2a');
        px(ctx, sx + 2, sy + 1, 12, 11, shade(P.grassD, -0.25));
        px(ctx, sx + 4, sy + 0, 9, 10, theme === 'snow' ? '#cfe0ea' : (theme === 'volcano' ? '#5a3a2a' : '#2f6b2a'));
        px(ctx, sx + 5, sy + 2, 5, 4, theme === 'snow' ? '#eef6fb' : '#458f3a');
        break;
      case 'palm':
        drawGround();
        px(ctx, sx + 7, sy + 5, 2, 11, '#8a6a3a');
        px(ctx, sx + 2, sy + 3, 12, 2, '#3f9a5a'); px(ctx, sx + 4, sy + 1, 8, 2, '#4fb06a'); px(ctx, sx + 1, sy + 5, 5, 2, '#3f9a5a'); px(ctx, sx + 10, sy + 5, 5, 2, '#3f9a5a');
        break;
      case 'bush': drawGround(); px(ctx, sx + 2, sy + 5, 12, 9, shade(P.blade, -0.1)); px(ctx, sx + 4, sy + 6, 5, 4, P.blade2); break;
      case 'rock': px(ctx, sx, sy, TS, TS, '#8a8f97'); px(ctx, sx + 2, sy + 2, 12, 12, '#6d727a'); px(ctx, sx + 4, sy + 3, 5, 4, '#a2a7ae'); break;
      case 'cavefloor': px(ctx, sx, sy, TS, TS, '#3f3b47'); px(ctx, sx + 4, sy + 5, 3, 3, '#332f3a'); px(ctx, sx + 10, sy + 10, 2, 2, '#4a4652'); break;
      case 'stalag': px(ctx, sx, sy, TS, TS, '#3f3b47'); px(ctx, sx + 5, sy + 2, 6, 14, '#5a5566'); px(ctx, sx + 7, sy + 4, 2, 10, '#726c82'); break;
      case 'water': px(ctx, sx, sy, TS, TS, '#4b8fd6'); px(ctx, sx + 2, sy + 4, 6, 2, '#7bb4ec'); px(ctx, sx + 9, sy + 10, 5, 2, '#7bb4ec'); break;
      case 'deepwater': px(ctx, sx, sy, TS, TS, '#2f6bb0'); px(ctx, sx + 3, sy + 7, 6, 2, '#4b8fd6'); break;
      case 'mud': px(ctx, sx, sy, TS, TS, '#6b5637'); px(ctx, sx + 3, sy + 4, 4, 3, '#54432a'); px(ctx, sx + 9, sy + 9, 4, 3, '#7d6543'); break;
      case 'sand': px(ctx, sx, sy, TS, TS, P.grass); px(ctx, sx + 4, sy + 5, 2, 1, P.grassD); px(ctx, sx + 10, sy + 11, 2, 1, P.grassD); break;
      case 'snow': px(ctx, sx, sy, TS, TS, '#e9f0f6'); px(ctx, sx + 5, sy + 6, 2, 2, '#d3ddea'); px(ctx, sx + 11, sy + 3, 1, 1, '#cfd9e4'); break;
      case 'ice': px(ctx, sx, sy, TS, TS, '#bfe0ef'); px(ctx, sx + 2, sy + 2, 6, 1, '#e6f6ff'); px(ctx, sx + 8, sy + 9, 5, 1, '#e6f6ff'); break;
      case 'ash': px(ctx, sx, sy, TS, TS, '#4a3b34'); px(ctx, sx + 3, sy + 5, 3, 2, '#5c4a42'); px(ctx, sx + 10, sy + 10, 2, 2, '#3a2d28'); break;
      case 'lava': px(ctx, sx, sy, TS, TS, '#e8531f'); px(ctx, sx + 2, sy + 3, 5, 3, '#ffb02e'); px(ctx, sx + 9, sy + 9, 4, 3, '#ffd34d'); px(ctx, sx + 6, sy + 11, 3, 2, '#c0331a'); break;
      case 'flowers': drawGround(); px(ctx, sx + 3, sy + 4, 2, 2, '#ffd34d'); px(ctx, sx + 9, sy + 8, 2, 2, '#ff7ba0'); px(ctx, sx + 6, sy + 11, 2, 2, '#8ac6ff'); break;
      case 'house': px(ctx, sx, sy, TS, TS, '#c86b52'); px(ctx, sx, sy, TS, 5, '#8f3f30'); px(ctx, sx + 2, sy + 7, 4, 4, '#8fd0e8'); px(ctx, sx + 10, sy + 7, 4, 4, '#8fd0e8'); break;
      case 'door': px(ctx, sx, sy, TS, TS, '#c86b52'); px(ctx, sx + 4, sy + 3, 8, 13, '#5a3a26'); px(ctx, sx + 9, sy + 9, 2, 2, '#ffd34d'); break;
      default:
        if (isWarp(ch)) { drawGround(); px(ctx, sx + 3, sy + 3, 10, 10, '#3a3f4a'); px(ctx, sx + 5, sy + 5, 6, 6, '#20242c'); }

  }

  function drawActor(ctx, sx, sy, dir, frame, palette) {
    palette = palette || { skin: '#f0c088', hair: '#4a3b2a', shirt: '#3a7bd6', pants: '#33333f' };
    const bob = frame ? 1 : 0;
    px(ctx, sx + 3, sy + 14, 10, 2, 'rgba(0,0,0,0.22)');
    px(ctx, sx + 4, sy + 8 - bob, 8, 6, palette.shirt);

    px(ctx, sx + 9, sy + 13 - bob, 3, 3, palette.pants);

    px(ctx, sx + 4, sy + 1 - bob, 8, 3, palette.hair);
    px(ctx, sx + 3, sy + 3 - bob, 1, 4, palette.hair);
    px(ctx, sx + 12, sy + 3 - bob, 1, 4, palette.hair);

    else if (dir === 'up') { px(ctx, sx + 4, sy + 1 - bob, 8, 4, palette.hair); }
    else if (dir === 'left') { px(ctx, sx + 5, ey, 1, 2, '#222'); }

  }

  const NPC_PALETTES = {
    mentor: { skin: '#f0c088', hair: '#d8d8e0', shirt: '#e8e8ee', pants: '#555' },
    npc2:   { skin: '#e0a878', hair: '#6a3d2a', shirt: '#d64a6b', pants: '#333' },
    npc3:   { skin: '#f0c088', hair: '#2a2a2a', shirt: '#4aa86b', pants: '#333' },
    npc4:   { skin: '#c98d5a', hair: '#3a2a1a', shirt: '#d68a3a', pants: '#333' },
    npc5:   { skin: '#f0c088', hair: '#8a5a2a', shirt: '#8a6bd6', pants: '#333' },
    npc6:   { skin: '#b98a5a', hair: '#1a1a1a', shirt: '#555', pants: '#222' },
  };

  function drawPlant(ctx, cx, cy, pheno, scale, t) {
    scale = scale || 1;
    const pal = PH.gen.paletteFor(pheno);
    const s = scale;
    const height = 14 + (pheno.quant.altura / 100) * 22;
    const bushy = pheno.quant.produccion / 100;
    const flicker = pheno.mutations.includes('fluorescente') ? (0.6 + 0.4 * Math.abs(Math.sin(t / 300))) : 1;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(s, s);
    px(ctx, -9, 2, 18, 3, 'rgba(0,0,0,0.2)');
    const stemH = height;
    px(ctx, -1, -stemH + 4, 2, stemH, pheno.albino ? '#cfc69a' : '#3f7d34');

    const leafCol = pal.leaf;
    const leafPairs = pheno.leaf === 'digitada' ? 4 : (pheno.leaf === 'palmada' ? 3 : 3);
    for (let i = 0; i < leafPairs; i++) {
      const ly = -6 - i * (stemH / (leafPairs + 1)) * 0.9;
      const lw = 6 + bushy * 5;

  }

  function leafShape(ctx, ox, oy, sign, lw, form, col, pheno) {
    const vg = pheno.mutations.includes('variegacion');
    for (let j = 0; j < lw; j++) {
      const seg = form === 'estrecha' || form === 'aciculada' ? 1 : (form === 'ancha' ? 3 : 2);

      if (form === 'serrada' && j % 2 === 0) px(ctx, ox + sign * j, yy - seg, 1, 1, shade(col, -0.2));

  function drawFlower(ctx, cx, cy, w, pal, pheno) {
    const half = w / 2;
    px(ctx, cx - half, cy - half, w, w, pal.base);
    px(ctx, cx - half, cy - half, w, 2, pal.light);
    px(ctx, cx - half, cy + half - 2, w, 2, pal.dark);
    // patrones
    if (pheno.pattern === 'moteado') { px(ctx, cx - half + 1, cy - 1, 2, 2, pal.dark); px(ctx, cx + 1, cy + 1, 1, 1, pal.light); }
    else if (pheno.pattern === 'rayado') { for (let i = -half; i < half; i += 3) px(ctx, cx + i, cy - half, 1, w, pal.dark); }
    else if (pheno.pattern === 'jaspeado') { px(ctx, cx - half, cy - half, half, half, pal.light); px(ctx, cx, cy, half, half, pal.dark); }
    else if (pheno.pattern === 'aureolado') { px(ctx, cx - half, cy - half, w, w, pal.dark); px(ctx, cx - half + 2, cy - half + 2, w - 4, w - 4, pal.base); }
    if (pheno.colorCo) { const co = PH.gen.COLOR_BY_KEY[pheno.colorCo]; if (co) px(ctx, cx, cy - half, half, w, PH.util.hslToHex(co.hue, 60, 50)); }
    px(ctx, cx - half + 1, cy - half + 1, 2, 2, pal.light);
    if (pheno.mutations.includes('quimera')) px(ctx, cx - half, cy, half, half, pal.dark);
  }

  PH.render = { TS, VW, VH, W, H, THEMES, drawTile, drawActor, drawPlant, NPC_PALETTES };
})(window.PH = window.PH || {});

/* ============================================================
   PHENO HUNTER — state.js
   Estado global: jugador, banco genético, catálogo, misiones,
   ambiente (clima/estación/ciclo día-noche) y guardado.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp } = PH.util;

  const SAVE_KEY = 'phenohunter_save_v1';

  function freshState() {
    return {
      version: 1,
      player: {
        name: 'Aprendiz',
        map: 'lab',
        x: PH.world.MAPS.lab.spawn.x,
        y: PH.world.MAPS.lab.spawn.y,
        dir: 'down',
        credits: 300,
        prestige: 0,
        tools: ['frasco', 'polen'],   // ids de herramientas poseídas
        gear: [],                      // ids de equipo
        activeTool: 'frasco',
        cebosActivos: 0,               // encuentros con feromona
        labLevel: 1,                   // mejora del laboratorio (mutaciones en cruce)
      },
      bank: [],          // especímenes almacenados
      garden: [],        // plantas creciendo en el invernadero
      catalog: {},       // signature -> {sig, speciesId, name, tier, rarity, count, firstAt, pheno}
      species: {},       // speciesId -> {seen, obtained}
      quests: {},        // questId -> {state:'active'|'done', progress}
      flags: {},         // banderas de historia
      stats: { discoveries: 0, crosses: 0, mutationsFound: 0, distance: 0, sequenced: 0, harvests: 0 },
      env: makeEnv(),
      playtime: 0,
    };
  }

  function makeEnv() {
    return {
      time: 8 * 60,          // minutos del día (0..1440)
      dayLength: 8 * 60 * 1000, // ms reales por día de juego
      season: 'primavera',
      weather: 'despejado',
      weatherTimer: 30000,
      night: false,
      heat: false,
    };
  }

  const SEASONS = ['primavera', 'verano', 'otono', 'invierno'];
  const WEATHERS = [
    { key: 'despejado', w: 40 },
    { key: 'lluvia', w: 16 },
    { key: 'niebla', w: 12 },
    { key: 'tormenta', w: 6 },
    { key: 'ola_calor', w: 6 },
    { key: 'nublado', w: 20 },
  ];

  const state = { data: freshState() };

  function get() { return state.data; }

  // Avanza el ambiente (dt en ms)
  function updateEnv(dt) {
    const env = state.data.env;
    // ciclo día/noche: mapea dayLength al reloj interno
    env.time += (dt / env.dayLength) * 1440;
    if (env.time >= 1440) { env.time -= 1440; advanceSeason(env); }
    env.night = env.time < 5 * 60 || env.time >= 20 * 60;
    env.heat = env.weather === 'ola_calor';
    // clima
    env.weatherTimer -= dt;
    if (env.weatherTimer <= 0) {
      env.weather = RNG.weighted(WEATHERS, 'w').key;
      env.weatherTimer = RNG.i(20000, 60000);
    }
  }
  function advanceSeason(env) {
    const i = SEASONS.indexOf(env.season);
    env.season = SEASONS[(i + 1) % 4];
  }

  function timeLabel(env) {
    const h = Math.floor(env.time / 60), m = Math.floor(env.time % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
  }

  /* ---------------- BANCO GENÉTICO ---------------- */
  function bankAdd(specimen) {
    state.data.bank.push(specimen);
    registerCatalog(specimen);
  }
  function bankRemove(uid) {
    const i = state.data.bank.findIndex(s => s.uid === uid);
    if (i >= 0) return state.data.bank.splice(i, 1)[0];
    return null;
  }
  function bankGet(uid) { return state.data.bank.find(s => s.uid === uid); }

  /* ---------------- CATÁLOGO ---------------- */
  // Devuelve {isNewSignature, isNewSpecies, entry}
  function registerCatalog(specimen) {
    const sp = state.data.species[specimen.speciesId] || { seen: 0, obtained: 0 };
    const isNewSpecies = sp.obtained === 0;
    sp.obtained++;
    state.data.species[specimen.speciesId] = sp;

    const sig = specimen.signature;
    let entry = state.data.catalog[sig];
    let isNewSignature = false;
    if (!entry) {
      isNewSignature = true;
      entry = {
        sig, speciesId: specimen.speciesId, name: specimen.name,
        tier: specimen.tier, rarity: specimen.rarity,
        count: 0, firstAt: PH.state.timeLabel(state.data.env),
        pheno: specimen.pheno, genotype: specimen.genotype,
        mutations: specimen.pheno.mutations.slice(),
      };
      state.data.catalog[sig] = entry;
      state.data.stats.discoveries++;
      if (specimen.pheno.mutations.length) state.data.stats.mutationsFound++;
      // Prestigio por descubrimiento, escalado por rareza
      addPrestige(Math.round(3 + specimen.rarity / 3));
    }
    entry.count++;
    return { isNewSignature, isNewSpecies, entry };
  }

  function markSeen(speciesId) {
    const sp = state.data.species[speciesId] || { seen: 0, obtained: 0 };
    sp.seen++;
    state.data.species[speciesId] = sp;
  }

  function addPrestige(n) {
    state.data.player.prestige += n;
  }
  function addCredits(n) { state.data.player.credits = Math.max(0, state.data.player.credits + n); }

  // Umbrales de prestigio que desbloquean contenido
  const PRESTIGE_UNLOCKS = [
    { at: 0, id: 'pradera', label: 'Pradera de Auralia' },
    { at: 8, id: 'bosque', label: 'Bosque de Vael' },
    { at: 18, id: 'cueva', label: 'Cueva de Vael' },
    { at: 25, id: 'pantano', label: 'Cenagal de Mureb' },
    { at: 40, id: 'isla', label: 'Islas Vireo' },
    { at: 45, id: 'desierto', label: 'Erg de Sael' },
    { at: 65, id: 'volcan', label: 'Monte Calder' },
    { at: 85, id: 'nieve', label: 'Manto de Yrr' },
    { at: 120, id: 'reliquias', label: 'Licencia de reliquias' },
  ];
  function unlocked(id) {
    const u = PRESTIGE_UNLOCKS.find(x => x.id === id);
    if (!u) return true;
    return state.data.player.prestige >= u.at;
  }

  /* ---------------- GUARDADO ---------------- */
  function save() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state.data));
      return true;
    } catch (e) { return false; }
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      const d = JSON.parse(raw);
      if (d && d.version) { state.data = Object.assign(freshState(), d); return true; }
    } catch (e) {}
    return false;
  }
  function reset() { state.data = freshState(); localStorage.removeItem(SAVE_KEY); }
  function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }

  PH.state = {
    SAVE_KEY, freshState, get, updateEnv, timeLabel, SEASONS, WEATHERS, PRESTIGE_UNLOCKS,
    bankAdd, bankRemove, bankGet, registerCatalog, markSeen,
    addPrestige, addCredits, unlocked, save, load, reset, hasSave,
  };
})(window.PH = window.PH || {});

(function (PH) {

    },
    tormenta_e: {
      id: 'tormenta_e', name: 'Tormenta eléctrica', icon: '⚡',
      desc: 'Descargas que inducen poliploidía y anomalías raras.',
      duration: 80000, mutMul: 2.2, ploidyMul: 3,
      spawn: (sp) => sp.mutBoost ? 1.4 : 1, tint: 'rgba(120,140,255,0.12)',
    },
    bruma_astral: {
      id: 'bruma_astral', name: 'Bruma astral', icon: '🌌',
      desc: 'Una niebla luminiscente favorece fenotipos bioluminiscentes.',
      duration: 90000, mutMul: 1.8,
      spawn: (sp) => sp.id === 'PH-006' ? 2.5 : 1, tint: 'rgba(80,120,180,0.22)', particles: 'spark',
    },
  };

  const active = { ev: null, remaining: 0 };
  let cooldown = 45000; // primer evento algo tardío

  function update(dt) {
    if (active.ev) {
      active.remaining -= dt;
      if (active.remaining <= 0) {
        const ended = active.ev;
        active.ev = null; active.remaining = 0;
        cooldown = RNG.i(60000, 150000);
        if (PH.ui && PH.ui.toast) PH.ui.toast(`${ended.icon} El evento «${ended.name}» ha terminado.`, '');
      }
      return;
    }
    cooldown -= dt;
    if (cooldown <= 0) trigger();
  }

  function trigger(forceId) {
    const keys = Object.keys(EVENTS);
    const id = forceId || RNG.pick(keys);
    const ev = EVENTS[id];
    active.ev = ev; active.remaining = ev.duration;
    if (PH.ui && PH.ui.toast) PH.ui.toast(`${ev.icon} ¡EVENTO RARO! «${ev.name}» — ${ev.desc}`, 'ok');
  }

  function current() { return active.ev; }
  function remaining() { return Math.max(0, Math.round(active.remaining / 1000)); }

  // Hooks consumidos por genetics/species
  function mutationBoost() { return active.ev ? (active.ev.mutMul || 1) : 1; }
  function spawnMultiplier(species) { return active.ev && active.ev.spawn ? active.ev.spawn(species) : 1; }
  function encounterBoost() { return active.ev ? (active.ev.encMul || 1) : 1; }
  function tint() { return active.ev ? active.ev.tint : null; }
  function particles() { return active.ev ? active.ev.particles : null; }

  PH.events = {
    EVENTS, update, trigger, current, remaining,
    mutationBoost, spawnMultiplier, encounterBoost, tint, particles,
  };
})(window.PH = window.PH || {});

/* ==== src/research.js ==== */
/* ============================================================
   PHENO HUNTER — research.js
   Investigación de ADN: secuenciación (revela alelos ocultos),
   comparación/parentesco y árbol filogenético del banco.
   ============================================================ */
(function (PH) {
  'use strict';
  const { cap } = PH.util;

  // Secuenciar un espécimen: marca sequenced y revela alelos recesivos ocultos.
  function sequence(spec) {
    spec.sequenced = true;
    const g = spec.genotype;
    const ph = spec.pheno;
    const hidden = [];
    for (const gene of PH.gen.QUAL_GENES) {
      const alleles = g[gene.key] || [];
      if (alleles[0] !== alleles[1]) {
        // hay heterocigosis: reporta el recesivo oculto
        const list = gene.list;
        const A = list.find(x => x.key === alleles[0]);
        const B = list.find(x => x.key === alleles[1]);
        const rec = (A.dom <= B.dom ? A : B).key;
        const dom = (A.dom > B.dom ? A : B).key;
        if (rec !== dom) hidden.push({ gene: gene.key, hidden: rec, expressed: dom });
      }
    }
    return { seq: PH.gen.dnaSequence(g), hidden };
  }

  // Compara dos especímenes -> parentesco y diferencias
  function compare(a, b) {
    const rel = PH.gen.relatedness(a.genotype, b.genotype);
    const relation = rel > 0.85 ? 'clones/idénticos' : rel > 0.6 ? 'parientes cercanos' : rel > 0.35 ? 'parientes lejanos' : 'no emparentados';
    return { rel: Math.round(rel * 100), relation };
  }

  // Construye un árbol de linaje a partir de `parents` en el banco.
  function lineage(spec, bankIndex) {
    function node(s, depth) {
      if (!s || depth > 4) return null;
      const n = { name: s.nickname || s.name, tier: s.tier, gen: s.generation, children: [] };
      if (s.parents) {
        for (const pid of s.parents) {
          const p = bankIndex[pid];
          const child = node(p, depth + 1);
          if (child) n.children.push(child);
        }
      }
      return n;
    }
    return node(spec, 0);
  }

  // Agrupa el catálogo por especie -> ramas filogenéticas simples
  function phylogeny(catalog) {
    const bySpecies = {};
    for (const e of Object.values(catalog)) {
      (bySpecies[e.speciesId] = bySpecies[e.speciesId] || []).push(e);
    }
    return bySpecies;
  }

  PH.research = { sequence, compare, lineage, phylogeny };
})(window.PH = window.PH || {});

/* ==== src/garden.js ==== */
/* ============================================================
   PHENO HUNTER — garden.js
   Invernadero / cultivo: planta clones y semillas, obsérvalos crecer
   por fases (plántula → veg → floración → cosecha) y cosecha para
   propagar la genética. Usa los sprites de cultivo (sprites.js).
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp } = PH.util;
  const G = () => PH.state.get();

  // Umbrales acumulados (ms reales) por fase. Ciclo completo ~130s base.
  const STAGE_TIMES = [0, 25000, 55000, 90000, 130000];
  const FINAL = STAGE_TIMES.length - 1;

  function capacity() {
    const s = G();
    return clamp(3 + Math.floor(s.player.prestige / 40), 3, 8);
  }

  function growRate(plant) {
    // velocidad y vigor aceleran; floración global también
    let r = 1 + ((plant.pheno.quant.velocidad || 50) - 50) / 120;
    if (PH.events && PH.events.current() && PH.events.current().id === 'floracion') r *= 1.6;
    return clamp(r, 0.5, 2.2);
  }

  function stageOf(growMs) {
    let idx = 0;
    for (let i = 0; i < STAGE_TIMES.length; i++) if (growMs >= STAGE_TIMES[i]) idx = i;
    return idx;
  }

  function plantFromBank(uid) {
    const s = G();
    if (!s.garden) s.garden = [];
    if (s.garden.length >= capacity()) return { ok: false, msg: 'No hay parcelas libres en el invernadero.' };
    const sp = PH.state.bankGet(uid);
    if (!sp) return { ok: false, msg: 'Muestra no encontrada.' };
    if (sp.form === 'polen') return { ok: false, msg: 'El polen no se planta; úsalo en cruces.' };
    PH.state.bankRemove(uid);
    const plant = {
      id: 'G' + Date.now().toString(36) + RNG.i(100, 999),
      name: sp.nickname || sp.name, speciesId: sp.speciesId,
      genotype: sp.genotype, pheno: sp.pheno, rarity: sp.rarity, tier: sp.tier,
      quality: sp.quality, generation: sp.generation, form: sp.form,
      growMs: 0, stage: 0, ready: false,
      seedSprite: RNG.pick(PH.sprites.SEEDLING_VARIANTS),
      vegSprite: RNG.pick(PH.sprites.VEG_VARIANTS),
    };
    s.garden.push(plant);
    return { ok: true, plant, msg: `Plantaste ${plant.name} en el invernadero.` };
  }

  function update(dt) {
    const s = G();
    if (!s.garden || !s.garden.length) return;
    for (const p of s.garden) {
      if (p.ready) continue;
      p.growMs += dt * growRate(p);
      p.stage = stageOf(p.growMs);
      if (p.growMs >= STAGE_TIMES[FINAL]) { p.ready = true; p.stage = FINAL; }
    }
  }

  // Sprite de la fase actual
  function spriteKey(p) {
    if (p.stage <= 0) return p.seedSprite;
    if (p.stage === 1 || p.stage === 2) return p.vegSprite;
    return PH.sprites.LIFECYCLE[p.stage].sprite;
  }

  function progressPct(p) {
    const total = STAGE_TIMES[FINAL];
    return clamp((p.growMs / total) * 100, 0, 100);
  }

  function regar(id) {
    const s = G();
    const p = (s.garden || []).find(x => x.id === id);
    if (!p || p.ready) return false;
    p.growMs += 9000; // riego: acelera el cultivo
    p.stage = stageOf(p.growMs);
    if (p.growMs >= STAGE_TIMES[FINAL]) { p.ready = true; p.stage = FINAL; }
    return true;
  }

  function harvest(id) {
    const s = G();
    const i = (s.garden || []).findIndex(x => x.id === id);
    if (i < 0) return { ok: false };
    const p = s.garden[i];
    if (!p.ready) return { ok: false, msg: 'Aún no está lista para cosechar.' };
    s.garden.splice(i, 1);

    // Rendimiento: nº de clones propagados según producción y ploidía
    const ploid = p.pheno.ploidy || 2;
    let clones = 1 + Math.floor((p.pheno.quant.produccion || 50) / 30) + (ploid > 2 ? 1 : 0);
    if (p.pheno.mutations.includes('gigantismo')) clones += 1;
    clones = clamp(clones, 1, 6);

    const made = [];
    for (let k = 0; k < clones; k++) {
      const spec = PH.species.makeSpecimen(PH.species.SPECIES_BY_ID[p.speciesId], s.env, {
        genotype: JSON.parse(JSON.stringify(p.genotype)),
        form: 'clon', quality: clamp((p.quality || 80) + RNG.i(-3, 5), 5, 100),
        generation: p.generation, caughtAt: { biome: 'invernadero', weather: '-', time: PH.state.timeLabel(s.env) },
      });
      PH.state.bankAdd(spec);
      made.push(spec);
    }
    // Crédito por cosecha según resina/producción/rareza
    const credits = Math.round(40 + (p.pheno.quant.resina || 40) * 1.4 + (p.pheno.quant.produccion || 40) * 1.2 + p.rarity * 3);
    PH.state.addCredits(credits);
    s.stats.harvests = (s.stats.harvests || 0) + 1;
    PH.state.addPrestige(2);
    return { ok: true, clones: made, credits, name: p.name };
  }

  function compost(id) {
    const s = G();
    const i = (s.garden || []).findIndex(x => x.id === id);
    if (i >= 0) s.garden.splice(i, 1);
  }

  PH.garden = { STAGE_TIMES, capacity, update, plantFromBank, spriteKey, progressPct, regar, harvest, compost, stageOf };
})(window.PH = window.PH || {});

/* ==== src/encounter.js ==== */
/* ============================================================
   PHENO HUNTER — encounter.js
   Resolución de recolección: éxito, calidad y forma obtenida.
   ============================================================ */
(function (PH) {
  'use strict';
  const { RNG, clamp } = PH.util;
  const { TOOLS, toolQuality } = PH.items;

  // Intenta recolectar `wild` con la herramienta `toolId`.
  // Devuelve { success, specimen?, form, quality, msg }
  function harvest(wild, toolId) {
    const s = PH.state.get();
    const tool = TOOLS[toolId];
    if (!tool) return { success: false, msg: 'Herramienta no válida.' };

    // Modificadores de equipo
    const hasStab = s.player.gear.includes('estabilizador');
    const qualityBonus = hasStab ? 8 : 0;

    // Probabilidad de éxito baja con la rareza (rarezas se resisten)
    let successP = tool.success - (wild.rarity / 300);
    successP = clamp(successP, 0.15, 0.98);
    const ok = RNG.chance(successP);

    if (!ok) {
      return { success: false, form: tool.form, msg: `La ${wild.name} se resistió. No obtuviste ${tool.form}.` };
    }

    const quality = toolQuality(tool, qualityBonus);
    // El polen no crea un espécimen completo: crea material de cruce (guardamos como espécimen "polen")
    const form = tool.form;

    // Construye el espécimen recolectado. Copia el genotipo salvaje.
    const spec = PH.species.makeSpecimen(
      PH.species.SPECIES_BY_ID[wild.speciesId],
      s.env,
      {
        genotype: JSON.parse(JSON.stringify(wild.genotype)),
        form, quality,
        caughtAt: { biome: mapBiome(), weather: s.env.weather, time: PH.state.timeLabel(s.env) },
        generation: 0,
      }
    );
    // conserva firma/rareza del salvaje (mismo genotipo => misma firma)
    spec.signature = wild.signature;
    spec.rarity = wild.rarity;
    spec.tier = wild.tier;

    return { success: true, specimen: spec, form, quality, msg: `¡Obtuviste ${form} de ${wild.name}! (calidad ${quality})` };
  }

  function mapBiome() {
    const s = PH.state.get();
    const map = PH.world.MAPS[s.player.map];
    return map ? map.biome : null;
  }

  // Probabilidad de encuentro al pisar hierba alta
  function encounterChance(biome) {
    const s = PH.state.get();
    const b = PH.species.BIOMES[biome];
    let p = b ? b.baseEncounter : 0.12;
    if (s.player.cebosActivos > 0) p += 0.05;
    if (PH.events && PH.events.encounterBoost) p *= PH.events.encounterBoost();
    return Math.min(0.6, p);
  }

  PH.encounter = { harvest, encounterChance };
})(window.PH = window.PH || {});
