<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Strainmon</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <!-- Consola portátil retro ORIGINAL (no reproduce ninguna marca/diseño comercial) -->
  <div id="device">
    <div id="brand"><span class="mark">STRAIN<b>BOY</b></span><span class="led"></span><span class="tag">COLOR · GENETICS</span></div>

    <div id="lcd">
      <div class="lcd-inner">
        <div id="hud"></div>
        <canvas id="screen" width="480" height="320"></canvas>
        <div id="overlay"></div>
        <div id="toasts"></div>
      </div>
      <div class="lcd-glare"></div>
    </div>

    <div id="controls">
      <div class="dpad" aria-label="dpad">
        <button data-key="arrowup" class="db up">▲</button>
        <button data-key="arrowleft" class="db left">◀</button>
        <button data-key="arrowright" class="db right">▶</button>
        <button data-key="arrowdown" class="db down">▼</button>
        <span class="db-center"></span>
      </div>
      <div class="face">
        <button data-key="escape" class="ab b">B</button>
        <button data-key=" " class="ab a">A</button>
      </div>
    </div>

    <div id="sysrow">
      <button data-key="select" class="pill-btn" title="SELECT · Modo DMG/color">SELECT</button>
      <button data-key="start" class="pill-btn" title="START · Misiones">START</button>
    </div>

    <div id="menurow">
      <button data-key="i" class="mb" title="Mochila">🎒</button>
      <button data-key="g" class="mb" title="Invernadero">🌿</button>
      <button data-key="l" class="mb" title="Laboratorio">🔬</button>
      <button data-key="b" class="mb" title="Banco">🧬</button>
      <button data-key="c" class="mb" title="Strain-dex">📖</button>
      <button data-key="q" class="mb" title="Misiones">📋</button>
      <button data-key="m" class="mb" title="Guardar">💾</button>
    </div>

    <div id="footrow">
      <span class="knob"><i></i>CONTRASTE</span>
      <div class="speaker"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <span class="knob" data-mute title="Silenciar"><i></i>VOLUMEN</span>
    </div>
  </div>

  <script src="src/util.js"></script>
  <script src="src/genetics.js"></script>
  <script src="src/species.js"></script>
  <script src="src/items.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/plantart.js"></script>
  <script src="src/state.js"></script>
  <script src="src/quests.js"></script>
  <script src="src/events.js"></script>
  <script src="src/research.js"></script>
  <script src="src/garden.js"></script>
  <script src="src/encounter.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/charart.js"></script>
  <script src="src/furniart.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/heat.js"></script>
  <script src="src/iso.js"></script>
  <script src="src/isogame.js"></script>
</body>
</html>
