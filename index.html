<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Strainmon</title>
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <div id="hud"></div>

    <div id="stage">
      <canvas id="screen" width="240" height="160"></canvas>
      <div id="overlay"></div>
      <div id="toasts"></div>
    </div>

    <div id="touch">
      <div class="dpad">
        <button data-key="arrowup" class="tb up">▲</button>
        <button data-key="arrowleft" class="tb left">◀</button>
        <button data-key="arrowright" class="tb right">▶</button>
        <button data-key="arrowdown" class="tb down">▼</button>
      </div>
      <div class="abtns">
        <button data-key=" " class="tb a">A</button>
        <div class="menu-keys">
          <button data-key="i" class="tb s">🎒</button>
          <button data-key="b" class="tb s">🧬</button>
          <button data-key="c" class="tb s">🌿</button>
        </div>
      </div>
    </div>

    <footer id="foot">
      Strainmon — RPG de exploración y genética landrace. Sin combates. Solo descubrimiento.
    </footer>
  </div>

  <script src="src/util.js"></script>
  <script src="src/genetics.js"></script>
  <script src="src/species.js"></script>
  <script src="src/items.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/plantart.js"></script>
  <script src="src/state.js"></script>
  <script src="src/quests.js"></script>
  <script src="src/events.js"></script>
  <script src="src/research.js"></script>
  <script src="src/garden.js"></script>
  <script src="src/encounter.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/charart.js"></script>
  <script src="src/furniart.js"></script>
  <script src="src/iso.js"></script>
  <script src="src/isogame.js"></script>
</body>
</html>
