<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Strainmon</title>
  <meta name="description" content="Strainmon — RPG de exploración y genética vegetal. Cultiva, cruza y colecciona cepas landrace. App web, sin descargas." />
  <meta name="theme-color" content="#14100f" />
  <!-- PWA: instalable en el móvil, pantalla completa, offline -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Strainmon" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <!-- Favicon inline (SVG data-URI): sin peticiones externas, 100% offline. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2320161f'/%3E%3Cpath d='M16 26c0-6 4-10 9-11-1 6-4 10-9 11zM16 26c0-6-4-10-9-11 1 6 4 10 9 11z' fill='%234a9b40'/%3E%3Crect x='13' y='24' width='6' height='5' rx='1' fill='%23c07048'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div id="app">
    <!-- Barra superior: identidad + HUD del juego + acciones rápidas -->
    <header id="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">🌿</span>Strain<b>mon</b></div>
      <div id="hud"></div>
      <div class="topbar-actions">
        <button class="icon-btn" data-key="select" title="Color / DMG" aria-label="Alternar color">🎨</button>
        <button class="icon-btn" data-key="n" title="Sonido" aria-label="Silenciar">🔊</button>
      </div>
    </header>

    <!-- Escenario: el mundo llena el área; overlay y controles se superponen -->
    <main id="stage">
      <canvas id="screen" width="480" height="432"></canvas>
      <div id="overlay"></div>
      <div id="toasts"></div>

      <!-- Controles táctiles (visibles en pantallas táctiles) -->
      <div id="pad" class="touch" aria-hidden="true">
        <button class="db up"    data-key="arrowup">▲</button>
        <button class="db left"  data-key="arrowleft">◀</button>
        <button class="db right" data-key="arrowright">▶</button>
        <button class="db down"  data-key="arrowdown">▼</button>
        <span class="db-center"></span>
      </div>
      <div id="ab" class="touch" aria-hidden="true">
        <button class="ab b" data-key="escape" aria-label="Volver">B</button>
        <button class="ab a" data-key=" " aria-label="Acción">A</button>
      </div>
    </main>

    <!-- Navegación inferior tipo app: accesos a cada pantalla del juego -->
    <nav id="tabbar" aria-label="Menú del juego">
      <button class="tab" data-key="i"><span>🎒</span><small>Mochila</small></button>
      <button class="tab" data-key="g"><span>🌿</span><small>Cultivo</small></button>
      <button class="tab" data-key="l"><span>🔬</span><small>Lab</small></button>
      <button class="tab" data-key="b"><span>🧬</span><small>Banco</small></button>
      <button class="tab" data-key="c"><span>📖</span><small>Dex</small></button>
      <button class="tab" data-key="q"><span>📋</span><small>Misiones</small></button>
      <button class="tab" data-key="m"><span>💾</span><small>Guardar</small></button>
    </nav>
  </div>

  <script src="src/util.js"></script>
  <script src="src/genetics.js"></script>
  <script src="src/species.js"></script>
  <script src="src/items.js"></script>
  <script src="src/world.js"></script>
  <script src="src/render.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/plantart.js"></script>
  <script src="src/state.js"></script>
  <script src="src/quests.js"></script>
  <script src="src/events.js"></script>
  <script src="src/research.js"></script>
  <script src="src/garden.js"></script>
  <script src="src/encounter.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/charart.js"></script>
  <script src="src/furniart.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/heat.js"></script>
  <script src="src/iso.js"></script>
  <script src="src/isogame.js"></script>
  <script>
    // Service worker: caché del app-shell para juego offline (web sostenible).
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
