<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#14100f" />
  <title>Strainmon — Phaser</title>
  <!-- Reutiliza el sistema visual cálido/retro del juego para la UI DOM -->
  <link rel="stylesheet" href="../assets/style.css" />
  <style>
    #stage { background: #14100f; }
    #game { position: absolute; inset: 0; }
    #game canvas { image-rendering: pixelated; display: block; }
  </style>
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand"><span class="brand-mark">🌿</span>Strain<b>mon</b></div>
      <div id="hud"></div>
      <div class="topbar-actions">
        <button class="icon-btn" data-key="n" title="Sonido">🔊</button>
      </div>
    </header>

    <main id="stage">
      <div id="game"></div>
      <div id="overlay"></div>
      <div id="toasts"></div>

      <div id="pad" class="touch" aria-hidden="true">
        <button class="db up"    data-dir="up">▲</button>
        <button class="db left"  data-dir="left">◀</button>
        <button class="db right" data-dir="right">▶</button>
        <button class="db down"  data-dir="down">▼</button>
        <span class="db-center"></span>
      </div>
      <div id="ab" class="touch" aria-hidden="true">
        <button class="ab b" data-key="escape" aria-label="Volver">B</button>
        <button class="ab a" data-key=" " aria-label="Acción">A</button>
      </div>
    </main>

    <nav id="tabbar" aria-label="Menú">
      <button class="tab" data-key="i"><span>🎒</span><small>Mochila</small></button>
      <button class="tab" data-key="g"><span>🌿</span><small>Cultivo</small></button>
      <button class="tab" data-key="l"><span>🔬</span><small>Lab</small></button>
      <button class="tab" data-key="b"><span>🧬</span><small>Banco</small></button>
      <button class="tab" data-key="c"><span>📖</span><small>Dex</small></button>
      <button class="tab" data-key="q"><span>📋</span><small>Misiones</small></button>
      <button class="tab" data-key="m"><span>💾</span><small>Guardar</small></button>
    </nav>
  </div>

  <!-- Motor -->
  <script src="vendor/phaser.min.js"></script>
  <!-- Lógica reutilizada del juego vanilla -->
  <script src="../src/util.js"></script>
  <script src="../src/genetics.js"></script>
  <script src="../src/species-data.js"></script>
  <script src="../src/species.js"></script>
  <script src="../src/items.js"></script>
  <script src="../src/world.js"></script>
  <script src="../src/render.js"></script>
  <script src="../src/sprites.js"></script>
  <script src="../src/plantart.js"></script>
  <script src="../src/strainart.js"></script>
  <script src="../src/state.js"></script>
  <script src="../src/quests.js"></script>
  <script src="../src/events.js"></script>
  <script src="../src/research.js"></script>
  <script src="../src/garden.js"></script>
  <script src="../src/encounter.js"></script>
  <script src="../src/ui.js"></script>
  <script src="../src/charart.js"></script>
  <script src="../src/furniart.js"></script>
  <script src="../src/audio.js"></script>
  <script src="../src/heat.js"></script>
  <!-- Motor Phaser (top-down) -->
  <script src="src/config.js"></script>
  <script src="src/boot.js"></script>
  <script src="src/world-scene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
