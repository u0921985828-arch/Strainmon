<title>Ribera Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Press+Start+2P&display=swap">
<style>
/*@@CSS@@*/</style>

<main class="marco" id="consola" aria-label="Ribera Verde, juego">
  <div class="screen" id="screen">
    <canvas id="c" width="240" height="160"></canvas>
    <div class="hud" id="hud" hidden></div>
    <div class="escena" id="escena">
      <div class="title" id="title" hidden>
        <h1>RIBERA VERDE<span>genética de barrio</span></h1>
        <p>Cultiva · Cruza · Vende · Sobrevive</p>
        <div class="press">PULSA START</div>
      </div>
      <div class="box bhp" id="bE" hidden></div>
      <div class="box bhp" id="bP" hidden></div>
    </div>
    <div class="ui" id="ui">
      <div class="box toast" id="toast" hidden></div>
      <div class="box dlg" id="dlg" hidden><div class="nm" id="dlgName" hidden></div><span id="dlgText"></span><div class="more" id="dlgMore" hidden></div></div>
      <div class="box menu" id="menu" hidden></div>
      <div class="box namebox" id="nameBox" hidden><label for="nameInput">¿Cómo te llamas?</label><input id="nameInput" maxlength="8" autocomplete="off" spellcheck="false"><small>Pulsa A para aceptar</small></div>
    </div>
    <div class="endcard" id="endcard" hidden></div>
    <div class="fade" id="fade"></div>
    <div class="wipe" id="wipe" hidden></div>
  </div>
  <div class="mando" id="mando">
    <div class="dpad" id="dpad" aria-label="Cruceta">
      <button class="u" data-b="up" aria-label="Arriba">▲</button>
      <button class="l" data-b="left" aria-label="Izquierda">◀</button>
      <div class="m"></div>
      <button class="r" data-b="right" aria-label="Derecha">▶</button>
      <button class="d" data-b="down" aria-label="Abajo">▼</button>
    </div>
    <div class="ab"><button data-b="B" aria-label="Botón B">B</button><button data-b="A" aria-label="Botón A">A</button></div>
    <div class="pills"><button id="bSound" aria-label="Activar o quitar sonido">SONIDO</button><button data-b="START" aria-label="Start, menú">START</button></div>
  </div>
  <div class="girar" id="girar" hidden><div><b>Gira el móvil</b>Ribera Verde se juega en horizontal.</div></div>
</main>
