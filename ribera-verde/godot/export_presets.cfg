; AAB para Google Play con la plantilla Gradle de Godot 4.7 (tools/godot-aab.js): targetSdk 36, minSdk 24, arm64-v8a y armeabi-v7a.
; La firma la pone tools/godot-aab.js con la upload key (variables LH_KEYSTORE*, fuera del repo), nunca este archivo.
[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="datos/*.json, arte/*.json, fuentes/*.txt, musica/*.json, i18n/strings.csv"
exclude_filter="tests/*, icono/*, android/*, addons/*"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=true
gradle_build/export_format=1
gradle_build/min_sdk="24"
gradle_build/target_sdk="36"
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=69
version/name="0.50.0"
package/unique_name="com.landracehunters.game"
package/name="Landrace Hunters"
package/signed=false
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192="res://icono/icono-192.png"
launcher_icons/adaptive_foreground_432x432="res://icono/icono-delante-432.png"
launcher_icons/adaptive_background_432x432="res://icono/icono-fondo-432.png"
launcher_icons/adaptive_monochrome_432x432="res://icono/icono-mono-432.png"
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=true
command_line/extra_args=""
apk_expansion/enable=false
permissions/custom_permissions=PackedStringArray()
permissions/vibrate=true
