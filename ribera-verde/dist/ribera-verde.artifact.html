<title>Ribera Verde</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
/* Layout: una consola portátil sobre fieltro oscuro; pantalla 3:2 (240x160) con mandos a los lados en escritorio y debajo en móvil */
:root{
  --felt:#0c130f; --felt2:#15211a;
  --shell:#2b9466; --shellHi:#55c592; --shellLo:#176043;
  --bezel:#1f232a; --ink:#e6f2ea; --muted:#8fae9b;
  --btn:#6d2c4b; --btnHi:#9a4a72; --pad:#22262d;
  --box:#f8f8f0; --boxInk:#3a3a44; --boxShadow:#d6cec2; --boxLine:#46749a; --boxLine2:#a9d2ec;
  --display:"Press Start 2P", ui-monospace, monospace;
  --pixel:"Pixelify Sans", ui-monospace, monospace;
  color-scheme: dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%, var(--felt2), var(--felt) 70%) fixed, var(--felt);color:var(--ink);font-family:var(--pixel);padding-inline:16px;padding-block:12px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:10px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.console{width:min(1100px,100%);display:grid;grid-template-columns:minmax(110px,1fr) auto minmax(110px,1fr);grid-template-areas:"l c r" ". p .";gap:10px 22px;padding:20px 26px 16px;background:linear-gradient(160deg,var(--shellHi) 0%,var(--shell) 28%,var(--shellLo) 100%);border-radius:40px/56px;box-shadow:inset 0 3px 0 rgba(255,255,255,.25),inset 0 -6px 0 rgba(0,0,0,.25),0 18px 40px rgba(0,0,0,.55);box-sizing:border-box;max-width:100%}
.center{grid-area:c;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bezel{background:var(--bezel);border-radius:14px 14px 34px 14px;padding:14px 22px 10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.6);width:min(720px,calc((100dvh - 150px) * 1.5 + 44px));max-width:100%;box-sizing:border-box}
.screen{position:relative;width:100%;aspect-ratio:3/2;container-type:inline-size;background:#000;overflow:hidden;border-radius:2px;--u:calc(100cqw / 240);user-select:none;-webkit-user-select:none}
.bezel .lbl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:var(--display);font-size:9px;letter-spacing:.08em;color:#8b93a0}
.bezel .lbl i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e04848;box-shadow:0 0 6px #ff5050;margin-right:6px;vertical-align:middle}
.bezel .lbl b{color:var(--shellHi);font-weight:400}
.sideL{grid-area:l;display:flex;align-items:center;justify-content:center}
.sideR{grid-area:r;display:flex;align-items:center;justify-content:center}
.pills{grid-area:p;display:flex;gap:18px;justify-content:center}
.dpad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);touch-action:none}
.dpad button,.ab button,.pills button{font:inherit;border:0;cursor:pointer;touch-action:none;color:#c9d2dc}
.dpad button{background:var(--pad);box-shadow:inset 0 -3px 0 rgba(0,0,0,.45),0 2px 0 rgba(255,255,255,.12);font-size:13px}
.dpad .u{grid-area:1/2;border-radius:6px 6px 0 0}.dpad .d{grid-area:3/2;border-radius:0 0 6px 6px}
.dpad .l{grid-area:2/1;border-radius:6px 0 0 6px}.dpad .r{grid-area:2/3;border-radius:0 6px 6px 0}
.dpad .m{grid-area:2/2;background:var(--pad)}
.ab{display:flex;gap:16px;transform:rotate(-18deg)}
.ab button{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--btnHi),var(--btn) 70%);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.35);font-family:var(--display);font-size:14px;color:#f1d7e4}
.ab button:nth-child(2){margin-top:-26px}
.pills button{background:#2a2f37;border-radius:20px;padding:8px 14px;font-family:var(--display);font-size:8px;letter-spacing:.1em;box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
button:active,button.on{filter:brightness(1.35)}
button:focus-visible{outline:2px solid #f8e070;outline-offset:2px}
.keys{font-size:13px;color:var(--muted);text-align:center;max-width:70ch;margin:0;line-height:1.5}
.keys kbd{font-family:var(--display);font-size:9px;background:#1d2a22;border:1px solid #2f4a3a;border-radius:4px;padding:2px 5px;color:var(--ink)}
@media (max-width:760px){
  .console{grid-template-columns:1fr 1fr;grid-template-areas:"c c" "l r" "p p";padding:12px 12px 14px;border-radius:26px;gap:12px}
  .bezel{padding:8px 8px 6px;border-radius:10px 10px 22px 10px;width:min(100%,calc((100dvh - 300px) * 1.5 + 16px))}
  .bezel .lbl{font-size:7px}
  .dpad{grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px)}
  .keys{display:none}
}
/* ---- in-screen UI, everything sized in GBA pixels (--u) ---- */
canvas#c{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.box{background:var(--box);border:calc(var(--u)*2) solid var(--boxLine);border-radius:calc(var(--u)*4);box-shadow:inset 0 0 0 calc(var(--u)*1.5) var(--boxLine2);color:var(--boxInk);text-shadow:calc(var(--u)*.8) calc(var(--u)*.8) 0 var(--boxShadow);box-sizing:border-box}
.dlg{position:absolute;left:calc(var(--u)*3);right:calc(var(--u)*3);bottom:calc(var(--u)*3);height:calc(var(--u)*44);padding:calc(var(--u)*6) calc(var(--u)*10);font-size:calc(var(--u)*10);line-height:calc(var(--u)*14);white-space:pre-wrap;z-index:20}
.dlg .nm{position:absolute;top:calc(var(--u)*-12);left:calc(var(--u)*6);background:var(--boxLine);color:#fff;text-shadow:none;font-size:calc(var(--u)*8);line-height:1;padding:calc(var(--u)*2.5) calc(var(--u)*5);border-radius:calc(var(--u)*3) calc(var(--u)*3) 0 0}
.dlg .more{position:absolute;right:calc(var(--u)*8);bottom:calc(var(--u)*4);width:0;height:0;border-left:calc(var(--u)*4) solid transparent;border-right:calc(var(--u)*4) solid transparent;border-top:calc(var(--u)*5) solid #e04040;animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--u)*2))}}
.menu{position:absolute;padding:calc(var(--u)*5) calc(var(--u)*7);font-size:calc(var(--u)*10);line-height:calc(var(--u)*14.5);z-index:30;min-width:calc(var(--u)*60)}
.menu.right{right:calc(var(--u)*3);bottom:calc(var(--u)*49);max-width:calc(var(--u)*170)}
.menu.start{right:calc(var(--u)*3);top:calc(var(--u)*3)}
.menu.full{left:calc(var(--u)*3);right:calc(var(--u)*3);top:calc(var(--u)*3);bottom:calc(var(--u)*3);display:flex;flex-direction:column}
.menu.battle{right:calc(var(--u)*3);bottom:calc(var(--u)*3);height:calc(var(--u)*44);width:calc(var(--u)*118);display:grid;grid-template-columns:1fr 1fr;align-content:center;padding:calc(var(--u)*4) calc(var(--u)*6);font-size:calc(var(--u)*9.5)}
.menu .ttl{color:var(--boxLine);font-size:calc(var(--u)*8.5);display:flex;justify-content:space-between;gap:calc(var(--u)*8);border-bottom:calc(var(--u)*1) solid var(--boxLine2);margin-bottom:calc(var(--u)*3);padding-bottom:calc(var(--u)*1)}
.menu .list{flex:1;min-height:0}
.menu .it{position:relative;padding-left:calc(var(--u)*10);white-space:nowrap;display:flex;justify-content:space-between;gap:calc(var(--u)*10);cursor:pointer;overflow:hidden;text-overflow:ellipsis}
.menu .it .r{color:#6a6a78;font-variant-numeric:tabular-nums}
.menu .it.sel::before{content:"";position:absolute;left:0;top:calc(var(--u)*3.5);border-top:calc(var(--u)*4) solid transparent;border-bottom:calc(var(--u)*4) solid transparent;border-left:calc(var(--u)*5) solid #404048}
.menu .it.dis{color:#a6a6ae}
.menu .sw{display:inline-block;width:calc(var(--u)*6);height:calc(var(--u)*6);border-radius:calc(var(--u)*1.5);margin-right:calc(var(--u)*4);vertical-align:middle;box-shadow:0 0 0 calc(var(--u)*.8) #404048}
.menu .desc{border-top:calc(var(--u)*1) solid var(--boxLine2);margin-top:calc(var(--u)*3);padding-top:calc(var(--u)*3);font-size:calc(var(--u)*8.5);line-height:calc(var(--u)*11.5);min-height:calc(var(--u)*24);white-space:pre-wrap}
.menu .arr{text-align:center;color:#e04040;font-size:calc(var(--u)*6);line-height:calc(var(--u)*5);height:calc(var(--u)*5)}
.menu .it>span:first-child{overflow:hidden;text-overflow:ellipsis}
.hud{position:absolute;left:calc(var(--u)*3);top:calc(var(--u)*3);background:rgba(16,28,22,.78);color:#eef8f0;font-size:calc(var(--u)*7.5);line-height:calc(var(--u)*9);padding:calc(var(--u)*2) calc(var(--u)*4);border-radius:calc(var(--u)*3);z-index:10;font-variant-numeric:tabular-nums;pointer-events:none}
.hud .heat{display:flex;align-items:center;gap:calc(var(--u)*3)}
.hud .bar{width:calc(var(--u)*34);height:calc(var(--u)*3);background:#2e3a34;border-radius:calc(var(--u)*1)}
.hud .bar i{display:block;height:100%;background:#f0a030;border-radius:calc(var(--u)*1)}
.hud .bar i.hot{background:#f04040}
.toast{position:absolute;left:50%;top:calc(var(--u)*24);transform:translateX(-50%);padding:calc(var(--u)*4) calc(var(--u)*10);font-size:calc(var(--u)*9);line-height:calc(var(--u)*12);text-align:center;z-index:25;width:max-content;max-width:calc(var(--u)*210);pointer-events:none}
.toast small{display:block;font-family:var(--display);font-size:calc(var(--u)*5.5);color:var(--boxLine);letter-spacing:.05em;text-shadow:none}
.bhp{position:absolute;padding:calc(var(--u)*3) calc(var(--u)*6);font-size:calc(var(--u)*8.5);line-height:calc(var(--u)*11);width:calc(var(--u)*104);z-index:15}
.bhp .row{display:flex;justify-content:space-between}
.bhp .hp{display:flex;align-items:center;gap:calc(var(--u)*3);font-size:calc(var(--u)*6.5);font-family:var(--display);color:#d08a20;text-shadow:none}
.bhp .hp span{flex:1;height:calc(var(--u)*3.5);background:#3a3a44;border-radius:calc(var(--u)*2);padding:calc(var(--u)*.6)}
.bhp .hp span i{display:block;height:100%;width:100%;background:#58d080;border-radius:calc(var(--u)*2);transition:width .5s steps(12)}
.bhp .num{text-align:right;font-variant-numeric:tabular-nums}
#bE{left:calc(var(--u)*6);top:calc(var(--u)*8)}
#bP{right:calc(var(--u)*6);bottom:calc(var(--u)*49)}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(var(--u)*20);z-index:12;pointer-events:none;text-align:center}
.title h1{margin:0;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*17);line-height:1.15;color:#ffe680;text-shadow:calc(var(--u)*1.5) calc(var(--u)*1.5) 0 #2a7a40,calc(var(--u)*3) calc(var(--u)*3) 0 #10301c;letter-spacing:.04em}
.title h1 span{display:block;color:#9cf0a8;font-size:calc(var(--u)*10);margin-top:calc(var(--u)*5)}
.title p{margin:calc(var(--u)*6) 0 0;font-size:calc(var(--u)*8);color:#d8f0e0;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #10301c}
.title .press{position:absolute;bottom:calc(var(--u)*14);font-family:var(--display);font-size:calc(var(--u)*7);color:#fff;animation:blink 1s steps(2) infinite;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #000}
@keyframes blink{50%{opacity:0}}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:40;transition:opacity .22s linear}
.fade.white{background:#fff}
.wipe{position:absolute;inset:0;background:#000;z-index:41;pointer-events:none;clip-path:inset(50% 0 50% 0)}
.wipe.go{animation:wipe .45s steps(8) forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.namebox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:calc(var(--u)*8) calc(var(--u)*10);z-index:35;display:flex;flex-direction:column;gap:calc(var(--u)*5);font-size:calc(var(--u)*9)}
.namebox input{font-family:var(--pixel);font-size:calc(var(--u)*12);width:calc(var(--u)*110);border:calc(var(--u)*1) solid var(--boxLine);background:#fff;color:var(--boxInk);padding:calc(var(--u)*2) calc(var(--u)*4);text-transform:uppercase}
.namebox small{font-size:calc(var(--u)*7);color:#6a6a78}
.endcard{position:absolute;inset:0;z-index:38;background:#0b1a12;color:#e8f8ec;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*6);text-align:center;padding:calc(var(--u)*12);font-size:calc(var(--u)*9);line-height:calc(var(--u)*13)}
.endcard h2{font-family:var(--display);font-weight:400;font-size:calc(var(--u)*14);color:#ffe680;margin:0}
@media (prefers-reduced-motion:reduce){.dlg .more,.title .press{animation:none}.fade{transition:none}}
</style>

<main class="console" aria-label="Ribera Verde, juego">
  <div class="sideL">
    <div class="dpad" id="dpad" aria-label="Cruceta">
      <button class="u" data-b="up" aria-label="Arriba">▲</button>
      <button class="l" data-b="left" aria-label="Izquierda">◀</button>
      <div class="m"></div>
      <button class="r" data-b="right" aria-label="Derecha">▶</button>
      <button class="d" data-b="down" aria-label="Abajo">▼</button>
    </div>
  </div>
  <div class="center">
    <div class="bezel">
      <div class="screen" id="screen">
        <canvas id="c" width="240" height="160"></canvas>
        <div class="hud" id="hud" hidden></div>
        <div class="title" id="title" hidden>
          <h1>RIBERA VERDE<span>versión cogollo</span></h1>
          <p>Cultiva · Cruza · Vende · Sobrevive</p>
          <div class="press">PULSA START</div>
        </div>
        <div class="box bhp" id="bE" hidden></div>
        <div class="box bhp" id="bP" hidden></div>
        <div class="box toast" id="toast" hidden></div>
        <div class="box dlg" id="dlg" hidden><div class="nm" id="dlgName" hidden></div><span id="dlgText"></span><div class="more" id="dlgMore" hidden></div></div>
        <div class="box menu" id="menu" hidden></div>
        <div class="box namebox" id="nameBox" hidden><label for="nameInput">¿Cómo te llamas?</label><input id="nameInput" maxlength="8" autocomplete="off" spellcheck="false"><small>Intro para aceptar</small></div>
        <div class="endcard" id="endcard" hidden></div>
        <div class="fade" id="fade"></div>
        <div class="wipe" id="wipe" hidden></div>
      </div>
      <div class="lbl"><span><i></i>RIBERA <b>VERDE</b></span><span>GROW·BOY</span></div>
    </div>
  </div>
  <div class="sideR">
    <div class="ab"><button data-b="B" aria-label="Botón B">B</button><button data-b="A" aria-label="Botón A">A</button></div>
  </div>
  <div class="pills">
    <button id="bSound" aria-label="Activar o quitar sonido">SONIDO</button>
    <button data-b="START" aria-label="Start, menú">START</button>
  </div>
</main>
<p class="keys">Mover <kbd>←↑↓→</kbd>/<kbd>WASD</kbd> · A <kbd>Z</kbd>/<kbd>Espacio</kbd>/<kbd>Intro</kbd> · B <kbd>X</kbd>/<kbd>Esc</kbd> (mantén B para correr) · Menú <kbd>M</kbd></p>

/* cannabis leaf, pixel version (cx,cy centre, s size) */
function drawLeafPx(t,cx,cy,s,col){
  const leaflets=[[-90,1],[-60,.82],[-120,.82],[-28,.58],[-152,.58],[0,.32],[180,.32]];
  for(const [deg,l] of leaflets){const a=deg*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),len=s*2*l,w=Math.max(.6,s*.34*l);
    for(let py=Math.floor(cy-len-2);py<=cy+len+2;py++)for(let px=Math.floor(cx-len-2);px<=cx+len+2;px++){
      const vx=px+.5-cx,vy=py+.5-cy,tt=(vx*dx+vy*dy)/len;if(tt<0||tt>1)continue;
      const d=Math.abs(vx*dy-vy*dx);if(d<=w*Math.sin(Math.PI*tt)+.15)t.P(px,py,col);}}
  t.F(Math.round(cx)-0,Math.round(cy),1,Math.max(2,Math.round(s)),col);
}

   ARTE — sprites y animaciones de PixelLab desde el atlas
   (assets/sprites/atlas.*, incrustado por tools/build.js como ATLAS).
   Todo lo que no esté en el atlas se dibuja con el procedural de siempre.
   ?arte=procedural en la URL fuerza el procedural para comparar.
   ========================================================= */
const ARTE={ok:false,fr:{},mir:{},rec:new WeakMap(),vfx:[],st:new WeakMap(),sobre:{},cubre:{},prisa:1};
const DIR4={down:'south',up:'north',left:'west',right:'east'};

function arteListo(){
  if(ARTE.p)return ARTE.p;
  let off=false;try{off=/[?&]arte=procedural/.test(location.search);}catch(e){}
  if(typeof ATLAS==='undefined'||!ATLAS||off)return ARTE.p=Promise.resolve(false);
  return ARTE.p=new Promise(res=>{
    const img=new Image();
    img.onload=()=>{try{
      const d=ATLAS.def;
      for(const k in d.frames){const f=d.frames[k];const [c,x]=mkCanvas(f.w,f.h);x.drawImage(img,f.x,f.y,f.w,f.h,0,0,f.w,f.h);ARTE.fr[k]=c;}
      for(const g in d.anims)for(const s in d.anims[g]){const a=d.anims[g][s];if(a.sobre)(ARTE.sobre[a.sobre]=ARTE.sobre[a.sobre]||[]).push([g,s]);}
      ARTE.d=d;ARTE.cubre=d.cubre||{};ARTE.ok=true;res(true);
    }catch(e){console.error(e);res(false);}};
    img.onerror=()=>{console.warn('atlas: no se pudo cargar la imagen');res(false);};
    img.src=ATLAS.png;
  });
}
const animDe=(g,s)=>!!g&&ARTE.ok&&ARTE.d.anims[g]?ARTE.d.anims[g][s]||null:null;
// fotogramas de una dirección; si falta, la más cercana (este ↔ oeste en espejo, después sur)
function clavesDe(g,s,dir){
  const a=animDe(g,s);if(!a)return null;const D=a.dirs;
  if(D[dir])return [D[dir],false];
  if(dir==='east'&&D.west)return [D.west,true];
  if(dir==='west'&&D.east)return [D.east,true];
  return [D.south||D.unica||D[Object.keys(D)[0]],false];
}
function tieneDir(g,s,dir){const a=animDe(g,s);if(!a)return false;const D=a.dirs;return !!(D[dir]||(dir==='east'&&D.west)||(dir==='west'&&D.east));}
function espejo(k){
  if(ARTE.mir[k])return ARTE.mir[k];
  const s=ARTE.fr[k];const [c,x]=mkCanvas(s.width,s.height);x.translate(s.width,0);x.scale(-1,1);x.drawImage(s,0,0);return ARTE.mir[k]=c;
}
function nFotos(g,s){const a=animDe(g,s);if(!a)return 0;return Math.max(...Object.values(a.dirs).map(v=>v.length));}
const duracion=(g,s)=>{const a=animDe(g,s);return a?nFotos(g,s)*1000/(a.fps||8):0;};
// o.i: índice fijo · o.ph: fase 0-1 del ciclo · si no, por tiempo t (ms) con fps y bucle del atlas
function frameDe(g,s,dir,t,o={}){
  const r=clavesDe(g,s,dir);if(!r)return null;
  const [ks,m]=r,a=animDe(g,s),n=ks.length;let i;
  if(o.i!=null)i=((o.i%n)+n)%n;
  else if(o.ph!=null)i=Math.floor(o.ph*n)%n;
  else{i=Math.floor(Math.max(0,t)*(a.fps||8)/1000);i=(o.bucle??a.bucle)?i%n:Math.min(n-1,i);}
  return {c:m?espejo(ks[i]):ARTE.fr[ks[i]],i,n,cel:a.celda||ARTE.d.celdas[g]};
}
// cambia colores exactos (rampa clave → rampa destino); se calcula una vez por fotograma y rampa
function conRampa(c,map,id){
  let m=ARTE.rec.get(c);if(!m){m=new Map();ARTE.rec.set(c,m);}
  if(m.has(id))return m.get(id);
  const [o,x]=mkCanvas(c.width,c.height);x.drawImage(c,0,0);
  const im=x.getImageData(0,0,c.width,c.height),px=im.data,tb={};
  for(const k in map){const a=parseInt(k.slice(1),16),b=parseInt(map[k].slice(1),16);tb[a]=[b>>16,(b>>8)&255,b&255];}
  for(let j=0;j<px.length;j+=4){if(!px[j+3])continue;const t=tb[(px[j]<<16)|(px[j+1]<<8)|px[j+2]];if(t){px[j]=t[0];px[j+1]=t[1];px[j+2]=t[2];}}
  x.putImageData(im,0,0);m.set(id,o);return o;
}
function pinta(f,xP,yP,c){ctx.drawImage(c||f.c,Math.round(xP-f.cel.ancla[0]),Math.round(yP-f.cel.ancla[1]));}
function dibujar(g,s,dir,t,xP,yP,o){const f=frameDe(g,s,dir,t,o);if(f)pinta(f,xP,yP);return f;}
function sombra(x,y){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(x-4,y-1,8,3);ctx.fillRect(x-5,y,10,1);}

}
function pjFrame(e,g,now,isP,dur){
  if(e.act&&!isP&&e.moving)e.act=null;
  if(e.act){const t=now-e.act.t0,f=frameDe(g,e.act.n,DIR4[e.dir],t);if(f&&t<duracion(g,e.act.n))return f;e.act=null;}
  if(e.moving){
    const s=isP&&dur<200&&animDe(g,'run')?'run':animDe(g,'walk')?'walk':null;
    if(s){const par=isP?e.parity:(e.x+e.y)&1;return frameDe(g,s,DIR4[e.dir],0,{ph:(par+Math.min(1,e.t/dur))/2});}   // un ciclo cada 2 casillas

const plantCache={};
const plantStage=p=>p.prog>=1?4:p.prog<.12?0:p.prog<.35?1:p.prog<.65?2:3;
function plantSprite(p){
  const s=getStrain(p.sid);const stage=p.dead?9:plantStage(p);
  const dry=p.water<=0||p.dead,pest=!!p.pest;
  const key=p.sid+stage+dry+pest;if(plantCache[key])return plantCache[key];
  const [c,x]=mkCanvas(16,26);const t=painter(x,rngSeed(hashStr(key)));
  const g1=dry?'#b8aa48':'#3c9a3e',g2=dry?'#8a7c30':'#22662a',g3=dry?'#d8cc78':'#74d064';
  const bud=s?s.c:'#9bd35a';
  // pot (fabric)
  t.F(3,20,10,6,'#2c2c30');t.F(3,20,10,1,'#4a4a52');t.F(4,21,8,1,'#5a3a20');t.F(3,25,10,1,'#18181c');
  const stem=(h)=>t.F(7,21-h,2,h,g2);
  if(stage===9){stem(6);t.F(4,16,4,1,'#8a7040');t.F(9,15,4,1,'#8a7040');}
  else if(stage===0){t.P(7,19,g1);t.P(8,19,g1);t.P(6,18,g3);t.P(9,18,g3);}
  else if(stage===1){stem(5);t.blob(5.5,16,2.6,1.4,g1,g2,g3);t.blob(10.5,16,2.6,1.4,g1,g2,g3);t.blob(8,14,2,1.6,g1,g2,g3);}
  else{
    const big=stage>=3;stem(big?16:10);

    for(let i=0;i<(big?5:3);i++){const y=top+i*(big?3.4:3.4);const w=(big?3.5:3)+i*.9;t.blob(8-w*.6,y+1,w*.75,1.8,g1,g2,g3);t.blob(8+w*.6,y+1,w*.75,1.8,g1,g2,g3);}

    if(big){const n=stage===4?7:4;const pts=[[8,top-1],[5,top+5],[11,top+5],[4,top+11],[12,top+11],[8,top+7],[8,top+13]];

  }

  plantCache[key]=c;return c;
}

  push(b=>{if((b==='A'||b==='B')&&!done)fin();});

function menu(items,o={}){return new Promise(res=>{
  items=items.map(it=>typeof it==='string'?{label:it}:it);
  let i=clamp(o.initial||0,0,items.length-1),top=0;const rows=o.rows||(o.cls==='full'?(o.desc?5:8):items.length);
  menuEl.className='box menu '+(o.cls||'right');
  const draw=()=>{
    if(i<top)top=i;if(i>=top+rows)top=i-rows+1;
    let h='';if(o.title)h+=`<div class="ttl"><span>${o.title}</span>${o.title2?`<span>${o.title2}</span>`:''}</div>`;
    if(o.cls==='full')h+=`<div class="arr">${top>0?'▲':''}</div><div class="list">`;
    items.slice(top,top+rows).forEach((it,k)=>{const idx=top+k;h+=`<div class="it ${idx===i?'sel':''} ${it.disabled?'dis':''}" data-i="${idx}"><span>${it.sw?`<i class="sw" style="background:${it.sw}"></i>`:''}${esc(it.label)}</span>${it.right!=null?`<span class="r">${esc(it.right)}</span>`:''}</div>`;});
    if(o.cls==='full')h+=`</div><div class="arr">${top+rows<items.length?'▼':''}</div>`;
    if(o.desc)h+=`<div class="desc">${esc(items[i].desc||'')}</div>`;
    menuEl.innerHTML=h;
  };
  draw();menuEl.hidden=false;
  const done=v=>{pop();menuEl.hidden=true;menuEl.onclick=null;res(v);};
  menuEl.onclick=e=>{const it=e.target.closest('.it');if(!it)return;const n=+it.dataset.i;if(n===i)handler('A');else{i=n;draw();}};
  const handler=b=>{const g=o.cls==='battle';const n=items.length;
    if(b==='up'){i=g?(i>=2?i-2:i):(i-1+n)%n;sfx('tick');draw();}
    else if(b==='down'){i=g?(i+2<n?i+2:i):(i+1)%n;sfx('tick');draw();}
    else if(g&&b==='left'){if(i%2)i--;draw();}else if(g&&b==='right'){if(i%2===0&&i+1<n)i++;draw();}
    else if(b==='A'){if(items[i].disabled){sfx('bump');return;}sfx('sel');done(i);}
    else if(b==='B'&&o.cancel!==false){sfx('back');done(-1);}
    else if(b==='START'&&o.startCloses){done(-1);}};
  push(handler);
});}

function updatePlayer(dt){
  if(P.moving){P.t+=dt;const k=Math.min(1,P.t/P.dur);P.px=(P.fx+(P.x-P.fx)*k)*16;P.py=(P.fy+(P.y-P.fy)*k)*16;
    if(k<1)return;P.moving=false;P.px=P.x*16;P.py=P.y*16;onStepEnd();P.chain=true;}
  if(!isFree()){P.chain=false;return;}
  const d=dirOrder[dirOrder.length-1];
  if(!d){P.chain=false;P.hold=0;return;}
  if(d!==P.dir){P.dir=d;if(!P.chain){P.hold=90;return;}}
  if(P.hold>0){P.hold-=dt;return;}
  tryMove(d);
}
function tryMove(d){
  const m=MAPS[S.map],[dx,dy]=DV[d];
  const ex=m.exits[P.x+','+P.y];
  if(d==='down'&&ex){P.chain=false;run(()=>warp(ex));return;}
  const nx=P.x+dx,ny=P.y+dy;
  if(tileSolid(m,nx,ny)||entAt(nx,ny)){const n=performance.now();if(n-P.bumpT>350){sfx('bump');P.bumpT=n;}P.chain=false;return;}
  P.fx=P.x;P.fy=P.y;P.x=nx;P.y=ny;P.t=0;P.moving=true;P.pisT=performance.now();P.dur=held.B?130:240;P.parity^=1;
}
function onStepEnd(){
  S.x=P.x;S.y=P.y;S.dir=P.dir;S.steps++;if(S.cool>0)S.cool--;
  const m=MAPS[S.map],door=m.doors[P.x+','+P.y];
  if(door){run(()=>warp(door));return;}
  if(S.map!=='town')return;
  if(P.y>=13&&P.y<=14&&P.x>=18&&P.x<=22){
    if(S.ch>=2&&!S.flags.darko1){queue('darko',async()=>{const e=ents.find(e=>e.id==='darko');if(e)e.dir='up';await talkDarko();});return;}
    if(S.ch>=5&&!S.flags.molina1&&!S.protect){queue('molina',talkMolina);return;}
  }
  if(S.ch>=2&&S.cool<=0){
    const g=totalBuds(),tall=m.g[P.y][P.x]==='tallgrass';
    const pp=g>0?(.002+S.heat*.00025)*(S.protect?.4:1):0;
    const pt=(g>=5||S.money>=150)?.004*(isNight()?2.5:1)*(tall?3:1):0;
    const r=Math.random();
    if(r<pp){S.cool=25;run(()=>battle('police'));}else if(r<pp+pt){S.cool=25;run(()=>battle('thief'));}
  }
}
function updateEnts(dt){
  const free=isFree(),m=MAPS[S.map];
  for(const e of ents){
    if(e.moving){e.t+=dt;const k=Math.min(1,e.t/320);e.px=(e.fx+(e.x-e.fx)*k)*16;e.py=(e.fy+(e.y-e.fy)*k)*16;if(k>=1){e.moving=false;e.fx=e.x;e.fy=e.y;}continue;}
    if(!free||!e.wander)continue;e.wt-=dt;if(e.wt>0)continue;e.wt=1200+Math.random()*2600;
    const d=pick(['up','down','left','right']);e.dir=d;const [dx,dy]=DV[d],nx=e.x+dx,ny=e.y+dy;
    if(Math.abs(nx-e.hx)>e.wander||Math.abs(ny-e.hy)>e.wander)continue;
    if(tileSolid(m,nx,ny)||entAt(nx,ny)||(nx===P.x&&ny===P.y)||(P.moving&&nx===P.fx&&ny===P.fy)||m.doors[nx+','+ny]||m.exits[nx+','+ny])continue;
    e.fx=e.x;e.fy=e.y;e.x=nx;e.y=ny;e.t=0;e.moving=true;
  }
}

function plantStep(p,h){
  if(p.dead)return;const s=getStrain(p.sid);
  p.water=Math.max(0,p.water-3.5*h);
  if(!p.pest&&p.prog<1&&Math.random()<.006*h*(100-s.r)/40)p.pest=true;
  let g=h/(s.d*24);if(p.water<20)g*=.4;if(p.water<=0)g=0;if(p.fert)g*=1.1;if(S.led)g*=1.1;
  if(p.prog<1)p.prog=Math.min(1,p.prog+g);
  if(p.water<=0)p.health-=4*h;if(p.pest)p.health-=2.5*h;if(p.water>30&&!p.pest)p.health+=h;
  p.health=clamp(p.health,0,100);if(p.health<=0)p.dead=true;
}
function plantsAdvance(min){for(const p of S.pots)if(p)plantStep(p,min/60);}
function advanceTime(min){while(min>0){const st=Math.min(60,min);min-=st;S.min+=st;plantsAdvance(st);if(S.min>=1440){S.min-=1440;newDay();}}}
function tickMinute(){
  S.min++;if(S.min%10===0)plantsAdvance(10);
  if(S.min%30===0&&S.hp<S.hpMax)S.hp++;
  if(S.min>=1440){S.min-=1440;newDay();}
  if(S.min%30===0&&S.map==='town')music(mapMusic());
}

    if(!S.flags.letter){const lx=3*16-cam.x,ly=6*16-cam.y;ctx.fillStyle='#fafaf2';ctx.fillRect(lx+5,ly+5,7,5);ctx.fillStyle='#c04040';ctx.fillRect(lx+8,ly+7,2,1);}
  }
  const fr=(e,dur)=>e.moving&&e.t/dur<.5?1+((e.x+e.y)&1):0;
  if(ARTE.ok)for(const e of ents)ambiente(e,now,cam);
  for(const e of ents)list.push([e.py,()=>{if(!dibujarPJ(e,e.look,now,cam,false,320))ctx.drawImage(spriteFor(e.look,e.dir,fr(e,320)),Math.round(e.px-cam.x),Math.round(e.py-cam.y-4));}]);
  list.push([P.py,()=>{if(!dibujarPJ(P,LOOKS.player,now,cam,true,P.dur))ctx.drawImage(spriteFor(LOOKS.player,P.dir,P.moving&&P.t/P.dur<.5?1+P.parity:0),Math.round(P.px-cam.x),Math.round(P.py-cam.y-4));}]);
  if(S.map==='home')POTS.forEach(([px,py],i)=>{if(i<S.potsOwned)list.push([py*16,()=>{const p=S.pots[i],x=px*16-cam.x,y=py*16-cam.y;if(!artePlanta(p,x,y,now))ctx.drawImage(p?plantSprite(p):emptyPot,x,y-10);}]);});
  const bolsa=ARTE.ok&&frameDe(ARTE.cubre['misc:bolsa'],'bolsa','unica',0,{i:0});
  for(const it of ITEMS)if(!it.hidden&&it.map===S.map&&!S.taken[it.id])list.push([it.y*16,()=>{const x=it.x*16-cam.x,y=it.y*16-cam.y;if(bolsa)pinta(bolsa,x+8,y+8);else ctx.drawImage(bagSprite,x,y);}]);
  arteCriaturas(now,cam,list);
  list.sort((a,b)=>a[0]-b[0]).forEach(o=>o[1]());
  if(ARTE.ok)pintarVfx(now,cam,S.map);
  const bob=Math.floor(now/400)%2;
  for(const e of ents){const bx=Math.round(e.px-cam.x)+4,by=Math.round(e.py-cam.y)-16+bob;
    if(e.def.client)bubble(bx,by,'$','#2a9a4a');else if(storyMark(e.id))bubble(bx,by,'!','#e03030');}
  if(S.map==='town'){
    const h=S.min/60;let a=h>=21||h<5?.5:h>=19?(h-19)/2*.5:h<7?(7-h)/2*.5:0;
    if(h>=17.5&&h<20.5){ctx.fillStyle=`rgba(255,130,50,${.13*Math.sin((h-17.5)/3*Math.PI)})`;ctx.fillRect(0,0,SW,SH);}
    if(a>0){ctx.fillStyle=`rgba(14,20,72,${a})`;ctx.fillRect(0,0,SW,SH);
      if(a>.2){ctx.globalCompositeOperation='lighter';for(const [lx,ly] of LAMPS){const x=lx*16+8-cam.x,y=ly*16+2-cam.y;if(x<-30||y<-30||x>SW+30||y>SH+30)continue;
        const g=ctx.createRadialGradient(x,y+8,1,x,y+8,28);g.addColorStop(0,`rgba(255,214,120,${a*.7})`);g.addColorStop(1,'rgba(255,214,120,0)');ctx.fillStyle=g;ctx.fillRect(x-30,y-22,60,60);}
        ctx.globalCompositeOperation='source-over';}}
  }
}
let emptyPot,titleArt,battleBg={};
function makeArt(){
  {const [c,x]=mkCanvas(16,26);const t=painter(x,rngSeed(1));t.F(3,20,10,6,'#2c2c30');t.F(3,20,10,1,'#4a4a52');t.F(4,21,8,1,'#5a3a20');t.F(3,25,10,1,'#18181c');emptyPot=c;}
  {const [c,x]=mkCanvas(64,64);const t=painter(x,rngSeed(2));drawLeafPx(t,32,38,13.6,'#164a26');drawLeafPx(t,32,38,12.4,'#4cc066');drawLeafPx(t,32,38,7,'#7ee08a');titleArt=c;}
  for(const kind of ['thief','police']){
    const [c,x]=mkCanvas(240,160);const R=rngSeed(kind==='thief'?3:4);const nite=kind==='thief';
    const sky=nite?['#241c48','#3a2a66','#5a3a78','#7a4a80']:['#4a78c0','#6a98d8','#94bce8','#c0dcf4'];
    for(let y=0;y<92;y++){x.fillStyle=sky[Math.min(3,Math.floor(y/23))];x.fillRect(0,y,240,1);}
    if(nite)for(let i=0;i<30;i++){x.fillStyle='#f0f0ff';x.fillRect(Math.floor(R()*240),Math.floor(R()*50),1,1);}
    let bx=-4;while(bx<240){const w=18+Math.floor(R()*24),h=22+Math.floor(R()*40);x.fillStyle=nite?'#1a1630':'#5c6c8c';x.fillRect(bx,92-h,w,h);x.fillStyle=nite?'#221d3c':'#6a7a9a';x.fillRect(bx,92-h,w,2);
      for(let wy=92-h+5;wy<86;wy+=7)for(let wx=bx+3;wx<bx+w-3;wx+=6)if(R()<.55){x.fillStyle=nite?(R()<.7?'#f0d070':'#f09a50'):'#aac8ea';x.fillRect(wx,wy,2,3);}bx+=w+2;}
    x.fillStyle=nite?'#3a3a4a':'#8a92a2';x.fillRect(0,92,240,68);
    for(let y=94;y<160;y+=7){x.fillStyle=nite?'#343444':'#808898';x.fillRect(0,y,240,2);}
    const ell=(cx,cy,rx,ry,f,rim)=>{x.fillStyle=rim;x.beginPath();x.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);x.fill();x.fillStyle=f;x.beginPath();x.ellipse(cx,cy-1,rx-3,ry-2.5,0,0,Math.PI*2);x.fill();};
    ell(178,64,44,10,nite?'#4a4a5e':'#a8b0be',nite?'#2a2a38':'#6a7282');ell(66,142,56,12,nite?'#4a4a5e':'#a8b0be',nite?'#2a2a38':'#6a7282');
    battleBg[kind]=c;
  }
  LAMPS=[];const m=MAPS.town;for(let y=0;y<m.h;y++)for(let x=0;x<m.w;x++)if(m.o[y][x]==='lamp')LAMPS.push([x,y]);
}
function renderBattle(now){
  if(!arteFondoCombate())ctx.drawImage(battleBg[B.kind],0,0);
  const k=Math.min(1,B.t/700),e=1-Math.pow(1-k,3);
  const ex=Math.round(154-(1-e)*180),px=Math.round(40+(1-e)*190);
  const fE=combFrame('E',now),fP=combFrame('P',now);
  const sh=B.shakeP>0?Math.round(Math.sin(B.shakeP/18)*3):0;
  if(fE){if(B.gone&&B.aE&&B.aE.n==='huir')pinta(fE,ex+24+Math.round((now-B.aE.t0)*.12),66);
    else if(!B.gone&&!(B.flashE>0&&Math.floor(B.flashE/70)%2===0))pinta(fE,ex+24,66);}
  else if(!B.gone&&!(B.flashE>0&&Math.floor(B.flashE/70)%2===0))ctx.drawImage(spriteFor(B.look,'down',0),ex,6,48,60);
  if(fP)pinta(fP,px+24+sh,142);else ctx.drawImage(spriteFor(LOOKS.player,'up',0),px+sh,82,48,60);
  if(ARTE.ok)pintarVfx(now,{x:0,y:0},'*');
}
function renderTitle(now){
  const t=now/1000;
  const sky=['#0e1638','#162250','#20306a','#2c3e7c','#3a4a86'];
  for(let y=0;y<110;y++){ctx.fillStyle=sky[Math.min(4,Math.floor(y/22))];ctx.fillRect(0,y,SW,1);}
  for(let i=0;i<40;i++){const sx=(i*53)%240,sy=(i*29)%90;if(((i*7+Math.floor(t*2))%9)>1){ctx.fillStyle=i%5?'#c8d0ff':'#ffffff';ctx.fillRect(sx,sy,1,1);}}
  ctx.fillStyle='#0a0f1e';for(let i=0;i<14;i++){const w=14+(i*37)%20,h=18+(i*53)%34;ctx.fillRect(i*18-6,110-h,w,h);}
  ctx.fillStyle='#f0d070';for(let i=0;i<40;i++){const wx=(i*61)%240,wy=82+(i*13)%24;if((i+Math.floor(t))%7)ctx.fillRect(wx,wy,1,2);}
  ctx.fillStyle='#14284a';ctx.fillRect(0,110,SW,50);
  for(let y=112;y<160;y+=4){const o=Math.sin(t*1.5+y)*6;ctx.fillStyle='#1e3a64';ctx.fillRect(20+o+(y*7)%60,y,30,1);ctx.fillRect(140-o+(y*5)%50,y,24,1);}
  if(mode==='title'){const by=Math.round(Math.sin(t*1.6)*2);ctx.globalAlpha=.55;ctx.drawImage(titleArt,88,62+by,64,64);ctx.globalAlpha=1;}
  else{ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,SW,SH);ctx.fillStyle='#2a6a48';ctx.beginPath();ctx.ellipse(120,104,34,7,0,0,Math.PI*2);ctx.fill();ctx.drawImage(spriteFor(LOOKS.kiko,'down',0),96,44,48,60);}
}
function updateHUD(){
  const h=$('hud');if(mode!=='world'||!S){h.hidden=true;return;}h.hidden=false;
  const hh=String(Math.floor(S.min/60)).padStart(2,'0'),mm=String(Math.floor(S.min%60/10)*10).padStart(2,'0'),heat=Math.round(S.heat);
  h.innerHTML=`DÍA ${S.day} · ${hh}:${mm}<br>${eur(S.money)} · ${Math.floor(totalBuds())} g<div class="heat">CALOR<span class="bar"><i class="${heat>=70?'hot':''}" style="width:${heat}%"></i></span></div>`;
}

/* =========================================================
   TÍTULO, PARTIDA, BUCLE
   ========================================================= */
const SAVE_KEY='riberaVerde_v1';
function save(){try{S.x=P.x;S.y=P.y;S.dir=P.dir;localStorage.setItem(SAVE_KEY,JSON.stringify(S));return true;}catch(e){return false;}}
function loadSave(){try{const t=localStorage.getItem(SAVE_KEY);return t?JSON.parse(t):null;}catch(e){return null;}}
function migrate(){const d=newState();for(const k in d)if(!(k in S))S[k]=d[k];for(const k in d.items)if(!(k in S.items))S.items[k]=0;}
function showTitle(){mode='title';$('title').hidden=false;updateHUD();music('title');}
async function titlePress(b){
  if((b!=='A'&&b!=='START')||lock)return;lock++;
  try{
    sfx('sel');const sv=loadSave();let c=1;
    if(sv){c=await menu(['CONTINUAR','NUEVA PARTIDA'],{cls:'start'});if(c<0)return;}
    if(c===0){S=sv;migrate();await fade(1);$('title').hidden=true;enterGame();await fade(0);showObjective();return;}
    if(sv&&await ask('Hay una partida guardada. ¿Empezar de cero y sobrescribirla?',['Sí','No'])!==0)return;
    await newGame();
  }finally{lock--;}
}
async function chooseName(){
  const opts=['EDDIE','ÁLEX','LUR','ANDER','Otro...'];const i=await menu(opts,{cls:'start',cancel:false,title:'NOMBRE'});
  if(i<4)return opts[i];
  return new Promise(res=>{const box=$('nameBox'),inp=$('nameInput');box.hidden=false;inp.value='';setTimeout(()=>inp.focus(),30);
    const done=()=>{const v=(inp.value.trim().toUpperCase().slice(0,8))||'EDDIE';box.hidden=true;inp.onkeydown=null;inp.blur();pop();res(v);};
    push(b=>{if(b==='A')done();});inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();done();}};});
}
async function newGame(){
  S=newState();await fade(1);$('title').hidden=true;mode='intro';music('home');await fade(0);
  await talk('???',['¡Aupa! Bienvenido a RIBERA VERDE, un barrio a orillas de la ría.','Me llamo KIKO. En el barrio me llaman el Cazasemillas.']);
  await talk('KIKO',['Este mundo está lleno de variedades de cannabis. Unas crecen en cualquier balcón...','...y otras solo en valles perdidos del Rif o del Hindu Kush.','Yo me dedico a buscarlas, cruzarlas y catalogarlas en una GENOTECA.','Pero cuéntame de ti. ¿Cómo te llamas?']);
  S.name=await chooseName();
  await talk('KIKO',['¡{N}! Claro, el sobrino de Maite... o la sobrina, que con esa gorra no se ve bien.','Tu tía nos dejó hace unas semanas. Te ha dejado su piso... y algo más.','Tu historia en Ribera Verde está a punto de empezar.','¡Te espero en el growshop!']);
  await fade(1);enterGame();await wait(300);await fade(0);
  await chapter(1);await wait(2600);showObjective();
}
function enterGame(){mode='world';enterMap(S.map,S.x,S.y,S.dir);if(S.clientsDay!==S.day)spawnClients();updateHUD();}
function update(dt){
  if(mode==='world'&&S){
    updatePlayer(dt);updateEnts(dt);
    if(isFree()){timeAcc+=dt;while(timeAcc>=MS_PER_MIN){timeAcc-=MS_PER_MIN;tickMinute();}
      if(pending.length&&!P.moving)run(pending.shift());}
    hudT-=dt;if(hudT<=0){hudT=250;updateHUD();}
  }else if(mode==='battle'&&B){B.t+=dt;if(B.flashE>0)B.flashE-=dt;if(B.shakeP>0)B.shakeP-=dt;}
}
function render(now){if(mode==='world'&&S)renderWorld(now);else if(mode==='battle'&&B)renderBattle(now);else if(mode==='title'||mode==='intro')renderTitle(now);}
let last=performance.now();
function loop(now){const dt=Math.min(50,now-last);last=now;try{update(dt);render(now);}catch(e){console.error(e);}requestAnimationFrame(loop);}
function boot(data){
  buildTiles();makeMisc();buildMaps();computeClientTiles();makeArt();arteListo();
  try{if(localStorage.getItem('rv_sound')==='0')setSound(false);}catch(e){}
  if(data&&data.S){S=data.S;migrate();enterGame();}else showTitle();
  requestAnimationFrame(loop);
  try{window.claude?.hot?.snapshot?.(()=>({S:S&&(mode==='world'||mode==='battle')?Object.assign(S,{x:P.x,y:P.y,dir:P.dir}):null}));}catch(e){}
}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
</script>
