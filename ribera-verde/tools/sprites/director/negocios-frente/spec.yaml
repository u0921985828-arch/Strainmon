nombre: negocios-frente
uso: muebles de los locales (lavandería primero; taller, panadería y bar después), objetos quietos en el mapa
tamano: 32x48 una casilla (celda mueble_escala, ancla 16,47) · 48x48 dos casillas (mueble_ancho)
escala: 16 px/m; protagonista 27 px = 1,70 m
vista: 3/4 de frente (alzado recto con la tapa vista), nunca isométrica ni girada
direcciones: 1
paleta: libre (≤ 32 colores por pieza), cuadrada después con el suelo floorLv y la pared iwT_lav
contorno: oscuro de un color
luz: arriba-izquierda
sombreado: 2-3 tonos por material, sin degradados ni anti-alias exterior
estilo: el de los muebles a mano de escala.py
pivote: base_centro (la base en la fila 47 de la celda)
referencias: fotos del usuario (lavandería, lavadora industrial, cafetera de dos grupos); solo texto a PixelLab, sin marcas
